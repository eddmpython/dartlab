<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<link rel="icon" href="data:," />
		<title>Universe deterministic layout reference</title>
		<style>
			html, body, main { width: 100%; height: 100%; margin: 0; overflow: hidden; }
			main { position: relative; background: #f8fafc; }
			.anchor { position: absolute; left: 0; top: 0; width: 8px; height: 8px; border: 1px solid #111827; box-sizing: border-box; }
		</style>
	</head>
	<body>
		<main id="scene" aria-label="Universe deterministic layout reference"></main>
		<script type="module">
			import {
				compileDeterministicLayout,
				projectAnchors,
				referenceLayoutNodes
			} from './deterministicLayoutProbe.mjs';

			const scene = document.querySelector('#scene');
			const fixturesPromise = fetch('./liveLayoutFixtures.json')
				.then((response) => response.ok ? response.json() : [])
				.catch(() => []);
			let layout = compileDeterministicLayout(referenceLayoutNodes(), {
				sourceSceneHash: `sha256:${'a'.repeat(64)}`
			});

			function render() {
				const projection = projectAnchors(layout, {
					width: window.innerWidth,
					height: window.innerHeight,
					dpr: window.devicePixelRatio
				});
				scene.replaceChildren(...projection.anchors.map((anchor) => {
					const element = document.createElement('span');
					element.className = 'anchor';
					element.dataset.nodeId = anchor.nodeId;
					element.style.transform = `translate(${anchor.x}px, ${anchor.y}px)`;
					return element;
				}));
				return projection;
			}

			let projection = render();
			window.addEventListener('resize', () => { projection = render(); });
			window.__universeLayout = {
				fixtures() {
					return fixturesPromise;
				},
				setScene(nodes, sourceSceneHash) {
					layout = compileDeterministicLayout(nodes, { sourceSceneHash });
					projection = render();
					return layout.receipt;
				},
				measure() {
					const anchors = [...document.querySelectorAll('.anchor')].map((element) => {
						const rect = element.getBoundingClientRect();
						return {
							nodeId: element.dataset.nodeId,
							x: rect.left,
							y: rect.top
						};
					});
					return {
						logicalHash: layout.logicalHash,
						anchorHash: projection.anchorHash,
						innerWidth: window.innerWidth,
						innerHeight: window.innerHeight,
						dpr: window.devicePixelRatio,
						anchors
					};
				}
			};
		</script>
	</body>
</html>

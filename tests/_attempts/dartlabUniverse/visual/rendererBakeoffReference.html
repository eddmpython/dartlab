<!doctype html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Universe renderer bakeoff</title>
	<style>
		:root { color-scheme: dark; font-family: system-ui, sans-serif; background: #020617; color: #e2e8f0; }
		body { margin: 0; padding: 16px; }
		.renderer-host { display: grid; gap: 12px; width: min(800px, 100%); }
		.renderer-stage { width: 100%; height: 500px; overflow: auto; border: 1px solid #334155; background: #08111f; }
		.renderer-stage > svg, .renderer-stage > canvas { display: block; width: 100%; height: 500px; }
		.edge { stroke: #64748b; stroke-opacity: 0.25; }
		.node { fill: #60a5fa; }
		.node.selected { fill: #fbbf24; stroke: #f8fafc; stroke-width: 2px; }
		.task-bridge { display: flex; flex-wrap: wrap; gap: 6px; }
		.task-bridge button { min-height: 36px; border: 1px solid #64748b; border-radius: 6px; background: #172033; color: inherit; }
		.relation-table { width: 100%; border-collapse: collapse; font-size: 12px; }
		.relation-table th, .relation-table td { padding: 2px 6px; border-bottom: 1px solid #1e293b; text-align: left; }
		.relation-table tr[aria-selected="true"] { outline: 2px solid #fbbf24; }
		#renderer-output { max-height: 360px; overflow: auto; padding: 12px; background: #0f172a; white-space: pre-wrap; }
	</style>
</head>
<body>
	<h1>Universe renderer bakeoff</h1>
	<div id="renderer-root" aria-live="off"></div>
	<pre id="renderer-output" aria-label="renderer 측정 결과">측정 중</pre>
	<script type="module" src="./rendererBakeoffBrowser.mjs"></script>
</body>
</html>

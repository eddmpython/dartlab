<!doctype html>
<html lang="ko">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<link rel="icon" href="data:," />
		<title>Universe density and omission reference</title>
		<style>
			html, body, main { width: 100%; height: 100%; margin: 0; overflow: hidden; }
			main { position: relative; background: #f8fafc; font-family: ui-monospace, monospace; }
			.node { position: absolute; left: 0; top: 0; width: 4px; height: 4px; border-radius: 50%; background: #334155; }
			.label { position: absolute; left: 0; top: 0; box-sizing: border-box; overflow: hidden; border: 1px solid #64748b; background: #fff; color: #0f172a; font-size: 11px; line-height: 18px; white-space: nowrap; }
		</style>
	</head>
	<body>
		<main id="scene" aria-label="Universe density and omission reference"></main>
		<script type="module">
			import {
				buildDensityFixture,
				compileDensityProjection
			} from './densityOmissionProbe.mjs';

			const scene = document.querySelector('#scene');
			let current = null;

			function renderCase(nodeCount, target) {
				current = compileDensityProjection(buildDensityFixture(nodeCount), target);
				const marks = current.anchors.map((anchor) => {
					const element = document.createElement('span');
					element.className = 'node';
					element.dataset.nodeId = anchor.nodeId;
					element.style.transform = `translate(${anchor.x}px, ${anchor.y}px)`;
					return element;
				});
				const labels = current.labels.map((label) => {
					const element = document.createElement('span');
					element.className = 'label';
					element.dataset.nodeId = label.nodeId;
					element.textContent = label.label;
					element.style.transform = `translate(${label.x}px, ${label.y}px)`;
					element.style.width = `${label.width}px`;
					element.style.height = `${label.height}px`;
					return element;
				});
				scene.replaceChildren(...marks, ...labels);
				return current.receipt;
			}

			function measure() {
				const labelElements = [...document.querySelectorAll('.label')];
				const rectangles = labelElements.map((element) => element.getBoundingClientRect());
				let pairCollisionCount = 0;
				for (let leftIndex = 0; leftIndex < rectangles.length; leftIndex += 1) {
					for (let rightIndex = leftIndex + 1; rightIndex < rectangles.length; rightIndex += 1) {
						const left = rectangles[leftIndex];
						const right = rectangles[rightIndex];
						if (left.left < right.right && left.right > right.left
							&& left.top < right.bottom && left.bottom > right.top) {
							pairCollisionCount += 1;
						}
					}
				}
				const possiblePairs = rectangles.length * (rectangles.length - 1) / 2;
				return {
					receiptHash: current.receiptHash,
					activeNodeCount: current.receipt.activeNodeCount,
					activeEdgeCount: current.receipt.activeEdgeCount,
					visibleLabelCount: rectangles.length,
					pairCollisionCount,
					collisionRate: possiblePairs === 0 ? 0 : pairCollisionCount / possiblePairs,
					viewport: { width: window.innerWidth, height: window.innerHeight, dpr: window.devicePixelRatio }
				};
			}

			window.__universeDensity = { renderCase, measure };
			const parameters = new URLSearchParams(window.location.search);
			const requestedNodeCount = Number(parameters.get('nodes'));
			const requestedTarget = parameters.get('target');
			const nodeCount = [250, 500, 1000].includes(requestedNodeCount) ? requestedNodeCount : 250;
			const target = ['desktop', 'mobile'].includes(requestedTarget)
				? requestedTarget
				: (window.innerWidth <= 500 ? 'mobile' : 'desktop');
			renderCase(nodeCount, target);
		</script>
	</body>
</html>

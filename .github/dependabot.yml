version: 2
updates:
  # pip 만 정기 버전 범프를 유지한다. dartlab 은 lockfile 없이 pyproject 상한 범위로
  # PyPI 에 배포되므로, 상한이 굳으면 사용자가 의존성 충돌을 맞는다. CI 게이트는
  # `pip install -e .` 신선 해석이라 PR green = PyPI 사용자와 동일 환경 검증이다.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "보안"
      include: "scope"
    open-pull-requests-limit: 2
    groups:
      python-runtime:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "polars*"
          - "pyarrow"
          - "duckdb"
          - "fastapi"
          - "uvicorn*"
          - "starlette"
          - "sse-starlette"
          - "httpx"
          - "huggingface-hub"
          - "pydantic*"
          - "plotly"
      python-test-tooling:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "pytest*"
          - "hypothesis"
          - "syrupy"
          - "pandera*"
          - "mutmut"
          - "ruff"
      python-ai-tooling:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "openai"
          - "anthropic"
          - "mcp*"

  # 정기 버전 범프 중단 (limit 0). 보안 업데이트는 이 설정과 무관하게 계속 흐른다.
  # 사유: PR 체크가 sync 워크플로(edgarSync·naverNewsSync 등)를 실행하지 않아 검증 없이
  # 머지되는 구조이고, 낡은 러너는 GitHub 이 강제 폐기하므로 정기 범프의 실익이 낮다.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "보안"
      include: "scope"
    open-pull-requests-limit: 0

  # pyproc의 npm exact dependency와 lockfile을 함께 갱신한다. PR은 전용 호환성 워크플로가
  # Node, Chromium, landing 타입, 단위 테스트, 프로덕션 빌드를 모두 검증한다.
  #
  # allow 목록을 두지 않는다. allow 는 정기 버전 범프뿐 아니라 보안 업데이트에도 적용되어,
  # 목록 밖 패키지의 보안 패치가 조용히 실패한다. 2026-08-19 실측: nanoid high 경보의
  # 자동 업데이트 job 이 command=security 인데도 allowed-updates=[pyproc] 를 받아
  # "cannot update to the required version as all versions were ignored" 로 끝났다.
  # 소음은 allow 가 아니라 group 과 major 무시로 줄인다. version-update:semver-* 는 정기
  # 갱신에만 적용되므로 보안 업데이트는 major 라도 그대로 흐른다.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Seoul"
    versioning-strategy: "increase"
    labels:
      - "dependencies"
      - "landing"
    commit-message:
      prefix: "개선"
      include: "scope"
    # group 을 쓰지 않는다. 이 저장소는 npm workspace 구성인데, 묶음 PR 이 workspace lockfile 을
    # 완전히 갱신하지 못해 `npm ci` 가 거부한다. 2026-08-19 실측: PR #115 가 열릴 때도,
    # `@dependabot recreate` 후에도 같은 오류로 호환성 게이트 4 개가 설치 단계에서 죽었다.
    #   npm error `npm ci` can only install packages when your package.json and
    #   package-lock.json are in sync. / Missing: svelte@5.56.9 from lock file
    # 같은 시점의 개별 PR(pyproc)은 lockfile 이 정상이었다. 소음은 group 이 아니라 동시 PR 수로
    # 제한한다. 이 상한은 정기 범프에만 걸리고 보안 업데이트는 별도로 흐른다.
    open-pull-requests-limit: 2
    ignore:
      # 정기 major 범프만 차단한다. version-update:semver-* 는 정기 갱신에만 적용되므로
      # 보안 업데이트는 major 라도 그대로 흐른다.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

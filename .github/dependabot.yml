version: 2
updates:
  # pip 만 정기 버전 범프를 유지한다. dartlab 은 lockfile 없이 pyproject 상한 범위로
  # PyPI 에 배포되므로, 상한이 굳으면 사용자가 의존성 충돌을 맞는다. CI 게이트는
  # `pip install -e .` 신선 해석이라 PR green = PyPI 사용자와 동일 환경 검증이다.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "보안"
      include: "scope"
    open-pull-requests-limit: 2
    groups:
      python-runtime:
        patterns:
          - "polars*"
          - "pyarrow"
          - "duckdb"
          - "fastapi"
          - "uvicorn*"
          - "starlette"
          - "sse-starlette"
          - "httpx"
          - "huggingface-hub"
          - "pydantic*"
          - "plotly"
      python-test-tooling:
        patterns:
          - "pytest*"
          - "hypothesis"
          - "syrupy"
          - "pandera*"
          - "mutmut"
          - "ruff"
      python-ai-tooling:
        patterns:
          - "openai"
          - "anthropic"
          - "mcp*"

  # 정기 버전 범프 중단 (limit 0). 보안 업데이트는 이 설정과 무관하게 계속 흐른다.
  # 사유: PR 체크가 sync 워크플로(edgarSync·naverNewsSync 등)를 실행하지 않아 검증 없이
  # 머지되는 구조이고, 낡은 러너는 GitHub 이 강제 폐기하므로 정기 범프의 실익이 낮다.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "보안"
      include: "scope"
    open-pull-requests-limit: 0

  # pyproc의 npm exact dependency와 lockfile을 함께 갱신한다. PR은 전용 호환성 워크플로가
  # Node, Chromium, landing 타입, 단위 테스트, 프로덕션 빌드를 모두 검증한다.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Seoul"
    allow:
      - dependency-name: "pyproc"
        dependency-type: "direct"
    versioning-strategy: "increase"
    labels:
      - "dependencies"
      - "landing"
    commit-message:
      prefix: "개선"
      include: "scope"
    open-pull-requests-limit: 1

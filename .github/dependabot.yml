version: 2
updates:
  # pip 만 정기 버전 범프를 유지한다. dartlab 은 lockfile 없이 pyproject 상한 범위로
  # PyPI 에 배포되므로, 상한이 굳으면 사용자가 의존성 충돌을 맞는다. CI 게이트는
  # `pip install -e .` 신선 해석이라 PR green = PyPI 사용자와 동일 환경 검증이다.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "보안"
      include: "scope"
    open-pull-requests-limit: 2
    groups:
      python-runtime:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "polars*"
          - "pyarrow"
          - "duckdb"
          - "fastapi"
          - "uvicorn*"
          - "starlette"
          - "sse-starlette"
          - "httpx"
          - "huggingface-hub"
          - "pydantic*"
          - "plotly"
      python-test-tooling:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "pytest*"
          - "hypothesis"
          - "syrupy"
          - "pandera*"
          - "mutmut"
          - "ruff"
      python-ai-tooling:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "openai"
          - "anthropic"
          - "mcp*"

  # 정기 버전 범프 중단 (limit 0). 보안 업데이트는 이 설정과 무관하게 계속 흐른다.
  # 사유: PR 체크가 sync 워크플로(edgarSync·naverNewsSync 등)를 실행하지 않아 검증 없이
  # 머지되는 구조이고, 낡은 러너는 GitHub 이 강제 폐기하므로 정기 범프의 실익이 낮다.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "보안"
      include: "scope"
    open-pull-requests-limit: 0

  # 정기 버전 범프 중단 (limit 0). 보안 업데이트는 이 설정과 무관하게 계속 흐른다.
  # 공식 문서가 이 용도를 명시한다. `open-pull-requests-limit` 제목에는 version 아이콘만 붙고
  # 본문에 "Security update pull requests are not subject to this limit and do not count
  # toward it" 이라고 적혀 있으며, "If you only require security updates and want to exclude
  # version updates, you can set open-pull-requests-limit to 0" 이 권장 수단으로 제시된다.
  #
  # 사유는 실측이다. npm PR 24 건 중 머지 1 건(4.2%)이고 pip 는 20 건 중 5 건(25%)이다. 유일하게
  # 머지된 npm PR #64 는 28 분 뒤 핫픽스(Deploy Site red)를 불렀다. 2026-07-09 커밋 4fe3a31f7
  # 이 같은 이유로 "정기 버전 범프를 pip 로 한정" 했었다. 이번에 확인된 추가 차단 요인도 있다.
  # 루트 package.json 의 overrides 11 개를 dependabot 이 갱신하지 않아 그 패키지의 정기 범프는
  # lockfile 불일치로 `npm ci` 에서 죽고(#115 svelte), pyproc 은 0.0.22 부터 landing 이 쓰는
  # 공개 표면이 사라져 머지 자체가 불가능하다(#116·#118). 닫아도 다음 버전으로 다시 열린다.
  #
  # allow 목록은 쓰지 않는다. allow 는 정기 범프뿐 아니라 보안 업데이트에도 적용된다(문서상
  # shield 아이콘 대상). 2026-08-19 실측: nanoid high 경보의 자동 업데이트 job 이
  # command=security 인데도 allowed-updates=[pyproc] 를 받아
  # "cannot update to the required version as all versions were ignored" 로 끝났다.
  #
  # ignore 도 쓰지 않는다. 같은 이유로 보안 업데이트를 함께 막는다. 문서는 `ignore` 를
  # "will prevent security and version updates for those dependencies" 라고 서술하고,
  # `ignore` 의 update-types 가 보안을 통과시킨다는 문장은 어디에도 없다. 그 예외 문장
  # ("update-types only affects version updates")은 `allow` 절에만 존재한다.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Seoul"
    versioning-strategy: "increase"
    labels:
      - "dependencies"
      - "landing"
    commit-message:
      prefix: "개선"
      include: "scope"
    open-pull-requests-limit: 0

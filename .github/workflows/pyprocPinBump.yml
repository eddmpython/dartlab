# pyproc 핀 자동 반영(게이트). pyproc 은 npm 에 릴리즈되고 dartlab 은 npm 버전으로 소비한다.
# 최신 npm 버전 -> 전체 게이트 -> 리뷰 PR. pyproc 0.x는 patch도 breaking일 수 있어 자동 병합하지 않는다.
name: pyproc pin bump (gated)

on:
  schedule:
    - cron: "0 */6 * * *" # 6시간마다(pyproc 릴리즈가 잦아 빠르게 따라간다)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: pyproc-pin
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      newer: ${{ steps.r.outputs.newer }}
      tier2: ${{ steps.r.outputs.tier2 }}
      bump: ${{ steps.r.outputs.bump }}
      latest: ${{ steps.r.outputs.latest }}
      current: ${{ steps.r.outputs.current }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/pyprocResolvePin.mjs

  gate-a:
    needs: resolve
    if: ${{ needs.resolve.outputs.newer == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: apply pin + install
        run: |
          node .github/scripts/pyprocApplyPin.mjs "${{ needs.resolve.outputs.latest }}"
          npm install
          PYODIDE_VERSION="$(node -p "require('./landing/runtime-manifest.json').pyodide")"
          npm install --no-save "pyodide@$PYODIDE_VERSION"
      - name: GATE-A (pyproc Runtime+AsgiServer x dartlab)
        run: node .github/scripts/pyprocSmoke.mjs

  landing:
    needs: [resolve, gate-a]
    if: ${{ needs.resolve.outputs.newer == 'true' && needs.gate-a.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - name: 후보 핀 설치
        run: |
          node .github/scripts/pyprocApplyPin.mjs "${{ needs.resolve.outputs.latest }}"
          npm install
      - name: landing 타입, 단위, 프로덕션 빌드
        run: |
          npm --workspace landing run check
          npm --workspace landing run test
          npm --workspace landing run build

  # 모든 0.x 후보를 실 Chromium에서 검증한다. 소스 경로 분류로 이 게이트를 생략하지 않는다.
  gate-b:
    needs: [resolve, gate-a]
    if: ${{ needs.resolve.outputs.newer == 'true' && needs.gate-a.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: apply pin + install + chromium
        run: |
          node .github/scripts/pyprocApplyPin.mjs "${{ needs.resolve.outputs.latest }}"
          npm install
          npm install --no-save playwright@1.61.1
          npx playwright install --with-deps chromium
      - name: "GATE-B (실 Chromium, crossOriginIsolated fork + R1 휠설치)"
        run: node .github/scripts/pyprocForkSmoke.mjs

  propose:
    needs: [resolve, gate-a, gate-b, landing]
    if: ${{ always() && needs.resolve.outputs.newer == 'true' && needs.gate-a.result == 'success' && needs.gate-b.result == 'success' && needs.landing.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      PYPROC_UPDATE_TOKEN: ${{ secrets.PYPROC_UPDATE_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: apply pin + lock 갱신
        run: |
          node .github/scripts/pyprocApplyPin.mjs "${{ needs.resolve.outputs.latest }}"
          npm install
      - name: 리뷰 후보 브랜치 생성
        id: branch
        run: |
          set -euo pipefail
          BR="pyproc-pin-${{ needs.resolve.outputs.latest }}"
          if git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1; then
            echo "branch=$BR" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node .github/scripts/pyprocApplyPin.mjs "${{ needs.resolve.outputs.latest }}"
          npm install
          git config user.name "dartlab-bot"
          git config user.email "dartlab-bot@users.noreply.github.com"
          git switch -c "$BR"
          git commit -o landing/package.json landing/runtime-manifest.json package-lock.json \
            -m "개선: pyproc 핀 ${{ needs.resolve.outputs.latest }} 전체 게이트 통과"
          git push -u origin "$BR"
          echo "branch=$BR" >> "$GITHUB_OUTPUT"
      - name: 리뷰 PR 생성
        if: ${{ env.PYPROC_UPDATE_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.PYPROC_UPDATE_TOKEN }}
        run: |
          set -euo pipefail
          EXISTING="$(gh pr list -B master -H "${{ steps.branch.outputs.branch }}" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$EXISTING" ]; then
            echo "기존 리뷰 PR: $EXISTING"
          else
            gh pr create -B master -H "${{ steps.branch.outputs.branch }}" \
              -t "pyproc 핀 -> ${{ needs.resolve.outputs.latest }}" \
              -b "npm ${{ needs.resolve.outputs.current }} -> ${{ needs.resolve.outputs.latest }} / GATE-A, Chromium, landing check, test, build PASS / pyproc 0.x 수동 리뷰 필수"
          fi
      - name: PR 권한 미설정 알림
        if: ${{ env.PYPROC_UPDATE_TOKEN == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="pyproc ${{ needs.resolve.outputs.latest }} 업데이트 리뷰 필요"
          BODY="후보 브랜치 \`${{ steps.branch.outputs.branch }}\`가 전체 게이트를 통과했습니다. 저장소의 Actions PR 생성 권한이 꺼져 있어 자동 PR 대신 이 이슈를 남깁니다. PYPROC_UPDATE_TOKEN을 설정하거나 저장소 권한을 고친 뒤 수동 PR을 만드세요."
          EXISTING="$(gh issue list --search "$TITLE in:title" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

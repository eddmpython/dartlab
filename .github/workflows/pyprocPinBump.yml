# pyproc 핀 자동 반영(게이트). pyproc 은 npm 에 릴리즈되고 dartlab 은 npm 버전으로 소비한다.
# 최신 npm 버전 -> 게이트 통과 -> 봇 PR. patch + 비 tier2(격리 경로 무접촉) + GATE-A green 만 auto-merge,
# 그 외(minor+/tier2)는 사람 리뷰 + 실 Chromium GATE-B. mainPlan/pyproc-runtime-ssot 02-auto-update.
name: pyproc pin bump (gated)

on:
  schedule:
    - cron: "0 */6 * * *" # 6시간마다(pyproc 릴리즈가 잦아 빠르게 따라간다)
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pyproc-pin
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      newer: ${{ steps.r.outputs.newer }}
      tier2: ${{ steps.r.outputs.tier2 }}
      bump: ${{ steps.r.outputs.bump }}
      latest: ${{ steps.r.outputs.latest }}
      current: ${{ steps.r.outputs.current }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/pyprocResolvePin.mjs

  gate-a:
    needs: resolve
    if: ${{ needs.resolve.outputs.newer == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: apply pin + install
        run: |
          node .github/scripts/pyprocApplyPin.mjs "${{ needs.resolve.outputs.latest }}"
          npm install
          npm install --no-save pyodide@0.27.5
      - name: GATE-A (pyproc Runtime+AsgiServer x dartlab)
        run: node .github/scripts/pyprocSmoke.mjs

  # Tier-2(프로세스 OS/JSPI) 경로가 바뀌거나 minor+ 면 실 Chromium 에서 crossOriginIsolated fork +
  # R1(COEP 하 휠설치)까지 검증. node 로는 못 덮는 경로라 Playwright chromium 필요.
  gate-b:
    needs: [resolve, gate-a]
    if: ${{ needs.resolve.outputs.newer == 'true' && (needs.resolve.outputs.tier2 == 'true' || needs.resolve.outputs.bump != 'patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: apply pin + install + chromium
        run: |
          node .github/scripts/pyprocApplyPin.mjs "${{ needs.resolve.outputs.latest }}"
          npm install
          npm install --no-save playwright@1.61.1
          npx playwright install --with-deps chromium
      - name: "GATE-B (실 Chromium, crossOriginIsolated fork + R1 휠설치)"
        run: node .github/scripts/pyprocForkSmoke.mjs

  land:
    needs: [resolve, gate-a, gate-b]
    if: ${{ always() && needs.resolve.outputs.newer == 'true' && needs.gate-a.result == 'success' && (needs.gate-b.result == 'success' || needs.gate-b.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: apply pin + lock 갱신
        run: |
          node .github/scripts/pyprocApplyPin.mjs "${{ needs.resolve.outputs.latest }}"
          npm install
      - name: 봇 PR (patch+비tier2 -> auto-merge, 그 외 리뷰)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BR="pyproc-pin-${{ needs.resolve.outputs.latest }}"
          git config user.name "dartlab-bot"
          git config user.email "dartlab-bot@users.noreply.github.com"
          git switch -c "$BR"
          git commit -o landing/package.json package-lock.json \
            -m "보안: pyproc 핀 ${{ needs.resolve.outputs.latest }} (npm, GATE-A green)"
          git push -u origin "$BR"
          gh pr create -B master -H "$BR" \
            -t "pyproc 핀 -> ${{ needs.resolve.outputs.latest }}" \
            -b "npm ${{ needs.resolve.outputs.current }} -> ${{ needs.resolve.outputs.latest }} / bump=${{ needs.resolve.outputs.bump }} / tier2=${{ needs.resolve.outputs.tier2 }} / GATE-A PASS"
          if [ "${{ needs.resolve.outputs.bump }}" = "patch" ] && [ "${{ needs.resolve.outputs.tier2 }}" != "true" ]; then
            gh pr merge --squash --auto
          else
            gh pr edit --add-label pyproc-tier2-review || true
          fi

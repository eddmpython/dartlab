  id: catalog-analysis
  title: 도감 · analysis 22축
  description: 재무 판독 22축을 전수로 훑고, 표의 example 을 그대로 실행합니다.
  level: 중급
  track: catalog
  order: 2
  tags: [analysis, catalog]
  company: "005930"
  prerequisites: [analysis-axes]
  minutes: 8

intro:
  goal: analysis 카탈로그를 읽고 축 하나를 실행한다.
  body: |
    `c.analysis()` 는 22개 판독 축을 표로 돌려줍니다. 수익성 · 성장성 · 안정성만 있는 게 아닙니다.
    이익품질 · 자본배분 · 지배구조 · 매크로민감도까지 있습니다.

    호출은 `c.analysis(도메인, 축)` 두 인자입니다. 도메인은 다섯 가지(financial · forecast ·
    governance · macro · valuation)이고, 어느 축이 어느 도메인에 속하는지는 표의 `example` 열이
    그대로 알려 줍니다. **외우지 말고 표를 읽으세요.**

sections:
  - id: catalog
    title: 22축 전수
    code: |
      c.analysis()

  - id: example
    title: example 열이 곧 호출법
    body: |
      복사해서 셀에 붙이면 그대로 돕니다.
    code: |
      c.analysis().select(["axis", "example"])

  - id: pick
    title: 축 하나 분석
    body: |
      축 이름을 바꿔 가며 실행해 보세요. 결과는 표가 아니라 dict 로 나옵니다.
    code: |
      c.analysis("financial", "이익품질")

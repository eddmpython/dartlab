meta:
  id: catalog-scan
  title: 도감 · scan 27축
  description: 전종목 횡단 스캔이 무엇을 할 수 있는지 카탈로그로 전수 훑고, 축 하나를 실행합니다.
  level: 중급
  track: catalog
  order: 1
  tags: [scan, catalog]
  prerequisites: [scan-cross]
  minutes: 8

intro:
  goal: scan 카탈로그를 읽는 법을 익히고, 표의 example 을 그대로 실행한다.
  body: |
    dartlab 의 능력 목록은 문서가 아니라 **엔진 자신**에게 물어보는 것이 정확합니다. 문서는 낡지만
    엔진은 낡지 않습니다.

    인자 없이 `dartlab.scan()` 을 부르면 27개 축이 표로 나옵니다. 표에는 축 이름(`axis`), 무엇을
    하는지(`description`), 그리고 **그대로 복사해 실행할 수 있는 호출**(`example`)이 들어 있습니다.

    이 레슨은 축을 외우는 곳이 아닙니다. **표를 읽는 법**을 익히는 곳입니다.

sections:
  - id: setup
    title: 시작
    code: |
      import dartlab
      import polars as pl

  - id: catalog
    title: 27축 전수
    body: |
      축 이름 · 분류 · 설명 · 실행 예시가 한 표에 있습니다.
    code: |
      dartlab.scan()

  - id: columns
    title: 표에서 무엇을 읽나
    body: |
      `example` 열이 곧 호출법입니다. 복사해서 셀에 붙이면 그대로 돕니다.
    code: |
      dartlab.scan().select(["axis", "group", "example"]).head(10)

  - id: pick
    title: 축 하나 실행
    body: |
      위 표의 `axis` 값을 바꿔 가며 실행해 보세요. 브라우저에서 도는 축은 growth · profitability ·
      liquidity · cashflow · ratio · account · debt 입니다. 나머지는 KRX 목록이나 직원수
      프리빌드가 필요해 로컬 설치본에서 씁니다.
    code: |
      axis = "growth"      # 표의 axis 열에서 골라 바꿔 보세요
      dartlab.scan(axis).head(10)

meta:
  id: catalog-credit
  title: 도감 · credit 8축
  description: 신용평가 엔진의 축 목록을 훑고, 위험 축 하나를 실행합니다.
  level: 중급
  track: catalog
  order: 3
  tags: [credit, catalog]
  company: "005930"
  prerequisites: [credit-dcr]
  minutes: 6

intro:
  goal: credit 카탈로그를 읽고 위험 축 하나를 부른다.
  body: |
    `c.credit()` 은 인자를 주면 그 축을, 안 주면 종합 등급을 돌려줍니다. 그런데 **무슨 축이
    있는지**는 어떻게 알까요. 다른 엔진과 같습니다. 카탈로그를 물어보면 됩니다.

sections:
  - id: catalog
    title: 축 목록
    code: |
      c.credit()

  - id: pick
    title: 위험 축 하나
    body: |
      채무상환 · 자본구조 · 유동성 · 현금흐름 · 사업안정성 · 재무신뢰성 · 공시리스크 중에서.
    code: |
      c.credit("현금흐름")

  - id: detail
    title: 근거 시계열까지
    code: |
      c.credit(detail=True)

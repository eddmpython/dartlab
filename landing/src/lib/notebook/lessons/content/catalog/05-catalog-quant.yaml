meta:
  id: catalog-quant
  title: 도감 · quant 48축
  description: 기술적 지표 48축을 카탈로그로 훑습니다. 실행은 가격 수집이 필요해 로컬 전용입니다.
  level: 중급
  track: catalog
  order: 5
  tags: [quant, catalog, boundary]
  company: "005930"
  prerequisites: [data-boundary]
  minutes: 6

intro:
  goal: quant 카탈로그를 읽고, 실행이 왜 로컬 전용인지 안다.
  body: |
    `c.quant()` 는 48개 축을 표로 돌려줍니다. 지표 · 신호 · 판단 · 모멘텀 · 베타 · 백테스트까지
    들어 있습니다.

    카탈로그를 보는 데는 네트워크가 필요 없어서 브라우저에서도 그대로 나옵니다. 하지만 **실제
    계산에는 가격 시계열이 필요**하고, 그건 바깥 사이트에서 받아 와야 해서 브라우저에서 막힙니다.
    표를 여기서 훑고, 실행은 로컬 설치본에서 하세요.

sections:
  - id: catalog
    title: 48축 전수
    code: |
      c.quant()

  - id: groups
    title: 어떤 갈래인가
    code: |
      c.quant().select(["axis", "group", "example"]).head(12)

  - id: run-local
    title: 실행은 로컬에서
    body: |
      아래 셀은 브라우저에서 읽기 전용입니다. `pip install dartlab` 후 로컬에서 그대로 돕니다.
    runtime: local
    code: |
      c.quant("지표").tail(5)

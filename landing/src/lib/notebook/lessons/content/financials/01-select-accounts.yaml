meta:
  id: select-accounts
  title: 필요한 계정만 콕 집어 뽑기
  description: 재무제표 전체 대신 매출액 · 영업이익 같은 필요한 행만 시계열로 받습니다.
  level: 기초
  track: financials
  order: 1
  tags: [company, select]
  company: "005930"
  prerequisites: [panel-statements]
  minutes: 10

intro:
  goal: 필요한 계정만 골라 분기 · 연간 · 별도 시계열로 뽑는다.
  body: |
    재무제표 전체를 보는 일은 드뭅니다. 보통은 **몇 개 계정의 시계열**이 필요하죠.

    `c.select(주제, 계정목록)` 이 그 일을 합니다. `freq` 로 분기와 연간을, `scope` 로
    연결과 별도를 바꿉니다.

    배우는 것: 계정 1개 뽑기, 여러 계정 동시, 연간 합산, 별도재무제표.

sections:
  - id: one
    title: 한 줄만
    body: |
      분기 컬럼 전체가 딸려옵니다.
    code: |
      c.select("IS", ["매출액"])

  - id: many
    title: 여러 계정 동시
    code: |
      c.select("IS", ["매출액", "영업이익", "당기순이익"])

  - id: yearly
    title: 연간으로
    code: |
      c.select("IS", ["매출액"], freq="Y")

  - id: separate
    title: 별도재무제표
    code: |
      c.select("BS", ["자본총계"], scope="separate")

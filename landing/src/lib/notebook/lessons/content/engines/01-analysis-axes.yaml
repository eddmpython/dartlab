meta:
  id: analysis-axes
  title: 22축 분석 (수익성 · 성장성 · 안정성)
  description: c.analysis 로 축 카탈로그를 보고 재무 축을 하나씩 분석합니다.
  level: 중급
  track: engines
  order: 1
  tags: [analysis]
  company: "005930"
  prerequisites: [select-accounts]
  minutes: 12

intro:
  goal: 22축 카탈로그를 보고 financial 그룹의 축을 부른다.
  body: |
    `c.analysis()` 를 인자 없이 부르면 22축 카탈로그가 나옵니다. `c.analysis(그룹, 축)` 으로
    축을 지정하면 시계열 · 전환점 · 데이터 기준시점이 담긴 dict 를 돌려줍니다.

    결과는 표가 아니라 dict(텍스트)로 출력됩니다.

sections:
  - id: catalog
    title: 무엇을 부를 수 있나
    code: |
      c.analysis()

  - id: profitability
    title: 수익성
    code: |
      c.analysis("financial", "수익성")

  - id: growth
    title: 성장성
    code: |
      c.analysis("financial", "성장성")

  - id: stability
    title: 안정성
    code: |
      c.analysis("financial", "안정성")

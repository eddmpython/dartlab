meta:
  id: story-section
  title: 재무 서사를 읽는 글로
  description: 여러 분석 결과를 사람이 읽는 서사 블록으로 조립합니다.
  level: 심화
  track: engines
  order: 3
  tags: [story]
  company: "005930"
  prerequisites: [analysis-axes]
  minutes: 12

intro:
  goal: 분석 결과를 서사 블록으로 조립하고 마크다운 원문을 꺼낸다.
  body: |
    `c.story(섹션)` 은 여러 분석 엔진의 결과를 사람이 읽는 서사 블록으로 조립한 보고서를
    돌려줍니다. 표와 문장이 섞인 형태로 렌더되고, `.toMarkdown()` 으로 원문을 꺼낼 수 있습니다.

    조립 과정 때문에 수십 초 걸릴 수 있습니다.

sections:
  - id: render
    title: 수익성 섹션
    code: |
      st = c.story("수익성")
      st

  - id: markdown
    title: 같은 결과를 마크다운으로
    code: |
      print(st.toMarkdown()[:1200])

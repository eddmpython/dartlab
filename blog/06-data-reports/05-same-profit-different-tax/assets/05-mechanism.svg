<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480">
  <title>명목세율과 실효세율이 갈리는 세 통로</title>
  <desc>세전이익에서 출발한 세금이 이월결손금 공제, 세액공제와 감면, 이연법인세라는 세 통로를 지나면서 명목세율보다 낮거나 높은 실효세율로 갈린다.</desc>
  <defs>
    <linearGradient id="bg05m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#bg05m)" rx="16"/>
  <text x="600" y="50" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="24" font-weight="700">명목 24%가 회사마다 다른 실효세율이 되는 세 통로</text>

  <rect x="80" y="200" width="180" height="70" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="170" y="232" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="700">세전이익</text>
  <text x="170" y="254" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">명목 24~25%</text>

  <line x1="260" y1="235" x2="330" y2="235" stroke="#334155" stroke-width="2"/>

  <g font-family="system-ui, sans-serif">
    <rect x="330" y="110" width="330" height="80" rx="10" fill="#0f172a" stroke="#166534" stroke-width="1.4"/>
    <text x="352" y="140" fill="#86efac" font-size="16" font-weight="700">이월결손금 공제</text>
    <text x="352" y="166" fill="#cbd5e1" font-size="14">과거 손실을 나중 이익에서 뺌 (세율 낮춤)</text>

    <rect x="330" y="200" width="330" height="80" rx="10" fill="#0f172a" stroke="#166534" stroke-width="1.4"/>
    <text x="352" y="230" fill="#86efac" font-size="16" font-weight="700">세액공제·감면</text>
    <text x="352" y="256" fill="#cbd5e1" font-size="14">R&amp;D·투자·고용 세금 깎아줌 (세율 낮춤)</text>

    <rect x="330" y="290" width="330" height="80" rx="10" fill="#0f172a" stroke="#3f4d63" stroke-width="1.4"/>
    <text x="352" y="320" fill="#cbd5e1" font-size="16" font-weight="700">이연법인세</text>
    <text x="352" y="346" fill="#94a3b8" font-size="14">회계·세법 시점 차이 조정 (양방향)</text>
  </g>

  <line x1="660" y1="235" x2="740" y2="235" stroke="#334155" stroke-width="2"/>

  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="740" y="120" width="200" height="60" rx="10" fill="#0f172a" stroke="#166534" stroke-width="1.4"/>
    <text x="840" y="147" fill="#86efac" font-size="15" font-weight="700">낮은 실효세율</text>
    <text x="840" y="167" fill="#94a3b8" font-size="13">한화에어로 0.4%</text>

    <rect x="740" y="205" width="200" height="60" rx="10" fill="#0f172a" stroke="#3f4d63" stroke-width="1.4"/>
    <text x="840" y="232" fill="#cbd5e1" font-size="15" font-weight="700">중앙값 18.7%</text>
    <text x="840" y="252" fill="#94a3b8" font-size="13">가장 흔한 구간</text>

    <rect x="740" y="290" width="200" height="60" rx="10" fill="#0f172a" stroke="#7f1d1d" stroke-width="1.4"/>
    <text x="840" y="317" fill="#fca5a5" font-size="15" font-weight="700">높은 실효세율</text>
    <text x="840" y="337" fill="#94a3b8" font-size="13">LG엔솔 80.5%</text>
  </g>

  <text x="600" y="430" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="15" font-weight="700">같은 명목세율에서 출발해도, 이 세 통로를 얼마나 쓰느냐로 세금이 극과 극으로 갈린다</text>
</svg>

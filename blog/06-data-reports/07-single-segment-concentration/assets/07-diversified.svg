<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480">
  <title>다각화한 대형주는 순자산 근처이거나 그 아래에서 거래된다</title>
  <desc>여러 사업을 거느린 다각화 대형주는 주가순자산비율이 1배 근처이거나 그 아래다. 삼성물산 1.41배, LG화학 0.79배, 한화 0.94배, CJ 1.11배, GS 0.47배, 롯데지주 0.30배. 지주회사 할인이라 불린다.</desc>
  <defs>
    <linearGradient id="bg07d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="480" fill="url(#bg07d)" rx="16"/>
  <text x="600" y="50" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="24" font-weight="700">다각화 = 디스카운트: 지주회사 할인</text>
  <text x="600" y="80" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">다각화 대형주 PBR · 1.0배(순자산) 선 아래면 순자산보다 싸게 거래</text>

  <line x1="500" y1="108" x2="500" y2="430" stroke="#22c55e" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="500" y="452" text-anchor="middle" fill="#86efac" font-family="system-ui, sans-serif" font-size="13">순자산 = 1.0배</text>

  <g font-family="system-ui, sans-serif" font-size="15">
    <!-- scale: 1.0 at x=500, each 1.0 = 300px -->
    <text x="70" y="140" fill="#e2e8f0">삼성물산</text>
    <rect x="500" y="126" width="123" height="22" rx="4" fill="#475569"/>
    <text x="633" y="143" fill="#cbd5e1" font-weight="700">1.41</text>

    <text x="70" y="176" fill="#e2e8f0">CJ</text>
    <rect x="500" y="162" width="33" height="22" rx="4" fill="#475569"/>
    <text x="543" y="179" fill="#cbd5e1" font-weight="700">1.11</text>

    <text x="70" y="212" fill="#e2e8f0">한화</text>
    <rect x="482" y="198" width="18" height="22" rx="4" fill="#7f1d1d"/>
    <text x="474" y="215" text-anchor="end" fill="#fca5a5" font-weight="700">0.94</text>

    <text x="70" y="248" fill="#e2e8f0">LG화학</text>
    <rect x="437" y="234" width="63" height="22" rx="4" fill="#7f1d1d"/>
    <text x="429" y="251" text-anchor="end" fill="#fca5a5" font-weight="700">0.79</text>

    <text x="70" y="284" fill="#e2e8f0">GS</text>
    <rect x="359" y="270" width="141" height="22" rx="4" fill="#7f1d1d"/>
    <text x="351" y="287" text-anchor="end" fill="#fca5a5" font-weight="700">0.47</text>

    <text x="70" y="320" fill="#e2e8f0">롯데지주</text>
    <rect x="410" y="306" width="90" height="22" rx="4" fill="#991b1b"/>
    <text x="402" y="323" text-anchor="end" fill="#fca5a5" font-weight="700">0.30</text>
  </g>

  <text x="600" y="410" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="15" font-weight="700">여러 사업을 묶으면 시장은 그 합을 부분의 합보다 낮게 매긴다</text>
</svg>

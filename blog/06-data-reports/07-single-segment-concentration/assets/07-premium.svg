<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460">
  <title>집중 PBR 4.14배 대 다각화 1.04배: 4배의 간극</title>
  <desc>시가총액 1조원 이상 대형주에서, 매출 90퍼센트 이상이 한 부문인 집중 기업 68곳의 주가순자산비율 중앙값은 4.14배, 최대부문이 50퍼센트 미만인 다각화 기업 18곳은 1.04배다. 시장은 집중에 프리미엄을, 다각화에 디스카운트를 매긴다.</desc>
  <defs>
    <linearGradient id="bg07p" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="460" fill="url(#bg07p)" rx="16"/>
  <text x="600" y="52" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="25" font-weight="700">시장은 한 우물에 프리미엄, 다각화에 디스카운트</text>
  <text x="600" y="84" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">시총 1조+ 대형주 주가순자산비율(PBR) 중앙값 · 순자산 대비 몇 배</text>

  <g font-family="system-ui, sans-serif">
    <text x="120" y="150" fill="#fbbf24" font-size="17" font-weight="700">매출 90%+ 한 부문 (집중, 68곳)</text>
    <rect x="120" y="165" width="828" height="52" rx="8" fill="#b45309"/>
    <text x="968" y="199" fill="#fde68a" font-size="26" font-weight="800">4.14배</text>

    <text x="120" y="278" fill="#86efac" font-size="17" font-weight="700">최대부문 50% 미만 (다각화, 18곳)</text>
    <rect x="120" y="293" width="208" height="52" rx="8" fill="#166534"/>
    <text x="348" y="327" fill="#bbf7d0" font-size="26" font-weight="800">1.04배</text>
  </g>

  <text x="600" y="400" text-anchor="middle" fill="#f97316" font-family="system-ui, sans-serif" font-size="16" font-weight="700">같은 대형주인데 집중 기업은 순자산의 네 배, 다각화 기업은 순자산 그대로</text>
  <text x="600" y="430" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">SK하이닉스 9.66 · 삼성바이오 7.88  vs  삼성물산 1.41 · LG화학 0.79 · 롯데지주 0.30</text>
</svg>

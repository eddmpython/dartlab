<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560">
  <title>대표 영업회사 6곳의 이자보상배율 3년 경로: 늪 대 저점 통과</title>
  <desc>같은 3년 연속 좀비 명단 안에서 롯데케미칼은 이자보상배율이 -0.49에서 -0.95로 더 깊어지고, LG디스플레이는 -1.04에서 0.28로 올라온다. 상태는 같아도 방향은 정반대.</desc>
  <defs>
    <linearGradient id="bg02x" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="560" fill="url(#bg02x)" rx="16"/>

  <text x="600" y="48" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="26" font-weight="700">같은 낙인, 갈라진 방향</text>
  <text x="600" y="78" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">3년 연속 좀비 대형 영업회사의 이자보상배율 경로 (2023 → 2025)</text>

  <!-- reference lines -->
  <line x1="150" y1="130" x2="850" y2="130" stroke="#3f6212" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="150" y="123" fill="#84cc16" font-family="system-ui, sans-serif" font-size="13">이자보상배율 1.0 (이자 감당선)</text>
  <line x1="150" y1="285" x2="850" y2="285" stroke="#7f1d1d" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="150" y="303" fill="#f87171" font-family="system-ui, sans-serif" font-size="13">0 (아래로는 영업적자)</text>

  <!-- lines: stuck / worsening -->
  <polyline points="250,360 540,413 830,431" fill="none" stroke="#ef4444" stroke-width="3.5"/>
  <polyline points="250,189 540,271 830,264" fill="none" stroke="#f97316" stroke-width="3"/>
  <polyline points="250,167 540,261 830,251" fill="none" stroke="#fb923c" stroke-width="3"/>
  <!-- lines: recovering -->
  <polyline points="250,445 540,322 830,241" fill="none" stroke="#22c55e" stroke-width="3.5"/>
  <polyline points="250,292 540,278 830,246" fill="none" stroke="#34d399" stroke-width="3"/>

  <!-- dots -->
  <g fill="#ef4444"><circle cx="250" cy="360" r="5"/><circle cx="540" cy="413" r="5"/><circle cx="830" cy="431" r="6"/></g>
  <g fill="#f97316"><circle cx="250" cy="189" r="4"/><circle cx="540" cy="271" r="4"/><circle cx="830" cy="264" r="5"/></g>
  <g fill="#fb923c"><circle cx="250" cy="167" r="4"/><circle cx="540" cy="261" r="4"/><circle cx="830" cy="251" r="5"/></g>
  <g fill="#22c55e"><circle cx="250" cy="445" r="5"/><circle cx="540" cy="322" r="5"/><circle cx="830" cy="241" r="6"/></g>
  <g fill="#34d399"><circle cx="250" cy="292" r="4"/><circle cx="540" cy="278" r="4"/><circle cx="830" cy="246" r="5"/></g>

  <!-- callouts -->
  <text x="820" y="455" text-anchor="end" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="13">롯데케미칼 3년째 심화 (-0.95)</text>
  <text x="820" y="228" text-anchor="end" fill="#86efac" font-family="system-ui, sans-serif" font-size="13">LG디스플레이 반등 (+0.28)</text>

  <!-- year axis -->
  <text x="250" y="500" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">2023</text>
  <text x="540" y="500" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">2024</text>
  <text x="830" y="500" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">2025</text>

  <!-- legend -->
  <rect x="890" y="120" width="290" height="320" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
  <text x="910" y="150" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="700">사이클 저점에 눌린 쪽</text>
  <rect x="910" y="164" width="22" height="6" rx="3" fill="#ef4444"/><text x="942" y="171" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">롯데케미칼 (석유화학)</text>
  <rect x="910" y="190" width="22" height="6" rx="3" fill="#f97316"/><text x="942" y="197" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">SK이노베이션 (정유·배터리)</text>
  <rect x="910" y="216" width="22" height="6" rx="3" fill="#fb923c"/><text x="942" y="223" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">현대제철 (철강)</text>
  <text x="910" y="272" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="700">바닥 치고 오르는 쪽</text>
  <rect x="910" y="286" width="22" height="6" rx="3" fill="#22c55e"/><text x="942" y="293" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">LG디스플레이 (디스플레이)</text>
  <rect x="910" y="312" width="22" height="6" rx="3" fill="#34d399"/><text x="942" y="319" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13.5">이마트 (유통)</text>
  <text x="910" y="366" fill="#64748b" font-family="system-ui, sans-serif" font-size="12.5">값 = 이자보상배율.</text>
  <text x="910" y="386" fill="#64748b" font-family="system-ui, sans-serif" font-size="12.5">1 미만이면 이자 미달,</text>
  <text x="910" y="406" fill="#64748b" font-family="system-ui, sans-serif" font-size="12.5">0 아래면 영업적자.</text>
</svg>

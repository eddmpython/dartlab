<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420">
  <title>SK이노베이션: 매출 80조 거함이 이자에 짓눌린다</title>
  <desc>SK이노베이션 2025년 영업이익은 4,487억원인데 현금으로 낸 이자는 3조5,754억원. 번 돈이 이자의 8분의 1에 그쳐 이자보상배율이 0.13. 흑자를 내고도 좀비 명단에 있다.</desc>
  <defs>
    <linearGradient id="bg02k" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#bg02k)" rx="16"/>

  <text x="600" y="50" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="25" font-weight="700">흑자를 내고도 좀비인 이유</text>
  <text x="600" y="80" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">SK이노베이션 2025년 · 매출 80.3조원 · dartlab 실측</text>

  <!-- 영업이익 bar -->
  <text x="150" y="150" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="16">본업으로 번 돈 (영업이익)</text>
  <rect x="150" y="162" width="88" height="44" rx="6" fill="#22c55e"/>
  <text x="252" y="191" fill="#4ade80" font-family="system-ui, sans-serif" font-size="18" font-weight="700">4,487억원</text>

  <!-- 이자 bar -->
  <text x="150" y="248" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="16">그해 현금으로 낸 이자</text>
  <rect x="150" y="260" width="700" height="44" rx="6" fill="#b45309"/>
  <text x="864" y="289" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="18" font-weight="700">3조 5,754억원</text>

  <!-- callout -->
  <rect x="150" y="336" width="900" height="56" rx="12" fill="#0f172a" stroke="#b45309" stroke-width="1.5"/>
  <text x="180" y="372" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="24" font-weight="800">0.13</text>
  <text x="270" y="372" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="15">이자보상배율. 번 돈이 이자의 8분의 1. 배터리 투자로 불어난 빚이 본업 이익을 압도한다.</text>
</svg>

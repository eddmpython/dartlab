<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560">
  <title>순현금이 시총보다 많은 19곳: 순현금/시총 배율 상위</title>
  <desc>순현금을 시가총액으로 나눈 배율 상위. 일진다이아 1.88배가 가장 극단이고, 세진티에스 1.76, 케이바이오랩스 1.63 순. 배율 1.0 선을 넘으면 순현금이 시총보다 많다는 뜻이다.</desc>
  <defs>
    <linearGradient id="bg03r" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="560" fill="url(#bg03r)" rx="16"/>

  <text x="600" y="48" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="26" font-weight="700">순현금이 시총의 몇 배인가</text>
  <text x="600" y="78" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">순현금 / 시가총액 배율 상위 10 · 1.0 이상이면 순현금 &gt; 시총</text>

  <!-- 1.0 reference line -->
  <line x1="620" y1="100" x2="620" y2="500" stroke="#3f6212" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="620" y="522" text-anchor="middle" fill="#84cc16" font-family="system-ui, sans-serif" font-size="13">배율 1.0 (순현금 = 시총)</text>

  <g font-family="system-ui, sans-serif">
    <!-- rows: y start 118, step 38, bar x=310, width=배율/2*620 -->
    <text x="290" y="135" text-anchor="end" fill="#e2e8f0" font-size="14" font-weight="700">일진다이아</text>
    <rect x="310" y="121" width="583" height="22" rx="4" fill="#b45309"/><text x="903" y="139" fill="#fbbf24" font-size="14" font-weight="800">1.88</text>

    <text x="290" y="173" text-anchor="end" fill="#cbd5e1" font-size="14">세진티에스</text>
    <rect x="310" y="159" width="546" height="22" rx="4" fill="#c2620a"/><text x="866" y="177" fill="#fbbf24" font-size="14" font-weight="700">1.76</text>

    <text x="290" y="211" text-anchor="end" fill="#cbd5e1" font-size="14">케이바이오랩스</text>
    <rect x="310" y="197" width="505" height="22" rx="4" fill="#c2620a"/><text x="825" y="215" fill="#fbbf24" font-size="14" font-weight="700">1.63</text>

    <text x="290" y="249" text-anchor="end" fill="#cbd5e1" font-size="14">소프트센</text>
    <rect x="310" y="235" width="502" height="22" rx="4" fill="#c2620a"/><text x="822" y="253" fill="#fbbf24" font-size="14" font-weight="700">1.62</text>

    <text x="290" y="287" text-anchor="end" fill="#cbd5e1" font-size="14">새론오토모티브</text>
    <rect x="310" y="273" width="474" height="22" rx="4" fill="#92400e"/><text x="794" y="291" fill="#fbbf24" font-size="14" font-weight="700">1.53</text>

    <text x="290" y="325" text-anchor="end" fill="#e2e8f0" font-size="14" font-weight="700">모토닉</text>
    <rect x="310" y="311" width="456" height="22" rx="4" fill="#b45309"/><text x="776" y="329" fill="#fbbf24" font-size="14" font-weight="700">1.47</text>

    <text x="290" y="363" text-anchor="end" fill="#cbd5e1" font-size="14">에코볼트</text>
    <rect x="310" y="349" width="446" height="22" rx="4" fill="#92400e"/><text x="766" y="367" fill="#fbbf24" font-size="14" font-weight="700">1.44</text>

    <text x="290" y="401" text-anchor="end" fill="#cbd5e1" font-size="14">대원산업</text>
    <rect x="310" y="387" width="366" height="22" rx="4" fill="#92400e"/><text x="686" y="405" fill="#fbbf24" font-size="14" font-weight="700">1.18</text>

    <text x="290" y="439" text-anchor="end" fill="#cbd5e1" font-size="14">레이언스</text>
    <rect x="310" y="425" width="350" height="22" rx="4" fill="#78350f"/><text x="670" y="443" fill="#fbbf24" font-size="14" font-weight="700">1.13</text>

    <text x="290" y="477" text-anchor="end" fill="#e2e8f0" font-size="14" font-weight="700">무학</text>
    <rect x="310" y="463" width="326" height="22" rx="4" fill="#b45309"/><text x="646" y="481" fill="#fbbf24" font-size="14" font-weight="700">1.05</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560">
  <title>비금융 상장사 1,972곳 중 순현금이 시총보다 많은 곳은 19곳</title>
  <desc>비금융 상장사 1,972곳에서, 현금만으로 시총을 넘는 곳은 100곳 이상(언론 집계)이지만, 모든 빚을 갚고도 순현금이 시가총액보다 많은 곳은 단 19곳. 그 19곳 합산 순현금 2.29조가 시총 1.87조보다 많다.</desc>
  <defs>
    <linearGradient id="bg03f" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="560" fill="url(#bg03f)" rx="16"/>

  <text x="600" y="52" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="26" font-weight="700">빚 다 갚고도 시총보다 현금이 많은 19곳</text>
  <text x="600" y="84" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">순현금 = 현금 + 단기금융상품 − 총부채(모든 부채) · 비금융·비스팩 · dartlab 전수</text>

  <!-- Bar 1: 1972 -->
  <rect x="150" y="128" width="900" height="56" rx="8" fill="#334155"/>
  <text x="170" y="163" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="17" font-weight="600">비금융 상장사 (시총·현금·부채 유효)</text>
  <text x="1030" y="163" text-anchor="end" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="20" font-weight="700">1,972곳</text>

  <!-- Bar 2: 현금>시총 100+ (참고) -->
  <rect x="260" y="204" width="680" height="52" rx="8" fill="#475569"/>
  <text x="280" y="230" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15">(참고) 현금만으로 시총 초과 · 언론 집계</text>
  <text x="280" y="250" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">빚을 빼기 전</text>
  <text x="920" y="236" text-anchor="end" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="18" font-weight="700">100곳+</text>

  <!-- Bar 3: 19 (amber) -->
  <rect x="410" y="276" width="380" height="66" rx="8" fill="#b45309"/>
  <text x="430" y="304" fill="#fde68a" font-family="system-ui, sans-serif" font-size="15">빚 다 갚고도 순현금 &gt; 시총</text>
  <text x="430" y="330" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">19곳</text>
  <text x="770" y="316" text-anchor="end" fill="#fde68a" font-family="system-ui, sans-serif" font-size="16" font-weight="700">대상의 약 1%</text>

  <!-- 합산 callout (green) -->
  <rect x="150" y="372" width="900" height="150" rx="12" fill="#0f172a" stroke="#166534" stroke-width="1.5"/>
  <text x="180" y="410" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="17" font-weight="700">19곳을 통째로 사면</text>
  <text x="180" y="452" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">인수 비용 (합산 시가총액)</text>
  <text x="1030" y="452" text-anchor="end" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="22" font-weight="700">1.87조원</text>
  <text x="180" y="486" fill="#86efac" font-family="system-ui, sans-serif" font-size="15">그 안의 순현금 (빚 다 갚고 남는 현금)</text>
  <text x="1030" y="486" text-anchor="end" fill="#22c55e" font-family="system-ui, sans-serif" font-size="22" font-weight="800">2.29조원</text>
  <text x="180" y="512" fill="#4ade80" font-family="system-ui, sans-serif" font-size="14">사자마자 4,200억원이 남고, 공장·브랜드·특허는 공짜로 딸려온다</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440">
  <title>일진다이아: 회사를 통째로 사도 순현금이 남는다</title>
  <desc>일진다이아는 시가총액 1,562억원인데 순현금이 2,935억원. 회사를 통째로 사는 데 1,562억이 들지만, 그 안의 순현금으로 인수대금을 갚고도 1,373억이 남고 공장과 기술은 공짜로 딸려온다.</desc>
  <defs>
    <linearGradient id="bg03c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="440" fill="url(#bg03c)" rx="16"/>

  <text x="600" y="50" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="25" font-weight="700">통째로 사도 현금이 남는다</text>
  <text x="600" y="80" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">일진다이아 · 공업용 다이아몬드 제조 · dartlab 실측</text>

  <!-- 시가총액 bar -->
  <text x="150" y="150" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="16">회사를 통째로 사는 값 (시가총액)</text>
  <rect x="150" y="162" width="373" height="46" rx="6" fill="#475569"/>
  <text x="537" y="192" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="18" font-weight="700">1,562억원</text>

  <!-- 순현금 bar -->
  <text x="150" y="252" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="16">그 안의 순현금 (빚 다 갚고 남는 현금)</text>
  <rect x="150" y="264" width="700" height="46" rx="6" fill="#22c55e"/>
  <text x="864" y="294" fill="#4ade80" font-family="system-ui, sans-serif" font-size="18" font-weight="800">2,935억원</text>

  <!-- surplus callout -->
  <rect x="150" y="344" width="900" height="60" rx="12" fill="#0f172a" stroke="#166534" stroke-width="1.5"/>
  <text x="180" y="382" fill="#22c55e" font-family="system-ui, sans-serif" font-size="24" font-weight="800">+1,373억</text>
  <text x="330" y="382" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="15">인수대금을 갚고도 남는 현금. 공장·기술·특허는 공짜로 딸려온다.</text>
</svg>

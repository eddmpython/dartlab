<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540">
  <title>벌이 초과 투자 235곳의 업종 분포: 배터리부터 라면까지</title>
  <desc>벌이보다 큰 설비투자를 한 235곳은 반도체와 전자, 화학과 정유, 자동차부품, 기계와 조선과 방산, 제약과 바이오, 철강과 금속, 식음료까지 넓게 걸쳐 있다. 특정 산업의 이야기가 아니다.</desc>
  <defs>
    <linearGradient id="bg06s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="540" fill="url(#bg06s)" rx="16"/>
  <text x="600" y="50" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="24" font-weight="700">한 섹터의 이야기가 아니다: 벌이 초과 투자 235곳의 업종</text>
  <text x="600" y="80" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">언론이 개별 헤드라인으로 소비하는 것을, 전수로 세면 산업 전반의 현상이다</text>

  <g font-family="system-ui, sans-serif">
    <!-- bars: 반도체30, 화학28, 자동차27, 기계조선방산24, 제약바이오24, 철강11, 식음료11 -->
    <text x="60" y="140" fill="#e2e8f0" font-size="15">반도체 · 전자</text>
    <rect x="300" y="124" width="600" height="24" rx="4" fill="#fbbf24"/>
    <text x="912" y="143" fill="#fde68a" font-size="15" font-weight="700">30</text>

    <text x="60" y="182" fill="#e2e8f0" font-size="15">화학 · 정유</text>
    <rect x="300" y="166" width="560" height="24" rx="4" fill="#f59e0b"/>
    <text x="872" y="185" fill="#fde68a" font-size="15" font-weight="700">28</text>

    <text x="60" y="224" fill="#e2e8f0" font-size="15">자동차부품</text>
    <rect x="300" y="208" width="540" height="24" rx="4" fill="#d97706"/>
    <text x="852" y="227" fill="#fde68a" font-size="15" font-weight="700">27</text>

    <text x="60" y="266" fill="#e2e8f0" font-size="15">기계 · 조선 · 방산</text>
    <rect x="300" y="250" width="480" height="24" rx="4" fill="#b45309"/>
    <text x="792" y="269" fill="#fde68a" font-size="15" font-weight="700">24</text>

    <text x="60" y="308" fill="#e2e8f0" font-size="15">제약 · 바이오</text>
    <rect x="300" y="292" width="480" height="24" rx="4" fill="#b45309"/>
    <text x="792" y="311" fill="#fde68a" font-size="15" font-weight="700">24</text>

    <text x="60" y="350" fill="#e2e8f0" font-size="15">철강 · 금속</text>
    <rect x="300" y="334" width="220" height="24" rx="4" fill="#475569"/>
    <text x="532" y="353" fill="#cbd5e1" font-size="15" font-weight="700">11</text>

    <text x="60" y="392" fill="#f97316" font-size="15" font-weight="700">식음료 (라면·과자·소주)</text>
    <rect x="300" y="376" width="220" height="24" rx="4" fill="#22c55e"/>
    <text x="532" y="395" fill="#86efac" font-size="15" font-weight="700">11</text>

    <text x="60" y="434" fill="#e2e8f0" font-size="15">배터리 (대형주)</text>
    <rect x="300" y="418" width="60" height="24" rx="4" fill="#166534"/>
    <text x="372" y="437" fill="#86efac" font-size="15" font-weight="700">3</text>
  </g>

  <text x="600" y="500" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="15" font-weight="700">삼양식품(라면)이 LG에너지솔루션(배터리)·POSCO홀딩스(철강)와 같은 명단에 오른다</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520">
  <title>벌이 초과 투자 대표 회사의 설비투자 대 영업현금 배수</title>
  <desc>설비투자를 영업활동현금흐름으로 나눈 배수. 삼성SDI 3.87배, 롯데웰푸드 3.54배, SK이노베이션 3.16배, LG에너지솔루션 2.97배, 무학 2.93배, 한국타이어 1.88배, 삼양식품 1.64배, POSCO홀딩스 1.35배. 1을 넘으면 벌이보다 더 투자한 것이다.</desc>
  <defs>
    <linearGradient id="bg06m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#bg06m)" rx="16"/>
  <text x="600" y="48" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="24" font-weight="700">설비투자 대 영업현금 배수: 배터리와 라면이 나란히</text>
  <text x="600" y="78" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">배수 1.0 = 벌이만큼 투자 · 그 이상은 벌이를 넘겨 투자</text>

  <line x1="360" y1="110" x2="360" y2="470" stroke="#f97316" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="360" y="500" text-anchor="middle" fill="#fdba74" font-family="system-ui, sans-serif" font-size="13">벌이 = 1.0배</text>

  <g font-family="system-ui, sans-serif">
    <!-- scale: 1.0 at x=360, each 1.0x = 180px -->
    <text x="60" y="140" fill="#e2e8f0" font-size="15">삼성SDI (배터리)</text>
    <rect x="360" y="124" width="517" height="24" rx="4" fill="#7f1d1d"/>
    <text x="887" y="143" fill="#fca5a5" font-size="14" font-weight="700">3.87배</text>

    <text x="60" y="178" fill="#e2e8f0" font-size="15">롯데웰푸드 (과자)</text>
    <rect x="360" y="162" width="457" height="24" rx="4" fill="#22c55e"/>
    <text x="827" y="181" fill="#86efac" font-size="14" font-weight="700">3.54배</text>

    <text x="60" y="216" fill="#e2e8f0" font-size="15">SK이노베이션 (정유)</text>
    <rect x="360" y="200" width="389" height="24" rx="4" fill="#b45309"/>
    <text x="759" y="219" fill="#fde68a" font-size="14" font-weight="700">3.16배</text>

    <text x="60" y="254" fill="#e2e8f0" font-size="15">LG에너지솔루션 (배터리)</text>
    <rect x="360" y="238" width="355" height="24" rx="4" fill="#7f1d1d"/>
    <text x="725" y="257" fill="#fca5a5" font-size="14" font-weight="700">2.97배</text>

    <text x="60" y="292" fill="#e2e8f0" font-size="15">무학 (소주)</text>
    <rect x="360" y="276" width="347" height="24" rx="4" fill="#22c55e"/>
    <text x="717" y="295" fill="#86efac" font-size="14" font-weight="700">2.93배</text>

    <text x="60" y="330" fill="#e2e8f0" font-size="15">한국타이어 (타이어)</text>
    <rect x="360" y="314" width="158" height="24" rx="4" fill="#d97706"/>
    <text x="528" y="333" fill="#fde68a" font-size="14" font-weight="700">1.88배</text>

    <text x="60" y="368" fill="#e2e8f0" font-size="15">삼양식품 (라면)</text>
    <rect x="360" y="352" width="115" height="24" rx="4" fill="#22c55e"/>
    <text x="485" y="371" fill="#86efac" font-size="14" font-weight="700">1.64배</text>

    <text x="60" y="406" fill="#e2e8f0" font-size="15">POSCO홀딩스 (철강)</text>
    <rect x="360" y="390" width="63" height="24" rx="4" fill="#475569"/>
    <text x="433" y="409" fill="#cbd5e1" font-size="14" font-weight="700">1.35배</text>
  </g>

  <text x="600" y="500" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">배수가 3배를 넘으면 차액을 전부 빚·증자로 메워야 한다 (초록=식음료, 붉은=배터리)</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540">
  <title>영업현금 흑자 1,126곳 중 벌이보다 더 투자한 곳은 235곳</title>
  <desc>2025년 영업활동현금흐름이 플러스인 비금융 상장사 1,126곳 중, 설비투자가 그 영업현금을 넘어선 곳이 235곳(설비투자 100억 이상). 3년 내리 그런 곳은 33곳이다.</desc>
  <defs>
    <linearGradient id="bg06f" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="540" fill="url(#bg06f)" rx="16"/>
  <text x="600" y="52" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="26" font-weight="700">본업으로 현금 버는데도, 다섯 곳 중 한 곳은 벌이보다 더 짓는다</text>
  <text x="600" y="84" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">비금융 상장사 · 영업현금 플러스 · 설비투자(유형자산 취득) · dartlab 전수</text>

  <rect x="150" y="128" width="900" height="56" rx="8" fill="#334155"/>
  <text x="170" y="163" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="17" font-weight="600">비금융 상장사 (영업현금 플러스)</text>
  <text x="1030" y="163" text-anchor="end" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="20" font-weight="700">1,126곳</text>

  <rect x="340" y="204" width="520" height="66" rx="8" fill="#b45309"/>
  <text x="360" y="232" fill="#fde68a" font-family="system-ui, sans-serif" font-size="15">설비투자가 영업현금을 넘어섬 (100억 이상)</text>
  <text x="360" y="258" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">235곳</text>
  <text x="840" y="244" text-anchor="end" fill="#fde68a" font-family="system-ui, sans-serif" font-size="15" font-weight="700">다섯 곳 중 한 곳</text>

  <rect x="420" y="290" width="360" height="46" rx="8" fill="#475569"/>
  <text x="440" y="319" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">(컷 없이) 소액 투자 포함</text>
  <text x="760" y="319" text-anchor="end" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="17" font-weight="700">275곳</text>

  <rect x="480" y="356" width="240" height="58" rx="8" fill="#166534"/>
  <text x="500" y="382" fill="#bbf7d0" font-family="system-ui, sans-serif" font-size="14">3년 내리(2023~2025) 지속형</text>
  <text x="500" y="405" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">33곳</text>

  <text x="600" y="462" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">본업이 부실해서가 아니다. 미래에 팔 물건을 위해 지금 공장을 짓는 베팅이다.</text>
  <text x="600" y="490" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">배터리 LG에너지솔루션과 라면 삼양식품이 같은 명단에 오른다</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520">
  <title>순이익과 영업현금이 갈리는 통로: 외상값과 재고</title>
  <desc>같은 매출에서 출발해도, 순이익은 발생주의라 외상 매출과 창고 재고까지 벌었다고 인정하지만, 영업활동현금흐름은 매출채권과 재고에 묶인 현금을 빼기 때문에 둘이 갈린다.</desc>
  <defs>
    <linearGradient id="bg04a" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#bg04a)" rx="16"/>
  <text x="600" y="50" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="25" font-weight="700">같은 장사, 갈라지는 두 숫자</text>
  <text x="600" y="80" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">발생주의 순이익은 외상과 재고까지 이익으로 인정하고, 영업현금은 그 돈이 묶인 만큼 뺀다</text>

  <rect x="480" y="120" width="240" height="60" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="600" y="150" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="17" font-weight="700">매출 100</text>
  <text x="600" y="170" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">한 해 판 것</text>

  <line x1="600" y1="180" x2="330" y2="250" stroke="#334155" stroke-width="2"/>
  <line x1="600" y1="180" x2="870" y2="250" stroke="#334155" stroke-width="2"/>

  <rect x="150" y="252" width="360" height="150" rx="10" fill="#0f172a" stroke="#166534" stroke-width="1.5"/>
  <text x="330" y="284" text-anchor="middle" fill="#86efac" font-family="system-ui, sans-serif" font-size="18" font-weight="700">순이익 (장부)</text>
  <text x="176" y="318" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">+ 현금으로 판 것</text>
  <text x="176" y="344" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">+ 외상으로 판 것 (아직 못 받음)</text>
  <text x="176" y="370" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">- 팔린 것의 원가만 비용</text>
  <text x="330" y="394" text-anchor="middle" fill="#22c55e" font-family="system-ui, sans-serif" font-size="16" font-weight="800">= 흑자</text>

  <rect x="690" y="252" width="360" height="150" rx="10" fill="#0f172a" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="870" y="284" text-anchor="middle" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="18" font-weight="700">영업현금 (통장)</text>
  <text x="716" y="318" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14">+ 현금으로 받은 것만</text>
  <text x="716" y="344" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="14">- 매출채권 증가 (외상값에 묶임)</text>
  <text x="716" y="370" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="14">- 재고 증가 (창고에 묶임)</text>
  <text x="870" y="394" text-anchor="middle" fill="#ef4444" font-family="system-ui, sans-serif" font-size="16" font-weight="800">= 마이너스일 수 있음</text>

  <text x="600" y="450" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="16" font-weight="700">외상과 재고가 크게 늘면 순이익은 흑자, 영업현금은 마이너스</text>
  <text x="600" y="482" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">이 유출이 성장의 씨앗인지 이익 부풀림인지가 다음 질문이다</text>
</svg>

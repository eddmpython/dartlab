<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560">
  <title>흑자 1,140곳 중 본업 현금이 마이너스였던 곳은 195곳, 3년 내리 그런 곳은 17곳</title>
  <desc>2025년 4분기를 모두 보고한 비금융 상장사 1,829곳 중 순이익 흑자는 1,140곳. 그중 영업활동현금흐름이 마이너스인 곳이 195곳(약 6곳 중 1곳)이고, 3년 내리 흑자이면서 3년 내리 영업현금이 마이너스였던 곳은 17곳으로 좁혀진다.</desc>
  <defs>
    <linearGradient id="bg04f" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="560" fill="url(#bg04f)" rx="16"/>
  <text x="600" y="52" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="26" font-weight="700">흑자를 낸 상장사, 여섯 곳 중 한 곳은 본업 현금이 마이너스</text>
  <text x="600" y="84" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="15">비금융 상장사 · 2025년 4분기 완주 · 순이익과 영업활동현금흐름 · dartlab 전수</text>

  <rect x="150" y="120" width="900" height="54" rx="8" fill="#334155"/>
  <text x="170" y="154" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="17" font-weight="600">비금융 상장사 (4분기 완주)</text>
  <text x="1030" y="154" text-anchor="end" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="20" font-weight="700">1,829곳</text>

  <rect x="235" y="192" width="730" height="52" rx="8" fill="#3f4d63"/>
  <text x="255" y="224" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="16">순이익 흑자</text>
  <text x="945" y="224" text-anchor="end" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="19" font-weight="700">1,140곳</text>

  <rect x="330" y="262" width="540" height="52" rx="8" fill="#475569"/>
  <text x="350" y="294" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="15">흑자인데 영업현금 &lt; 순이익</text>
  <text x="850" y="294" text-anchor="end" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="18" font-weight="700">281곳</text>

  <rect x="410" y="332" width="380" height="64" rx="8" fill="#b45309"/>
  <text x="430" y="360" fill="#fde68a" font-family="system-ui, sans-serif" font-size="15">흑자인데 영업현금 &lt; 0</text>
  <text x="430" y="386" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="800">195곳</text>
  <text x="770" y="372" text-anchor="end" fill="#fde68a" font-family="system-ui, sans-serif" font-size="15" font-weight="700">흑자의 17%</text>

  <rect x="470" y="414" width="260" height="58" rx="8" fill="#7f1d1d"/>
  <text x="490" y="440" fill="#fecaca" font-family="system-ui, sans-serif" font-size="14">3년 내리 흑자 &amp; 3년 내리 영업현금 &lt; 0</text>
  <text x="490" y="463" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">17곳</text>

  <text x="600" y="510" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">단년 195는 이야기의 시작. 사이클과 성장의 현금 유출을 걷어내면 3년 내리 갈린 곳은 17.</text>
  <text x="600" y="534" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">이익은 회계가 인정한 의견, 현금은 통장에 찍힌 사실</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560">
  <title>가져오기 층과 그 위의 정규화, 비교, 분석 층</title>
  <desc>기존 라이브러리는 원문을 가져오는 첫 층에서 완성되고, dartlab은 그 위의 정규화, 비교, 분석, 질문 층을 맡는다</desc>

  <defs>
    <linearGradient id="bg11h" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="560" fill="url(#bg11h)" rx="16"/>

  <text x="600" y="52" text-anchor="middle" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="26" font-weight="700">공시 데이터를 다루는 네 개의 층</text>
  <text x="600" y="82" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="15">가져오기는 바닥일 뿐, 진짜 일은 그 위에서 시작한다</text>

  <!-- 층 4: 질문 -->
  <rect x="300" y="120" width="600" height="70" rx="10" fill="#0a1a10" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="150" text-anchor="middle" fill="#4ade80" font-family="system-ui, sans-serif" font-size="17" font-weight="700">④ 질문으로 답 받기</text>
  <text x="600" y="174" text-anchor="middle" fill="#86efac" font-family="system-ui, sans-serif" font-size="13">ask · 코드 없이 자연어로</text>

  <!-- 층 3: 분석 -->
  <rect x="240" y="205" width="720" height="70" rx="10" fill="#0a1a10" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="235" text-anchor="middle" fill="#4ade80" font-family="system-ui, sans-serif" font-size="17" font-weight="700">③ 분석</text>
  <text x="600" y="259" text-anchor="middle" fill="#86efac" font-family="system-ui, sans-serif" font-size="13">비율 · 신용 · 가치평가 · 서사</text>

  <!-- 층 2: 비교/정규화 -->
  <rect x="180" y="290" width="840" height="70" rx="10" fill="#0a1a10" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="320" text-anchor="middle" fill="#4ade80" font-family="system-ui, sans-serif" font-size="17" font-weight="700">② 정규화와 횡단 비교</text>
  <text x="600" y="344" text-anchor="middle" fill="#86efac" font-family="system-ui, sans-serif" font-size="13">표준 계정 · 시계열 격자 · 전 종목 · 한국과 미국</text>

  <!-- 층 1: 가져오기 (공통 바닥) -->
  <rect x="120" y="375" width="960" height="80" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="600" y="408" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="17" font-weight="700">① 가져오기</text>
  <text x="600" y="432" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">원문 · 재무제표 · 공시 목록</text>

  <!-- 좌측 범위 브래킷: 기존 라이브러리 = 1층만 -->
  <line x1="90" y1="375" x2="90" y2="455" stroke="#f59e0b" stroke-width="2"/>
  <line x1="90" y1="375" x2="104" y2="375" stroke="#f59e0b" stroke-width="2"/>
  <line x1="90" y1="455" x2="104" y2="455" stroke="#f59e0b" stroke-width="2"/>
  <text x="82" y="420" text-anchor="end" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="700">기존</text>
  <text x="82" y="440" text-anchor="end" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="14" font-weight="700">라이브러리</text>

  <!-- 우측 범위 브래킷: dartlab = 전체 -->
  <line x1="1110" y1="120" x2="1110" y2="455" stroke="#22c55e" stroke-width="2"/>
  <line x1="1096" y1="120" x2="1110" y2="120" stroke="#22c55e" stroke-width="2"/>
  <line x1="1096" y1="455" x2="1110" y2="455" stroke="#22c55e" stroke-width="2"/>
  <text x="1118" y="290" text-anchor="start" fill="#4ade80" font-family="system-ui, sans-serif" font-size="15" font-weight="700">dartlab</text>

  <text x="600" y="510" text-anchor="middle" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="15" font-weight="600">같은 바닥 위에서, 기존 도구는 첫 층까지. dartlab은 그 위 전체를 맡는다.</text>
</svg>

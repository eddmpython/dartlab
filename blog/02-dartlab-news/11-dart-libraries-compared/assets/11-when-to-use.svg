<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520">
  <title>언제 무엇을 쓰나</title>
  <desc>원문 그대로가 목적이면 기존 라이브러리, 비교와 분석까지 가려면 dartlab. 층이 다른 두 도구를 목적으로 고른다</desc>

  <defs>
    <linearGradient id="bg11w" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="520" fill="url(#bg11w)" rx="16"/>

  <text x="600" y="52" text-anchor="middle" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="26" font-weight="700">언제 무엇을 쓰나</text>
  <text x="600" y="82" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="15">경쟁이 아니라 목적이 다른 두 층</text>

  <!-- 분기 질문 -->
  <rect x="410" y="120" width="380" height="70" rx="35" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="600" y="153" text-anchor="middle" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="17" font-weight="700">무엇이 목적인가?</text>
  <text x="600" y="177" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">원문 그대로 vs 비교와 분석</text>

  <!-- 왼쪽 분기 -->
  <line x1="500" y1="190" x2="310" y2="250" stroke="#f59e0b" stroke-width="2"/>
  <line x1="700" y1="190" x2="890" y2="250" stroke="#22c55e" stroke-width="2"/>

  <!-- 왼쪽: 기존 라이브러리 -->
  <rect x="70" y="256" width="480" height="200" rx="12" fill="#1a1a10" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="310" y="292" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="17" font-weight="700">기존 라이브러리</text>
  <text x="310" y="316" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">OpenDartReader · dart-fss</text>
  <text x="100" y="356" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14">· 특정 공시 첨부 문서 내려받기</text>
  <text x="100" y="386" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14">· 방금 접수된 공시 실시간 확인</text>
  <text x="100" y="416" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14">· XBRL 원문 태그 그대로 다루기</text>
  <text x="310" y="444" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="600">API를 직접 두드리는 쪽이 빠르다</text>

  <!-- 오른쪽: dartlab -->
  <rect x="650" y="256" width="480" height="200" rx="12" fill="#0a1a10" stroke="#22c55e" stroke-width="1.5"/>
  <text x="890" y="292" text-anchor="middle" fill="#4ade80" font-family="system-ui, sans-serif" font-size="17" font-weight="700">dartlab</text>
  <text x="890" y="316" text-anchor="middle" fill="#86efac" font-family="system-ui, sans-serif" font-size="13">정규화 위의 분석 층</text>
  <text x="680" y="356" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14">· 회사끼리 나란히 비교</text>
  <text x="680" y="386" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14">· 시계열 격자 · 한국과 미국</text>
  <text x="680" y="416" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14">· 비율 · 신용 · 가치평가 · 질문</text>
  <text x="890" y="444" text-anchor="middle" fill="#4ade80" font-family="system-ui, sans-serif" font-size="13" font-weight="600">정리가 끝난 자리에서 시작한다</text>

  <text x="600" y="498" text-anchor="middle" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="15" font-weight="600">가져오는 층 위에 dartlab이 있다. 둘은 층이 다르다.</text>
</svg>

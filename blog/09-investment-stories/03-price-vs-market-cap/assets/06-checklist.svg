<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">주가 다음에 볼 체크리스트</title>
  <desc id="desc">종목 화면에서 주가 다음에 확인할 시가총액, 발행주식수, 거래대금, 희석, 밸류에이션 체크리스트</desc>
  <rect width="1200" height="760" fill="#f7fafc"/>
  <rect x="86" y="64" width="1028" height="632" rx="28" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
  <text x="600" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#172033">주가 다음에 남길 다섯 줄</text>
  <g font-family="Arial, sans-serif" font-size="28" fill="#172033">
    <g transform="translate(150 190)">
      <rect width="900" height="74" rx="18" fill="#e8f0f8"/>
      <circle cx="38" cy="37" r="18" fill="#2f5f73"/>
      <path d="M28 37 L36 46 L50 28" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="47">1. 주가: 1주 가격인가, 전체 회사 가격인가</text>
    </g>
    <g transform="translate(150 286)">
      <rect width="900" height="74" rx="18" fill="#edf7f1"/>
      <circle cx="38" cy="37" r="18" fill="#1f5135"/>
      <path d="M28 37 L36 46 L50 28" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="47">2. 시가총액: 시장이 회사 전체에 붙인 가격은 얼마인가</text>
    </g>
    <g transform="translate(150 382)">
      <rect width="900" height="74" rx="18" fill="#fff3d7"/>
      <circle cx="38" cy="37" r="18" fill="#b98516"/>
      <path d="M28 37 L36 46 L50 28" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="47">3. 주식 수: 증자, 전환, 소각으로 주당 몫이 바뀌었나</text>
    </g>
    <g transform="translate(150 478)">
      <rect width="900" height="74" rx="18" fill="#f4edf8"/>
      <circle cx="38" cy="37" r="18" fill="#6d4d83"/>
      <path d="M28 37 L36 46 L50 28" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="47">4. 거래대금: 내가 사고팔 수 있을 만큼 유동성이 있나</text>
    </g>
    <g transform="translate(150 574)">
      <rect width="900" height="74" rx="18" fill="#f4f7fb"/>
      <circle cx="38" cy="37" r="18" fill="#526477"/>
      <path d="M28 37 L36 46 L50 28" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="80" y="47">5. PER와 PBR: 이익과 자본에 비해 전체 가격은 어떤가</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">비싼 주식과 큰 회사의 차이</title>
  <desc id="desc">1주 가격은 높지만 작은 회사와 1주 가격은 낮지만 큰 회사를 비교하는 지도</desc>
  <rect width="1200" height="700" fill="#f8fbfd"/>
  <text x="600" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#172033">비싼 주식과 큰 회사는 다르다</text>
  <g transform="translate(95 130)">
    <rect width="470" height="500" rx="26" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
    <text x="235" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#172033">1주 가격은 높다</text>
    <rect x="175" y="110" width="120" height="160" rx="16" fill="#bf6b3d"/>
    <text x="235" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff">1주</text>
    <g fill="#f5d5c1">
      <rect x="140" y="330" width="46" height="46" rx="8"/>
      <rect x="198" y="330" width="46" height="46" rx="8"/>
      <rect x="256" y="330" width="46" height="46" rx="8"/>
      <rect x="314" y="330" width="46" height="46" rx="8"/>
    </g>
    <text x="235" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#526477">발행주식수가 적으면</text>
    <text x="235" y="474" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#6d4c11">전체 회사는 작을 수 있다</text>
  </g>
  <g transform="translate(635 130)">
    <rect width="470" height="500" rx="26" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
    <text x="235" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#172033">1주 가격은 낮다</text>
    <g fill="#2f5f73">
      <rect x="95" y="112" width="48" height="48" rx="8"/>
      <rect x="153" y="112" width="48" height="48" rx="8"/>
      <rect x="211" y="112" width="48" height="48" rx="8"/>
      <rect x="269" y="112" width="48" height="48" rx="8"/>
      <rect x="327" y="112" width="48" height="48" rx="8"/>
      <rect x="95" y="170" width="48" height="48" rx="8"/>
      <rect x="153" y="170" width="48" height="48" rx="8"/>
      <rect x="211" y="170" width="48" height="48" rx="8"/>
      <rect x="269" y="170" width="48" height="48" rx="8"/>
      <rect x="327" y="170" width="48" height="48" rx="8"/>
      <rect x="95" y="228" width="48" height="48" rx="8"/>
      <rect x="153" y="228" width="48" height="48" rx="8"/>
      <rect x="211" y="228" width="48" height="48" rx="8"/>
      <rect x="269" y="228" width="48" height="48" rx="8"/>
      <rect x="327" y="228" width="48" height="48" rx="8"/>
    </g>
    <text x="235" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#526477">발행주식수가 많으면</text>
    <text x="235" y="474" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1f5135">전체 회사는 더 클 수 있다</text>
  </g>
  <text x="600" y="666" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#526477">투자 화면에서는 주가 다음에 시가총액과 발행주식수를 같이 본다</text>
</svg>

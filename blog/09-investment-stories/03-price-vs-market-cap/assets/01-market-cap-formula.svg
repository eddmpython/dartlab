<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">시가총액 공식</title>
  <desc id="desc">주가에 발행주식수를 곱하면 시가총액이 된다는 공식과 두 회사의 비교 예시</desc>
  <rect width="1200" height="680" fill="#f7fafc"/>
  <rect x="70" y="58" width="1060" height="564" rx="26" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
  <text x="600" y="126" text-anchor="middle" font-family="Arial, sans-serif" font-size="44" font-weight="700" fill="#172033">시가총액은 회사 전체의 가격표다</text>
  <g transform="translate(120 190)">
    <rect x="0" y="0" width="265" height="160" rx="20" fill="#e8f0f8" stroke="#b8c8d9" stroke-width="2"/>
    <text x="132" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#19324a">주가</text>
    <text x="132" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#526477">1주 가격</text>
  </g>
  <text x="445" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#2f5f73">x</text>
  <g transform="translate(505 190)">
    <rect x="0" y="0" width="265" height="160" rx="20" fill="#edf7f1" stroke="#a8cfb6" stroke-width="2"/>
    <text x="132" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#1f5135">발행주식수</text>
    <text x="132" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#526477">몇 조각인가</text>
  </g>
  <text x="830" y="292" text-anchor="middle" font-family="Arial, sans-serif" font-size="54" font-weight="700" fill="#2f5f73">=</text>
  <g transform="translate(890 190)">
    <rect x="0" y="0" width="220" height="160" rx="20" fill="#fff3d7" stroke="#dfbd61" stroke-width="2"/>
    <text x="110" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#6d4c11">시가총액</text>
    <text x="110" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#526477">전체 가격</text>
  </g>
  <g transform="translate(150 420)">
    <rect x="0" y="0" width="400" height="132" rx="20" fill="#f4f7fb" stroke="#d7e0ea"/>
    <text x="34" y="44" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172033">A 회사</text>
    <text x="34" y="84" font-family="Arial, sans-serif" font-size="24" fill="#526477">주가 50만원 x 100만주</text>
    <text x="34" y="116" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2f5f73">시가총액 5,000억원</text>
  </g>
  <g transform="translate(650 420)">
    <rect x="0" y="0" width="400" height="132" rx="20" fill="#f4f7fb" stroke="#d7e0ea"/>
    <text x="34" y="44" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#172033">B 회사</text>
    <text x="34" y="84" font-family="Arial, sans-serif" font-size="24" fill="#526477">주가 5만원 x 1억주</text>
    <text x="34" y="116" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#2f5f73">시가총액 5조원</text>
  </g>
</svg>

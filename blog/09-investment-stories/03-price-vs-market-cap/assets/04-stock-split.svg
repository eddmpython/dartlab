<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">주식분할 전후</title>
  <desc id="desc">분할 전과 후에 주가와 주식 수가 바뀌어도 전체 가치가 같을 수 있음을 보여주는 도해</desc>
  <rect width="1200" height="700" fill="#f7fafc"/>
  <text x="600" y="74" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#172033">분할은 단위를 바꾸는 일이다</text>
  <g transform="translate(90 140)">
    <rect width="470" height="420" rx="28" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
    <text x="235" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#172033">분할 전</text>
    <rect x="172" y="118" width="126" height="126" rx="22" fill="#2f5f73"/>
    <text x="235" y="194" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff">1주</text>
    <text x="235" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#526477">주가 10만원</text>
    <text x="235" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#526477">발행주식수 100주</text>
    <text x="235" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#6d4c11">시가총액 1,000만원</text>
  </g>
  <g transform="translate(560 325)">
    <circle cx="40" cy="40" r="40" fill="#fff3d7" stroke="#dfbd61" stroke-width="2"/>
    <text x="40" y="52" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#6d4c11">2:1</text>
  </g>
  <g transform="translate(640 140)">
    <rect width="470" height="420" rx="28" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
    <text x="235" y="58" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="700" fill="#172033">분할 후</text>
    <g fill="#2f5f73">
      <rect x="154" y="118" width="84" height="84" rx="16"/>
      <rect x="252" y="118" width="84" height="84" rx="16"/>
    </g>
    <text x="196" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">1주</text>
    <text x="294" y="171" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#ffffff">1주</text>
    <text x="235" y="306" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#526477">주가 5만원</text>
    <text x="235" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#526477">발행주식수 200주</text>
    <text x="235" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#6d4c11">시가총액 1,000만원</text>
  </g>
  <text x="600" y="632" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#526477">가격이 내려간 것처럼 보여도 전체 가치가 자동으로 늘어난 것은 아니다</text>
</svg>

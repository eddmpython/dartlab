<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">기술적 분석 시간 프레임 사다리</title>
  <desc id="desc">분봉, 일봉, 주봉, 월봉은 같은 가격을 서로 다른 질문으로 바꾸며, 지지선과 저항선은 시간 프레임에 따라 달라진다.</desc>
  <rect width="1200" height="720" fill="#111827"/>
  <text x="70" y="82" fill="#f9fafb" font-size="38" font-weight="700">시간 프레임이 먼저다</text>
  <text x="70" y="122" fill="#9ca3af" font-size="18">같은 종가도 분봉, 일봉, 주봉, 월봉에서는 서로 다른 질문이 된다</text>

  <g transform="translate(120 170)">
    <line x1="160" y1="40" x2="160" y2="430" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
    <g transform="translate(0 20)">
      <circle cx="160" cy="40" r="26" fill="#38bdf8"/>
      <text x="220" y="33" fill="#f8fafc" font-size="26" font-weight="700">분봉</text>
      <text x="220" y="65" fill="#cbd5e1" font-size="18">호가, 단기 수급, 장중 변동을 본다</text>
      <text x="690" y="55" fill="#93c5fd" font-size="18">위험: 잡음이 너무 많다</text>
    </g>
    <g transform="translate(0 150)">
      <circle cx="160" cy="40" r="26" fill="#22c55e"/>
      <text x="220" y="33" fill="#f8fafc" font-size="26" font-weight="700">일봉</text>
      <text x="220" y="65" fill="#cbd5e1" font-size="18">20일선, 거래량, 단기 지지선을 본다</text>
      <text x="690" y="55" fill="#86efac" font-size="18">위험: 뉴스 하루에 흔들린다</text>
    </g>
    <g transform="translate(0 280)">
      <circle cx="160" cy="40" r="26" fill="#f59e0b"/>
      <text x="220" y="33" fill="#f8fafc" font-size="26" font-weight="700">주봉</text>
      <text x="220" y="65" fill="#cbd5e1" font-size="18">60일, 120일 흐름과 중기 추세를 본다</text>
      <text x="690" y="55" fill="#fcd34d" font-size="18">위험: 반응이 늦다</text>
    </g>
    <g transform="translate(0 410)">
      <circle cx="160" cy="40" r="26" fill="#a78bfa"/>
      <text x="220" y="33" fill="#f8fafc" font-size="26" font-weight="700">월봉</text>
      <text x="220" y="65" fill="#cbd5e1" font-size="18">사이클, 구조 변화, 장기 박스권을 본다</text>
      <text x="690" y="55" fill="#c4b5fd" font-size="18">위험: 기회비용을 늦게 본다</text>
    </g>
  </g>

  <g transform="translate(150 625)">
    <rect x="0" y="-52" width="900" height="72" rx="16" fill="#020617" stroke="#64748b"/>
    <text x="30" y="-10" fill="#f8fafc" font-size="21">지지선 질문 전에 먼저 쓸 것: "나는 어느 기간의 종가 기준으로 보고 있는가?"</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">기술적 분석의 세 가지 가정과 깨지는 조건</title>
  <desc id="desc">가격 반영, 추세, 반복 행동이라는 가정은 새 정보, 유동성 변화, 시간 기준 오류가 생기면 다시 점검해야 한다.</desc>
  <rect width="1200" height="720" fill="#0f172a"/>
  <text x="70" y="82" fill="#f8fafc" font-size="38" font-weight="700">기술적 분석은 신호가 아니라 가정에서 시작한다</text>
  <text x="70" y="124" fill="#94a3b8" font-size="18">가정이 유용한 만큼, 언제 깨지는지도 같이 적어야 한다</text>

  <g transform="translate(70 180)">
    <rect x="0" y="0" width="310" height="170" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="28" y="46" fill="#e0f2fe" font-size="26" font-weight="700">1. 가격은 흔적이다</text>
    <text x="28" y="86" fill="#cbd5e1" font-size="17">모든 정보가 완벽히 반영된다는 뜻이 아니다.</text>
    <text x="28" y="118" fill="#cbd5e1" font-size="17">참여자가 실제로 거래한 기록이 남는다는 뜻이다.</text>
    <text x="28" y="150" fill="#fbbf24" font-size="16">깨지는 조건: 공시, 실적, 규제, 거래정지</text>
  </g>

  <g transform="translate(445 180)">
    <rect x="0" y="0" width="310" height="170" rx="18" fill="#1e293b" stroke="#22c55e" stroke-width="2"/>
    <text x="28" y="46" fill="#dcfce7" font-size="26" font-weight="700">2. 추세는 관성이다</text>
    <text x="28" y="86" fill="#cbd5e1" font-size="17">오르던 가격은 바로 멈추지 않고,</text>
    <text x="28" y="118" fill="#cbd5e1" font-size="17">내리던 가격도 바로 회복되지 않는 경향이 있다.</text>
    <text x="28" y="150" fill="#fbbf24" font-size="16">깨지는 조건: 큰 갭, 거래량 동반 이탈</text>
  </g>

  <g transform="translate(820 180)">
    <rect x="0" y="0" width="310" height="170" rx="18" fill="#1e293b" stroke="#a78bfa" stroke-width="2"/>
    <text x="28" y="46" fill="#ede9fe" font-size="26" font-weight="700">3. 행동은 반복된다</text>
    <text x="28" y="86" fill="#cbd5e1" font-size="17">손익분기점, 공포, 탐욕, 관망은</text>
    <text x="28" y="118" fill="#cbd5e1" font-size="17">다른 종목에서도 비슷한 흔적을 만든다.</text>
    <text x="28" y="150" fill="#fbbf24" font-size="16">깨지는 조건: 구조 변화, 유동성 단절</text>
  </g>

  <path d="M225 380 C300 430 420 430 510 500" fill="none" stroke="#475569" stroke-width="4"/>
  <path d="M600 380 C600 440 600 455 600 500" fill="none" stroke="#475569" stroke-width="4"/>
  <path d="M975 380 C900 430 780 430 690 500" fill="none" stroke="#475569" stroke-width="4"/>
  <polygon points="510,500 493,493 501,512" fill="#475569"/>
  <polygon points="600,500 590,482 610,482" fill="#475569"/>
  <polygon points="690,500 699,493 707,512" fill="#475569"/>

  <g transform="translate(250 505)">
    <rect x="0" y="0" width="700" height="126" rx="20" fill="#020617" stroke="#f97316" stroke-width="2"/>
    <text x="34" y="45" fill="#fed7aa" font-size="25" font-weight="700">그래서 기술적 분석의 첫 질문은 "맞나?"가 아니다</text>
    <text x="34" y="82" fill="#e2e8f0" font-size="20">먼저 적을 것: 가격 기준, 시간 프레임, 거래량 확인, 무효 조건</text>
  </g>
</svg>

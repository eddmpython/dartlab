<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">수급과 가격 반응 매트릭스</title>
  <desc id="desc">순매수와 주가 방향, 거래대금 변화를 함께 읽는 네 가지 질문 매트릭스</desc>
  <rect width="1200" height="760" fill="#f7fafc"/>
  <text x="600" y="76" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#172033">같은 순매수도 가격 반응에 따라 질문이 달라진다</text>
  <line x1="600" y1="140" x2="600" y2="650" stroke="#cbd5df" stroke-width="4"/>
  <line x1="120" y1="395" x2="1080" y2="395" stroke="#cbd5df" stroke-width="4"/>
  <text x="360" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#1f5135">주가 상승</text>
  <text x="840" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#8a3d2b">주가 하락</text>
  <text x="72" y="286" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#19324a" transform="rotate(-90 72 286)">거래대금 큼</text>
  <text x="72" y="544" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#526477" transform="rotate(-90 72 544)">거래대금 작음</text>
  <g font-family="Arial, sans-serif">
    <rect x="145" y="165" width="390" height="190" rx="22" fill="#edf7f1" stroke="#a8cfb6"/>
    <text x="340" y="222" text-anchor="middle" font-size="28" font-weight="700" fill="#172033">강한 수요 후보</text>
    <text x="340" y="270" text-anchor="middle" font-size="23" fill="#526477">가격과 돈의 흐름이 같이 움직인다</text>
    <text x="340" y="312" text-anchor="middle" font-size="23" fill="#526477">추세 지속 조건을 확인한다</text>
    <rect x="665" y="165" width="390" height="190" rx="22" fill="#fff3d7" stroke="#dfbd61"/>
    <text x="860" y="222" text-anchor="middle" font-size="28" font-weight="700" fill="#172033">흡수 또는 물량 정리</text>
    <text x="860" y="270" text-anchor="middle" font-size="23" fill="#526477">누가 사도 가격이 밀릴 수 있다</text>
    <text x="860" y="312" text-anchor="middle" font-size="23" fill="#526477">반대편 매도 압력을 본다</text>
    <rect x="145" y="435" width="390" height="190" rx="22" fill="#e8f0f8" stroke="#b8c8d9"/>
    <text x="340" y="492" text-anchor="middle" font-size="28" font-weight="700" fill="#172033">가벼운 반등 후보</text>
    <text x="340" y="540" text-anchor="middle" font-size="23" fill="#526477">가격은 올랐지만 참여가 약하다</text>
    <text x="340" y="582" text-anchor="middle" font-size="23" fill="#526477">거래대금 확인이 필요하다</text>
    <rect x="665" y="435" width="390" height="190" rx="22" fill="#f4edf8" stroke="#cdb8dd"/>
    <text x="860" y="492" text-anchor="middle" font-size="28" font-weight="700" fill="#172033">소음일 가능성</text>
    <text x="860" y="540" text-anchor="middle" font-size="23" fill="#526477">절대 금액이 작으면 의미도 작다</text>
    <text x="860" y="582" text-anchor="middle" font-size="23" fill="#526477">기간 누적으로 다시 본다</text>
  </g>
</svg>

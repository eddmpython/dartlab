<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">수급 체크리스트</title>
  <desc id="desc">투자자별 수급 화면에서 순매수, 상대편, 기간, 가격, 거래대금, 시가총액을 확인하는 체크리스트</desc>
  <rect width="1200" height="800" fill="#f7fafc"/>
  <rect x="82" y="58" width="1036" height="684" rx="28" fill="#ffffff" stroke="#d8e1ea" stroke-width="2"/>
  <text x="600" y="118" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#172033">수급을 볼 때 남길 여섯 줄</text>
  <g font-family="Arial, sans-serif" font-size="27" fill="#172033">
    <g transform="translate(140 170)">
      <rect width="920" height="70" rx="18" fill="#e8f0f8"/>
      <circle cx="38" cy="35" r="18" fill="#2f5f73"/>
      <path d="M28 35 L36 44 L50 26" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="45">1. 어느 집단이 순매수했고, 반대편은 누구였나</text>
    </g>
    <g transform="translate(140 260)">
      <rect width="920" height="70" rx="18" fill="#edf7f1"/>
      <circle cx="38" cy="35" r="18" fill="#1f5135"/>
      <path d="M28 35 L36 44 L50 26" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="45">2. 하루 숫자인가, 여러 날 누적인가</text>
    </g>
    <g transform="translate(140 350)">
      <rect width="920" height="70" rx="18" fill="#fff3d7"/>
      <circle cx="38" cy="35" r="18" fill="#b98516"/>
      <path d="M28 35 L36 44 L50 26" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="45">3. 그동안 주가는 올랐나, 내렸나</text>
    </g>
    <g transform="translate(140 440)">
      <rect width="920" height="70" rx="18" fill="#fff1ee"/>
      <circle cx="38" cy="35" r="18" fill="#8a3d2b"/>
      <path d="M28 35 L36 44 L50 26" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="45">4. 거래량과 거래대금이 같이 커졌나</text>
    </g>
    <g transform="translate(140 530)">
      <rect width="920" height="70" rx="18" fill="#f4edf8"/>
      <circle cx="38" cy="35" r="18" fill="#6d4d83"/>
      <path d="M28 35 L36 44 L50 26" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="45">5. 순매수 금액은 시가총액 대비 의미 있는가</text>
    </g>
    <g transform="translate(140 620)">
      <rect width="920" height="70" rx="18" fill="#f4f7fb"/>
      <circle cx="38" cy="35" r="18" fill="#526477"/>
      <path d="M28 35 L36 44 L50 26" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="45">6. 공시나 지수 이벤트가 같은 날 있었나</text>
    </g>
  </g>
</svg>

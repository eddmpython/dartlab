name: "AI 광풍"
title: "AI 광풍, 언제까지 갈까요. 봐야 할 신호는 딱 하나입니다"
date: 2026-07-01
sector: tech
type: economy

caption: |
  AI가 미쳐 날뛴다는 말이 과장이 아닙니다. 챗GPT 한 곳만 월 사용자가 약 11억명입니다. 그런데 이 광풍이 언제까지 갈지 재려면 관심이 아니라 돈을 봐야 합니다.

  관심만 보면 오히려 선두가 내려갑니다. AI 챗봇 웹방문에서 챗GPT 몫은 2026년 5월 말 46.4퍼센트로 50퍼센트 아래까지 내려왔습니다. 사라진 게 아니라 제미나이 27.7퍼센트와 클로드 10.3퍼센트로 나뉜 것이고, 판 자체는 오히려 커졌습니다.

  닷컴 거품은 관심만 폭발하고 매출이 안 따라와 꺼졌습니다. 이번은 다릅니다. 관심이 흔들리는 동안에도 돈 곡선은 한 번도 꺾이지 않았습니다. 앤스로픽의 연환산 매출 속도는 2024년 1월 약 0.87억달러에서 2026년 4월 약 300억달러까지 계속 우상향했습니다. 오픈AI도 130억에서 250억달러로 올라 그 속도를 유지했습니다.

  그래서 광풍이 식는 신호는 SNS가 잠잠해지는 날이 아니라, 이 돈 곡선이 관심과 벌어지며 꺾이는 분기입니다. 그 분기는 아직 오지 않았습니다.
pinnedComment: "교육용 카드뉴스입니다. 투자 권유나 특정 종목 추천이 아닙니다. 숫자는 공시가 아니라 뉴스·웹 보도치이며, 측정 방식(웹방문·앱 사용자·매출 집계 기준)마다 값이 달라 한 계열로 통일해 인용했습니다. 매출 속도(런레이트)는 지금 속도로 1년을 벌면 얼마인지 환산한 값이고, 앤스로픽 수치는 리셀러 클라우드 매출까지 더한 큰(gross) 기준이라 절대 크기보다 곡선이 꺾이지 않았다는 방향이 핵심입니다. 오픈AI·앤스로픽은 비상장이라 감사받은 재무가 아니며, 이 카드는 붐의 수명을 재는 신호를 관심에서 돈으로 옮겨 읽자는 관찰이지 미래 예측이 아닙니다."

explainers:
  - term: "매출 속도(런레이트)"
    body: "지금 벌리는 속도로 1년을 채우면 얼마인지 환산한 매출입니다. 아직 1년을 다 번 게 아니라 현재 속도를 연간으로 늘린 값입니다."
  - term: "웹방문 점유율"
    body: "주요 AI 챗봇 사이트 방문 중 각 서비스가 차지하는 몫입니다. 앱이나 기업용까지 재는 다른 지표와는 값이 다릅니다."

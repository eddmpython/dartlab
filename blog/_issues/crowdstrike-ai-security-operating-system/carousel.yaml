name: "CrowdStrike"
stockCode: "CRWD"
corpName: "CrowdStrike"
title: "CrowdStrike는 백신보다 보안 운영체제를 봅니다"
date: 2026-06-29
sector: cybersecurity
type: event
caption: |
  사이버보안은 예전처럼 백신 하나를 깔고 끝나는 시장이 아닙니다.
  공격 표면은 엔드포인트, 클라우드, 아이덴티티, 로그, AI 에이전트까지 넓어졌습니다.

  그래서 CrowdStrike를 볼 때 핵심은 "좋은 보안주인가"보다 더 좁습니다.
  Falcon이 고객의 보안 운영체제처럼 더 많은 모듈을 묶고 있는지 봐야 합니다.

  회계연도 2027년 1분기, 즉 2026년 4월 30일에 끝난 분기 기준 ARR은 55억1000만달러였습니다.
  순신규 ARR은 2억5600만달러, free cash flow는 4억6800만달러였습니다.
  또 구독 고객 중 6개 이상 모듈을 쓰는 비중은 51%라고 회사가 밝혔습니다.

  다음 체크포인트는 단순합니다.
  AI 보안 수요가 실제 모듈 확장으로 이어지는가.
  사고 이후 신뢰 회복과 유지율이 숫자로 확인되는가.
explainers:
  - term: "EDR"
    body: "Endpoint Detection and Response의 약자입니다. 노트북, 서버 같은 단말에서 수상한 행위를 탐지하고 대응하는 보안 영역입니다."
  - term: "SOC"
    body: "Security Operations Center의 약자입니다. 보안 경보를 모니터링하고 침해 여부를 판단해 대응하는 조직 또는 운영 체계를 말합니다."
  - term: "ARR"
    body: "Annual Recurring Revenue의 약자입니다. 구독형 소프트웨어 회사가 반복적으로 기대할 수 있는 연간 매출 규모를 보는 지표입니다."
  - term: "Agentic SOC"
    body: "보안 분석가가 하던 경보 분류, 조사, 대응 일부를 AI 에이전트가 보조하거나 자동화하는 운영 모델입니다."
  - term: "회계연도"
    body: "기업이 실적을 끊어 보는 1년 기준입니다. CrowdStrike의 회계연도 2027년 1분기는 달력상 2026년 4월 30일에 끝난 분기입니다."

name: "인공지능"
title: "인공지능은 어디까지 갈 수 있을까"
date: 2026-06-30
sector: tech
type: economy

caption: |
  인공지능이 어디까지 갈 수 있느냐는 보통 기술의 질문으로 다뤄집니다. 더 큰 모델, 더 똑똑한 추론.

  그런데 인공지능을 굴리려면 모델보다 먼저 엄청난 설비가 필요합니다. 데이터센터, 반도체, 전력. 그래서 빅테크의 설비투자가 폭증했습니다. 세계 최고의 현금창출 기업인 마이크로소프트조차 분기 설비투자가 2024년 약 100억 달러에서 2026년 약 310억 달러로 뛰었습니다.

  문제는 그 돈이 버는 현금을 빠르게 먹기 시작했다는 겁니다. 설비투자가 영업현금흐름에서 차지하는 비율이 27%에서 66%로 올랐습니다. 벌어들이는 현금보다 투자가 더 빨리 크면, 아무리 큰 회사도 그 속도를 영원히 이어갈 수는 없습니다.

  그래서 인공지능의 천장은 모델이 아니라 현금이 정합니다. 다음에 인공지능이 어디까지 갈지 궁금하면, 새 모델 발표가 아니라 빅테크의 현금흐름표 — 설비투자가 버는 현금을 먹는 속도를 보면 됩니다.
pinnedComment: "교육용 카드뉴스입니다. 투자 권유나 특정 종목 추천이 아닙니다. 숫자는 마이크로소프트(MSFT)가 미국 증권거래위원회(SEC)에 제출한 현금흐름표 직독입니다. 분기 설비투자(유형자산 취득)는 2023년 약 66억 달러에서 2026년 약 309억 달러로, 영업현금흐름 대비 비율은 27%(2023)에서 66%(2026)로 올랐습니다. 마이크로소프트는 빅테크 설비투자 흐름을 보여주는 대표 사례로 든 것이며, 흐름은 회사·시점에 따라 다를 수 있습니다."

explainers:
  - term: "설비투자"
    body: "데이터센터·서버·반도체처럼 미래에 쓰려고 미리 들이는 큰 돈입니다. 공시에서는 유형자산 취득으로 잡힙니다."
  - term: "영업현금흐름"
    body: "회사가 본업으로 실제 벌어들인 현금입니다. 이 돈으로 투자도 하고 배당도 합니다. 이익과 달리 진짜 들어온 현금입니다."

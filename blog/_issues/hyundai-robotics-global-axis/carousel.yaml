title: "현대차는 로봇으로 세계의 축이 될 수 있을까"
date: 2026-07-03
sector: mobility
caption: |
  현대차 주가는 2026년 6월 1일 사상 최고인 78만 3천원까지 올랐습니다. 그 값을 밀어올린 건 자동차가 아니라 로봇, 보스턴다이내믹스였습니다.

  현대차는 이 로봇 회사를 2021년 8.8억달러에 사들였고, 2026년 6월 남은 지분까지 인수해 그룹과 정의선 회장이 지분 100%를 채웠습니다. 세계의 로봇 축이 되겠다는 선언입니다.

  그런데 장부는 다른 말을 합니다. 보스턴다이내믹스의 2025년 매출은 1,501억원으로 현대차 연결 매출의 0.08%에 그치고, 순손실은 5,284억원, 5년 누적 손실은 약 1.76조원입니다. 매출보다 손실이 세 배 넘게 큰 적자 자회사입니다.

  그런데도 증권가는 이 회사 가치를 약 30조로 봅니다. 한 증권사는 목표주가 100만원의 근거를 이 로봇에 뒀습니다. 다만 둘 다 재무사실이 아니라 아직 검증되지 않은 기대입니다. 78만원을 만든 진짜 촉매는 실적이 아니라, 로봇 상장으로 정의선 회장 개인 지분 20%가 현금이 되는 승계의 시계였습니다.

  그래서 판단은 연 3만대 로봇공장의 약속이 실제 매출과 흑자로 바뀌는지에서 갈립니다. 아틀라스 양산, 나스닥 상장 서류, 공장 가동. 이 셋이 기대를 실체로 바꿉니다.

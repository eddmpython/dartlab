<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">CoreWeave debt and lease stack</title>
  <desc id="desc">CoreWeave growth is supported by debt, leases, and equipment financing.</desc>
  <rect width="960" height="540" fill="#0b1020"/>
  <rect x="38" y="36" width="884" height="468" rx="24" fill="#111827" stroke="#25334d"/>
  <text x="70" y="86" fill="#f8fafc" font-family="Malgun Gothic, Arial" font-size="28" font-weight="700">부채와 임대가 CoreWeave의 두 번째 재무제표다</text>
  <text x="70" y="120" fill="#9ca3af" font-family="Malgun Gothic, Arial" font-size="16">단위: USD 십억 달러. debt는 2025년 말 원금, lease와 OEM financing은 2026Q1 공시 기준.</text>
  <line x1="190" y1="420" x2="805" y2="420" stroke="#374151" stroke-width="2"/>
  <g font-family="Malgun Gothic, Arial">
    <rect x="214" y="170" width="122" height="250" rx="14" fill="#f59e0b"/>
    <rect x="424" y="303" width="122" height="117" rx="14" fill="#60a5fa"/>
    <rect x="634" y="343" width="122" height="77" rx="14" fill="#34d399"/>
    <text x="275" y="152" text-anchor="middle" fill="#fef3c7" font-size="30" font-weight="700">21.6B</text>
    <text x="485" y="285" text-anchor="middle" fill="#dbeafe" font-size="30" font-weight="700">10.1B</text>
    <text x="695" y="325" text-anchor="middle" fill="#d1fae5" font-size="30" font-weight="700">6.7B</text>
    <text x="275" y="452" text-anchor="middle" fill="#cbd5e1" font-size="16">Debt principal</text>
    <text x="485" y="452" text-anchor="middle" fill="#cbd5e1" font-size="16">Operating leases</text>
    <text x="695" y="452" text-anchor="middle" fill="#cbd5e1" font-size="16">OEM financing</text>
  </g>
  <text x="70" y="488" fill="#9ca3af" font-family="Malgun Gothic, Arial" font-size="15">핵심: AI 수요가 커질수록 capacity도 커진다. capacity는 부채, 임대, 장비 금융의 고정 의무로 먼저 잡힌다.</text>
</svg>

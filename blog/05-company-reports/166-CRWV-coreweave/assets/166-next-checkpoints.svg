<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">CoreWeave next filing checklist</title>
  <desc id="desc">Six lines to check in the next CoreWeave filing.</desc>
  <rect width="960" height="540" fill="#07111f"/>
  <rect x="40" y="36" width="880" height="468" rx="24" fill="#0f172a" stroke="#253858"/>
  <text x="72" y="86" fill="#f8fafc" font-family="Malgun Gothic, Arial" font-size="28" font-weight="700">다음 10-Q에서 먼저 볼 여섯 줄</text>
  <text x="72" y="120" fill="#94a3b8" font-family="Malgun Gothic, Arial" font-size="16">좋다 나쁘다가 아니라 backlog가 현금으로 내려오는 속도를 확인한다.</text>
  <g font-family="Malgun Gothic, Arial" font-size="18">
    <rect x="78" y="160" width="250" height="70" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="106" y="204" fill="#e2e8f0">1. Revenue backlog</text>
    <rect x="356" y="160" width="250" height="70" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="384" y="204" fill="#e2e8f0">2. RPO conversion</text>
    <rect x="634" y="160" width="250" height="70" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="662" y="204" fill="#e2e8f0">3. Capex</text>
    <rect x="78" y="260" width="250" height="70" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="106" y="304" fill="#e2e8f0">4. Operating cash flow</text>
    <rect x="356" y="260" width="250" height="70" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="384" y="304" fill="#e2e8f0">5. Debt service</text>
    <rect x="634" y="260" width="250" height="70" rx="14" fill="#1e293b" stroke="#334155"/>
    <text x="662" y="304" fill="#e2e8f0">6. Customer concentration</text>
  </g>
  <path d="M203 230 V260 M481 230 V260 M759 230 V260" stroke="#64748b" stroke-width="2" stroke-dasharray="6 8"/>
  <text x="72" y="410" fill="#f8fafc" font-family="Malgun Gothic, Arial" font-size="22" font-weight="700">판단 문장</text>
  <text x="72" y="446" fill="#cbd5e1" font-family="Malgun Gothic, Arial" font-size="16">backlog만 커지면 기대다. 매출, OCF, capex, debt service가 같이 맞아야 구조다.</text>
</svg>

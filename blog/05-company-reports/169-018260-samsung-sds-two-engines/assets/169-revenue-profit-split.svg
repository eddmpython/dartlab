<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">삼성SDS 2025년 매출과 영업이익의 주인</title>
  <desc id="desc">물류는 매출 53퍼센트지만 영업이익은 14퍼센트, IT서비스는 매출 47퍼센트지만 영업이익은 86퍼센트를 차지한다.</desc>
  <rect width="1200" height="675" rx="30" fill="#07111f"/>
  <text x="70" y="78" fill="#f8fafc" font-family="Pretendard, sans-serif" font-size="34" font-weight="800">매출의 절반과 이익의 주인이 다르다</text>
  <text x="70" y="114" fill="#94a3b8" font-family="Pretendard, sans-serif" font-size="17">2025년, 연결 기준, 단위 조원과 억원</text>
  <g font-family="Pretendard, sans-serif">
    <text x="70" y="190" fill="#cbd5e1" font-size="20" font-weight="700">매출 13.93조원</text>
    <rect x="70" y="220" width="500" height="86" rx="16" fill="#132238"/>
    <rect x="70" y="220" width="235" height="86" rx="16" fill="#22d3ee"/>
    <text x="187" y="258" text-anchor="middle" fill="#06202a" font-size="22" font-weight="900">IT서비스 47%</text>
    <text x="187" y="283" text-anchor="middle" fill="#164e63" font-size="16">6.54조원</text>
    <text x="438" y="258" text-anchor="middle" fill="#e2e8f0" font-size="22" font-weight="900">물류 53%</text>
    <text x="438" y="283" text-anchor="middle" fill="#94a3b8" font-size="16">7.39조원</text>
    <text x="70" y="390" fill="#cbd5e1" font-size="20" font-weight="700">영업이익 9,571억원</text>
    <rect x="70" y="420" width="500" height="86" rx="16" fill="#132238"/>
    <rect x="70" y="420" width="432" height="86" rx="16" fill="#38bdf8"/>
    <text x="286" y="458" text-anchor="middle" fill="#082f49" font-size="22" font-weight="900">IT서비스 86%</text>
    <text x="286" y="483" text-anchor="middle" fill="#075985" font-size="16">8,271억원</text>
    <text x="536" y="458" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="800">14%</text>
    <text x="536" y="483" text-anchor="middle" fill="#94a3b8" font-size="14">1,300억원</text>
    <rect x="650" y="180" width="480" height="350" rx="24" fill="#0d1b2e" stroke="#24415f"/>
    <text x="700" y="235" fill="#f8fafc" font-size="25" font-weight="800">같은 매출 1원, 다른 경제성</text>
    <text x="700" y="295" fill="#22d3ee" font-size="20" font-weight="800">IT서비스 영업이익률 12.6%</text>
    <text x="700" y="333" fill="#94a3b8" font-size="17">클라우드, SI, ITO가 이익의 중심</text>
    <line x1="700" y1="370" x2="1080" y2="370" stroke="#24415f"/>
    <text x="700" y="423" fill="#fbbf24" font-size="20" font-weight="800">물류 영업이익률 1.8%</text>
    <text x="700" y="461" fill="#94a3b8" font-size="17">운임과 물동량이 큰 외형을 만든다</text>
    <text x="70" y="610" fill="#64748b" font-size="15">출처: 삼성SDS 2025년 4분기 실적발표</text>
  </g>
</svg>

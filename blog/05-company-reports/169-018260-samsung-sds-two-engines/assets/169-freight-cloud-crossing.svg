<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">2022년부터 2025년 물류와 클라우드 매출 변화</title>
  <desc id="desc">물류 매출은 2022년 11.27조원에서 2025년 7.39조원으로 줄었고 클라우드는 1.16조원에서 2.68조원으로 늘었다.</desc>
  <rect width="1200" height="675" rx="30" fill="#07111f"/>
  <text x="70" y="76" fill="#f8fafc" font-family="Pretendard, sans-serif" font-size="34" font-weight="800">운임의 봉우리가 내려갈 때 클라우드가 올라왔다</text>
  <text x="70" y="112" fill="#94a3b8" font-family="Pretendard, sans-serif" font-size="17">사업 매출, 단위 조원</text>
  <g transform="translate(90 150)" font-family="Pretendard, sans-serif">
    <line x1="0" y1="400" x2="1020" y2="400" stroke="#334155" stroke-width="2"/>
    <g fill="#64748b" font-size="15" text-anchor="end">
      <text x="-15" y="405">0</text><text x="-15" y="305">3</text><text x="-15" y="205">6</text><text x="-15" y="105">9</text><text x="-15" y="5">12</text>
    </g>
    <g fill="#14243a">
      <rect x="80" y="24" width="105" height="376" rx="12"/><rect x="320" y="161" width="105" height="239" rx="12"/><rect x="560" y="152" width="105" height="248" rx="12"/><rect x="800" y="154" width="105" height="246" rx="12"/>
    </g>
    <g fill="#fbbf24" font-size="18" font-weight="800" text-anchor="middle">
      <text x="132" y="15">11.27</text><text x="372" y="152">7.17</text><text x="612" y="143">7.43</text><text x="852" y="145">7.39</text>
    </g>
    <polyline points="132,361 372,337 612,323 852,311" fill="none" stroke="#22d3ee" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#22d3ee">
      <circle cx="132" cy="361" r="9"/><circle cx="372" cy="337" r="9"/><circle cx="612" cy="323" r="9"/><circle cx="852" cy="311" r="9"/>
    </g>
    <g fill="#67e8f9" font-size="18" font-weight="800" text-anchor="middle">
      <text x="132" y="345">1.16</text><text x="372" y="321">1.88</text><text x="612" y="307">2.32</text><text x="852" y="295">2.68</text>
    </g>
    <g fill="#cbd5e1" font-size="17" text-anchor="middle">
      <text x="132" y="440">2022</text><text x="372" y="440">2023</text><text x="612" y="440">2024</text><text x="852" y="440">2025</text>
    </g>
    <rect x="695" y="12" width="20" height="20" rx="5" fill="#14243a"/><text x="725" y="28" fill="#cbd5e1" font-size="16">물류</text>
    <line x1="815" y1="22" x2="855" y2="22" stroke="#22d3ee" stroke-width="6"/><text x="870" y="28" fill="#cbd5e1" font-size="16">클라우드</text>
  </g>
  <text x="70" y="620" fill="#64748b" font-family="Pretendard, sans-serif" font-size="15">출처: 삼성SDS 2022년부터 2025년 연간 실적발표</text>
</svg>

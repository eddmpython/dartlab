<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">JYP 투어와 MD의 수익 개선 순환</title>
  <desc id="desc">투어, 도시 팝업, 캐릭터 상품, 전자상거래, 현지 물류가 반복되는 순환과 블루개러지 영업이익률 상승을 보여준다.</desc>
  <rect width="1200" height="675" rx="30" fill="#12091b"/>
  <text x="70" y="78" fill="#fff7ed" font-family="Pretendard, sans-serif" font-size="34" font-weight="800">공연 하루를 도시 전체의 소비 주간으로 늘린다</text>
  <text x="70" y="114" fill="#a78b9f" font-family="Pretendard, sans-serif" font-size="17">투어 연결 MD와 Blue Garage 수익 구조</text>
  <g font-family="Pretendard, sans-serif">
    <circle cx="375" cy="360" r="180" fill="#26132e" stroke="#8b5cf6" stroke-width="4"/>
    <circle cx="375" cy="360" r="78" fill="#ec4899"/>
    <text x="375" y="350" text-anchor="middle" fill="#fff7ed" font-size="20" font-weight="800">팬 IP</text>
    <text x="375" y="382" text-anchor="middle" fill="#fff7ed" font-size="20" font-weight="800">반복 구매</text>
    <g fill="#fff7ed" font-size="18" font-weight="800" text-anchor="middle">
      <text x="375" y="202">월드투어</text><text x="520" y="290">도시 팝업</text><text x="510" y="455">캐릭터 MD</text><text x="375" y="535">FANS SHOP</text><text x="235" y="455">현지 물류</text><text x="235" y="290">라이선스</text>
    </g>
    <path d="M375 225 A145 145 0 0 1 500 300" fill="none" stroke="#f9a8d4" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M520 320 A145 145 0 0 1 500 430" fill="none" stroke="#f9a8d4" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M475 465 A145 145 0 0 1 395 500" fill="none" stroke="#f9a8d4" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M350 500 A145 145 0 0 1 255 450" fill="none" stroke="#f9a8d4" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M230 425 A145 145 0 0 1 230 310" fill="none" stroke="#f9a8d4" stroke-width="5" marker-end="url(#arrow)"/>
    <path d="M255 275 A145 145 0 0 1 350 225" fill="none" stroke="#f9a8d4" stroke-width="5" marker-end="url(#arrow)"/>
    <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#f9a8d4"/></marker></defs>
    <rect x="650" y="190" width="470" height="360" rx="28" fill="#26132e" stroke="#4b294f"/>
    <text x="700" y="245" fill="#fff7ed" font-size="25" font-weight="900">Blue Garage 영업이익률</text>
    <rect x="700" y="300" width="120" height="180" rx="18" fill="#6d28d9"/>
    <text x="760" y="285" text-anchor="middle" fill="#c4b5fd" font-size="24" font-weight="900">3.4%</text>
    <text x="760" y="515" text-anchor="middle" fill="#e9d5ff" font-size="17">2024</text>
    <rect x="850" y="244" width="120" height="236" rx="18" fill="#a855f7"/>
    <text x="910" y="229" text-anchor="middle" fill="#e9d5ff" font-size="24" font-weight="900">7.9%</text>
    <text x="910" y="515" text-anchor="middle" fill="#e9d5ff" font-size="17">2025</text>
    <rect x="1000" y="190" width="80" height="290" rx="18" fill="#ec4899"/>
    <text x="1040" y="175" text-anchor="middle" fill="#fbcfe8" font-size="24" font-weight="900">11.1%</text>
    <text x="1040" y="515" text-anchor="middle" fill="#e9d5ff" font-size="17">2026 Q1</text>
    <text x="70" y="620" fill="#7c647a" font-size="15">출처: JYP 2025년 4분기 및 2026년 1분기 Earnings Note</text>
  </g>
</svg>

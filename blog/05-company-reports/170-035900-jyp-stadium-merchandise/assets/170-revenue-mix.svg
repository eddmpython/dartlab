<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">JYP 2025년 매출 구성</title>
  <desc id="desc">앨범 2066억원, 콘서트 1889억원, MD 1885억원이 세 개의 큰 축이다.</desc>
  <rect width="1200" height="675" rx="30" fill="#12091b"/>
  <text x="70" y="78" fill="#fff7ed" font-family="Pretendard, sans-serif" font-size="34" font-weight="800">앨범 회사가 세 개의 2,000억원 엔진을 만들었다</text>
  <text x="70" y="114" fill="#a78b9f" font-family="Pretendard, sans-serif" font-size="17">2025년 매출 8,219억원, 단위 억원</text>
  <g font-family="Pretendard, sans-serif">
    <rect x="70" y="170" width="1060" height="120" rx="22" fill="#2a1533"/>
    <rect x="70" y="170" width="266" height="120" rx="22" fill="#8b5cf6"/>
    <rect x="336" y="170" width="243" height="120" fill="#ec4899"/>
    <rect x="579" y="170" width="242" height="120" fill="#f97316"/>
    <rect x="821" y="170" width="66" height="120" fill="#22d3ee"/>
    <rect x="887" y="170" width="58" height="120" fill="#34d399"/>
    <rect x="945" y="170" width="185" height="120" rx="22" fill="#4b294f"/>
    <g fill="#fff7ed" font-size="18" font-weight="900" text-anchor="middle">
      <text x="203" y="225">앨범</text><text x="203" y="252">2,066</text>
      <text x="457" y="225">콘서트</text><text x="457" y="252">1,889</text>
      <text x="700" y="225">MD</text><text x="700" y="252">1,885</text>
    </g>
    <g transform="translate(85 350)">
      <rect width="310" height="105" rx="18" fill="#26132e"/><text x="26" y="42" fill="#c4b5fd" font-size="19" font-weight="800">스트리밍</text><text x="26" y="76" fill="#fff7ed" font-size="27" font-weight="900">513억원</text>
      <rect x="330" width="310" height="105" rx="18" fill="#26132e"/><text x="356" y="42" fill="#67e8f9" font-size="19" font-weight="800">광고</text><text x="356" y="76" fill="#fff7ed" font-size="27" font-weight="900">450억원</text>
      <rect x="660" width="310" height="105" rx="18" fill="#26132e"/><text x="686" y="42" fill="#6ee7b7" font-size="19" font-weight="800">출연</text><text x="686" y="76" fill="#fff7ed" font-size="27" font-weight="900">354억원</text>
    </g>
    <rect x="280" y="505" width="640" height="62" rx="31" fill="#32183c"/>
    <text x="600" y="544" text-anchor="middle" fill="#f9a8d4" font-size="20" font-weight="800">앨범, 콘서트, MD 합계가 전체 매출의 71%</text>
    <text x="70" y="620" fill="#7c647a" font-size="15">기타 매출 1,062억원 포함. 출처: JYP 2025년 4분기 IR</text>
  </g>
</svg>

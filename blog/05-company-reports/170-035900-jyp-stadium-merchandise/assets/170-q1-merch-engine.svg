<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">JYP 2026년 1분기 MD와 콘서트 성장</title>
  <desc id="desc">주력 아티스트 새 앨범 부재에도 MD 606억원, 콘서트 409억원이 성장을 이끌었다.</desc>
  <rect width="1200" height="675" rx="30" fill="#12091b"/>
  <text x="70" y="78" fill="#fff7ed" font-family="Pretendard, sans-serif" font-size="34" font-weight="800">주력 새 앨범이 없던 분기, MD가 606억원을 만들었다</text>
  <text x="70" y="114" fill="#a78b9f" font-family="Pretendard, sans-serif" font-size="17">2026년 1분기, 단위 억원</text>
  <g font-family="Pretendard, sans-serif">
    <rect x="70" y="170" width="330" height="180" rx="26" fill="#ec4899"/>
    <text x="110" y="220" fill="#fff7ed" font-size="22" font-weight="800">MD</text>
    <text x="110" y="284" fill="#fff7ed" font-size="50" font-weight="900">606</text>
    <text x="110" y="325" fill="#fce7f3" font-size="21" font-weight="800">전년 대비 +85.2%</text>
    <rect x="435" y="170" width="330" height="180" rx="26" fill="#8b5cf6"/>
    <text x="475" y="220" fill="#fff7ed" font-size="22" font-weight="800">콘서트</text>
    <text x="475" y="284" fill="#fff7ed" font-size="50" font-weight="900">409</text>
    <text x="475" y="325" fill="#ede9fe" font-size="21" font-weight="800">전년 대비 +88.7%</text>
    <rect x="800" y="170" width="330" height="180" rx="26" fill="#2a1533" stroke="#f97316" stroke-width="3"/>
    <text x="840" y="220" fill="#fed7aa" font-size="22" font-weight="800">앨범</text>
    <text x="840" y="284" fill="#fff7ed" font-size="50" font-weight="900">252</text>
    <text x="840" y="325" fill="#fdba74" font-size="21" font-weight="800">전년 대비 -15.1%</text>
    <path d="M235 380 V430 H600" stroke="#f9a8d4" stroke-width="5" fill="none"/><path d="M600 380 V430" stroke="#c4b5fd" stroke-width="5" fill="none"/><path d="M965 380 V430 H600" stroke="#fdba74" stroke-width="5" fill="none"/>
    <rect x="305" y="430" width="590" height="120" rx="28" fill="#32183c"/>
    <text x="600" y="477" text-anchor="middle" fill="#fff7ed" font-size="25" font-weight="900">매출 1,860억원, +32.1%</text>
    <text x="600" y="520" text-anchor="middle" fill="#f9a8d4" font-size="22" font-weight="800">영업이익 334억원, +70.0%</text>
    <text x="70" y="620" fill="#7c647a" font-size="15">출처: JYP 2026년 1분기 Earnings Note</text>
  </g>
</svg>

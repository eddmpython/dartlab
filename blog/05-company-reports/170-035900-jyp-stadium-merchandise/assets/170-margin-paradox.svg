<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">JYP 매출 증가와 영업이익률 하락</title>
  <desc id="desc">매출은 2023년 5665억원에서 2025년 8219억원으로 늘었지만 영업이익률은 29.9퍼센트에서 18.9퍼센트로 낮아졌다.</desc>
  <rect width="1200" height="675" rx="30" fill="#12091b"/>
  <text x="70" y="78" fill="#fff7ed" font-family="Pretendard, sans-serif" font-size="34" font-weight="800">사상 최대 매출이 최고 마진을 뜻하지 않았다</text>
  <text x="70" y="114" fill="#a78b9f" font-family="Pretendard, sans-serif" font-size="17">연결 연간, 매출 단위 억원</text>
  <g transform="translate(90 150)" font-family="Pretendard, sans-serif">
    <line x1="0" y1="390" x2="1010" y2="390" stroke="#4b294f" stroke-width="2"/>
    <g fill="#7c3aed" opacity="0.9">
      <rect x="115" y="170" width="180" height="220" rx="22"/><rect x="420" y="156" width="180" height="234" rx="22"/><rect x="725" y="70" width="180" height="320" rx="22"/>
    </g>
    <g fill="#f5d0fe" font-size="24" font-weight="900" text-anchor="middle">
      <text x="205" y="150">5,665</text><text x="510" y="136">6,018</text><text x="815" y="50">8,219</text>
    </g>
    <polyline points="205,86 510,181 815,215" fill="none" stroke="#fb7185" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#fb7185"><circle cx="205" cy="86" r="10"/><circle cx="510" cy="181" r="10"/><circle cx="815" cy="215" r="10"/></g>
    <g fill="#fecdd3" font-size="23" font-weight="900" text-anchor="middle">
      <text x="205" y="73">29.9%</text><text x="510" y="168">21.3%</text><text x="815" y="202">18.9%</text>
    </g>
    <g fill="#e9d5ff" font-size="18" text-anchor="middle"><text x="205" y="430">2023</text><text x="510" y="430">2024</text><text x="815" y="430">2025</text></g>
    <rect x="330" y="470" width="450" height="52" rx="26" fill="#32183c"/>
    <text x="555" y="502" text-anchor="middle" fill="#f9a8d4" font-size="18" font-weight="800">2년간 매출 +45%, 영업이익률 -11.0%p</text>
  </g>
  <text x="70" y="620" fill="#7c647a" font-family="Pretendard, sans-serif" font-size="15">출처: JYP 2025년 4분기 IR, dartlab 연결 손익계산서</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" width="1080" height="720">
  <rect width="1080" height="720" fill="#0a0e1a"/>

  <text x="540" y="44" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">2026~2027년에 봐야 할 다섯 줄</text>
  <text x="540" y="68" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#64748b">한화오션 (042660), 반전이 진짜인지 판가름할 체크포인트</text>

  <!-- 체크 1: OPM 10% (달성) -->
  <rect x="40" y="92" width="1000" height="88" rx="8" fill="#0f1623" stroke="#22c55e" stroke-width="1.5"/>
  <circle cx="72" cy="136" r="18" fill="#22c55e"/>
  <text x="72" y="142" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#0a0e1a">1</text>
  <rect x="1002" y="110" width="24" height="24" rx="4" fill="#22c55e20"/>
  <text x="1014" y="127" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="16" fill="#22c55e">✓</text>
  <text x="104" y="122" font-family="-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#22c55e">분기 영업이익률 10% 안착</text>
  <text x="104" y="148" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#94a3b8">2026Q1 13.7%로 두 자릿수 진입. 2025년 8~11% 범위를 넘어 목표선 통과.</text>
  <rect x="870" y="112" width="120" height="28" rx="4" fill="#22c55e20"/>
  <text x="930" y="131" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#22c55e">현재 13.7%</text>

  <!-- 체크 2: 상선 잔고 이익 착지 (진행중) -->
  <rect x="40" y="196" width="1000" height="88" rx="8" fill="#0f1623" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="72" cy="240" r="18" fill="#f59e0b"/>
  <text x="72" y="246" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#0a0e1a">2</text>
  <rect x="1002" y="214" width="24" height="24" rx="4" fill="#f59e0b20"/>
  <text x="1014" y="231" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="16" fill="#f59e0b">!</text>
  <text x="104" y="226" font-family="-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f59e0b">상선 잔고의 이익 착지</text>
  <text x="104" y="252" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#94a3b8">매출원가율 80% 초반이 유지되며 수주잔고 26조가 이익으로 바뀌는지. 반전의 지속성.</text>
  <rect x="838" y="216" width="154" height="28" rx="4" fill="#f59e0b20"/>
  <text x="915" y="235" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#f59e0b">원가율 80.5%</text>

  <!-- 체크 3: 특수선 손익 전환 (진행중) -->
  <rect x="40" y="300" width="1000" height="88" rx="8" fill="#0f1623" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="72" cy="344" r="18" fill="#f59e0b"/>
  <text x="72" y="350" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#0a0e1a">3</text>
  <rect x="1002" y="318" width="24" height="24" rx="4" fill="#f59e0b20"/>
  <text x="1014" y="335" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="16" fill="#f59e0b">!</text>
  <text x="104" y="330" font-family="-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f59e0b">특수선(방산) 손익 전환</text>
  <text x="104" y="356" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#94a3b8">내수 위주 저마진 특수선이 흑자로. KDDX 공정 본격화 2028년까지는 고정비 부담.</text>
  <rect x="838" y="318" width="154" height="28" rx="4" fill="#f59e0b20"/>
  <text x="915" y="337" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#f59e0b">내수 비중 큼</text>

  <!-- 체크 4: 방산 첫 수출 (미달성) -->
  <rect x="40" y="404" width="1000" height="88" rx="8" fill="#0f1623" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="72" cy="448" r="18" fill="#ef4444"/>
  <text x="72" y="454" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">4</text>
  <rect x="1002" y="422" width="24" height="24" rx="4" fill="#ef444420"/>
  <text x="1014" y="439" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="16" fill="#ef4444">✗</text>
  <text x="104" y="434" font-family="-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#ef4444">방산(특수선) 첫 수출 계약</text>
  <text x="104" y="460" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#94a3b8">폴란드, 캐나다 잠수함 연패. 필리핀, 사우디, 그리스, 태국 경합 중. 수출이 마진 도약의 관건.</text>
  <rect x="838" y="422" width="154" height="28" rx="4" fill="#ef444420"/>
  <text x="915" y="441" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#ef4444">경합 중</text>

  <!-- 체크 5: 이자보상배율/부채 (미달성) -->
  <rect x="40" y="508" width="1000" height="88" rx="8" fill="#0f1623" stroke="#ef4444" stroke-width="1.5"/>
  <circle cx="72" cy="552" r="18" fill="#ef4444"/>
  <text x="72" y="558" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#f1f5f9">5</text>
  <rect x="1002" y="526" width="24" height="24" rx="4" fill="#ef444420"/>
  <text x="1014" y="543" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="16" fill="#ef4444">✗</text>
  <text x="104" y="538" font-family="-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#ef4444">이자보상배율 3.0배, 단기차입 축소</text>
  <text x="104" y="564" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#94a3b8">현재 1.52배, 차입금 6.14조 중 단기 57%. 사이클 하강을 버틸 방어력 확보가 관건.</text>
  <rect x="870" y="526" width="120" height="28" rx="4" fill="#ef444420"/>
  <text x="930" y="545" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#ef4444">현재 1.52배</text>

  <!-- 범례 -->
  <rect x="40" y="616" width="20" height="20" rx="3" fill="#22c55e20"/>
  <text x="52" y="631" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#22c55e">✓</text>
  <text x="70" y="631" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#64748b">달성</text>
  <rect x="140" y="616" width="20" height="20" rx="3" fill="#f59e0b20"/>
  <text x="152" y="631" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#f59e0b">!</text>
  <text x="170" y="631" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#64748b">진행 중</text>
  <rect x="250" y="616" width="20" height="20" rx="3" fill="#ef444420"/>
  <text x="262" y="631" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#ef4444">✗</text>
  <text x="280" y="631" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#64748b">미달성</text>

  <rect x="40" y="652" width="1000" height="46" rx="6" fill="#0f1623" stroke="#334155" stroke-width="1"/>
  <text x="540" y="680" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#64748b">dCR-BBB+ · 수주잔고 34.5조 · 부채비율 205% · 2026-07-13 dartlab 실측</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <rect width="1200" height="720" fill="#0a0e1a"/>

  <text x="600" y="46" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">수주 점유율 반전: 꼴찌에서 국내 1위로</text>
  <text x="600" y="72" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#64748b">한화오션 국내 신조 수주 점유율 (GT 물량 기준)</text>

  <!-- 왼쪽: 3년 상승 -->
  <text x="90" y="120" font-family="-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#fbbf24">한화오션 3년 궤적</text>

  <!-- 기준선 -->
  <line x1="90" y1="520" x2="540" y2="520" stroke="#334155" stroke-width="1"/>
  <!-- 스케일: 35% max → 360px 높이, base y=520, 10.28px per % -->
  <!-- 2023 5.2 → 53px -->
  <rect x="120" y="467" width="90" height="53" rx="3" fill="#ef4444"/>
  <text x="165" y="500" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#fff">5.2%</text>
  <text x="165" y="542" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#94a3b8">2023</text>

  <!-- 2024 24.6 → 253px -->
  <rect x="270" y="267" width="90" height="253" rx="3" fill="#f59e0b"/>
  <text x="315" y="300" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#fff">24.6%</text>
  <text x="315" y="542" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#94a3b8">2024</text>

  <!-- 2025 30.9 → 318px -->
  <rect x="420" y="202" width="90" height="318" rx="3" fill="#22c55e"/>
  <text x="465" y="235" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="700" fill="#fff">30.9%</text>
  <text x="465" y="542" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#22c55e" font-weight="700">2025</text>

  <!-- 상승 화살표 -->
  <path d="M165 455 Q300 360 460 215" stroke="#22c55e" stroke-width="2" fill="none" stroke-dasharray="4,4" opacity="0.6"/>
  <text x="300" y="345" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#22c55e">2년 만에 5.9배</text>

  <!-- 구분선 -->
  <line x1="600" y1="110" x2="600" y2="560" stroke="#1e2d45" stroke-width="1"/>

  <!-- 오른쪽: 2025 국내 순위 -->
  <text x="660" y="120" font-family="-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#fbbf24">2025년 국내 순위</text>

  <!-- 가로 막대: base x=680, 스케일 35%→420px, 12px per % -->
  <!-- 1위 한화오션 30.9 → 371px -->
  <rect x="680" y="150" width="371" height="36" rx="3" fill="#22c55e"/>
  <text x="690" y="174" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#04120a">1. 한화오션</text>
  <text x="1061" y="174" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#22c55e">30.9%</text>

  <!-- 2위 HD현대중공업 25.1 → 301px -->
  <rect x="680" y="206" width="301" height="36" rx="3" fill="#334155"/>
  <text x="690" y="230" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#e2e8f0">2. HD현대중공업</text>
  <text x="991" y="230" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#94a3b8">25.1%</text>

  <!-- 3위 삼성중공업 18.6 → 223px -->
  <rect x="680" y="262" width="223" height="36" rx="3" fill="#334155"/>
  <text x="690" y="286" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#e2e8f0">3. 삼성중공업</text>
  <text x="913" y="286" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#94a3b8">18.6%</text>

  <!-- 4위 HD현대삼호 17.9 → 215px -->
  <rect x="680" y="318" width="215" height="36" rx="3" fill="#334155"/>
  <text x="690" y="342" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#e2e8f0">4. HD현대삼호</text>
  <text x="905" y="342" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#94a3b8">17.9%</text>

  <!-- 기타 7.5 → 90px -->
  <rect x="680" y="374" width="90" height="36" rx="3" fill="#1e2d45"/>
  <text x="690" y="398" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#64748b">기타</text>
  <text x="780" y="398" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#64748b">7.5%</text>

  <!-- 하단 캐비엇 박스 -->
  <rect x="90" y="590" width="1020" height="86" rx="8" fill="#0f1623" stroke="#334155" stroke-width="1"/>
  <text x="110" y="622" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="700" fill="#fbbf24">읽는 법</text>
  <text x="110" y="648" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13.5" fill="#cbd5e1">수주 점유율은 GT(총톤수) 물량 기준이라, 매출액이나 LNG선 같은 고부가 선종의 실제 점유율과는 차이가 있다.</text>
  <text x="110" y="668" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13.5" fill="#cbd5e1">물량 1위라고 이익 1위는 아니다. 그래도 일감을 가장 많이 쓸어담았다는 사실은 바뀌지 않는다.</text>

  <text x="600" y="708" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#334155">출처: 한국조선해양플랜트협회 (한화오션 2025 사업보고서 인용) · dartlab 정리</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720">
  <rect width="1200" height="720" fill="#0a0e1a"/>

  <text x="600" y="46" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">자본잠식 직전에서 결손 해소까지</text>
  <text x="600" y="72" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#64748b">자본총계와 이익잉여금의 4년 (조원)</text>

  <!-- 좌측: 자본총계 -->
  <text x="90" y="120" font-family="-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#fbbf24">자본총계</text>
  <line x1="100" y1="560" x2="560" y2="560" stroke="#334155" stroke-width="1"/>
  <!-- base y=560, 60px per 조 -->
  <!-- 2021 2.22 ->133 -->
  <rect x="110" y="427" width="55" height="133" rx="3" fill="#64748b"/>
  <text x="137" y="415" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#94a3b8">2.22</text>
  <text x="137" y="580" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#64748b">2021</text>
  <!-- 2022 0.74 ->44 (강조) -->
  <rect x="185" y="516" width="55" height="44" rx="3" fill="#ef4444"/>
  <text x="212" y="504" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#ef4444">0.74</text>
  <text x="212" y="580" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#ef4444" font-weight="700">2022</text>
  <!-- 2023 4.31 ->259 -->
  <rect x="260" y="301" width="55" height="259" rx="3" fill="#fbbf24"/>
  <text x="287" y="289" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#94a3b8">4.31</text>
  <text x="287" y="580" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#fbbf24">2023</text>
  <!-- 2024 4.86 ->292 -->
  <rect x="335" y="268" width="55" height="292" rx="3" fill="#22c55e" opacity="0.6"/>
  <text x="362" y="256" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#94a3b8">4.86</text>
  <text x="362" y="580" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#64748b">2024</text>
  <!-- 2025 6.17 ->370 -->
  <rect x="410" y="190" width="55" height="370" rx="3" fill="#22c55e" opacity="0.8"/>
  <text x="437" y="178" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#94a3b8">6.17</text>
  <text x="437" y="580" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#64748b">2025</text>
  <!-- 2026Q1 6.83 ->410 (강조) -->
  <rect x="485" y="150" width="55" height="410" rx="3" fill="#22c55e"/>
  <text x="512" y="138" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#22c55e">6.83</text>
  <text x="512" y="580" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#22c55e" font-weight="700">26Q1</text>

  <text x="330" y="620" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#94a3b8">2022 대비 <tspan font-weight="700" fill="#22c55e">9.2배</tspan> 복원 (자기자본비율 6% to 33%)</text>

  <!-- 구분선 -->
  <line x1="600" y1="110" x2="600" y2="600" stroke="#1e2d45" stroke-width="1"/>

  <!-- 우측: 이익잉여금 (제로선 교차) -->
  <text x="630" y="120" font-family="-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#fbbf24">이익잉여금 (누적 손익)</text>
  <!-- zero line y=400, 45px per 조 -->
  <line x1="630" y1="400" x2="1120" y2="400" stroke="#334155" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="1128" y="404" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#94a3b8">0</text>

  <!-- 2023 -3.03 -> 136px 아래, y=400~536 -->
  <rect x="660" y="400" width="80" height="136" rx="3" fill="#ef4444"/>
  <text x="700" y="556" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#ef4444">-3.03</text>
  <text x="700" y="392" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#64748b">2023</text>

  <!-- 2024 +0.24 -> 11px 위 -->
  <rect x="770" y="389" width="80" height="11" rx="3" fill="#22c55e" opacity="0.5"/>
  <text x="810" y="378" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#94a3b8">+0.24</text>
  <text x="810" y="420" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#64748b">2024</text>

  <!-- 2025 +1.55 -> 70px 위 -->
  <rect x="880" y="330" width="80" height="70" rx="3" fill="#22c55e" opacity="0.75"/>
  <text x="920" y="319" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#94a3b8">+1.55</text>
  <text x="920" y="420" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#64748b">2025</text>

  <!-- 2026Q1 +2.03 -> 91px 위 -->
  <rect x="990" y="309" width="80" height="91" rx="3" fill="#22c55e"/>
  <text x="1030" y="298" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="700" fill="#22c55e">+2.03</text>
  <text x="1030" y="420" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#22c55e" font-weight="700">26Q1</text>

  <text x="875" y="620" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#94a3b8">누적결손 -3조를 <tspan font-weight="700" fill="#22c55e">3년 만에 갚고 흑자 전환</tspan></text>

  <!-- 하단 -->
  <rect x="90" y="648" width="1020" height="44" rx="8" fill="#0f1623" stroke="#334155" stroke-width="1"/>
  <text x="600" y="676" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#cbd5e1">한화가 넣은 자본과 되돌아온 이익이 대우조선 시절의 상처를 지웠다. 다만 차입금은 아직 6.1조다.</text>

  <text x="600" y="712" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#334155">출처: DART 기반 dartlab 실측 (자본 Q4 스냅샷, 2026은 Q1) · 2026-07-13</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820">
  <rect width="1200" height="820" fill="#0a0e1a"/>

  <text x="600" y="44" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#f1f5f9">재무 회복 대시보드</text>
  <text x="600" y="68" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#64748b">한화오션 핵심 재무 지표 6개 (2026Q1 기준)</text>

  <!-- 카드 1: 부채비율 -->
  <rect x="40" y="92" width="350" height="200" rx="10" fill="#0f1623" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="40" y="92" width="350" height="6" rx="5" fill="#f59e0b"/>
  <text x="215" y="128" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#94a3b8">부채비율</text>
  <text x="215" y="172" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="42" font-weight="700" fill="#f59e0b">205%</text>
  <text x="215" y="200" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#64748b">2022년 1542%에서 정상화</text>
  <rect x="60" y="218" width="310" height="10" rx="5" fill="#1e2d45"/>
  <rect x="60" y="218" width="212" height="10" rx="5" fill="#f59e0b"/>
  <text x="370" y="228" text-anchor="end" font-family="-apple-system,'Segoe UI',sans-serif" font-size="10" fill="#f59e0b">205/300</text>
  <text x="215" y="268" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#64748b">3사 중 중간 (삼성 272, HD 184)</text>

  <!-- 카드 2: ICR -->
  <rect x="425" y="92" width="350" height="200" rx="10" fill="#0f1623" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="425" y="92" width="350" height="6" rx="5" fill="#f59e0b"/>
  <text x="600" y="128" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#94a3b8">이자보상배율 (2025)</text>
  <text x="600" y="172" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="42" font-weight="700" fill="#f59e0b">1.52배</text>
  <text x="600" y="200" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#64748b">번 돈으로 이자를 겨우 갚는 수준</text>
  <rect x="445" y="218" width="310" height="10" rx="5" fill="#1e2d45"/>
  <rect x="445" y="218" width="157" height="10" rx="5" fill="#f59e0b"/>
  <text x="755" y="228" text-anchor="end" font-family="-apple-system,'Segoe UI',sans-serif" font-size="10" fill="#f59e0b">1.52/3.0</text>
  <text x="600" y="268" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#64748b">안전 기준 3.0배까지 2배 더 필요</text>

  <!-- 카드 3: 부실 앙상블 -->
  <rect x="810" y="92" width="350" height="200" rx="10" fill="#0f1623" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="810" y="92" width="350" height="6" rx="5" fill="#fbbf24"/>
  <text x="985" y="128" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#94a3b8">부실 위험 5모델 앙상블</text>
  <text x="985" y="172" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="38" font-weight="700" fill="#fbbf24">주의</text>
  <text x="985" y="200" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#64748b">위험 2 : 안전 2 : 경고 1로 갈림</text>
  <rect x="830" y="216" width="86" height="24" rx="4" fill="#ef444422"/>
  <text x="873" y="232" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#ef4444">Altman Z 위험</text>
  <rect x="924" y="216" width="86" height="24" rx="4" fill="#fbbf2422"/>
  <text x="967" y="232" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#fbbf24">Z'' 경고</text>
  <rect x="1018" y="216" width="122" height="24" rx="4" fill="#22c55e22"/>
  <text x="1079" y="232" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#22c55e">Ohlson/Zmijewski 안전</text>
  <text x="985" y="270" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#fbbf24">회복 중이나 아직 안전구간 아님</text>

  <!-- 카드 4: 자본 회복 -->
  <rect x="40" y="320" width="350" height="200" rx="10" fill="#0f1623" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="40" y="320" width="350" height="6" rx="5" fill="#22c55e"/>
  <text x="215" y="356" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#94a3b8">자본 회복</text>
  <text x="215" y="400" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="42" font-weight="700" fill="#22c55e">9.2배</text>
  <text x="215" y="424" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#f1f5f9">0.74조 (2022)에서 6.83조 (26Q1)</text>
  <rect x="60" y="440" width="90" height="28" rx="4" fill="#ef444420"/>
  <text x="105" y="459" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#ef4444">0.74조</text>
  <text x="215" y="459" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="16" fill="#64748b">▶</text>
  <rect x="250" y="440" width="90" height="28" rx="4" fill="#22c55e20"/>
  <text x="295" y="459" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="600" fill="#22c55e">6.83조</text>
  <text x="215" y="496" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#64748b">한화 유증 + 이익잉여금 결손 해소</text>

  <!-- 카드 5: 이익 변동성 -->
  <rect x="425" y="320" width="350" height="200" rx="10" fill="#0f1623" stroke="#f59e0b" stroke-width="1.5"/>
  <rect x="425" y="320" width="350" height="6" rx="5" fill="#f59e0b"/>
  <text x="600" y="356" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#94a3b8">이익 변동계수</text>
  <text x="600" y="400" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="42" font-weight="700" fill="#f59e0b">4.04</text>
  <text x="600" y="424" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#f1f5f9">이익 변동성이 매우 높음</text>
  <rect x="445" y="444" width="310" height="36" rx="6" fill="#f59e0b15"/>
  <text x="600" y="462" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#f59e0b">2021 OPM -39%에서 26Q1 +13.7%.</text>
  <text x="600" y="478" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="12" fill="#f59e0b">매출 조금에 이익이 크게 출렁</text>
  <text x="600" y="500" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#64748b">고정비 큰 조선업 특성 (양날의 검)</text>

  <!-- 카드 6: 수주잔고 -->
  <rect x="810" y="320" width="350" height="200" rx="10" fill="#0f1623" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="810" y="320" width="350" height="6" rx="5" fill="#22c55e"/>
  <text x="985" y="356" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#94a3b8">수주잔고</text>
  <text x="985" y="400" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="42" font-weight="700" fill="#22c55e">34.5조</text>
  <text x="985" y="424" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="13" fill="#f1f5f9">매출 2.7년치 가시성 확보</text>
  <rect x="830" y="442" width="310" height="14" rx="3" fill="#1e2d45"/>
  <rect x="830" y="442" width="274" height="14" rx="3" fill="#22c55e"/>
  <text x="985" y="476" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#22c55e">상선 26.0 / 특수선 6.3 / 플랜트 2.2</text>
  <text x="985" y="496" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#64748b">업황 하강 시 완충 역할</text>

  <!-- 하단 결론 -->
  <rect x="40" y="548" width="1120" height="90" rx="10" fill="#0f1623" stroke="#334155" stroke-width="1"/>
  <rect x="40" y="548" width="1120" height="5" rx="5" fill="#334155"/>
  <text x="600" y="590" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#f1f5f9">회복은 됐지만 아직 얇은 얼음이다</text>
  <text x="600" y="616" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" fill="#64748b">이자보상배율 1.52배와 단기차입 57%가 다음 사이클의 방어력. 수주잔고 34.5조가 완충.</text>

  <!-- 레이팅 요약 -->
  <rect x="40" y="660" width="1120" height="110" rx="10" fill="#0f1623" stroke="#1e2d45" stroke-width="1"/>
  <rect x="60" y="680" width="200" height="70" rx="6" fill="#22c55e15"/>
  <text x="160" y="706" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#64748b">신용등급 (상향)</text>
  <text x="160" y="734" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#22c55e">dCR-BBB+</text>
  <rect x="286" y="680" width="200" height="70" rx="6" fill="#3b82f615"/>
  <text x="386" y="706" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#64748b">아키타입</text>
  <text x="386" y="734" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#3b82f6">턴어라운드</text>
  <rect x="512" y="680" width="200" height="70" rx="6" fill="#22c55e15"/>
  <text x="612" y="706" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#64748b">전망</text>
  <text x="612" y="734" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#22c55e">긍정적</text>
  <rect x="738" y="680" width="200" height="70" rx="6" fill="#f59e0b15"/>
  <text x="838" y="706" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#64748b">부도확률 (PD)</text>
  <text x="838" y="734" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="18" font-weight="700" fill="#f59e0b">0.15%</text>
  <rect x="964" y="680" width="176" height="70" rx="6" fill="#1e2d45"/>
  <text x="1052" y="706" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#64748b">데이터 기준</text>
  <text x="1052" y="734" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="14" font-weight="600" fill="#94a3b8">2026-07-13</text>

  <text x="600" y="810" text-anchor="middle" font-family="-apple-system,'Segoe UI',sans-serif" font-size="11" fill="#334155">dartlab 실측 · DART 사업보고서 기반 (최신 회계 2026Q1)</text>
</svg>

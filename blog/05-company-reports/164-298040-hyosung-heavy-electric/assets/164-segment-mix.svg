<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">효성중공업 2025년 사업부 매출 믹스</title>
  <desc id="desc">2025년 연결 매출에서 중공업, 건설, 기타가 차지하는 비중을 보여준다.</desc>
  <rect width="960" height="540" fill="#08111f"/>
  <text x="54" y="62" fill="#f8fafc" font-family="Malgun Gothic, Arial" font-size="30" font-weight="700">효성중공업은 변압기 회사이면서 건설 회사다</text>
  <text x="54" y="96" fill="#9fb3c8" font-family="Malgun Gothic, Arial" font-size="16">DART 주요 제품 및 서비스. 2025년 연결 매출 5.97조원</text>
  <circle cx="278" cy="290" r="158" fill="none" stroke="#f43f5e" stroke-width="78" stroke-dasharray="690 304" transform="rotate(-90 278 290)"/>
  <circle cx="278" cy="290" r="158" fill="none" stroke="#38bdf8" stroke-width="78" stroke-dasharray="297 697" stroke-dashoffset="-690" transform="rotate(-90 278 290)"/>
  <circle cx="278" cy="290" r="158" fill="none" stroke="#64748b" stroke-width="78" stroke-dasharray="5 989" stroke-dashoffset="-987" transform="rotate(-90 278 290)"/>
  <circle cx="278" cy="290" r="105" fill="#08111f"/>
  <text x="278" y="282" fill="#f8fafc" font-family="Malgun Gothic, Arial" font-size="32" font-weight="700" text-anchor="middle">5.97조</text>
  <text x="278" y="314" fill="#94a3b8" font-family="Malgun Gothic, Arial" font-size="15" text-anchor="middle">2025 매출</text>
  <g font-family="Malgun Gothic, Arial">
    <rect x="560" y="178" width="24" height="24" rx="5" fill="#f43f5e"/>
    <text x="598" y="198" fill="#f8fafc" font-size="22" font-weight="700">중공업 69.5%</text>
    <text x="598" y="226" fill="#aebfd3" font-size="15">변압기, 차단기, 전동기, 감속기 등 4.15조원</text>
    <rect x="560" y="270" width="24" height="24" rx="5" fill="#38bdf8"/>
    <text x="598" y="290" fill="#f8fafc" font-size="22" font-weight="700">건설 29.9%</text>
    <text x="598" y="318" fill="#aebfd3" font-size="15">주상복합, 아파트, 오피스텔 등 1.79조원</text>
    <rect x="560" y="362" width="24" height="24" rx="5" fill="#64748b"/>
    <text x="598" y="382" fill="#f8fafc" font-size="22" font-weight="700">기타 0.6%</text>
    <text x="598" y="410" fill="#aebfd3" font-size="15">임대 등 328억원</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">전력기기 4사 2025년 매출과 영업이익률</title>
  <desc id="desc">효성중공업, HD현대일렉트릭, LS ELECTRIC, 일진전기의 매출과 영업이익률을 비교한다.</desc>
  <rect width="960" height="540" fill="#08111f"/>
  <text x="54" y="62" fill="#f8fafc" font-family="Malgun Gothic, Arial" font-size="30" font-weight="700">더 크지만 덜 순수하다</text>
  <text x="54" y="96" fill="#9fb3c8" font-family="Malgun Gothic, Arial" font-size="16">2025년 매출 막대와 영업이익률 라벨</text>
  <g font-family="Malgun Gothic, Arial" font-size="15" fill="#cbd5e1">
    <text x="96" y="464">효성중공업</text>
    <text x="300" y="464">HD현대일렉트릭</text>
    <text x="528" y="464">LS ELECTRIC</text>
    <text x="744" y="464">일진전기</text>
  </g>
  <line x1="80" y1="430" x2="890" y2="430" stroke="#334155" stroke-width="2"/>
  <rect x="110" y="132" width="108" height="298" rx="10" fill="#f43f5e"/>
  <rect x="322" y="226" width="108" height="204" rx="10" fill="#38bdf8"/>
  <rect x="538" y="182" width="108" height="248" rx="10" fill="#2563eb"/>
  <rect x="754" y="328" width="108" height="102" rx="10" fill="#64748b"/>
  <g font-family="Malgun Gothic, Arial" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle">
    <text x="164" y="120">5.97조</text>
    <text x="376" y="214">4.08조</text>
    <text x="592" y="170">4.97조</text>
    <text x="808" y="316">2.04조</text>
  </g>
  <g font-family="Malgun Gothic, Arial" font-size="18" fill="#fde68a" text-anchor="middle">
    <text x="164" y="92">OPM 12.5%</text>
    <text x="376" y="186">OPM 24.4%</text>
    <text x="592" y="142">OPM 8.6%</text>
    <text x="808" y="288">OPM 7.4%</text>
  </g>
  <text x="54" y="510" fill="#94a3b8" font-family="Malgun Gothic, Arial" font-size="14">효성중공업은 매출이 가장 크지만, 순수 초고압 변압기 병목주인 HD현대일렉트릭보다 연결 마진이 낮다.</text>
</svg>

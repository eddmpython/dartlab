<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">효성중공업 다음 공시 체크리스트</title>
  <desc id="desc">효성중공업 다음 공시에서 확인할 다섯 가지 숫자를 정리한다.</desc>
  <rect width="960" height="540" fill="#07111f"/>
  <text x="54" y="62" fill="#f8fafc" font-family="Malgun Gothic, Arial" font-size="30" font-weight="700">다음 공시에서 볼 다섯 숫자</text>
  <text x="54" y="96" fill="#9fb3c8" font-family="Malgun Gothic, Arial" font-size="16">수주잔고가 진짜 이익과 현금으로 바뀌는지 확인하는 순서</text>
  <g font-family="Malgun Gothic, Arial">
    <rect x="72" y="140" width="816" height="58" rx="12" fill="#122033" stroke="#243447"/>
    <text x="104" y="177" fill="#f8fafc" font-size="22" font-weight="700">1. 중공업 수주잔고</text>
    <text x="382" y="177" fill="#9fb3c8" font-size="16">20.2조원이 유지되거나 질 좋은 신규 수주로 이어지는가</text>
    <rect x="72" y="220" width="816" height="58" rx="12" fill="#122033" stroke="#243447"/>
    <text x="104" y="257" fill="#f8fafc" font-size="22" font-weight="700">2. 중공업 매출 비중</text>
    <text x="382" y="257" fill="#9fb3c8" font-size="16">건설 비중이 연결 마진을 얼마나 희석하는가</text>
    <rect x="72" y="300" width="816" height="58" rx="12" fill="#122033" stroke="#243447"/>
    <text x="104" y="337" fill="#f8fafc" font-size="22" font-weight="700">3. 매출총이익률</text>
    <text x="382" y="337" fill="#9fb3c8" font-size="16">수주 가격과 원재료 부담이 제품 마진에 남는가</text>
    <rect x="72" y="380" width="816" height="58" rx="12" fill="#122033" stroke="#243447"/>
    <text x="104" y="417" fill="#f8fafc" font-size="22" font-weight="700">4. 영업현금흐름</text>
    <text x="382" y="417" fill="#9fb3c8" font-size="16">이익이 재고와 매출채권에 묶이지 않고 현금으로 들어오는가</text>
    <rect x="72" y="460" width="816" height="58" rx="12" fill="#122033" stroke="#243447"/>
    <text x="104" y="497" fill="#f8fafc" font-size="22" font-weight="700">5. 부채비율</text>
    <text x="382" y="497" fill="#9fb3c8" font-size="16">호황 이익이 재무 레버리지 완화로 이어지는가</text>
  </g>
</svg>

    <text x="292" y="466">당기 수주액</text>
    <text x="504" y="466">당기 매출액</text>
    <text x="716" y="466">당기말 잔고</text>
  </g>
  <g>
    <rect x="92" y="128" width="112" height="310" rx="10" fill="#2563eb"/>
    <rect x="304" y="318" width="112" height="120" rx="10" fill="#38bdf8"/>
    <rect x="516" y="414" width="112" height="24" rx="10" fill="#94a3b8"/>
    <rect x="728" y="28" width="112" height="410" rx="10" fill="#f43f5e"/>
  </g>
  <g font-family="Malgun Gothic, Arial" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle">
    <text x="148" y="116">15.3</text>
    <text x="360" y="306">6.2</text>
    <text x="572" y="402">1.2</text>
    <text x="784" y="22">20.2</text>
  </g>
  <g font-family="Malgun Gothic, Arial" font-size="15" fill="#e2e8f0" text-anchor="middle">

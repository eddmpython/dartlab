<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">효성중공업 2026년 1분기 중공업 수주잔고</title>
  <desc id="desc">전기말 잔고, 당기 수주액, 당기 매출액, 당기말 수주잔고를 막대로 비교한다.</desc>
  <rect width="960" height="540" fill="#07111f"/>
  <text x="54" y="62" fill="#f8fafc" font-family="Malgun Gothic, Arial" font-size="30" font-weight="700">20조 수주잔고는 어디서 왔나</text>
  <text x="54" y="96" fill="#9fb3c8" font-family="Malgun Gothic, Arial" font-size="16">DART 2026년 1분기보고서, 중공업 부문 수주상황. 단위: 조원</text>
  <line x1="86" y1="438" x2="890" y2="438" stroke="#334155" stroke-width="2"/>

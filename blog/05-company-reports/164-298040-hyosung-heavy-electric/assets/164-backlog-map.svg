  <rect x="54" y="500" width="852" height="1" fill="#1f2937"/>
  <text x="54" y="522" fill="#94a3b8" font-family="Malgun Gothic, Arial" font-size="13">중공업 부문에는 효성중공업, Nantong, 인도, HICO 등 주요 종속회사가 포함된다.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" style="background:#0a0e1a;font-family:-apple-system,'Segoe UI',sans-serif">
  <text x="400" y="38" fill="#f1f5f9" font-size="18" font-weight="bold" text-anchor="middle">현대차 주가, 저점에서 세 배 넘게 뛰었다가 되돌림</text>
  <text x="400" y="60" fill="#64748b" font-size="13" text-anchor="middle">52주 저점 20.4만 → 사상최고 78.3만(2026-06-01) → 50.2만(2026-06-30)</text>

  <!-- axes -->
  <line x1="90" y1="90" x2="90" y2="330" stroke="#1e293b" stroke-width="1"/>
  <line x1="90" y1="330" x2="730" y2="330" stroke="#1e293b" stroke-width="1"/>
  <line x1="90" y1="183" x2="730" y2="183" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4"/>

  <!-- y labels (만원) -->
  <text x="80" y="99" fill="#64748b" font-size="11" text-anchor="end">80만</text>
  <text x="80" y="188" fill="#64748b" font-size="11" text-anchor="end">50만</text>
  <text x="80" y="277" fill="#64748b" font-size="11" text-anchor="end">20만</text>

  <!-- path: low(150,276) -> peak(500,95) -> current(680,183) -->
  <polyline points="150,276 500,95 680,183" fill="none" stroke="#fbbf24" stroke-width="3"/>

  <circle cx="150" cy="276" r="6" fill="#64748b"/>
  <circle cx="500" cy="95" r="7" fill="#ef4444"/>
  <circle cx="680" cy="183" r="6" fill="#fbbf24"/>

  <text x="150" y="300" fill="#94a3b8" font-size="12" text-anchor="middle">203,500원</text>
  <text x="150" y="316" fill="#64748b" font-size="10" text-anchor="middle">52주 저점</text>

  <text x="500" y="82" fill="#ef4444" font-size="14" font-weight="bold" text-anchor="middle">783,000원</text>
  <text x="500" y="66" fill="#64748b" font-size="10" text-anchor="middle">사상최고 · 2026-06-01</text>

  <text x="695" y="170" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle">502,000원</text>
  <text x="700" y="205" fill="#64748b" font-size="10" text-anchor="middle">현재</text>

  <!-- annotations -->
  <text x="330" y="150" fill="#22c55e" font-size="12" text-anchor="middle">저점 대비 +285%</text>
  <text x="600" y="115" fill="#ef4444" font-size="12" text-anchor="middle">고점서 -36%</text>

  <text x="400" y="360" fill="#64748b" font-size="11" text-anchor="middle">78만원까지 올린 것은 자동차였을까, 아니면 로봇 옵션이었을까</text>
</svg>

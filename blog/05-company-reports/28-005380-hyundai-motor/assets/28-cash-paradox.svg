<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" style="background:#0a0e1a;font-family:-apple-system,'Segoe UI',sans-serif">
  <text x="400" y="38" fill="#f1f5f9" font-size="18" font-weight="bold" text-anchor="middle">영업이익은 11.5조 흑자, 연결 영업현금은 6조 마이너스</text>
  <text x="400" y="60" fill="#64748b" font-size="13" text-anchor="middle">현대캐피탈 할부·리스채권이 운전자본에서 34조를 삼킨다 (조원)</text>

  <!-- zero line -->
  <line x1="90" y1="250" x2="730" y2="250" stroke="#334155" stroke-width="1"/>
  <text x="80" y="150" fill="#64748b" font-size="11" text-anchor="end">+15</text>
  <text x="80" y="254" fill="#64748b" font-size="11" text-anchor="end">0</text>
  <text x="80" y="312" fill="#64748b" font-size="11" text-anchor="end">-6</text>

  <!-- x labels -->
  <text x="150" y="350" fill="#94a3b8" font-size="12" text-anchor="middle">2021</text>
  <text x="280" y="350" fill="#94a3b8" font-size="12" text-anchor="middle">2022</text>
  <text x="410" y="350" fill="#94a3b8" font-size="12" text-anchor="middle">2023</text>
  <text x="540" y="350" fill="#94a3b8" font-size="12" text-anchor="middle">2024</text>
  <text x="670" y="350" fill="#94a3b8" font-size="12" text-anchor="middle">2025</text>

  <!-- 영업이익 line (green): 6.68,9.82,15.13,14.24,11.47 ; y=250-val*10 -->
  <polyline points="150,183.2 280,151.8 410,98.7 540,107.6 670,135.3" fill="none" stroke="#22c55e" stroke-width="3"/>
  <circle cx="150" cy="183.2" r="5" fill="#22c55e"/>
  <circle cx="280" cy="151.8" r="5" fill="#22c55e"/>
  <circle cx="410" cy="98.7" r="5" fill="#22c55e"/>
  <circle cx="540" cy="107.6" r="5" fill="#22c55e"/>
  <circle cx="670" cy="135.3" r="6" fill="#22c55e"/>

  <!-- 영업CF line (red): -1.18,10.63,-2.52,-5.66,-5.99 -->
  <polyline points="150,261.8 280,143.7 410,275.2 540,306.6 670,309.9" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="2"/>
  <circle cx="150" cy="261.8" r="5" fill="#ef4444"/>
  <circle cx="280" cy="143.7" r="5" fill="#ef4444"/>
  <circle cx="410" cy="275.2" r="5" fill="#ef4444"/>
  <circle cx="540" cy="306.6" r="5" fill="#ef4444"/>
  <circle cx="670" cy="309.9" r="6" fill="#ef4444"/>

  <!-- key labels -->
  <text x="670" y="126" fill="#22c55e" font-size="13" font-weight="bold" text-anchor="middle">11.5</text>
  <text x="670" y="326" fill="#ef4444" font-size="13" font-weight="bold" text-anchor="middle">-5.99</text>
  <text x="280" y="134" fill="#94a3b8" font-size="11" text-anchor="middle">+10.63</text>

  <!-- legend -->
  <rect x="150" y="76" width="14" height="4" fill="#22c55e"/>
  <text x="170" y="82" fill="#94a3b8" font-size="11" text-anchor="start">영업이익</text>
  <rect x="250" y="76" width="14" height="4" fill="#ef4444"/>
  <text x="270" y="82" fill="#94a3b8" font-size="11" text-anchor="start">연결 영업활동현금흐름</text>

  <!-- annotation -->
  <text x="500" y="382" fill="#fbbf24" font-size="11" text-anchor="middle">별도(자동차만) 영업현금은 흑자. 마이너스는 손실이 아니라 금융자회사 연결의 착시.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" style="background:#0a0e1a;font-family:-apple-system,'Segoe UI',sans-serif">
  <text x="400" y="38" fill="#f1f5f9" font-size="18" font-weight="bold" text-anchor="middle">한국산 자동차 미국 관세, 25%에서 15%로 내렸다가 다시 흔들린다</text>
  <text x="400" y="60" fill="#64748b" font-size="13" text-anchor="middle">관세는 이제 실적 변수가 아니라 정치 변수</text>

  <line x1="90" y1="300" x2="720" y2="300" stroke="#1e293b" stroke-width="1"/>
  <line x1="90" y1="130" x2="720" y2="130" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4"/>
  <line x1="90" y1="215" x2="720" y2="215" stroke="#1e293b" stroke-width="0.5" stroke-dasharray="4"/>
  <text x="80" y="135" fill="#64748b" font-size="11" text-anchor="end">25%</text>
  <text x="80" y="220" fill="#64748b" font-size="11" text-anchor="end">15%</text>

  <!-- step path: 25(2025.04) -> 15(2025.11) -> 25 위협(2026.01, dashed) -->
  <polyline points="180,130 400,130 400,215 560,215" fill="none" stroke="#fbbf24" stroke-width="3"/>
  <polyline points="560,215 560,130 680,130" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="6"/>

  <circle cx="180" cy="130" r="6" fill="#ef4444"/>
  <circle cx="400" cy="215" r="7" fill="#22c55e"/>
  <circle cx="680" cy="130" r="6" fill="#ef4444"/>

  <text x="180" y="322" fill="#94a3b8" font-size="12" text-anchor="middle">2025.04</text>
  <text x="180" y="116" fill="#ef4444" font-size="14" font-weight="bold" text-anchor="middle">25%</text>
  <text x="180" y="340" fill="#64748b" font-size="10" text-anchor="middle">트럼프 25% 부과</text>

  <text x="400" y="322" fill="#94a3b8" font-size="12" text-anchor="middle">2025.11</text>
  <text x="400" y="238" fill="#22c55e" font-size="14" font-weight="bold" text-anchor="middle">15%</text>
  <text x="400" y="340" fill="#64748b" font-size="10" text-anchor="middle">한미 합의로 인하(일본과 동률)</text>

  <text x="640" y="322" fill="#94a3b8" font-size="12" text-anchor="middle">2026.01</text>
  <text x="680" y="116" fill="#ef4444" font-size="13" font-weight="bold" text-anchor="middle">25%?</text>
  <text x="640" y="340" fill="#64748b" font-size="10" text-anchor="middle">트럼프 재위협(미발효)</text>

  <rect x="430" y="248" width="270" height="22" rx="4" fill="#fbbf24" opacity="0.08"/>
  <text x="565" y="263" fill="#fbbf24" font-size="11" text-anchor="middle">인하의 대가: 한국 국내투자 86.5조원 약속</text>

  <text x="400" y="380" fill="#64748b" font-size="11" text-anchor="middle">관측 가능한 흔적: 2025년 4분기 영업이익 1.70조로 급락(전년 동기 2.82조)</text>
</svg>

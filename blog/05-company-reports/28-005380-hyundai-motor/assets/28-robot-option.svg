<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" style="background:#0a0e1a;font-family:-apple-system,'Segoe UI',sans-serif">
  <text x="400" y="38" fill="#f1f5f9" font-size="18" font-weight="bold" text-anchor="middle">78만원을 만든 것: 로봇의 미검증 기대 vs 로봇의 실측 적자</text>
  <text x="400" y="60" fill="#64748b" font-size="13" text-anchor="middle">보스턴다이내믹스, 시장이 매긴 값과 장부가 말하는 값</text>

  <line x1="400" y1="90" x2="400" y2="360" stroke="#1e293b" stroke-width="1" stroke-dasharray="4"/>

  <!-- Left: 시장 기대 (미검증) -->
  <text x="200" y="115" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle">시장 기대 (미검증)</text>
  <ellipse cx="200" cy="185" rx="130" ry="46" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6"/>
  <text x="200" y="180" fill="#fbbf24" font-size="22" font-weight="bold" text-anchor="middle">30조 ~ 128조</text>
  <text x="200" y="203" fill="#94a3b8" font-size="11" text-anchor="middle">기업가치 추정</text>
  <text x="200" y="258" fill="#94a3b8" font-size="12" text-anchor="middle">증권가 현재 약 30조원</text>
  <text x="200" y="278" fill="#94a3b8" font-size="12" text-anchor="middle">KB 2035년 전망 128조원</text>
  <text x="200" y="298" fill="#94a3b8" font-size="12" text-anchor="middle">다올 목표주가 100만원</text>
  <text x="200" y="335" fill="#64748b" font-size="11" text-anchor="middle">아직 증명 안 된 셀사이드 기대</text>

  <!-- Right: 재무 실측 -->
  <text x="600" y="115" fill="#ef4444" font-size="14" font-weight="bold" text-anchor="middle">재무 실측</text>
  <rect x="540" y="150" width="120" height="130" rx="4" fill="#ef4444" opacity="0.8"/>
  <text x="600" y="205" fill="#f1f5f9" font-size="20" font-weight="bold" text-anchor="middle">-1.76조</text>
  <text x="600" y="228" fill="#f1f5f9" font-size="11" text-anchor="middle">5년 누적 순손실</text>
  <text x="600" y="308" fill="#94a3b8" font-size="12" text-anchor="middle">2025 매출 1,501억 / 순손실 5,284억</text>
  <text x="600" y="335" fill="#64748b" font-size="11" text-anchor="middle">매출보다 손실이 3배 이상 큰 적자 자회사</text>

  <text x="400" y="392" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">78만원은 자동차가 아니라, 아직 증명 안 된 로봇 옵션값이었다</text>
</svg>

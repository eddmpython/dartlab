<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" style="background:#0a0e1a;font-family:-apple-system,'Segoe UI',sans-serif">
  <text x="400" y="38" fill="#f1f5f9" font-size="18" font-weight="bold" text-anchor="middle">현대차가 판 전동화, 하이브리드가 순수전기의 2.3배 (2025)</text>
  <text x="400" y="60" fill="#64748b" font-size="13" text-anchor="middle">소매 판매 기준, 전체 전동화 믹스 약 27% (단위: 대)</text>

  <!-- HEV 611,783 -> width 500 -->
  <text x="170" y="120" fill="#94a3b8" font-size="14" text-anchor="end">하이브리드</text>
  <rect x="180" y="103" width="500" height="34" rx="4" fill="#22c55e" opacity="0.9"/>
  <text x="690" y="125" fill="#22c55e" font-size="14" font-weight="bold" text-anchor="start">611,783</text>
  <text x="430" y="125" fill="#0a0e1a" font-size="12" font-weight="bold" text-anchor="middle">+32%</text>

  <!-- BEV 269,169 -> width 220 -->
  <text x="170" y="182" fill="#94a3b8" font-size="14" text-anchor="end">순수전기</text>
  <rect x="180" y="165" width="220" height="34" rx="4" fill="#3b82f6" opacity="0.85"/>
  <text x="410" y="187" fill="#3b82f6" font-size="14" font-weight="bold" text-anchor="start">269,169</text>
  <text x="290" y="187" fill="#f1f5f9" font-size="12" font-weight="bold" text-anchor="middle">+17%</text>

  <!-- PHEV 44,124 -> width 36 -->
  <text x="170" y="244" fill="#94a3b8" font-size="14" text-anchor="end">플러그인</text>
  <rect x="180" y="227" width="36" height="34" rx="4" fill="#8b5cf6" opacity="0.85"/>
  <text x="226" y="249" fill="#94a3b8" font-size="13" text-anchor="start">44,124</text>

  <!-- FCEV 7,047 -> width 6 -->
  <text x="170" y="300" fill="#94a3b8" font-size="14" text-anchor="end">수소</text>
  <rect x="180" y="283" width="8" height="34" rx="4" fill="#06b6d4" opacity="0.85"/>
  <text x="198" y="305" fill="#94a3b8" font-size="13" text-anchor="start">7,047</text>

  <rect x="180" y="345" width="500" height="26" rx="6" fill="#22c55e" opacity="0.08"/>
  <text x="430" y="362" fill="#22c55e" font-size="12" font-weight="bold" text-anchor="middle">하이브리드는 친환경 구호가 아니라 마진을 지키는 장치다</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" style="background:#0a0e1a;font-family:-apple-system,'Segoe UI',sans-serif">
  <text x="400" y="38" fill="#f1f5f9" font-size="18" font-weight="bold" text-anchor="middle">같은 그룹, 다른 장부: 현대차 vs 기아</text>
  <text x="400" y="60" fill="#64748b" font-size="13" text-anchor="middle">현대차만 현대캐피탈을 연결해 재무가 무겁고 마진이 낮다 (2026Q1)</text>

  <!-- Panel A: 부채비율 -->
  <text x="230" y="100" fill="#94a3b8" font-size="13" font-weight="bold" text-anchor="middle">부채비율 (%)</text>
  <line x1="120" y1="320" x2="360" y2="320" stroke="#1e293b" stroke-width="1"/>
  <rect x="160" y="120" width="46" height="200" fill="#ef4444"/>
  <text x="183" y="112" fill="#ef4444" font-size="14" font-weight="bold" text-anchor="middle">190%</text>
  <text x="183" y="338" fill="#f1f5f9" font-size="12" text-anchor="middle">현대차</text>
  <rect x="270" y="245" width="46" height="75" fill="#22c55e"/>
  <text x="293" y="237" fill="#22c55e" font-size="14" font-weight="bold" text-anchor="middle">71%</text>
  <text x="293" y="338" fill="#f1f5f9" font-size="12" text-anchor="middle">기아</text>

  <line x1="400" y1="90" x2="400" y2="330" stroke="#1e293b" stroke-width="1" stroke-dasharray="4"/>

  <!-- Panel B: 영업이익률 -->
  <text x="580" y="100" fill="#94a3b8" font-size="13" font-weight="bold" text-anchor="middle">영업이익률 (%)</text>
  <line x1="470" y1="320" x2="710" y2="320" stroke="#1e293b" stroke-width="1"/>
  <rect x="510" y="188" width="46" height="132" fill="#fbbf24"/>
  <text x="533" y="180" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="middle">5.5%</text>
  <text x="533" y="338" fill="#f1f5f9" font-size="12" text-anchor="middle">현대차</text>
  <rect x="620" y="140" width="46" height="180" fill="#22c55e"/>
  <text x="643" y="132" fill="#22c55e" font-size="14" font-weight="bold" text-anchor="middle">7.5%</text>
  <text x="643" y="338" fill="#f1f5f9" font-size="12" text-anchor="middle">기아</text>

  <text x="400" y="372" fill="#64748b" font-size="11" text-anchor="middle">신용등급 현대차 dCR-A+ · 기아 dCR-AA. 더 많이 파는 현대차가 장부는 더 무겁다.</text>
</svg>

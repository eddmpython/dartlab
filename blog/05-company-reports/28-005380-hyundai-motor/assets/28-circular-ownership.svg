<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" style="background:#0a0e1a;font-family:-apple-system,'Segoe UI',sans-serif">
  <text x="400" y="38" fill="#f1f5f9" font-size="18" font-weight="bold" text-anchor="middle">정의선의 0.32%: 현대모비스 지분 0.32%로 그룹을 지배한다</text>
  <text x="400" y="60" fill="#64748b" font-size="13" text-anchor="middle">순환출자 고리, 2025 기준. 국내 10대 그룹 중 유일하게 남은 순환출자</text>

  <defs>
    <marker id="arrowSlate" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- 현대모비스 top -->
  <circle cx="400" cy="150" r="66" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="400" y="146" fill="#3b82f6" font-size="16" font-weight="bold" text-anchor="middle">현대모비스</text>
  <text x="400" y="167" fill="#94a3b8" font-size="11" text-anchor="middle">핵심 지배 고리</text>

  <!-- 현대차 bottom-left -->
  <circle cx="235" cy="330" r="66" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
  <text x="235" y="335" fill="#fbbf24" font-size="16" font-weight="bold" text-anchor="middle">현대차</text>

  <!-- 기아 bottom-right -->
  <circle cx="565" cy="330" r="66" fill="none" stroke="#22c55e" stroke-width="2"/>
  <text x="565" y="335" fill="#22c55e" font-size="16" font-weight="bold" text-anchor="middle">기아</text>

  <!-- 모비스 -> 현대차 약 22% -->
  <path d="M 350 195 C 305 235 275 255 268 268" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrowSlate)"/>
  <rect x="250" y="222" width="60" height="24" rx="4" fill="#94a3b8" opacity="0.12"/>
  <text x="280" y="239" fill="#94a3b8" font-size="13" font-weight="bold" text-anchor="middle">약 22%</text>

  <!-- 현대차 -> 기아 약 35% -->
  <path d="M 300 355 C 370 390 430 390 500 355" fill="none" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrowSlate)"/>
  <rect x="370" y="378" width="60" height="24" rx="4" fill="#94a3b8" opacity="0.12"/>
  <text x="400" y="395" fill="#94a3b8" font-size="13" font-weight="bold" text-anchor="middle">약 35%</text>

  <!-- 기아 -> 모비스 약 18% -->
  <path d="M 532 268 C 500 235 470 210 460 200" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <rect x="490" y="222" width="60" height="24" rx="4" fill="#94a3b8" opacity="0.12"/>
  <text x="520" y="239" fill="#94a3b8" font-size="13" font-weight="bold" text-anchor="middle">약 18%</text>

  <!-- 정의선 -->
  <circle cx="110" cy="150" r="40" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5"/>
  <text x="110" y="146" fill="#f59e0b" font-size="13" font-weight="bold" text-anchor="middle">정의선</text>
  <text x="110" y="163" fill="#94a3b8" font-size="11" text-anchor="middle">회장</text>

  <!-- 정의선 -> 모비스 0.32% -->
  <line x1="150" y1="150" x2="332" y2="150" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4" marker-end="url(#arrowAmber)"/>
  <text x="240" y="142" fill="#f59e0b" font-size="12" font-weight="bold" text-anchor="middle">0.32%</text>

  <!-- 정의선 -> 현대차 2.7% -->
  <line x1="128" y1="185" x2="190" y2="280" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="4" marker-end="url(#arrowAmber)"/>
  <text x="135" y="238" fill="#f59e0b" font-size="12" font-weight="bold" text-anchor="middle">2.7%</text>

  <rect x="110" y="405" width="580" height="42" rx="6" fill="#f59e0b" opacity="0.06"/>
  <text x="400" y="424" fill="#f59e0b" font-size="12" font-weight="bold" text-anchor="middle">직접 지분은 현대차 2.7%, 모비스 0.32%. 지배력의 핵심은 현대글로비스 약 20%와 순환출자 고리다.</text>
  <text x="400" y="441" fill="#64748b" font-size="11" text-anchor="middle">2018년 개편안은 엘리엇 반대로 자진 철회. 고리는 아직 살아있다.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" style="background:#0a0e1a;font-family:-apple-system,'Segoe UI',sans-serif">
  <text x="400" y="38" fill="#f1f5f9" font-size="18" font-weight="bold" text-anchor="middle">판매는 세계 3위인데, BYD가 안방까지 들어왔다 (2025)</text>
  <text x="400" y="60" fill="#64748b" font-size="13" text-anchor="middle">글로벌 판매 순위, 단위: 만대</text>

  <!-- Toyota 1132 -> width 530 (scale 0.468) -->
  <text x="150" y="112" fill="#94a3b8" font-size="14" text-anchor="end">도요타그룹</text>
  <rect x="160" y="95" width="530" height="30" rx="4" fill="#64748b" opacity="0.6"/>
  <text x="700" y="115" fill="#94a3b8" font-size="13" font-weight="bold" text-anchor="start">1,132</text>

  <!-- VW 898 -> width 420 -->
  <text x="150" y="162" fill="#94a3b8" font-size="14" text-anchor="end">폭스바겐그룹</text>
  <rect x="160" y="145" width="420" height="30" rx="4" fill="#64748b" opacity="0.6"/>
  <text x="590" y="165" fill="#94a3b8" font-size="13" font-weight="bold" text-anchor="start">898</text>

  <!-- Hyundai group 727 -> width 340 -->
  <text x="150" y="212" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="end">현대차그룹</text>
  <rect x="160" y="195" width="340" height="30" rx="4" fill="#fbbf24" opacity="0.9"/>
  <text x="510" y="215" fill="#fbbf24" font-size="14" font-weight="bold" text-anchor="start">727</text>

  <!-- BYD 460 -> width 215 -->
  <text x="150" y="262" fill="#ef4444" font-size="14" text-anchor="end">BYD</text>
  <rect x="160" y="245" width="215" height="30" rx="4" fill="#ef4444" opacity="0.75"/>
  <text x="385" y="265" fill="#ef4444" font-size="13" font-weight="bold" text-anchor="start">460</text>

  <rect x="160" y="300" width="540" height="44" rx="6" fill="#fbbf24" opacity="0.06"/>
  <text x="430" y="318" fill="#fbbf24" font-size="12" font-weight="bold" text-anchor="middle">현대차그룹은 4년 연속 세계 3위, 그룹 영업이익은 20.55조로 폭스바겐 첫 추월(도요타 다음 2위)</text>
  <text x="430" y="336" fill="#64748b" font-size="11" text-anchor="middle">그런데 BYD는 460만대로 톱5에 올라 유럽서 테슬라를 넘고, 3,150만원 아토3로 한국까지 들어왔다</text>

  <text x="400" y="376" fill="#64748b" font-size="11" text-anchor="middle">현대차는 중국(179만에서 19.7만, -89%)과 러시아를 잃고도 3위를 지켰다</text>
</svg>

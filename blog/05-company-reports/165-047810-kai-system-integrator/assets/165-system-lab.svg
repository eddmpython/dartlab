<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
<title>KAI system integration lab</title>
<desc>R and D people, production capacity, and spending</desc>
<rect width="1100" height="640" fill="#07111f"/>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12233a"/><stop offset="1" stop-color="#07111f"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff4f72"/><stop offset="1" stop-color="#58c7ff"/></linearGradient>
</defs>
<rect x="24" y="24" width="1052" height="592" rx="24" fill="url(#bg)" stroke="#24364f"/>
<text x="70" y="82" fill="#f8fafc" font-family="Arial, sans-serif" font-size="29" font-weight="800" text-anchor="start">Technology means certified system integration</text>
<rect x="90" y="155" width="430" height="120" rx="18" fill="#0c1a2d" stroke="#334155"/>
<text x="116" y="193" fill="#93c5fd" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">R and D people</text>
<text x="116" y="233" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="900" text-anchor="start">2,253</text>
<text x="116" y="260" fill="#b8c5d6" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">Design to flight test</text>
<rect x="590" y="155" width="430" height="120" rx="18" fill="#0c1a2d" stroke="#334155"/>
<text x="616" y="193" fill="#93c5fd" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">Master or PhD</text>
<text x="616" y="233" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="900" text-anchor="start">1,024</text>
<text x="616" y="260" fill="#b8c5d6" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">45.45% of R and D staff</text>
<rect x="90" y="325" width="430" height="120" rx="18" fill="#0c1a2d" stroke="#334155"/>
<text x="116" y="363" fill="#93c5fd" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">10 years plus</text>
<text x="116" y="403" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="900" text-anchor="start">415</text>
<text x="116" y="430" fill="#b8c5d6" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">Experienced core group</text>
<rect x="590" y="325" width="430" height="120" rx="18" fill="#0c1a2d" stroke="#334155"/>
<text x="616" y="363" fill="#93c5fd" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">2025 R and D</text>
<text x="616" y="403" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="900" text-anchor="start">KRW 164B</text>
<text x="616" y="430" fill="#b8c5d6" font-family="Arial, sans-serif" font-size="16" font-weight="500" text-anchor="start">4.52% of sales</text>
<text x="105" y="525" fill="#f8fafc" font-family="Arial, sans-serif" font-size="21" font-weight="800" text-anchor="start">Capacity: T-50/KF-21 60 units per year, KUH/LAH/LCH 72 units per year</text>
<text x="105" y="565" fill="#b8c5d6" font-family="Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">Technology becomes a story only when backlog, margin, and cash confirm it.</text>
</svg>

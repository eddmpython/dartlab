<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
<title>KAI filing checklist</title>
<desc>What to check in the next filing</desc>
<rect width="1100" height="640" fill="#07111f"/>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12233a"/><stop offset="1" stop-color="#07111f"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff4f72"/><stop offset="1" stop-color="#58c7ff"/></linearGradient>
</defs>
<rect x="24" y="24" width="1052" height="592" rx="24" fill="url(#bg)" stroke="#24364f"/>
<text x="70" y="82" fill="#f8fafc" font-family="Arial, sans-serif" font-size="34" font-weight="800" text-anchor="start">Open the next filing in this order</text>
<text x="70" y="116" fill="#b8c5d6" font-family="Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">Backlog first, then inventory, cash flow, and leverage.</text>
<rect x="95" y="170" width="910" height="64" rx="16" fill="#0c1a2d" stroke="#334155"/>
<circle cx="132" cy="202" r="18" fill="#ff4f72"/>
<text x="132" y="209" fill="#07111f" font-family="Arial, sans-serif" font-size="18" font-weight="900" text-anchor="middle">1</text>
<text x="180" y="210" fill="#f8fafc" font-family="Arial, sans-serif" font-size="23" font-weight="800" text-anchor="start">Backlog</text>
<text x="480" y="210" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start">Can 26.55T stay high?</text>
<rect x="95" y="248" width="910" height="64" rx="16" fill="#0c1a2d" stroke="#334155"/>
<circle cx="132" cy="280" r="18" fill="#ff4f72"/>
<text x="132" y="287" fill="#07111f" font-family="Arial, sans-serif" font-size="18" font-weight="900" text-anchor="middle">2</text>
<text x="180" y="288" fill="#f8fafc" font-family="Arial, sans-serif" font-size="23" font-weight="800" text-anchor="start">Product mix</text>
<text x="480" y="288" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start">T-50/KF-21 and export mix</text>
<rect x="95" y="326" width="910" height="64" rx="16" fill="#0c1a2d" stroke="#334155"/>
<circle cx="132" cy="358" r="18" fill="#ff4f72"/>
<text x="132" y="365" fill="#07111f" font-family="Arial, sans-serif" font-size="18" font-weight="900" text-anchor="middle">3</text>
<text x="180" y="366" fill="#f8fafc" font-family="Arial, sans-serif" font-size="23" font-weight="800" text-anchor="start">Inventory</text>
<text x="480" y="366" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start">Can 3.64T stop rising?</text>
<rect x="95" y="404" width="910" height="64" rx="16" fill="#0c1a2d" stroke="#334155"/>
<circle cx="132" cy="436" r="18" fill="#ff4f72"/>
<text x="132" y="443" fill="#07111f" font-family="Arial, sans-serif" font-size="18" font-weight="900" text-anchor="middle">4</text>
<text x="180" y="444" fill="#f8fafc" font-family="Arial, sans-serif" font-size="23" font-weight="800" text-anchor="start">Operating cash flow</text>
<text x="480" y="444" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start">Can -9,033 turn around?</text>
<rect x="95" y="482" width="910" height="64" rx="16" fill="#0c1a2d" stroke="#334155"/>
<circle cx="132" cy="514" r="18" fill="#ff4f72"/>
<text x="132" y="521" fill="#07111f" font-family="Arial, sans-serif" font-size="18" font-weight="900" text-anchor="middle">5</text>
<text x="180" y="522" fill="#f8fafc" font-family="Arial, sans-serif" font-size="23" font-weight="800" text-anchor="start">Debt ratio</text>
<text x="480" y="522" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start">Split contract debt and borrowing</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc">
<title>KAI product mix</title>
<desc>2025 separate sales mix</desc>
<rect width="1100" height="640" fill="#07111f"/>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12233a"/><stop offset="1" stop-color="#07111f"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff4f72"/><stop offset="1" stop-color="#58c7ff"/></linearGradient>
</defs>
<rect x="24" y="24" width="1052" height="592" rx="24" fill="url(#bg)" stroke="#24364f"/>
<text x="70" y="82" fill="#f8fafc" font-family="Arial, sans-serif" font-size="30" font-weight="800" text-anchor="start">Four revenue clocks, not one fighter story</text>

<rect x="130" y="478" width="28" height="28" rx="6" fill="#fbbf24" stroke="none"/>
<text x="175" y="500" fill="#e5eef8" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">Aerostructure</text>
<text x="550" y="500" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" font-weight="800" text-anchor="start">27.3%</text>
<text x="730" y="350" fill="#ffb4c4" font-family="Arial, sans-serif" font-size="24" font-weight="800" text-anchor="start">Key question</text>

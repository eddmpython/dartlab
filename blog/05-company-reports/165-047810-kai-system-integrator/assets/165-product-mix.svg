<text x="175" y="332" fill="#e5eef8" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">T-50 and KF-21</text>
<text x="550" y="332" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" font-weight="800" text-anchor="start">38.3%</text>
<rect x="130" y="366" width="28" height="28" rx="6" fill="#58c7ff" stroke="none"/>
<text x="175" y="388" fill="#e5eef8" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="start">KUH and LAH</text>
<text x="550" y="388" fill="#f8fafc" font-family="Arial, sans-serif" font-size="22" font-weight="800" text-anchor="start">17.6%</text>
<rect x="130" y="422" width="28" height="28" rx="6" fill="#a78bfa" stroke="none"/>

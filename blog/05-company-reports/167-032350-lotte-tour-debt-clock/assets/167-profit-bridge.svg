<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">롯데관광개발 영업이익에서 순이익까지</title>
  <desc id="desc">2025년 영업이익이 금융비용과 세금 효과를 지나 순이익으로 이어지는 과정을 보여주는 브리지 차트</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbfaf6"/><stop offset="1" stop-color="#ece7de"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#1a2940" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="68" y="82" fill="#14243b" font-family="Pretendard, sans-serif" font-size="34" font-weight="800">영업은 흑자였지만, 세전까지는 한 걸음이 모자랐다</text>
  <text x="68" y="119" fill="#6b7280" font-family="Pretendard, sans-serif" font-size="18">2025년 연결 손익 흐름. 단위: 억원</text>

  <line x1="110" y1="520" x2="1090" y2="520" stroke="#b9b3a9" stroke-width="2"/>
  <g font-family="Pretendard, sans-serif" filter="url(#s)">
    <rect x="105" y="207" width="182" height="313" rx="16" fill="#245a69"/>
    <text x="196" y="252" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">영업이익</text>
    <text x="196" y="300" text-anchor="middle" fill="#fff" font-size="36" font-weight="900">+1,433</text>

    <rect x="348" y="176" width="182" height="344" rx="16" fill="#791f37"/>
    <text x="439" y="221" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">금융비용</text>
    <text x="439" y="269" text-anchor="middle" fill="#fff" font-size="36" font-weight="900">-1,533</text>
    <text x="439" y="301" text-anchor="middle" fill="#ead8df" font-size="15">이자비용 약 1,478</text>

    <rect x="591" y="476" width="182" height="44" rx="12" fill="#505967"/>
    <text x="682" y="459" text-anchor="middle" fill="#14243b" font-size="19" font-weight="700">세전손실</text>
    <text x="682" y="507" text-anchor="middle" fill="#fff" font-size="27" font-weight="900">-45</text>

    <rect x="834" y="363" width="182" height="157" rx="16" fill="#d2a449"/>
    <text x="925" y="405" text-anchor="middle" fill="#14243b" font-size="19" font-weight="700">법인세수익</text>
    <text x="925" y="453" text-anchor="middle" fill="#14243b" font-size="34" font-weight="900">+321</text>

    <rect x="1028" y="422" width="110" height="98" rx="15" fill="#244f3e"/>
    <text x="1083" y="458" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">순이익</text>
    <text x="1083" y="494" text-anchor="middle" fill="#fff" font-size="28" font-weight="900">+276</text>
  </g>

  <path d="M287 328 H338" stroke="#14243b" stroke-width="4" stroke-linecap="round"/><path d="M330 318 L342 328 L330 338" fill="none" stroke="#14243b" stroke-width="4"/>
  <path d="M530 348 H581" stroke="#14243b" stroke-width="4" stroke-linecap="round"/><path d="M573 338 L585 348 L573 358" fill="none" stroke="#14243b" stroke-width="4"/>
  <path d="M773 442 H824" stroke="#14243b" stroke-width="4" stroke-linecap="round"/><path d="M816 432 L828 442 L816 452" fill="none" stroke="#14243b" stroke-width="4"/>
  <path d="M1016 470 H1019" stroke="#14243b" stroke-width="4"/>

  <rect x="68" y="565" width="1064" height="63" rx="15" fill="#14243b"/>
  <text x="94" y="604" fill="#fff" font-family="Pretendard, sans-serif" font-size="20" font-weight="700">순이익 흑자는 사실이다. 다만 영업이 금융비용을 이긴 결과가 아니라 세금 효과까지 지나 만들어졌다.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">롯데관광개발 매출 정체성 변화</title>
  <desc id="desc">2025년과 2026년 1분기 매출에서 카지노가 차지하는 비중을 여행, 호텔, 기타와 비교한 누적 막대 그래프</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f5ee"/><stop offset="1" stop-color="#ece5d8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#14243b" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect x="46" y="40" width="1108" height="595" rx="28" fill="#fffdf8" filter="url(#shadow)"/>
  <text x="92" y="105" fill="#12233b" font-family="Pretendard, sans-serif" font-size="34" font-weight="800">여행사의 이름, 카지노의 매출</text>
  <text x="92" y="140" fill="#6b7280" font-family="Pretendard, sans-serif" font-size="18">연결 매출 구성. 2025년 연간과 2026년 1분기</text>
  <line x1="92" y1="170" x2="1108" y2="170" stroke="#d8d0c2"/>

  <text x="92" y="232" fill="#12233b" font-family="Pretendard, sans-serif" font-size="23" font-weight="700">2025</text>
  <text x="1098" y="232" text-anchor="end" fill="#12233b" font-family="Pretendard, sans-serif" font-size="22" font-weight="700">6,534억원</text>
  <clipPath id="bar1"><rect x="92" y="255" width="1016" height="76" rx="16"/></clipPath>
  <g clip-path="url(#bar1)">
    <rect x="92" y="255" width="741" height="76" fill="#6f1831"/>
    <rect x="833" y="255" width="139" height="76" fill="#d3a54a"/>
    <rect x="972" y="255" width="127" height="76" fill="#315d6c"/>
    <rect x="1099" y="255" width="9" height="76" fill="#9aa2aa"/>
  </g>
  <text x="112" y="303" fill="#fff" font-family="Pretendard, sans-serif" font-size="25" font-weight="800">카지노 72.9%</text>
  <text x="902" y="303" text-anchor="middle" fill="#12233b" font-family="Pretendard, sans-serif" font-size="18" font-weight="700">여행 13.6%</text>
  <text x="1035" y="303" text-anchor="middle" fill="#fff" font-family="Pretendard, sans-serif" font-size="17" font-weight="700">호텔 12.5%</text>

  <text x="92" y="401" fill="#12233b" font-family="Pretendard, sans-serif" font-size="23" font-weight="700">2026 Q1</text>
  <text x="1098" y="401" text-anchor="end" fill="#12233b" font-family="Pretendard, sans-serif" font-size="22" font-weight="700">1,562억원</text>
  <clipPath id="bar2"><rect x="92" y="424" width="1016" height="76" rx="16"/></clipPath>
  <g clip-path="url(#bar2)">
    <rect x="92" y="424" width="772" height="76" fill="#6f1831"/>
    <rect x="864" y="424" width="119" height="76" fill="#d3a54a"/>
    <rect x="983" y="424" width="118" height="76" fill="#315d6c"/>
    <rect x="1101" y="424" width="7" height="76" fill="#9aa2aa"/>
  </g>
  <text x="112" y="472" fill="#fff" font-family="Pretendard, sans-serif" font-size="25" font-weight="800">카지노 76.0%</text>
  <text x="923" y="472" text-anchor="middle" fill="#12233b" font-family="Pretendard, sans-serif" font-size="17" font-weight="700">여행 11.7%</text>
  <text x="1042" y="472" text-anchor="middle" fill="#fff" font-family="Pretendard, sans-serif" font-size="17" font-weight="700">호텔 11.6%</text>

  <rect x="92" y="550" width="1016" height="50" rx="13" fill="#12233b"/>
  <text x="116" y="582" fill="#fff" font-family="Pretendard, sans-serif" font-size="20" font-weight="700">매출의 질문은 여행객 수에서 카지노 드롭과 순매출, 영업 레버리지로 이동했다.</text>
  <text x="1108" y="620" text-anchor="end" fill="#7a746c" font-family="Pretendard, sans-serif" font-size="14">자료: 롯데관광개발 사업보고서, 1분기보고서</text>
</svg>

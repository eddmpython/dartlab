<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">롯데관광개발 영업 전환 시간표</title>
  <desc id="desc">2018년 카지노 법인 인수에서 2025년 영업이익 1433억원까지의 사업 전환을 보여주는 시간표</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101d31"/><stop offset="1" stop-color="#223b4d"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#72808e"/><stop offset=".5" stop-color="#d5a64a"/><stop offset="1" stop-color="#f0c96b"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#night)"/>
  <text x="70" y="86" fill="#fff" font-family="Pretendard, sans-serif" font-size="34" font-weight="800">건물은 먼저 열렸고, 이익은 네 해 뒤에 도착했다</text>
  <text x="70" y="123" fill="#aebaca" font-family="Pretendard, sans-serif" font-size="18">카지노 법인 인수, 호텔 개장, 카지노 이전, 영업 흑자의 순서</text>
  <line x1="90" y1="316" x2="1110" y2="316" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>

  <g font-family="Pretendard, sans-serif">
    <circle cx="140" cy="316" r="18" fill="#8d9aaa" stroke="#fff" stroke-width="4"/>
    <text x="140" y="205" text-anchor="middle" fill="#f0c96b" font-size="25" font-weight="800">2018</text>
    <text x="140" y="239" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">카지노 법인 인수</text>
    <text x="140" y="267" text-anchor="middle" fill="#aebaca" font-size="16">149억원 + 증자 350억원</text>

    <circle cx="348" cy="316" r="18" fill="#a88646" stroke="#fff" stroke-width="4"/>
    <text x="348" y="379" text-anchor="middle" fill="#f0c96b" font-size="25" font-weight="800">2020.12</text>
    <text x="348" y="414" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">호텔 개장</text>
    <text x="348" y="442" text-anchor="middle" fill="#aebaca" font-size="16">1,600개 객실</text>

    <circle cx="554" cy="316" r="18" fill="#b99248" stroke="#fff" stroke-width="4"/>
    <text x="554" y="205" text-anchor="middle" fill="#f0c96b" font-size="25" font-weight="800">2021.06</text>
    <text x="554" y="239" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">카지노 이전 개장</text>
    <text x="554" y="267" text-anchor="middle" fill="#aebaca" font-size="16">영업장 4.6배 확장</text>

    <circle cx="765" cy="316" r="18" fill="#c99e4b" stroke="#fff" stroke-width="4"/>
    <text x="765" y="379" text-anchor="middle" fill="#f0c96b" font-size="25" font-weight="800">2024</text>
    <text x="765" y="414" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">첫 영업 흑자</text>
    <text x="765" y="442" text-anchor="middle" fill="#aebaca" font-size="16">영업이익 390억원</text>

    <circle cx="1022" cy="316" r="24" fill="#f0c96b" stroke="#fff" stroke-width="5" filter="url(#glow)"/>
    <text x="1022" y="195" text-anchor="middle" fill="#f0c96b" font-size="28" font-weight="900">2025</text>
    <text x="1022" y="232" text-anchor="middle" fill="#fff" font-size="22" font-weight="800">영업이익 1,433억원</text>
    <text x="1022" y="264" text-anchor="middle" fill="#aebaca" font-size="17">영업이익률 21.9%</text>
  </g>

  <rect x="70" y="514" width="1060" height="94" rx="20" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".15"/>
  <text x="98" y="552" fill="#f0c96b" font-family="Pretendard, sans-serif" font-size="19" font-weight="800">전환의 의미</text>
  <text x="98" y="584" fill="#fff" font-family="Pretendard, sans-serif" font-size="21" font-weight="700">고정비가 손실을 키우던 리조트가 매출 문턱을 넘자 같은 고정비가 이익 레버리지로 바뀌었다.</text>
  <text x="1130" y="642" text-anchor="end" fill="#8ea0b4" font-family="Pretendard, sans-serif" font-size="14">연결 기준, 금액 반올림</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">롯데관광개발 영업현금흐름과 현금 이자</title>
  <desc id="desc">2024년, 2025년, 2026년 1분기의 영업현금흐름과 현금 이자 지급액을 비교한 그래프</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9f7f1"/><stop offset="1" stop-color="#e8e2d7"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#15263f" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="70" y="82" fill="#14243b" font-family="Pretendard, sans-serif" font-size="34" font-weight="800">현금은 이자를 한 번만 센다</text>
  <text x="70" y="119" fill="#6f7680" font-family="Pretendard, sans-serif" font-size="18">영업현금흐름과 현금 이자 지급액 비교. 단위: 억원</text>

  <g font-family="Pretendard, sans-serif" filter="url(#s)">
    <rect x="82" y="171" width="316" height="345" rx="24" fill="#fffdf8"/>
    <text x="240" y="215" text-anchor="middle" fill="#14243b" font-size="25" font-weight="800">2024</text>
    <rect x="130" y="274" width="72" height="190" rx="12" fill="#285e6b"/>
    <rect x="275" y="308" width="72" height="156" rx="12" fill="#7c1f38"/>
    <text x="166" y="261" text-anchor="middle" fill="#285e6b" font-size="22" font-weight="900">1,217</text>
    <text x="311" y="295" text-anchor="middle" fill="#7c1f38" font-size="22" font-weight="900">999</text>
    <text x="166" y="492" text-anchor="middle" fill="#4c5562" font-size="15">영업현금</text>
    <text x="311" y="492" text-anchor="middle" fill="#4c5562" font-size="15">현금 이자</text>

    <rect x="442" y="171" width="316" height="345" rx="24" fill="#fffdf8"/>
    <text x="600" y="215" text-anchor="middle" fill="#14243b" font-size="25" font-weight="800">2025</text>
    <rect x="490" y="308" width="72" height="156" rx="12" fill="#285e6b"/>
    <rect x="635" y="316" width="72" height="148" rx="12" fill="#7c1f38"/>
    <text x="526" y="295" text-anchor="middle" fill="#285e6b" font-size="22" font-weight="900">1,001</text>
    <text x="671" y="303" text-anchor="middle" fill="#7c1f38" font-size="22" font-weight="900">948</text>
    <text x="526" y="492" text-anchor="middle" fill="#4c5562" font-size="15">영업현금</text>
    <text x="671" y="492" text-anchor="middle" fill="#4c5562" font-size="15">현금 이자</text>

    <rect x="802" y="171" width="316" height="345" rx="24" fill="#fffdf8"/>
    <text x="960" y="215" text-anchor="middle" fill="#14243b" font-size="25" font-weight="800">2026 Q1</text>
    <line x1="850" y1="405" x2="1070" y2="405" stroke="#a7a29a" stroke-width="2"/>
    <rect x="890" y="405" width="72" height="18" rx="9" fill="#285e6b"/>
    <rect x="1000" y="355" width="72" height="50" rx="10" fill="#7c1f38"/>
    <text x="926" y="448" text-anchor="middle" fill="#285e6b" font-size="22" font-weight="900">-14</text>
    <text x="1036" y="342" text-anchor="middle" fill="#7c1f38" font-size="22" font-weight="900">155</text>
    <text x="926" y="492" text-anchor="middle" fill="#4c5562" font-size="15">영업현금</text>
    <text x="1036" y="492" text-anchor="middle" fill="#4c5562" font-size="15">현금 이자</text>
  </g>

  <rect x="70" y="554" width="1060" height="76" rx="18" fill="#14243b"/>
  <text x="96" y="584" fill="#f0c96b" font-family="Pretendard, sans-serif" font-size="17" font-weight="800">회계 주의</text>
  <text x="96" y="613" fill="#fff" font-family="Pretendard, sans-serif" font-size="20" font-weight="700">이자 지급액은 영업현금흐름에 이미 포함된다. 다시 빼면 이자를 두 번 차감한다.</text>
</svg>

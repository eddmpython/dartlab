<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">롯데관광개발 담보대출 구조</title>
  <desc id="desc">9500억원 외부 담보대출과 토지, 건물, 보험금청구권, 카지노 자회사 주식의 연결 구조</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101c2e"/><stop offset="1" stop-color="#293443"/></linearGradient>
    <filter id="glow"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".32"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="68" y="82" fill="#fff" font-family="Pretendard, sans-serif" font-size="34" font-weight="800">담보는 건물 한 채가 아니라 영업 구조 전체를 감싼다</text>
  <text x="68" y="119" fill="#aeb8c5" font-family="Pretendard, sans-serif" font-size="18">2026년 1분기 공시 기준. 약정 원금과 장부금액은 같은 숫자가 아니다.</text>

  <g filter="url(#glow)" font-family="Pretendard, sans-serif">
    <rect x="420" y="207" width="360" height="188" rx="30" fill="#f7f1e4" stroke="#d5a64a" stroke-width="5"/>
    <text x="600" y="258" text-anchor="middle" fill="#6e1932" font-size="20" font-weight="800">외부 담보대출</text>
    <text x="600" y="318" text-anchor="middle" fill="#14243b" font-size="48" font-weight="900">원금 9,500억원</text>
    <text x="600" y="361" text-anchor="middle" fill="#596273" font-size="18">장부금액 8,940억원 · 금리 6%에서 9%</text>

    <rect x="70" y="183" width="260" height="118" rx="20" fill="#335b68"/>
    <text x="200" y="225" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">토지</text>
    <text x="200" y="267" text-anchor="middle" fill="#fff" font-size="30" font-weight="900">5,970억원</text>

    <rect x="70" y="390" width="260" height="118" rx="20" fill="#36516b"/>
    <text x="200" y="432" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">건물</text>
    <text x="200" y="474" text-anchor="middle" fill="#fff" font-size="30" font-weight="900">7,273억원</text>

    <rect x="870" y="183" width="260" height="118" rx="20" fill="#78566a"/>
    <text x="1000" y="225" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">보험금청구권 질권</text>
    <text x="1000" y="267" text-anchor="middle" fill="#fff" font-size="27" font-weight="900">한도 1.14조원</text>

    <rect x="870" y="390" width="260" height="118" rx="20" fill="#725d3c"/>
    <text x="1000" y="432" text-anchor="middle" fill="#fff" font-size="19" font-weight="700">LT엔터테인먼트 주식</text>
    <text x="1000" y="474" text-anchor="middle" fill="#fff" font-size="30" font-weight="900">400만주</text>
  </g>

  <path d="M330 242 C380 242 380 270 420 270" fill="none" stroke="#d5a64a" stroke-width="4"/>
  <path d="M330 449 C380 449 380 330 420 330" fill="none" stroke="#d5a64a" stroke-width="4"/>
  <path d="M780 270 C820 270 820 242 870 242" fill="none" stroke="#d5a64a" stroke-width="4"/>
  <path d="M780 330 C820 330 820 449 870 449" fill="none" stroke="#d5a64a" stroke-width="4"/>

  <rect x="68" y="554" width="1064" height="73" rx="17" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".14"/>
  <text x="93" y="584" fill="#f0c96b" font-family="Pretendard, sans-serif" font-size="17" font-weight="800">중복 계산 금지</text>
  <text x="93" y="611" fill="#fff" font-family="Pretendard, sans-serif" font-size="19" font-weight="700">원금 9,500억원과 장부금액 8,940억원은 같은 대출의 계약 금액과 회계 금액이다.</text>
</svg>

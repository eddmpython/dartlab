<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">HD현대마린솔루션 이익과 영업현금흐름 비교</title>
  <desc id="desc">2025년 연간과 2026년 1분기 순이익, 영업현금흐름, 매출채권 변화를 비교</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#173747"/></linearGradient>
    <linearGradient id="good" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#24a9df"/><stop offset="1" stop-color="#51d2bd"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="68" y="74" fill="#fff" font-family="Pretendard, sans-serif" font-size="34" font-weight="800">이익과 현금의 순서가 한 분기 만에 바뀌었다</text>
  <text x="68" y="111" fill="#abc1cc" font-family="Pretendard, sans-serif" font-size="18">기간은 다르므로 금액보다 각 기간의 현금전환율을 비교한다.</text>

  <g font-family="Pretendard, sans-serif" filter="url(#s)">
    <rect x="68" y="154" width="498" height="399" rx="29" fill="#f7fbfd"/>
    <rect x="634" y="154" width="498" height="399" rx="29" fill="#f7fbfd"/>
  </g>
  <g font-family="Pretendard, sans-serif">
    <text x="102" y="207" fill="#173149" font-size="24" font-weight="900">2025년 연간</text><rect x="409" y="177" width="119" height="38" rx="19" fill="#dff6f1"/><text x="468" y="202" text-anchor="middle" fill="#167666" font-size="18" font-weight="900">120.2%</text>
    <text x="102" y="262" fill="#687b89" font-size="17">순이익</text><rect x="211" y="239" width="264" height="31" rx="15.5" fill="#a8c4d3"/><text x="489" y="262" fill="#294759" font-size="17" font-weight="900">2,696억</text>
    <text x="102" y="319" fill="#687b89" font-size="17">영업현금</text><rect x="211" y="296" width="317" height="31" rx="15.5" fill="url(#good)"/><text x="489" y="319" text-anchor="end" fill="#075f7f" font-size="17" font-weight="900">3,241억</text>
    <line x1="102" y1="361" x2="528" y2="361" stroke="#dce7ec"/>
    <text x="102" y="404" fill="#687b89" font-size="17">유형자산 취득</text><text x="528" y="404" text-anchor="end" fill="#173149" font-size="22" font-weight="900">172억</text>
    <text x="102" y="446" fill="#687b89" font-size="17">현금과 단기금융자산</text><text x="528" y="446" text-anchor="end" fill="#173149" font-size="22" font-weight="900">5,642억</text>
    <rect x="102" y="479" width="426" height="47" rx="15" fill="#e9f7f4"/><text x="315" y="509" text-anchor="middle" fill="#28685e" font-size="17" font-weight="800">이익보다 현금이 545억원 많았다</text>

    <text x="668" y="207" fill="#173149" font-size="24" font-weight="900">2026년 1분기</text><rect x="975" y="177" width="119" height="38" rx="19" fill="#fff1d5"/><text x="1034" y="202" text-anchor="middle" fill="#986b12" font-size="18" font-weight="900">46.2%</text>
    <text x="668" y="262" fill="#687b89" font-size="17">순이익</text><rect x="777" y="239" width="264" height="31" rx="15.5" fill="#a8c4d3"/><text x="1055" y="262" fill="#294759" font-size="17" font-weight="900">981억</text>
    <text x="668" y="319" fill="#687b89" font-size="17">영업현금</text><rect x="777" y="296" width="122" height="31" rx="15.5" fill="#efbd58"/><text x="913" y="319" fill="#80590c" font-size="17" font-weight="900">453억</text>
    <line x1="668" y1="361" x2="1094" y2="361" stroke="#dce7ec"/>
    <text x="668" y="404" fill="#687b89" font-size="17">매출채권 및 기타채권</text><text x="1094" y="404" text-anchor="end" fill="#173149" font-size="22" font-weight="900">3,886억</text>
    <text x="668" y="446" fill="#687b89" font-size="17">2025년 말 대비</text><text x="1094" y="446" text-anchor="end" fill="#ae6910" font-size="22" font-weight="900">708억 증가</text>
    <rect x="668" y="479" width="426" height="47" rx="15" fill="#fff5e1"/><text x="881" y="509" text-anchor="middle" fill="#8b651b" font-size="17" font-weight="800">한 분기 시차인지 다음 분기에 검증</text>
  </g>

  <g font-family="Pretendard, sans-serif">
    <rect x="212" y="590" width="776" height="47" rx="23.5" fill="#09283b" stroke="#326479"/>
    <text x="600" y="620" text-anchor="middle" fill="#eef8fa" font-size="19" font-weight="800">설비가 가벼워도 고객이 늦게 결제하면 현금은 무거워진다</text>
  </g>
</svg>

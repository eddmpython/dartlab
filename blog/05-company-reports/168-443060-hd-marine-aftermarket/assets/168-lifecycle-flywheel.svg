<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">선박 한 척이 30년 고객이 되는 과정</title>
  <desc id="desc">선박 인도에서 보증, 정품 부품, 장기 유지보수, 친환경 개조, 디지털 관제로 이어지는 생애주기</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071526"/><stop offset="1" stop-color="#164553"/></linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#3bb7ef"/><stop offset=".55" stop-color="#4fd1b7"/><stop offset="1" stop-color="#f1bf5b"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <path d="M0 510 C180 450 295 585 470 520 S810 430 1200 505 V675 H0Z" fill="#0c2f42" opacity=".72"/>
  <text x="68" y="74" fill="#fff" font-family="Pretendard, sans-serif" font-size="34" font-weight="800">배가 인도되는 날, 30년짜리 고객 명단이 열린다</text>
  <text x="68" y="111" fill="#abc4cf" font-family="Pretendard, sans-serif" font-size="18">설치 기반은 한 번의 판매가 아니라 반복되는 접점의 순서다.</text>

  <path d="M116 336 C270 218 360 424 510 313 S755 215 890 321 S1050 370 1094 292" fill="none" stroke="url(#route)" stroke-width="9" stroke-linecap="round"/>
  <g fill="#fff" stroke="#4fd1b7" stroke-width="5">
    <circle cx="120" cy="333" r="13"/><circle cx="310" cy="302" r="13"/><circle cx="500" cy="320" r="13"/><circle cx="690" cy="267" r="13"/><circle cx="884" cy="319" r="13"/><circle cx="1086" cy="300" r="13"/>
  </g>

  <g font-family="Pretendard, sans-serif" filter="url(#s)">
    <rect x="66" y="175" width="176" height="102" rx="21" fill="#f8fbfd"/><text x="154" y="214" text-anchor="middle" fill="#10283a" font-size="21" font-weight="900">1. 선박 인도</text><text x="154" y="246" text-anchor="middle" fill="#637786" font-size="16">신규 설치 기반</text>
    <rect x="244" y="355" width="176" height="102" rx="21" fill="#f8fbfd"/><text x="332" y="394" text-anchor="middle" fill="#10283a" font-size="21" font-weight="900">2. 보증</text><text x="332" y="426" text-anchor="middle" fill="#637786" font-size="16">장비 이력 축적</text>
    <rect x="425" y="166" width="176" height="102" rx="21" fill="#f8fbfd"/><text x="513" y="205" text-anchor="middle" fill="#10283a" font-size="21" font-weight="900">3. 정품 부품</text><text x="513" y="237" text-anchor="middle" fill="#637786" font-size="16">반복 주문</text>
    <rect x="612" y="337" width="176" height="102" rx="21" fill="#f8fbfd"/><text x="700" y="376" text-anchor="middle" fill="#10283a" font-size="21" font-weight="900">4. LTSA</text><text x="700" y="408" text-anchor="middle" fill="#637786" font-size="16">장기 계약</text>
    <rect x="800" y="164" width="176" height="102" rx="21" fill="#f8fbfd"/><text x="888" y="203" text-anchor="middle" fill="#10283a" font-size="21" font-weight="900">5. 친환경 개조</text><text x="888" y="235" text-anchor="middle" fill="#637786" font-size="16">규제 대응</text>
    <rect x="958" y="350" width="176" height="102" rx="21" fill="#f8fbfd"/><text x="1046" y="389" text-anchor="middle" fill="#10283a" font-size="21" font-weight="900">6. 디지털</text><text x="1046" y="421" text-anchor="middle" fill="#637786" font-size="16">예방 정비</text>
  </g>

  <g font-family="Pretendard, sans-serif">
    <rect x="68" y="542" width="1064" height="86" rx="23" fill="#09263a" stroke="#2d6074"/>
    <text x="112" y="578" fill="#72dbcc" font-size="17" font-weight="800">설치 기반의 넓이</text><text x="112" y="608" fill="#fff" font-size="25" font-weight="900">누적 AM 서비스 1만 척</text>
    <line x1="483" y1="561" x2="483" y2="610" stroke="#35596b"/>
    <text x="526" y="578" fill="#f0c36b" font-size="17" font-weight="800">관계의 깊이</text><text x="526" y="608" fill="#fff" font-size="25" font-weight="900">LTSA 선박 450척 이상</text>
    <text x="1089" y="590" text-anchor="end" fill="#aac1cb" font-size="16">두 숫자는 같은 고객 범위가 아니다</text>
  </g>
</svg>

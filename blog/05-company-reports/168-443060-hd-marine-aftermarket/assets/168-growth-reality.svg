<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">HD현대마린솔루션 사업별 성장의 현실</title>
  <desc id="desc">2022년과 2025년 AM, 친환경, 디지털 매출을 비교해 현재 성장축과 미래 옵션을 구분</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#193748"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".3"/></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="68" y="74" fill="#fff" font-family="Pretendard, sans-serif" font-size="34" font-weight="800">미래보다 먼저 커진 것은 오래된 엔진의 부품이었다</text>
  <text x="68" y="111" fill="#abc1cc" font-family="Pretendard, sans-serif" font-size="18">2022년과 2025년 연결 매출 비교, 단위 억원</text>

  <g filter="url(#s)" font-family="Pretendard, sans-serif">
    <rect x="68" y="154" width="1064" height="395" rx="28" fill="#f7fbfd"/>
    <text x="106" y="219" fill="#163148" font-size="24" font-weight="900">AM</text><text x="106" y="248" fill="#71818d" font-size="16">현재 성장의 본체</text>
    <rect x="306" y="190" width="328" height="31" rx="15.5" fill="#cceaf7"/><rect x="306" y="232" width="657" height="31" rx="15.5" fill="#28a9e0"/>
    <text x="646" y="214" fill="#5b7181" font-size="16" font-weight="800">2022  4,670</text><text x="944" y="256" text-anchor="end" fill="#fff" font-size="17" font-weight="900">2025  9,351</text>
    <rect x="998" y="194" width="93" height="64" rx="17" fill="#e5f7fc"/><text x="1044" y="222" text-anchor="middle" fill="#0780b8" font-size="17" font-weight="800">증가</text><text x="1044" y="246" text-anchor="middle" fill="#07577d" font-size="20" font-weight="900">100%</text>

    <line x1="106" y1="290" x2="1092" y2="290" stroke="#dde7ec"/>
    <text x="106" y="349" fill="#163148" font-size="24" font-weight="900">친환경</text><text x="106" y="378" fill="#71818d" font-size="16">프로젝트 시차</text>
    <rect x="306" y="320" width="136" height="31" rx="15.5" fill="#cfeee7"/><rect x="306" y="362" width="121" height="31" rx="15.5" fill="#44c6a8"/>
    <text x="454" y="344" fill="#5b7181" font-size="16" font-weight="800">2022  1,942</text><text x="439" y="386" fill="#187866" font-size="17" font-weight="900">2025  1,723</text>
    <rect x="998" y="324" width="93" height="64" rx="17" fill="#edf5f3"/><text x="1044" y="352" text-anchor="middle" fill="#36766a" font-size="17" font-weight="800">감소</text><text x="1044" y="376" text-anchor="middle" fill="#265b53" font-size="20" font-weight="900">11%</text>

    <line x1="106" y1="420" x2="1092" y2="420" stroke="#dde7ec"/>
    <text x="106" y="479" fill="#163148" font-size="24" font-weight="900">디지털</text><text x="106" y="508" fill="#71818d" font-size="16">빠르지만 작은 옵션</text>
    <rect x="306" y="450" width="32" height="31" rx="15.5" fill="#f7e8bf"/><rect x="306" y="492" width="65" height="31" rx="15.5" fill="#efbd58"/>
    <text x="350" y="474" fill="#7b6e50" font-size="16" font-weight="800">2022  454</text><text x="383" y="516" fill="#8a6317" font-size="17" font-weight="900">2025  919</text>
    <rect x="998" y="454" width="93" height="64" rx="17" fill="#fff6df"/><text x="1044" y="482" text-anchor="middle" fill="#9b741f" font-size="17" font-weight="800">증가</text><text x="1044" y="506" text-anchor="middle" fill="#7b5915" font-size="20" font-weight="900">103%</text>
  </g>

  <g font-family="Pretendard, sans-serif">
    <rect x="178" y="587" width="844" height="48" rx="24" fill="#0b293b" stroke="#326579"/>
    <text x="600" y="618" text-anchor="middle" fill="#eff8fa" font-size="19" font-weight="800">친환경과 디지털의 2025년 합산 비중은 13.3%, 현재와 미래를 분리한다</text>
  </g>
</svg>

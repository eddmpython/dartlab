    <text x="1033" y="386" fill="#94a3b8" font-size="15">CAPEX</text>
  </g>
  <g stroke="#38bdf8" stroke-width="4" fill="none">
    <path d="M220 335 H250"/>
    <path d="M410 335 H440"/>
    <path d="M600 335 H630"/>
    <path d="M790 335 H820"/>
    <path d="M980 335 H1010"/>

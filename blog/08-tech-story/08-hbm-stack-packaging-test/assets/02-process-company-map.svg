    <text x="658" y="245" fill="#e2e8f0" font-size="17">TSMC</text>
    <text x="658" y="274" fill="#e2e8f0" font-size="17">Amkor</text>
    <text x="658" y="303" fill="#e2e8f0" font-size="17">ASE</text>
    <text x="658" y="360" fill="#94a3b8" font-size="15">EDGAR, IR</text>

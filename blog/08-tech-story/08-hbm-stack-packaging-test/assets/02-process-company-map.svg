<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">HBM 공정별 회사 지도</title>
  <desc id="desc">HBM 가치사슬을 설계, 메모리 제조, 본딩, 패키징, 테스트, 최종 칩으로 나누고 대표 회사를 배치한다.</desc>
  <rect width="1200" height="675" fill="#0a0e1a"/>
  <text x="58" y="64" fill="#f8fafc" font-size="33" font-family="Arial, sans-serif" font-weight="700">HBM은 한 회사가 아니라 공정 네트워크다</text>
  <text x="58" y="104" fill="#94a3b8" font-size="18" font-family="Arial, sans-serif">DART와 EDGAR에서는 각 회사가 잡은 칸과 기간 라벨을 분리해서 읽어야 한다</text>
  <g font-family="Arial, sans-serif">
    <rect x="60" y="160" width="160" height="350" rx="12" fill="#111827" stroke="#334155"/>
    <text x="90" y="205" fill="#fbbf24" font-size="20" font-weight="700">GPU 설계</text>
    <text x="88" y="245" fill="#e2e8f0" font-size="17">NVIDIA</text>
    <text x="88" y="274" fill="#e2e8f0" font-size="17">AMD</text>
    <text x="88" y="303" fill="#e2e8f0" font-size="17">Broadcom</text>
    <text x="88" y="360" fill="#94a3b8" font-size="15">EDGAR</text>
    <text x="88" y="386" fill="#94a3b8" font-size="15">수요, 마진</text>
    <text x="88" y="412" fill="#94a3b8" font-size="15">고객 집중</text>
    <rect x="250" y="160" width="160" height="350" rx="12" fill="#111827" stroke="#334155"/>
    <text x="280" y="205" fill="#fbbf24" font-size="20" font-weight="700">HBM 제조</text>
    <text x="278" y="245" fill="#e2e8f0" font-size="17">SK하이닉스</text>
    <text x="278" y="274" fill="#e2e8f0" font-size="17">삼성전자</text>
    <text x="278" y="303" fill="#e2e8f0" font-size="17">Micron</text>
    <text x="278" y="360" fill="#94a3b8" font-size="15">DART, EDGAR</text>
    <text x="278" y="386" fill="#94a3b8" font-size="15">DRAM, HBM</text>
    <text x="278" y="412" fill="#94a3b8" font-size="15">CAPEX, 수율</text>
    <rect x="440" y="160" width="160" height="350" rx="12" fill="#111827" stroke="#334155"/>
    <text x="470" y="205" fill="#fbbf24" font-size="20" font-weight="700">본딩</text>
    <text x="468" y="245" fill="#e2e8f0" font-size="17">한미반도체</text>

    <text x="468" y="303" fill="#e2e8f0" font-size="17">Besi</text>
    <text x="468" y="360" fill="#94a3b8" font-size="15">DART</text>
    <text x="468" y="386" fill="#94a3b8" font-size="15">TC bonder</text>
    <text x="468" y="412" fill="#94a3b8" font-size="15">고객 집중</text>
    <rect x="630" y="160" width="160" height="350" rx="12" fill="#111827" stroke="#334155"/>

  <rect x="58" y="555" width="1090" height="58" rx="10" fill="#111827" stroke="#334155"/>
  <text x="82" y="590" fill="#e2e8f0" font-size="19" font-family="Arial, sans-serif">읽는 순서: 기술 칸을 먼저 잡고, 그 칸이 DART 또는 EDGAR의 매출, 마진, 투자, 리스크 문장에 어떻게 찍히는지 본다</text>

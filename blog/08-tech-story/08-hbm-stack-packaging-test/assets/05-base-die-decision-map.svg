<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">HBM4 베이스 다이 결정 지도</title>
  <desc id="desc">HBM4에서 베이스 다이는 I/O, 전력, 열, 고객별 인터페이스를 모으는 결정 지점이다.</desc>
  <rect width="1200" height="675" fill="#0a0e1a"/>
  <text x="58" y="64" fill="#f8fafc" font-size="34" font-family="Arial, sans-serif" font-weight="700">HBM4의 베이스 다이는 단순 받침대가 아니다</text>
  <text x="58" y="104" fill="#94a3b8" font-size="18" font-family="Arial, sans-serif">2,048-bit 인터페이스, 전력망, 열, 고객별 요구가 한 장의 로직 다이에 모인다</text>
  <g font-family="Arial, sans-serif">
    <rect x="420" y="220" width="360" height="220" rx="18" fill="#111827" stroke="#fbbf24" stroke-width="3"/>
    <text x="510" y="285" fill="#fbbf24" font-size="28" font-weight="700">Base Die</text>
    <text x="478" y="326" fill="#e2e8f0" font-size="19">신호 정렬</text>
    <text x="478" y="358" fill="#e2e8f0" font-size="19">전력 분배</text>
    <text x="478" y="390" fill="#e2e8f0" font-size="19">테스트 경로</text>
    <text x="478" y="422" fill="#e2e8f0" font-size="19">고객별 인터페이스</text>
    <rect x="80" y="170" width="250" height="95" rx="12" fill="#111827" stroke="#334155"/>
    <text x="110" y="207" fill="#38bdf8" font-size="21" font-weight="700">DRAM 다이</text>
    <text x="110" y="238" fill="#cbd5e1" font-size="17">셀, TSV, 적층 수율</text>
    <rect x="80" y="330" width="250" height="95" rx="12" fill="#111827" stroke="#334155"/>
    <text x="110" y="367" fill="#38bdf8" font-size="21" font-weight="700">파운드리 공정</text>
    <text x="110" y="398" fill="#cbd5e1" font-size="17">로직 노드, PDK, 수율</text>
    <rect x="80" y="490" width="250" height="95" rx="12" fill="#111827" stroke="#334155"/>
    <text x="110" y="527" fill="#38bdf8" font-size="21" font-weight="700">고객 GPU</text>
    <text x="110" y="558" fill="#cbd5e1" font-size="17">컨트롤러, 검증, 전력</text>
    <rect x="870" y="170" width="250" height="95" rx="12" fill="#111827" stroke="#334155"/>
    <text x="900" y="207" fill="#fbbf24" font-size="21" font-weight="700">2,048-bit I/O</text>
    <text x="900" y="238" fill="#cbd5e1" font-size="17">통로가 넓어질수록 복잡</text>
    <rect x="870" y="330" width="250" height="95" rx="12" fill="#111827" stroke="#334155"/>
    <text x="900" y="367" fill="#fbbf24" font-size="21" font-weight="700">전력과 열</text>
    <text x="900" y="398" fill="#cbd5e1" font-size="17">전압 강하, 발열, 노이즈</text>
    <rect x="870" y="490" width="250" height="95" rx="12" fill="#111827" stroke="#334155"/>
    <text x="900" y="527" fill="#fbbf24" font-size="21" font-weight="700">양산 검증</text>
    <text x="900" y="558" fill="#cbd5e1" font-size="17">샘플, 인증, 출하</text>
  </g>
  <g stroke="#38bdf8" stroke-width="4" fill="none">
    <path d="M330 218 C380 220 385 270 420 300"/>
    <path d="M330 378 C380 378 390 354 420 340"/>
    <path d="M330 538 C385 520 395 430 420 390"/>
  </g>
  <g stroke="#fbbf24" stroke-width="4" fill="none">
    <path d="M780 300 C825 270 830 220 870 218"/>
    <path d="M780 340 C825 354 830 378 870 378"/>
    <path d="M780 390 C825 430 830 520 870 538"/>
  </g>
  <rect x="58" y="610" width="1090" height="42" rx="9" fill="#111827" stroke="#334155"/>
  <text x="80" y="637" fill="#e2e8f0" font-size="18" font-family="Arial, sans-serif">해석: HBM4 경쟁은 DRAM 적층뿐 아니라 베이스 다이를 누가 어떤 공정과 고객 사양으로 잡는지의 경쟁이다</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">HBM 스택 원리</title>
  <desc id="desc">HBM은 여러 DRAM 다이를 TSV와 마이크로범프로 수직 연결해 GPU 옆에 붙이는 메모리 구조다.</desc>
  <rect width="1200" height="675" fill="#0a0e1a"/>
  <text x="60" y="68" fill="#f8fafc" font-size="34" font-family="Arial, sans-serif" font-weight="700">HBM은 왜 옆으로 넓히지 않고 위로 쌓나</text>
  <text x="60" y="108" fill="#94a3b8" font-size="18" font-family="Arial, sans-serif">고대역폭 메모리: 짧은 배선, 넓은 병렬 통로, 패키징 난도가 한 덩어리로 묶인다</text>
  <rect x="70" y="180" width="270" height="275" rx="10" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="105" y="220" fill="#e2e8f0" font-size="23" font-family="Arial, sans-serif" font-weight="700">평면 DRAM</text>
  <text x="105" y="258" fill="#cbd5e1" font-size="18" font-family="Arial, sans-serif">칩을 옆으로 늘리면</text>
  <text x="105" y="288" fill="#cbd5e1" font-size="18" font-family="Arial, sans-serif">배선이 길어지고</text>
  <text x="105" y="318" fill="#cbd5e1" font-size="18" font-family="Arial, sans-serif">전력과 지연이 늘어난다</text>
  <rect x="105" y="350" width="205" height="45" rx="6" fill="#1e293b" stroke="#64748b"/>
  <text x="132" y="379" fill="#fbbf24" font-size="17" font-family="Arial, sans-serif" font-weight="700">넓지만 느린 길</text>
  <g transform="translate(450 145)">
    <rect x="0" y="372" width="330" height="42" rx="8" fill="#1f2937" stroke="#64748b"/>
    <text x="90" y="399" fill="#e2e8f0" font-size="17" font-family="Arial, sans-serif">인터포저 또는 기판</text>
    <rect x="42" y="322" width="246" height="33" rx="5" fill="#374151" stroke="#fbbf24"/>
    <text x="305" y="344" fill="#fbbf24" font-size="15" font-family="Arial, sans-serif">로직 베이스</text>
    <g fill="#475569" stroke="#cbd5e1">
      <rect x="54" y="275" width="222" height="30" rx="4"/>
      <rect x="54" y="228" width="222" height="30" rx="4"/>
      <rect x="54" y="181" width="222" height="30" rx="4"/>
      <rect x="54" y="134" width="222" height="30" rx="4"/>
      <rect x="54" y="87" width="222" height="30" rx="4"/>
      <rect x="54" y="40" width="222" height="30" rx="4"/>
    </g>
    <g stroke="#38bdf8" stroke-width="4">
      <line x1="95" y1="42" x2="95" y2="321"/>
      <line x1="145" y1="42" x2="145" y2="321"/>
      <line x1="195" y1="42" x2="195" y2="321"/>
      <line x1="245" y1="42" x2="245" y2="321"/>
    </g>
    <g fill="#fbbf24">
      <circle cx="80" cy="364" r="5"/><circle cx="115" cy="364" r="5"/><circle cx="150" cy="364" r="5"/><circle cx="185" cy="364" r="5"/><circle cx="220" cy="364" r="5"/><circle cx="255" cy="364" r="5"/>
      <circle cx="80" cy="315" r="4"/><circle cx="115" cy="315" r="4"/><circle cx="150" cy="315" r="4"/><circle cx="185" cy="315" r="4"/><circle cx="220" cy="315" r="4"/><circle cx="255" cy="315" r="4"/>
    </g>
    <text x="85" y="25" fill="#f8fafc" font-size="23" font-family="Arial, sans-serif" font-weight="700">HBM 스택</text>
    <text x="305" y="110" fill="#38bdf8" font-size="15" font-family="Arial, sans-serif">TSV</text>
    <text x="304" y="318" fill="#fbbf24" font-size="15" font-family="Arial, sans-serif">마이크로범프</text>
  </g>
  <g transform="translate(855 195)">
    <rect x="0" y="0" width="260" height="260" rx="16" fill="#172033" stroke="#475569" stroke-width="2"/>
    <rect x="40" y="52" width="180" height="120" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <g fill="#64748b">
      <rect x="62" y="74" width="28" height="28"/><rect x="98" y="74" width="28" height="28"/><rect x="134" y="74" width="28" height="28"/><rect x="170" y="74" width="28" height="28"/>
      <rect x="62" y="110" width="28" height="28"/><rect x="98" y="110" width="28" height="28"/><rect x="134" y="110" width="28" height="28"/><rect x="170" y="110" width="28" height="28"/>
    </g>
    <text x="77" y="210" fill="#f8fafc" font-size="23" font-family="Arial, sans-serif" font-weight="700">GPU 또는 ASIC</text>
  </g>
  <path d="M780 520 C835 535 850 520 900 470" fill="none" stroke="#fbbf24" stroke-width="5"/>
  <text x="818" y="555" fill="#fbbf24" font-size="17" font-family="Arial, sans-serif">GPU 옆에 붙는 짧은 메모리 고속도로</text>
  <rect x="58" y="555" width="1090" height="54" rx="10" fill="#111827" stroke="#334155"/>
  <text x="80" y="589" fill="#e2e8f0" font-size="19" font-family="Arial, sans-serif">핵심 병목: 적층 수가 늘수록 TSV, 본딩, 열, 수율, 테스트가 동시에 어려워진다</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 370" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="900" height="370" fill="#0a0e1a"/>
  <text x="450" y="46" fill="#f1f5f9" font-size="26" font-weight="700" text-anchor="middle">보안 기술의 3세대 지형</text>
  <text x="450" y="74" fill="#64748b" font-size="15" text-anchor="middle">세대가 올라갈수록 기술은 앞서 간다</text>

  <!-- gen 1 -->
  <rect x="40" y="110" width="240" height="170" rx="14" fill="#111827" stroke="#1f2937"/>
  <text x="160" y="146" fill="#fbbf24" font-size="18" font-weight="700" text-anchor="middle">1세대 · 백신</text>
  <text x="160" y="176" fill="#cbd5e1" font-size="14" text-anchor="middle">시그니처, PC 한 대</text>
  <text x="160" y="202" fill="#94a3b8" font-size="13" text-anchor="middle">아는 악성코드 차단</text>
  <text x="160" y="248" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">안랩 V3</text>

  <!-- gen 2 -->
  <rect x="330" y="110" width="240" height="170" rx="14" fill="#111827" stroke="#1f2937"/>
  <text x="450" y="146" fill="#fbbf24" font-size="18" font-weight="700" text-anchor="middle">2세대 · 방화벽</text>
  <text x="450" y="176" fill="#cbd5e1" font-size="14" text-anchor="middle">네트워크 경계 검사</text>
  <text x="450" y="202" fill="#94a3b8" font-size="13" text-anchor="middle">장비 + 소프트웨어</text>
  <text x="450" y="248" fill="#e2e8f0" font-size="15" font-weight="600" text-anchor="middle">포티넷 · 팔로알토</text>

  <!-- gen 3 -->
  <rect x="620" y="110" width="240" height="170" rx="14" fill="#111827" stroke="#334155"/>
  <text x="740" y="146" fill="#fbbf24" font-size="18" font-weight="700" text-anchor="middle">3세대 · EDR·제로트러스트</text>
  <text x="740" y="176" fill="#cbd5e1" font-size="14" text-anchor="middle">클라우드 실시간 감시</text>
  <text x="740" y="202" fill="#94a3b8" font-size="13" text-anchor="middle">아무도 믿지 않는다</text>
  <text x="740" y="243" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">크라우드스트라이크</text>
  <text x="740" y="263" fill="#e2e8f0" font-size="14" font-weight="600" text-anchor="middle">센티넬원 · 지스케일러</text>

  <!-- arrows -->
  <text x="305" y="200" fill="#475569" font-size="26" text-anchor="middle">&#8594;</text>
  <text x="595" y="200" fill="#475569" font-size="26" text-anchor="middle">&#8594;</text>

  <text x="450" y="330" fill="#fbbf24" font-size="16" font-weight="600" text-anchor="middle">기술은 위로 올라간다. 그런데 이익도 그럴까?</text>
</svg>

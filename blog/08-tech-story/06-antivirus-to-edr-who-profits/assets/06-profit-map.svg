<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="900" height="500" fill="#0a0e1a"/>
  <text x="450" y="44" fill="#f1f5f9" font-size="26" font-weight="700" text-anchor="middle">누가 진짜 버나: 보안 9곳의 영업이익률</text>
  <text x="450" y="72" fill="#64748b" font-size="14" text-anchor="middle">각사 최근 완료 회계연도 실측(dartlab). 흑자 초록 · 적자 빨강</text>

  <!-- zero axis -->
  <line x1="466" y1="100" x2="466" y2="452" stroke="#334155" stroke-width="1.5"/>
  <text x="466" y="472" fill="#64748b" font-size="12" text-anchor="middle">0%</text>

  <!-- bars -->
  <g font-size="15">
    <!-- 포티넷 +30.7 -->
    <text x="24" y="133" fill="#cbd5e1">포티넷</text>
    <rect x="466" y="117" width="254" height="22" rx="3" fill="#22c55e"/>
    <text x="728" y="133" fill="#4ade80" font-weight="700">+30.7%</text>
    <!-- 윈스 +21.3 -->
    <text x="24" y="169" fill="#cbd5e1">윈스</text>
    <rect x="466" y="153" width="176" height="22" rx="3" fill="#22c55e"/>
    <text x="650" y="169" fill="#4ade80" font-weight="600">+21.3%</text>
    <!-- 지니언스 +14.5 -->
    <text x="24" y="205" fill="#cbd5e1">지니언스</text>
    <rect x="466" y="189" width="120" height="22" rx="3" fill="#22c55e"/>
    <text x="594" y="205" fill="#4ade80" font-weight="600">+14.5%</text>
    <!-- 팔로알토 +13.5 -->
    <text x="24" y="241" fill="#cbd5e1">팔로알토</text>
    <rect x="466" y="225" width="112" height="22" rx="3" fill="#22c55e"/>
    <text x="586" y="241" fill="#4ade80" font-weight="600">+13.5%</text>
    <!-- 안랩 +12.4 -->
    <text x="24" y="277" fill="#cbd5e1">안랩</text>
    <rect x="466" y="261" width="103" height="22" rx="3" fill="#22c55e"/>
    <text x="577" y="277" fill="#4ade80" font-weight="600">+12.4%</text>
    <!-- 파수 +5.4 -->
    <text x="24" y="313" fill="#cbd5e1">파수</text>
    <rect x="466" y="297" width="45" height="22" rx="3" fill="#16a34a"/>
    <text x="519" y="313" fill="#4ade80" font-weight="600">+5.4%</text>
    <!-- 크라우드스트라이크 -3.5 -->
    <text x="24" y="349" fill="#e2e8f0" font-weight="600">크라우드스트라이크</text>
    <rect x="437" y="333" width="29" height="22" rx="3" fill="#ef4444"/>
    <text x="429" y="349" fill="#f87171" font-weight="700" text-anchor="end">-3.5%</text>
    <!-- 지스케일러 -4.8 -->
    <text x="24" y="385" fill="#cbd5e1">지스케일러</text>
    <rect x="426" y="369" width="40" height="22" rx="3" fill="#ef4444"/>
    <text x="418" y="385" fill="#f87171" font-weight="600" text-anchor="end">-4.8%</text>
    <!-- 센티넬원 -32.1 -->
    <text x="24" y="421" fill="#e2e8f0" font-weight="600">센티넬원</text>
    <rect x="200" y="405" width="266" height="22" rx="3" fill="#ef4444"/>
    <text x="192" y="421" fill="#f87171" font-weight="700" text-anchor="end">-32.1%</text>
  </g>

  <text x="450" y="492" fill="#fbbf24" font-size="15" font-weight="600" text-anchor="middle">가장 앞선 3세대(EDR·제로트러스트)가 이익 지도에선 바닥이다</text>
</svg>

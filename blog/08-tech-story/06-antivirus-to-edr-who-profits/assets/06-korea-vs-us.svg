<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="820" height="440" fill="#0a0e1a"/>
  <text x="410" y="44" fill="#f1f5f9" font-size="25" font-weight="700" text-anchor="middle">태평양을 사이에 둔 두 개의 보안 산업</text>
  <text x="410" y="72" fill="#64748b" font-size="14" text-anchor="middle">흑자냐 성장이냐, 정확히 반대를 골랐다</text>

  <!-- US panel -->
  <rect x="40" y="100" width="345" height="248" rx="14" fill="#111827" stroke="#1f2937"/>
  <text x="212" y="134" fill="#38bdf8" font-size="17" font-weight="700" text-anchor="middle">미국 · 크라우드스트라이크</text>
  <line x1="80" y1="300" x2="344" y2="300" stroke="#334155"/>
  <rect x="95" y="150" width="70" height="150" fill="#1d4ed8" opacity="0.85"/>
  <text x="130" y="322" fill="#94a3b8" font-size="12.5" text-anchor="middle">매출 약 6.0조원</text>
  <text x="250" y="196" fill="#f87171" font-size="16" font-weight="700" text-anchor="middle">영업이익률 -3.5%</text>
  <text x="250" y="224" fill="#e2e8f0" font-size="14" text-anchor="middle">4년 매출 4.3배</text>
  <text x="250" y="256" fill="#fbbf24" font-size="13.5" text-anchor="middle">적자 감수, 초고속 성장</text>

  <!-- KR panel -->
  <rect x="435" y="100" width="345" height="248" rx="14" fill="#111827" stroke="#1f2937"/>
  <text x="607" y="134" fill="#22c55e" font-size="17" font-weight="700" text-anchor="middle">한국 · 안랩</text>
  <line x1="475" y1="300" x2="739" y2="300" stroke="#334155"/>
  <rect x="490" y="293" width="70" height="7" fill="#16a34a"/>
  <text x="525" y="322" fill="#94a3b8" font-size="12.5" text-anchor="middle">매출 0.27조원</text>
  <text x="645" y="196" fill="#4ade80" font-size="16" font-weight="700" text-anchor="middle">영업이익률 +12.4%</text>
  <text x="645" y="224" fill="#e2e8f0" font-size="14" text-anchor="middle">4년 매출 +29%</text>
  <text x="645" y="256" fill="#fbbf24" font-size="13.5" text-anchor="middle">흑자지만 작고 정체</text>

  <text x="410" y="392" fill="#fbbf24" font-size="19" font-weight="700" text-anchor="middle">매출 규모 약 22배</text>
  <text x="410" y="420" fill="#94a3b8" font-size="14" text-anchor="middle">한국엔 적자를 감수하고 시장을 삼키는 자본 모델이 없다</text>
</svg>

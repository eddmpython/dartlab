<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="880" height="380" fill="#0a0e1a"/>
  <text x="40" y="46" fill="#f1f5f9" font-size="25" font-weight="700">한 질문, 세 개의 시제</text>
  <text x="40" y="74" fill="#64748b" font-size="15">"부가가치는 어디에 앉는가"를 세 기술에 물었더니, 이익이 도착한 시점이 달랐다</text>

  <!-- 곧 온다 (원자로) -->
  <rect x="50" y="110" width="250" height="200" rx="14" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
  <text x="175" y="150" fill="#38bdf8" font-size="18" font-weight="700" text-anchor="middle">곧 온다</text>
  <text x="175" y="178" fill="#e2e8f0" font-size="14" text-anchor="middle">원자로 · SMR</text>
  <text x="175" y="228" fill="#94a3b8" font-size="13" text-anchor="middle">능력은 갖췄으나</text>
  <text x="175" y="248" fill="#94a3b8" font-size="13" text-anchor="middle">이익은 아직 대기</text>
  <text x="175" y="288" fill="#38bdf8" font-size="13" text-anchor="middle">미래의 매출을 기다린다</text>

  <!-- 지금 터졌다 (변압기) -->
  <rect x="315" y="110" width="250" height="200" rx="14" fill="#111827" stroke="#fbbf24" stroke-width="2"/>
  <text x="440" y="150" fill="#fbbf24" font-size="18" font-weight="700" text-anchor="middle">지금 터졌다</text>
  <text x="440" y="178" fill="#e2e8f0" font-size="14" text-anchor="middle">변압기</text>
  <text x="440" y="222" fill="#fbbf24" font-size="26" text-anchor="middle" font-weight="700">+24.4%</text>
  <text x="440" y="248" fill="#94a3b8" font-size="13" text-anchor="middle">대체 불가능한 자리가</text>
  <text x="440" y="288" fill="#fbbf24" font-size="13" text-anchor="middle">이익을 지금 낸다</text>

  <!-- 아직 멀었다 (로봇) -->
  <rect x="580" y="110" width="250" height="200" rx="14" fill="#111827" stroke="#ef4444" stroke-width="2"/>
  <text x="705" y="150" fill="#ef4444" font-size="18" font-weight="700" text-anchor="middle">아직 멀었다</text>
  <text x="705" y="178" fill="#e2e8f0" font-size="14" text-anchor="middle">로봇</text>
  <text x="705" y="222" fill="#ef4444" font-size="26" text-anchor="middle" font-weight="700">-180.3%</text>
  <text x="705" y="248" fill="#94a3b8" font-size="13" text-anchor="middle">이익은 도착하지 않았고</text>
  <text x="705" y="288" fill="#ef4444" font-size="13" text-anchor="middle">값은 기대가 만든다</text>

  <text x="440" y="345" fill="#64748b" font-size="13" text-anchor="middle">같은 법칙(대체 불가능성), 서로 다른 시제. 이익은 남이 못 만드는 자리에, 그러나 저마다 다른 때에 앉는다</text>
</svg>

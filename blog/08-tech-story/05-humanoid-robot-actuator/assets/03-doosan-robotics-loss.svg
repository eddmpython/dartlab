<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="880" height="420" fill="#0a0e1a"/>
  <text x="40" y="46" fill="#f1f5f9" font-size="25" font-weight="700">두산로보틱스: 매출은 줄고, 적자는 깊어졌다</text>
  <text x="40" y="74" fill="#64748b" font-size="15">막대는 매출(억원), 선은 영업이익률(%). 완성 로봇의 초기 시장 고전. 실측</text>

  <!-- 매출 막대 468 330 -->
  <rect x="180" y="230" width="120" height="150" fill="#1e3a5f"/>
  <rect x="480" y="274" width="120" height="106" fill="#1e3a5f"/>
  <text x="240" y="222" fill="#93c5fd" font-size="15" text-anchor="middle">매출 468억</text>
  <text x="540" y="266" fill="#93c5fd" font-size="15" text-anchor="middle">매출 330억</text>
  <line x1="120" y1="380" x2="720" y2="380" stroke="#334155"/>
  <text x="240" y="402" fill="#94a3b8" font-size="14" text-anchor="middle">2024</text>
  <text x="540" y="402" fill="#94a3b8" font-size="14" text-anchor="middle">2025</text>

  <!-- OPM 선 -88 -180 -->
  <polyline points="240,180 540,300" fill="none" stroke="#ef4444" stroke-width="3"/>
  <circle cx="240" cy="180" r="6" fill="#ef4444"/>
  <circle cx="540" cy="300" r="7" fill="#dc2626"/>
  <text x="240" y="168" fill="#ef4444" font-size="16" text-anchor="middle" font-weight="700">-88%</text>
  <text x="560" y="300" fill="#dc2626" font-size="18" text-anchor="start" font-weight="700">-180.3%</text>

  <text x="440" y="130" fill="#ef4444" font-size="14" text-anchor="middle" font-weight="600">100원을 팔 때마다 180원을 잃는 국면</text>
</svg>

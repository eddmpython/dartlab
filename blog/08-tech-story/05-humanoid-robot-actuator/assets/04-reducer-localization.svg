<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="880" height="360" fill="#0a0e1a"/>
  <text x="40" y="46" fill="#f1f5f9" font-size="25" font-weight="700">관절의 병목: 하모닉 감속기 국산화</text>
  <text x="40" y="74" fill="#64748b" font-size="15">일본이 반세기 독점한 로봇 관절 부품. 특허가 풀리자 한국이 도전을 시작했다</text>

  <!-- timeline -->
  <line x1="90" y1="200" x2="800" y2="200" stroke="#334155" stroke-width="2"/>

  <!-- 1964 -->
  <circle cx="130" cy="200" r="7" fill="#94a3b8"/>
  <text x="130" y="170" fill="#94a3b8" font-size="14" text-anchor="middle" font-weight="700">1964</text>
  <text x="130" y="235" fill="#64748b" font-size="12" text-anchor="middle">일본 HDS</text>
  <text x="130" y="252" fill="#64748b" font-size="12" text-anchor="middle">상용화</text>

  <!-- 독점 구간 -->
  <rect x="130" y="196" width="330" height="8" fill="#ef4444"/>
  <text x="295" y="290" fill="#ef4444" font-size="14" text-anchor="middle" font-weight="600">일본 독점 약 50년</text>

  <!-- 2013 -->
  <circle cx="460" cy="200" r="7" fill="#fbbf24"/>
  <text x="460" y="170" fill="#fbbf24" font-size="14" text-anchor="middle" font-weight="700">2013</text>
  <text x="460" y="235" fill="#94a3b8" font-size="12" text-anchor="middle">기본 특허</text>
  <text x="460" y="252" fill="#94a3b8" font-size="12" text-anchor="middle">만료</text>

  <!-- 2017 -->
  <circle cx="620" cy="200" r="7" fill="#22c55e"/>
  <text x="620" y="170" fill="#22c55e" font-size="14" text-anchor="middle" font-weight="700">2017</text>
  <text x="620" y="235" fill="#94a3b8" font-size="12" text-anchor="middle">에스비비테크</text>
  <text x="620" y="252" fill="#94a3b8" font-size="12" text-anchor="middle">국산 양산</text>

  <!-- 2026 -->
  <circle cx="770" cy="200" r="7" fill="#22c55e"/>
  <text x="770" y="170" fill="#22c55e" font-size="14" text-anchor="middle" font-weight="700">2026</text>
  <text x="770" y="235" fill="#94a3b8" font-size="12" text-anchor="middle">현대차 국산</text>
  <text x="770" y="252" fill="#94a3b8" font-size="12" text-anchor="middle">감속기 시험</text>

  <rect x="460" y="196" width="340" height="8" fill="#22c55e"/>
  <text x="630" y="320" fill="#22c55e" font-size="13" text-anchor="middle" font-weight="600">한국 도전(에스피지·에스비비테크), 이익은 아직 미래형</text>
</svg>

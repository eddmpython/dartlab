<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="880" height="420" fill="#0a0e1a"/>
  <text x="40" y="46" fill="#f1f5f9" font-size="25" font-weight="700">휴머노이드를 사람의 몸에 빗대면</text>
  <text x="40" y="74" fill="#64748b" font-size="15">관절은 감속기, 근육은 액추에이터, 감각은 센서. 이 셋이 없으면 로봇은 조각상이다</text>

  <!-- robot figure -->
  <g stroke="#475569" stroke-width="6" fill="none" stroke-linecap="round">
    <circle cx="300" cy="150" r="26" fill="#1e293b"/>
    <line x1="300" y1="176" x2="300" y2="280"/>
    <line x1="300" y1="205" x2="245" y2="250"/>
    <line x1="245" y1="250" x2="255" y2="310"/>
    <line x1="300" y1="205" x2="355" y2="250"/>
    <line x1="355" y1="250" x2="345" y2="310"/>
    <line x1="300" y1="280" x2="270" y2="360"/>
    <line x1="300" y1="280" x2="330" y2="360"/>
  </g>
  <!-- joint dots -->
  <circle cx="245" cy="250" r="9" fill="#fbbf24"/>
  <circle cx="355" cy="250" r="9" fill="#fbbf24"/>
  <circle cx="300" cy="280" r="9" fill="#38bdf8"/>
  <circle cx="300" cy="150" r="9" fill="#22c55e"/>

  <!-- labels -->
  <line x1="245" y1="250" x2="470" y2="150" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="480" y="146" fill="#fbbf24" font-size="17" font-weight="700">관절 = 감속기</text>
  <text x="480" y="170" fill="#94a3b8" font-size="13">빠른 회전을 느리고 힘센 움직임으로. 일본이 오래 독점</text>

  <line x1="300" y1="280" x2="470" y2="245" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="480" y="241" fill="#38bdf8" font-size="17" font-weight="700">근육 = 액추에이터</text>
  <text x="480" y="265" fill="#94a3b8" font-size="13">모터·감속기·센서를 묶어 팔다리를 움직인다</text>

  <line x1="300" y1="150" x2="470" y2="335" stroke="#22c55e" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="480" y="331" fill="#22c55e" font-size="17" font-weight="700">감각 = 센서</text>
  <text x="480" y="355" fill="#94a3b8" font-size="13">힘·토크·비전으로 자세와 균형을 잡는다</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="880" height="540" fill="#0a0e1a"/>
  <text x="40" y="46" fill="#f1f5f9" font-size="26" font-weight="700">휴머노이드 밸류체인 6개사 이익률 지도</text>
  <text x="40" y="74" fill="#64748b" font-size="15">2025년 영업이익률(%). 대부분 바닥선 아래로 내려간다. 우리 데이터 실측</text>

  <!-- zero line -->
  <line x1="60" y1="150" x2="820" y2="150" stroke="#64748b" stroke-width="1.5"/>
  <text x="50" y="155" fill="#94a3b8" font-size="12" text-anchor="end">0%</text>

  <!-- 두산로보틱스 -180.3, scale 1.8px/% -->
  <rect x="75" y="150" width="70" height="325" fill="#dc2626"/>
  <text x="110" y="495" fill="#ef4444" font-size="15" font-weight="700" text-anchor="middle">-180.3%</text>
  <text x="110" y="514" fill="#94a3b8" font-size="11" text-anchor="middle">두산로보틱스</text>
  <text x="110" y="530" fill="#64748b" font-size="10" text-anchor="middle">완성로봇</text>

  <!-- 레인보우 -7.3 -->
  <rect x="200" y="150" width="70" height="13" fill="#ef4444"/>
  <text x="235" y="183" fill="#ef4444" font-size="13" text-anchor="middle">-7.3%</text>
  <text x="235" y="514" fill="#94a3b8" font-size="11" text-anchor="middle">레인보우</text>
  <text x="235" y="530" fill="#64748b" font-size="10" text-anchor="middle">완성휴머노이드</text>

  <!-- 에스비비테크 -114.7 (2023) -->
  <rect x="325" y="150" width="70" height="206" fill="#ef4444"/>
  <text x="360" y="376" fill="#ef4444" font-size="14" font-weight="700" text-anchor="middle">-114.7%</text>
  <text x="360" y="514" fill="#94a3b8" font-size="11" text-anchor="middle">에스비비테크</text>
  <text x="360" y="530" fill="#64748b" font-size="10" text-anchor="middle">감속기 · 2023</text>

  <!-- 에스피지 +5.3 -->
  <rect x="450" y="140" width="70" height="10" fill="#22c55e"/>
  <text x="485" y="130" fill="#22c55e" font-size="14" font-weight="700" text-anchor="middle">+5.3%</text>
  <text x="485" y="514" fill="#94a3b8" font-size="11" text-anchor="middle">에스피지</text>
  <text x="485" y="530" fill="#64748b" font-size="10" text-anchor="middle">감속기</text>

  <!-- 하이젠 -12.1 -->
  <rect x="575" y="150" width="70" height="22" fill="#ef4444"/>
  <text x="610" y="192" fill="#ef4444" font-size="13" text-anchor="middle">-12.1%</text>
  <text x="610" y="514" fill="#94a3b8" font-size="11" text-anchor="middle">하이젠알앤엠</text>
  <text x="610" y="530" fill="#64748b" font-size="10" text-anchor="middle">액추에이터</text>

  <!-- 로보티즈 +8.6 -->
  <rect x="700" y="135" width="70" height="15" fill="#22c55e"/>
  <text x="735" y="125" fill="#22c55e" font-size="14" font-weight="700" text-anchor="middle">+8.6%</text>
  <text x="735" y="514" fill="#94a3b8" font-size="11" text-anchor="middle">로보티즈</text>
  <text x="735" y="530" fill="#64748b" font-size="10" text-anchor="middle">액추에이터</text>

  <text x="440" y="440" fill="#ef4444" font-size="14" text-anchor="middle" font-weight="600">여섯 중 넷이 적자. 이익이 아직 도착하지 않았다</text>
</svg>

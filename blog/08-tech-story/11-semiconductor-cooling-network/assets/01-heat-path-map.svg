<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">AI 칩 열 이동 경로</title>
  <desc id="desc">AI 칩에서 생긴 열이 cold plate, manifold, CDU, 시설수, chiller, 전력과 물 제약으로 이동하는 경로를 설명한다.</desc>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="76" y="84" font-family="Malgun Gothic, Arial, sans-serif" font-size="36" font-weight="700" fill="#111827">열은 칩에서 시작하지만 거래망은 건물까지 간다</text>
  <text x="76" y="124" font-family="Malgun Gothic, Arial, sans-serif" font-size="18" fill="#475569">AI 랙 냉각은 cold plate 하나가 아니라 coolant loop, CDU, chiller, 전력과 물이 연결된 시스템이다.</text>
  <g font-family="Malgun Gothic, Arial, sans-serif">
    <rect x="74" y="214" width="146" height="110" rx="18" fill="#111827"/>
    <text x="147" y="260" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">GPU와 HBM</text>
    <text x="147" y="292" text-anchor="middle" font-size="15" fill="#cbd5e1">열 발생</text>

    <rect x="294" y="214" width="146" height="110" rx="18" fill="#f97316"/>
    <text x="367" y="260" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Cold plate</text>
    <text x="367" y="292" text-anchor="middle" font-size="15" fill="#fff7ed">열 흡수</text>

    <rect x="514" y="214" width="146" height="110" rx="18" fill="#0ea5e9"/>
    <text x="587" y="260" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Manifold</text>
    <text x="587" y="292" text-anchor="middle" font-size="15" fill="#e0f2fe">냉각수 분배</text>

    <rect x="734" y="214" width="146" height="110" rx="18" fill="#0f766e"/>
    <text x="807" y="260" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">CDU</text>
    <text x="807" y="292" text-anchor="middle" font-size="15" fill="#ccfbf1">압력과 온도</text>

    <rect x="954" y="214" width="146" height="110" rx="18" fill="#4338ca"/>
    <text x="1027" y="260" text-anchor="middle" font-size="20" font-weight="700" fill="#ffffff">Chiller</text>
    <text x="1027" y="292" text-anchor="middle" font-size="15" fill="#e0e7ff">시설 냉각</text>

    <path d="M226 269 H286 M446 269 H506 M666 269 H726 M886 269 H946" stroke="#64748b" stroke-width="5" fill="none"/>
    <path d="M286 269 l-18 -12 v24 z M506 269 l-18 -12 v24 z M726 269 l-18 -12 v24 z M946 269 l-18 -12 v24 z" fill="#64748b"/>

    <rect x="162" y="426" width="250" height="120" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="287" y="470" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">성능 제약</text>
    <text x="287" y="506" text-anchor="middle" font-size="16" fill="#475569">열을 못 빼면 클럭과 전력이 내려간다</text>

    <rect x="514" y="426" width="250" height="120" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="639" y="470" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">운영 제약</text>
    <text x="639" y="506" text-anchor="middle" font-size="16" fill="#475569">누수, 유지보수, 수질 관리가 생긴다</text>

    <rect x="866" y="426" width="250" height="120" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="991" y="470" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">입지 제약</text>
    <text x="991" y="506" text-anchor="middle" font-size="16" fill="#475569">전력과 물, 열 배출 인프라가 필요하다</text>

    <path d="M147 324 C180 390 220 410 287 426" stroke="#94a3b8" stroke-width="3" fill="none"/>
    <path d="M807 324 C790 380 708 402 639 426" stroke="#94a3b8" stroke-width="3" fill="none"/>
    <path d="M1027 324 C1052 380 1044 404 991 426" stroke="#94a3b8" stroke-width="3" fill="none"/>

    <text x="76" y="636" font-size="17" fill="#64748b">읽는 순서: 칩 열밀도에서 시작해 랙 밀도, CDU, chiller, 전력과 물까지 이어진다.</text>
  </g>
</svg>

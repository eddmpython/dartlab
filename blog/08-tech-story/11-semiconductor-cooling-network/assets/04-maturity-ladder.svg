<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">반도체 냉각 기술 성숙도 사다리</title>
  <desc id="desc">공랭, rear-door, direct-to-chip, immersion, direct-to-silicon 냉각 기술의 성숙도와 검증 조건을 보여준다.</desc>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="76" y="84" font-family="Malgun Gothic, Arial, sans-serif" font-size="34" font-weight="700" fill="#111827">기술 성숙도: 모든 냉각이 같은 단계는 아니다</text>
  <text x="76" y="124" font-family="Malgun Gothic, Arial, sans-serif" font-size="18" fill="#475569">투자 신호는 유행어가 아니라 어느 단계가 실제 고객 랙에 들어갔는지에서 나온다.</text>
  <g font-family="Malgun Gothic, Arial, sans-serif">
    <rect x="96" y="492" width="198" height="96" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="195" y="528" text-anchor="middle" font-size="21" font-weight="700" fill="#334155">공랭</text>
    <text x="195" y="558" text-anchor="middle" font-size="15" fill="#475569">성숙, 한계 접근</text>

    <rect x="326" y="420" width="198" height="168" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
    <text x="425" y="470" text-anchor="middle" font-size="21" font-weight="700" fill="#075985">Rear-door</text>
    <text x="425" y="502" text-anchor="middle" font-size="15" fill="#0369a1">기존 랙 보강</text>

    <rect x="556" y="330" width="198" height="258" rx="18" fill="#ffffff" stroke="#bbf7d0"/>
    <text x="655" y="402" text-anchor="middle" font-size="21" font-weight="700" fill="#166534">Direct-to-chip</text>
    <text x="655" y="436" text-anchor="middle" font-size="15" fill="#166534">확산 단계</text>
    <text x="655" y="468" text-anchor="middle" font-size="14" fill="#64748b">cold plate, CDU</text>

    <rect x="786" y="260" width="198" height="328" rx="18" fill="#ffffff" stroke="#fed7aa"/>
    <text x="885" y="352" text-anchor="middle" font-size="21" font-weight="700" fill="#9a3412">Immersion</text>
    <text x="885" y="386" text-anchor="middle" font-size="15" fill="#9a3412">선택 적용</text>
    <text x="885" y="418" text-anchor="middle" font-size="14" fill="#64748b">운영과 정비가 변수</text>

    <rect x="1016" y="190" width="198" height="398" rx="18" fill="#ffffff" stroke="#fecaca"/>
    <text x="1115" y="302" text-anchor="middle" font-size="21" font-weight="700" fill="#be123c">Direct-to-silicon</text>
    <text x="1115" y="336" text-anchor="middle" font-size="15" fill="#be123c">미래형</text>
    <text x="1115" y="368" text-anchor="middle" font-size="14" fill="#64748b">패키지 설계와 결합</text>

    <path d="M96 636 H1214" stroke="#64748b" stroke-width="4"/>
    <text x="96" y="666" font-size="16" fill="#64748b">낮은 랙 밀도</text>
    <text x="1058" y="666" font-size="16" fill="#64748b">초고밀도 랙</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="880" height="500" fill="#0a0e1a"/>
  <text x="40" y="48" fill="#f1f5f9" font-size="26" font-weight="700">골드러시의 곡괭이: HBM 장비</text>
  <text x="40" y="76" fill="#64748b" font-size="15">한미반도체. 막대=매출(억원), 선=영업이익률(%). 우리 데이터 실측</text>

  <line x1="70" y1="430" x2="820" y2="430" stroke="#334155" stroke-width="1.5"/>

  <!-- bars -->
  <rect x="135" y="277" width="90" height="153" fill="#1e3a5f"/>
  <text x="180" y="266" fill="#94a3b8" font-size="15" text-anchor="middle" font-weight="600">3,276</text>
  <text x="180" y="452" fill="#64748b" font-size="13" text-anchor="middle">2022</text>

  <rect x="315" y="356" width="90" height="74" fill="#3a1f1f"/>
  <text x="360" y="345" fill="#ef4444" font-size="15" text-anchor="middle" font-weight="600">1,590</text>
  <text x="360" y="452" fill="#64748b" font-size="13" text-anchor="middle">2023</text>
  <text x="360" y="392" fill="#ef4444" font-size="11" text-anchor="middle">HBM 직전 침체</text>

  <rect x="495" y="169" width="90" height="261" fill="#fbbf24"/>
  <text x="540" y="158" fill="#fbbf24" font-size="15" text-anchor="middle" font-weight="700">5,589</text>
  <text x="540" y="452" fill="#64748b" font-size="13" text-anchor="middle">2024</text>

  <rect x="675" y="161" width="90" height="269" fill="#fbbf24"/>
  <text x="720" y="150" fill="#fbbf24" font-size="15" text-anchor="middle" font-weight="700">5,767</text>
  <text x="720" y="452" fill="#64748b" font-size="13" text-anchor="middle">2025</text>

  <!-- OPM line -->
  <polyline points="180,239 360,308 540,174 720,186" fill="none" stroke="#22c55e" stroke-width="2.5"/>
  <circle cx="180" cy="239" r="5" fill="#22c55e"/><text x="180" y="228" fill="#22c55e" font-size="12" text-anchor="middle">34.1%</text>
  <circle cx="360" cy="308" r="5" fill="#22c55e"/><text x="405" y="312" fill="#22c55e" font-size="12" text-anchor="middle">21.7%</text>
  <circle cx="540" cy="174" r="5" fill="#22c55e"/><text x="540" y="152" fill="#22c55e" font-size="12" text-anchor="middle">45.7%</text>
  <circle cx="720" cy="186" r="5" fill="#22c55e"/><text x="720" y="470" fill="#22c55e" font-size="12" text-anchor="middle">43.6%</text>

  <!-- annotation -->
  <text x="450" y="120" fill="#e2e8f0" font-size="14" text-anchor="middle" font-weight="600">매출 한 해 만에 3.5배. 2025 매출총이익률 57.6%로 칩(60.4%)에 육박.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 420" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="880" height="420" fill="#0a0e1a"/>
  <text x="40" y="48" fill="#f1f5f9" font-size="26" font-weight="700">모래에서 11N 실리콘까지</text>
  <text x="40" y="76" fill="#64748b" font-size="15">순도 98%에서 99.999999999%로. 이 간극이 사슬에서 가장 먼 구간이다</text>

  <!-- boxes -->
  <g>
    <rect x="40" y="150" width="150" height="90" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="115" y="190" fill="#e2e8f0" font-size="16" font-weight="700" text-anchor="middle">규사</text>
    <text x="115" y="212" fill="#64748b" font-size="12" text-anchor="middle">SiO2, 부도체</text>
  </g>
  <g>
    <rect x="240" y="150" width="150" height="90" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="315" y="184" fill="#e2e8f0" font-size="16" font-weight="700" text-anchor="middle">금속급 실리콘</text>
    <text x="315" y="206" fill="#64748b" font-size="12" text-anchor="middle">아크로 2,000도</text>
    <text x="315" y="224" fill="#fbbf24" font-size="13" text-anchor="middle" font-weight="600">순도 98~99%</text>
  </g>
  <g>
    <rect x="440" y="150" width="150" height="90" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="515" y="184" fill="#e2e8f0" font-size="16" font-weight="700" text-anchor="middle">TCS 가스</text>
    <text x="515" y="206" fill="#64748b" font-size="12" text-anchor="middle">삼염화실란</text>
    <text x="515" y="224" fill="#64748b" font-size="12" text-anchor="middle">반복 증류로 정제</text>
  </g>
  <g>
    <rect x="640" y="150" width="200" height="90" rx="10" fill="#14210f" stroke="#22c55e" stroke-width="1.8"/>
    <text x="740" y="184" fill="#e2e8f0" font-size="16" font-weight="700" text-anchor="middle">폴리실리콘</text>
    <text x="740" y="206" fill="#64748b" font-size="12" text-anchor="middle">고온 막대에 침착</text>
    <text x="740" y="224" fill="#22c55e" font-size="13" text-anchor="middle" font-weight="700">순도 11N (9가 11개)</text>
  </g>

  <!-- arrows -->
  <g stroke="#475569" stroke-width="2" fill="#475569">
    <line x1="190" y1="195" x2="234" y2="195"/><polygon points="234,190 244,195 234,200"/>
    <line x1="390" y1="195" x2="434" y2="195"/><polygon points="434,190 444,195 434,200"/>
    <line x1="590" y1="195" x2="634" y2="195"/><polygon points="634,190 644,195 634,200"/>
  </g>
  <text x="215" y="185" fill="#94a3b8" font-size="11" text-anchor="middle">산소 제거</text>
  <text x="415" y="185" fill="#94a3b8" font-size="11" text-anchor="middle">가스화</text>
  <text x="615" y="185" fill="#94a3b8" font-size="11" text-anchor="middle">지멘스공정</text>

  <text x="40" y="310" fill="#94a3b8" font-size="14">여기까지가 사슬의 맨 앞. 인류가 하는 가장 어려운 정제 중 하나.</text>
  <text x="40" y="336" fill="#fbbf24" font-size="14" font-weight="600">그런데 이 공정을 하는 대표 상장사(OCI)의 2025년 영업이익률은 0.0%였다.</text>
  <text x="40" y="362" fill="#64748b" font-size="12">참고: SK하이닉스 뉴스룸 외. 태양광용은 약 10N, 반도체 웨이퍼용은 11N.</text>
</svg>

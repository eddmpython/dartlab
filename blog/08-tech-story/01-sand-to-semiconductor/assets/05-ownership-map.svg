<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="880" height="500" fill="#0a0e1a"/>
  <text x="40" y="46" fill="#f1f5f9" font-size="26" font-weight="700">사슬 소유권과 이익률 지도</text>
  <text x="40" y="74" fill="#64748b" font-size="15">가장 어려운 앞 공정은 이익률이 낮거나 증시에서 살 수조차 없다</text>

  <!-- header -->
  <text x="40" y="112" fill="#475569" font-size="12">공정 단계</text>
  <text x="250" y="112" fill="#475569" font-size="12">대표 회사</text>
  <text x="470" y="112" fill="#475569" font-size="12">상장</text>
  <text x="580" y="112" fill="#475569" font-size="12">2025 영업이익률</text>
  <line x1="40" y1="120" x2="840" y2="120" stroke="#1e293b" stroke-width="1"/>

  <!-- rows -->
  <g font-size="14">
    <!-- 1 폴리실리콘 -->
    <text x="40" y="150" fill="#cbd5e1">1. 폴리실리콘</text>
    <text x="250" y="150" fill="#94a3b8">OCI (태양광 위주)</text>
    <text x="470" y="150" fill="#64748b">상장</text>
    <rect x="580" y="140" width="2" height="14" fill="#ef4444"/>
    <text x="600" y="151" fill="#ef4444" font-weight="700">0.0%</text>

    <!-- 2 웨이퍼 비상장 -->
    <text x="40" y="192" fill="#cbd5e1">2. 웨이퍼</text>
    <text x="250" y="192" fill="#94a3b8">SK실트론</text>
    <text x="470" y="192" fill="#ef4444" font-weight="600">비상장</text>
    <text x="580" y="192" fill="#64748b" font-style="italic">증시에서 살 수 없음</text>

    <!-- 3 공정소재 -->
    <text x="40" y="234" fill="#cbd5e1">3. 공정소재</text>
    <text x="250" y="234" fill="#94a3b8">동진쎄미켐</text>
    <text x="470" y="234" fill="#64748b">상장</text>
    <rect x="580" y="224" width="66" height="14" fill="#38bdf8"/>
    <text x="656" y="235" fill="#38bdf8" font-weight="600">14.3%</text>

    <!-- 4 소모성부품 -->
    <text x="40" y="276" fill="#cbd5e1">4. 소모성부품</text>
    <text x="250" y="276" fill="#94a3b8">하나머티리얼즈</text>
    <text x="470" y="276" fill="#64748b">상장</text>
    <rect x="580" y="266" width="84" height="14" fill="#38bdf8"/>
    <text x="674" y="277" fill="#38bdf8" font-weight="600">18.3%</text>

    <!-- 5 HBM장비 -->
    <text x="40" y="318" fill="#e2e8f0">5. HBM장비</text>
    <text x="250" y="318" fill="#cbd5e1">한미반도체</text>
    <text x="470" y="318" fill="#64748b">상장</text>
    <rect x="580" y="308" width="201" height="14" fill="#fbbf24"/>
    <text x="791" y="319" fill="#fbbf24" font-weight="700">43.6%</text>

    <!-- 6 칩 제조 -->
    <text x="40" y="360" fill="#e2e8f0">6. 칩 제조</text>
    <text x="250" y="360" fill="#cbd5e1">SK하이닉스</text>
    <text x="470" y="360" fill="#64748b">상장</text>
    <rect x="580" y="350" width="224" height="14" fill="#22c55e"/>
    <text x="814" y="361" fill="#22c55e" font-weight="700">48.6%</text>

    <!-- 7 후공정 -->
    <text x="40" y="402" fill="#cbd5e1">7. 후공정</text>
    <text x="250" y="402" fill="#94a3b8">하나마이크론</text>
    <text x="470" y="402" fill="#64748b">상장</text>
    <rect x="580" y="392" width="38" height="14" fill="#38bdf8"/>
    <text x="628" y="403" fill="#38bdf8" font-weight="600">8.3%</text>
  </g>

  <line x1="40" y1="424" x2="840" y2="424" stroke="#1e293b" stroke-width="1"/>
  <text x="40" y="456" fill="#fbbf24" font-size="14" font-weight="600">부가가치는 난도가 아니라 대체 불가능성 x 사이클 위치 x 자본 회수력이 결정한다.</text>
  <text x="40" y="480" fill="#64748b" font-size="12">막대는 사슬 단계별 대표사 2025 영업이익률. 회사 우열이 아니라 부가가치가 앉는 자리를 보는 지도.</text>
</svg>

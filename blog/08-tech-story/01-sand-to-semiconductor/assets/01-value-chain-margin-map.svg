<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="880" height="500" fill="#0a0e1a"/>
  <text x="40" y="48" fill="#f1f5f9" font-size="26" font-weight="700">반도체 사슬 8단계 부가가치 지도</text>
  <text x="40" y="76" fill="#64748b" font-size="15">공정 단계별 대표 상장사 2025년 영업이익률 (매출 대비 영업이익, %). 우리 데이터 실측</text>

  <!-- baseline -->
  <line x1="70" y1="430" x2="820" y2="430" stroke="#334155" stroke-width="1.5"/>

  <!-- bars: center x, opm -->
  <!-- 폴리실리콘 0.0 -->
  <rect x="85" y="428" width="70" height="2" fill="#ef4444"/>
  <text x="120" y="416" fill="#ef4444" font-size="17" font-weight="700" text-anchor="middle">0.0%</text>
  <text x="120" y="452" fill="#94a3b8" font-size="13" text-anchor="middle">폴리실리콘</text>
  <text x="120" y="470" fill="#64748b" font-size="11" text-anchor="middle">모래→실리콘</text>

  <!-- 소재 14.3 -->
  <rect x="210" y="344" width="70" height="86" fill="#38bdf8"/>
  <text x="245" y="332" fill="#38bdf8" font-size="17" font-weight="700" text-anchor="middle">14.3%</text>
  <text x="245" y="452" fill="#94a3b8" font-size="13" text-anchor="middle">공정소재</text>
  <text x="245" y="470" fill="#64748b" font-size="11" text-anchor="middle">동진쎄미켐</text>

  <!-- 부품 18.3 -->
  <rect x="335" y="320" width="70" height="110" fill="#38bdf8"/>
  <text x="370" y="308" fill="#38bdf8" font-size="17" font-weight="700" text-anchor="middle">18.3%</text>
  <text x="370" y="452" fill="#94a3b8" font-size="13" text-anchor="middle">소모성부품</text>
  <text x="370" y="470" fill="#64748b" font-size="11" text-anchor="middle">하나머티리얼즈</text>

  <!-- HBM 장비 43.6 -->
  <rect x="460" y="168" width="70" height="262" fill="#fbbf24"/>
  <text x="495" y="156" fill="#fbbf24" font-size="17" font-weight="700" text-anchor="middle">43.6%</text>
  <text x="495" y="452" fill="#e2e8f0" font-size="13" text-anchor="middle">HBM장비</text>
  <text x="495" y="470" fill="#64748b" font-size="11" text-anchor="middle">한미반도체</text>

  <!-- 칩 48.6 -->
  <rect x="585" y="138" width="70" height="292" fill="#22c55e"/>
  <text x="620" y="126" fill="#22c55e" font-size="17" font-weight="700" text-anchor="middle">48.6%</text>
  <text x="620" y="452" fill="#e2e8f0" font-size="13" text-anchor="middle">칩 제조</text>
  <text x="620" y="470" fill="#64748b" font-size="11" text-anchor="middle">SK하이닉스</text>

  <!-- 후공정 8.3 -->
  <rect x="710" y="380" width="70" height="50" fill="#38bdf8"/>
  <text x="745" y="368" fill="#38bdf8" font-size="17" font-weight="700" text-anchor="middle">8.3%</text>
  <text x="745" y="452" fill="#94a3b8" font-size="13" text-anchor="middle">후공정</text>
  <text x="745" y="470" fill="#64748b" font-size="11" text-anchor="middle">하나마이크론</text>

  <!-- annotations -->
  <text x="120" y="150" fill="#ef4444" font-size="13" text-anchor="middle" font-weight="600">가장 어려운데</text>
  <text x="120" y="168" fill="#ef4444" font-size="13" text-anchor="middle" font-weight="600">가장 못 번다</text>
  <text x="620" y="98" fill="#22c55e" font-size="13" text-anchor="middle" font-weight="600">부가가치 폭발</text>
</svg>

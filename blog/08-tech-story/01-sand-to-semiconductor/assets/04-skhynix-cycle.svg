<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="880" height="480" fill="#0a0e1a"/>
  <text x="40" y="48" fill="#f1f5f9" font-size="26" font-weight="700">칩의 심전도: SK하이닉스 영업이익률</text>
  <text x="40" y="76" fill="#64748b" font-size="15">이익률의 정점(48.6%)을 가지려면 적자의 골짜기(-23.6%)를 지나야 한다. 연간 실측</text>

  <!-- zero line -->
  <line x1="70" y1="300" x2="840" y2="300" stroke="#475569" stroke-width="1.2" stroke-dasharray="5 5"/>
  <text x="46" y="305" fill="#64748b" font-size="12" text-anchor="end">0%</text>

  <!-- recover segment highlighted -->
  <polyline points="90,260 210,237 330,184 450,239 570,394" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
  <polyline points="570,394 690,158 810,106" fill="none" stroke="#22c55e" stroke-width="3"/>

  <!-- points -->
  <g font-size="13" text-anchor="middle">
    <circle cx="90" cy="260" r="5" fill="#38bdf8"/><text x="90" y="248" fill="#cbd5e1">10.1</text><text x="90" y="330" fill="#64748b" font-size="12">2019</text>
    <circle cx="210" cy="237" r="5" fill="#38bdf8"/><text x="210" y="225" fill="#cbd5e1">15.7</text><text x="210" y="330" fill="#64748b" font-size="12">2020</text>
    <circle cx="330" cy="184" r="5" fill="#38bdf8"/><text x="330" y="172" fill="#cbd5e1">28.9</text><text x="330" y="330" fill="#64748b" font-size="12">2021</text>
    <circle cx="450" cy="239" r="5" fill="#38bdf8"/><text x="450" y="227" fill="#cbd5e1">15.3</text><text x="450" y="330" fill="#64748b" font-size="12">2022</text>
    <circle cx="570" cy="394" r="6" fill="#ef4444"/><text x="570" y="416" fill="#ef4444" font-weight="700">-23.6</text><text x="570" y="440" fill="#ef4444" font-size="12">2023 적자</text>
    <circle cx="690" cy="158" r="5" fill="#22c55e"/><text x="690" y="146" fill="#22c55e">35.5</text><text x="690" y="330" fill="#64748b" font-size="12">2024</text>
    <circle cx="810" cy="106" r="7" fill="#22c55e"/><text x="810" y="94" fill="#22c55e" font-weight="700">48.6</text><text x="810" y="330" fill="#64748b" font-size="12">2025</text>
  </g>

  <text x="640" y="300" fill="#94a3b8" font-size="13" font-weight="600">2년 사이 -23.6% → 48.6%</text>
</svg>

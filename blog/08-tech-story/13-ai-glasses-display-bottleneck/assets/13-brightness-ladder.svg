<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">밝기 사다리: 디스플레이 세대별 최대 밝기</title>
  <desc id="desc">LCoS와 마이크로OLED는 실내용 수천 nit에 머물고, 야외 풀컬러가 요구하는 수만에서 수백만 nit에 닿는 것은 마이크로LED뿐이라는 로그 스케일 막대 도식</desc>
  <rect width="1200" height="700" fill="#0f172a"/>
  <text x="60" y="66" fill="#f8fafc" font-size="33" font-family="Arial, sans-serif" font-weight="700">밝기 사다리: 세대가 오를수록 밝아지지만, 꼭대기엔 함정이 있다</text>
  <text x="60" y="104" fill="#cbd5e1" font-size="18" font-family="Arial, sans-serif">세로축은 로그 눈금이다. 한 칸 오를 때마다 밝기가 10배다. 실내는 아래쪽으로 되지만, 야외 풀컬러는 위쪽 띠를 요구한다.</text>

  <!-- axes -->
  <line x1="200" y1="150" x2="200" y2="600" stroke="#475569" stroke-width="2"/>
  <line x1="200" y1="600" x2="1090" y2="600" stroke="#475569" stroke-width="2"/>

  <!-- gridlines + labels (log) -->
  <g font-family="Arial, sans-serif" font-size="14" fill="#94a3b8">
    <line x1="200" y1="600" x2="1090" y2="600" stroke="#1f2937" stroke-width="1"/>
    <text x="150" y="605">1,000</text>
    <line x1="200" y1="487.5" x2="1090" y2="487.5" stroke="#1f2937" stroke-width="1"/>
    <text x="146" y="492">10,000</text>
    <line x1="200" y1="375" x2="1090" y2="375" stroke="#1f2937" stroke-width="1"/>
    <text x="138" y="380">100,000</text>
    <line x1="200" y1="262.5" x2="1090" y2="262.5" stroke="#1f2937" stroke-width="1"/>
    <text x="132" y="267">1,000,000</text>
    <line x1="200" y1="150" x2="1090" y2="150" stroke="#1f2937" stroke-width="1"/>
    <text x="126" y="155">10,000,000</text>
    <text x="150" y="135" fill="#cbd5e1" font-weight="700">nit</text>
  </g>

  <!-- outdoor full-color ceiling band: ~3,000 (y546) to ~1,000,000 (y262.5) -->
  <rect x="200" y="262.5" width="890" height="283.5" fill="#f97316" opacity="0.10"/>
  <line x1="200" y1="262.5" x2="1090" y2="262.5" stroke="#fb923c" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="1085" y="255" fill="#fdba74" font-size="14" font-family="Arial, sans-serif" text-anchor="end">한낮 야외 풀컬러가 요구하는 광원 밝기대 (수천 ~ 수백만 nit)</text>

  <!-- bars -->
  <g font-family="Arial, sans-serif">
    <!-- LCoS 5,000 -> y=521.4 -->
    <rect x="300" y="521.4" width="110" height="78.6" rx="6" fill="#fbbf24"/>
    <text x="355" y="512" fill="#fde68a" font-size="15" text-anchor="middle">5,000 nit</text>
    <text x="355" y="628" fill="#e2e8f0" font-size="16" font-weight="700" text-anchor="middle">LCoS</text>
    <text x="355" y="650" fill="#94a3b8" font-size="13" text-anchor="middle">메타 레이밴 디스플레이</text>
    <text x="355" y="668" fill="#94a3b8" font-size="13" text-anchor="middle">실내 글자용</text>

    <!-- microOLED ~5,000 -> y=521.4 -->
    <rect x="490" y="521.4" width="110" height="78.6" rx="6" fill="#22d3ee"/>
    <text x="545" y="512" fill="#a5f3fc" font-size="15" text-anchor="middle">3,000~5,000</text>
    <text x="545" y="628" fill="#e2e8f0" font-size="16" font-weight="700" text-anchor="middle">마이크로OLED</text>
    <text x="545" y="650" fill="#94a3b8" font-size="13" text-anchor="middle">Vision Pro, Galaxy XR</text>
    <text x="545" y="668" fill="#94a3b8" font-size="13" text-anchor="middle">헤드셋용</text>

    <!-- microLED range 500,000 (y296.4) to 10,000,000 (y150) -->
    <rect x="820" y="150" width="110" height="146.4" rx="6" fill="#34d399"/>
    <rect x="820" y="296.4" width="110" height="303.6" rx="6" fill="#34d399" opacity="0.16"/>
    <text x="875" y="140" fill="#6ee7b7" font-size="15" text-anchor="middle">50만 ~ 1,000만</text>
    <text x="875" y="628" fill="#e2e8f0" font-size="16" font-weight="700" text-anchor="middle">마이크로LED</text>
    <text x="875" y="650" fill="#94a3b8" font-size="13" text-anchor="middle">야외 풀컬러의 유일 소자</text>
    <text x="875" y="668" fill="#f87171" font-size="13" font-weight="700" text-anchor="middle">그러나 아직 양산 전</text>

    <!-- Samsung Display 40,000 demo reference dot -> y=419.8, x ~ 690 -->
    <circle cx="690" cy="419.8" r="7" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
    <text x="705" y="416" fill="#e2e8f0" font-size="13" font-family="Arial, sans-serif">삼성디스플레이 40,000 nit 데모</text>
    <text x="705" y="434" fill="#94a3b8" font-size="12" font-family="Arial, sans-serif">무대 시연일 뿐, 상세는 뒤 막에서</text>
  </g>

  <rect x="60" y="624" width="120" height="64" rx="12" fill="#101820" stroke="#0f766e" stroke-width="1"/>
  <text x="72" y="650" fill="#5eead4" font-size="14" font-family="Arial, sans-serif" font-weight="700">꼭대기의 함정</text>
  <text x="72" y="670" fill="#cbd5e1" font-size="12.5" font-family="Arial, sans-serif">밝기·색·수율</text>
  <text x="72" y="686" fill="#cbd5e1" font-size="12.5" font-family="Arial, sans-serif">동시엔 불가</text>
</svg>

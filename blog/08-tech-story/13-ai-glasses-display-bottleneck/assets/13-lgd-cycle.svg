<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">LG디스플레이 영업이익과 대형 패널 사이클</title>
  <desc id="desc">LG디스플레이가 3년 적자 후 2025년 흑자로 돌아섰지만 그 주어는 대형 패널 산업 사이클이지 AR 안경이 아니라는 연간 영업이익 추이</desc>
  <rect width="1200" height="620" fill="#0f172a"/>
  <text x="60" y="66" fill="#f8fafc" font-size="33" font-family="Arial, sans-serif" font-weight="700">이 흑자전환은 AR이 아니다: LG디스플레이 영업이익</text>
  <text x="60" y="104" fill="#cbd5e1" font-size="18" font-family="Arial, sans-serif">AR 병목의 재무를 찾겠다고 가까운 디스플레이 장부를 열면 이 곡선이 나온다. 하지만 주어가 다르다.</text>

  <!-- axes -->
  <line x1="200" y1="150" x2="200" y2="560" stroke="#475569" stroke-width="2"/>
  <!-- zero line -->
  <line x1="200" y1="275" x2="1000" y2="275" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="150" y="280" fill="#94a3b8" font-size="14" font-family="Arial, sans-serif">0</text>
  <text x="120" y="185" fill="#94a3b8" font-size="14" font-family="Arial, sans-serif">+1조</text>
  <text x="120" y="475" fill="#94a3b8" font-size="14" font-family="Arial, sans-serif">-2조</text>
  <text x="70" y="140" fill="#cbd5e1" font-size="14" font-family="Arial, sans-serif" font-weight="700">영업이익 (조원, KRW)</text>

  <!-- connecting line -->
  <polyline points="300,473.55 490,513.45 680,328.2 870,225.6" fill="none" stroke="#38bdf8" stroke-width="3"/>

  <!-- points + labels -->
  <g font-family="Arial, sans-serif">
    <circle cx="300" cy="473.55" r="8" fill="#ef4444"/>
    <text x="300" y="502" fill="#fca5a5" font-size="15" text-anchor="middle">-2.09조</text>
    <text x="300" y="588" fill="#e2e8f0" font-size="15" text-anchor="middle">2022</text>

    <circle cx="490" cy="513.45" r="8" fill="#dc2626"/>
    <text x="490" y="540" fill="#fca5a5" font-size="15" text-anchor="middle">-2.51조</text>
    <text x="490" y="588" fill="#e2e8f0" font-size="15" text-anchor="middle">2023</text>

    <circle cx="680" cy="328.2" r="8" fill="#f97316"/>
    <text x="680" y="356" fill="#fdba74" font-size="15" text-anchor="middle">-0.56조</text>
    <text x="680" y="588" fill="#e2e8f0" font-size="15" text-anchor="middle">2024</text>

    <circle cx="870" cy="225.6" r="8" fill="#22c55e"/>
    <text x="870" y="214" fill="#86efac" font-size="15" text-anchor="middle">+0.52조 (2.0%)</text>
    <text x="870" y="588" fill="#e2e8f0" font-size="15" text-anchor="middle">2025</text>
  </g>

  <rect x="1020" y="180" width="150" height="330" rx="12" fill="#111827" stroke="#334155" stroke-width="1"/>
  <text x="1035" y="210" fill="#fbbf24" font-size="15" font-family="Arial, sans-serif" font-weight="700">흑자전환의 주어</text>
  <text x="1035" y="238" fill="#cbd5e1" font-size="13.5" font-family="Arial, sans-serif">중국 LCD 과잉</text>
  <text x="1035" y="260" fill="#cbd5e1" font-size="13.5" font-family="Arial, sans-serif">LCD 사업 철수</text>
  <text x="1035" y="282" fill="#cbd5e1" font-size="13.5" font-family="Arial, sans-serif">아이폰 OLED 회복</text>
  <text x="1035" y="322" fill="#94a3b8" font-size="13" font-family="Arial, sans-serif">= 대형 패널</text>
  <text x="1035" y="342" fill="#94a3b8" font-size="13" font-family="Arial, sans-serif">산업 사이클</text>
  <text x="1035" y="386" fill="#f87171" font-size="13.5" font-family="Arial, sans-serif" font-weight="700">AR 안경 아님</text>
  <text x="1035" y="414" fill="#94a3b8" font-size="13" font-family="Arial, sans-serif">LG디스플레이는</text>
  <text x="1035" y="434" fill="#94a3b8" font-size="13" font-family="Arial, sans-serif">AR 마이크로</text>
  <text x="1035" y="454" fill="#94a3b8" font-size="13" font-family="Arial, sans-serif">디스플레이</text>
  <text x="1035" y="474" fill="#94a3b8" font-size="13" font-family="Arial, sans-serif">공급사가 아니다</text>
</svg>

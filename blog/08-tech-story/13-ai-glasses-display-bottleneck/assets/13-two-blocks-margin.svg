<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">안경 병목층 대 누가 이기든 파는 층</title>
  <desc id="desc">서울바이오시스 0.03퍼센트부터 메타 41퍼센트까지는 하나의 안경 가치사슬 기울기가 아니라 서로 다른 사업 마진을 나란히 둔 두 블록이라는 영업이익률 막대 도식</desc>
  <rect width="1200" height="650" fill="#0f172a"/>
  <text x="60" y="66" fill="#f8fafc" font-size="32" font-family="Arial, sans-serif" font-weight="700">한 줄로 이으면 안 되는 두 블록: 영업이익률 2025</text>
  <text x="60" y="104" fill="#cbd5e1" font-size="18" font-family="Arial, sans-serif">0.03%에서 41%로 매끈한 기울기를 긋고 싶어지지만, 그건 인과가 아니라 서로 다른 사업 마진을 나란히 둔 관찰이다.</text>

  <!-- axis -->
  <line x1="150" y1="160" x2="150" y2="560" stroke="#475569" stroke-width="2"/>
  <line x1="150" y1="560" x2="1150" y2="560" stroke="#475569" stroke-width="2"/>
  <g font-family="Arial, sans-serif" font-size="13" fill="#94a3b8">
    <line x1="150" y1="560" x2="1150" y2="560" stroke="#1f2937"/>
    <text x="120" y="565" text-anchor="end">0%</text>
    <line x1="150" y1="471" x2="1150" y2="471" stroke="#1f2937" stroke-width="1"/>
    <text x="120" y="476" text-anchor="end">10%</text>
    <line x1="150" y1="382" x2="1150" y2="382" stroke="#1f2937" stroke-width="1"/>
    <text x="120" y="387" text-anchor="end">20%</text>
    <line x1="150" y1="293" x2="1150" y2="293" stroke="#1f2937" stroke-width="1"/>
    <text x="120" y="298" text-anchor="end">30%</text>
    <line x1="150" y1="204" x2="1150" y2="204" stroke="#1f2937" stroke-width="1"/>
    <text x="120" y="209" text-anchor="end">40%</text>
  </g>

  <!-- block divider -->
  <line x1="648" y1="150" x2="648" y2="560" stroke="#334155" stroke-width="2" stroke-dasharray="4 6"/>
  <rect x="176" y="150" width="220" height="30" rx="15" fill="#7f1d1d"/>
  <text x="196" y="171" fill="#fecaca" font-size="14" font-family="Arial, sans-serif">A. 안경 인접 부품층 (KRW)</text>
  <rect x="700" y="150" width="300" height="30" rx="15" fill="#075985"/>
  <text x="720" y="171" fill="#e0f2fe" font-size="14" font-family="Arial, sans-serif">B. 누가 이기든 파는 전사 마진 (USD)</text>

  <g font-family="Arial, sans-serif" font-size="14">
    <!-- A block: KRW, AR-irrelevant thin -->
    <rect x="200" y="557" width="60" height="3" fill="#dc2626"/>
    <text x="230" y="548" fill="#fca5a5" text-anchor="middle" font-size="13">0.03%</text>
    <text x="230" y="582" fill="#e2e8f0" text-anchor="middle" font-size="13">서울바이오</text>
    <text x="230" y="600" fill="#94a3b8" text-anchor="middle" font-size="12">마이크로LED</text>

    <rect x="310" y="542.2" width="60" height="17.8" fill="#ef4444"/>
    <text x="340" y="533" fill="#fca5a5" text-anchor="middle" font-size="13">2.0%</text>
    <text x="340" y="582" fill="#e2e8f0" text-anchor="middle" font-size="13">LG디스플레이</text>
    <text x="340" y="600" fill="#94a3b8" text-anchor="middle" font-size="12">대형 패널</text>

    <rect x="420" y="533" width="60" height="27" fill="#f97316"/>
    <text x="450" y="524" fill="#fdba74" text-anchor="middle" font-size="13">3.04%</text>
    <text x="450" y="582" fill="#e2e8f0" text-anchor="middle" font-size="13">LG이노텍</text>
    <text x="450" y="600" fill="#94a3b8" text-anchor="middle" font-size="12">카메라 모듈</text>

    <rect x="530" y="488.3" width="60" height="71.7" fill="#fb923c"/>
    <text x="560" y="479" fill="#fed7aa" text-anchor="middle" font-size="13">8.07%</text>
    <text x="560" y="582" fill="#e2e8f0" text-anchor="middle" font-size="13">삼성전기</text>
    <text x="560" y="600" fill="#94a3b8" text-anchor="middle" font-size="12">MLCC·기판</text>

    <!-- B block: USD, whole-company -->
    <rect x="700" y="430.4" width="60" height="129.6" fill="#fbbf24"/>
    <text x="730" y="421" fill="#fef3c7" text-anchor="middle" font-size="13">14.58%</text>
    <text x="730" y="582" fill="#e2e8f0" text-anchor="middle" font-size="13">코닝</text>
    <text x="730" y="600" fill="#94a3b8" text-anchor="middle" font-size="12">유리</text>

    <rect x="810" y="312" width="60" height="248" fill="#38bdf8"/>
    <text x="840" y="303" fill="#e0f2fe" text-anchor="middle" font-size="13">27.9%</text>
    <text x="840" y="582" fill="#e2e8f0" text-anchor="middle" font-size="13">퀄컴</text>
    <text x="840" y="600" fill="#94a3b8" text-anchor="middle" font-size="12">폰 SoC · FY9월</text>

    <rect x="920" y="275.3" width="60" height="284.7" fill="#22c55e"/>
    <text x="950" y="266" fill="#bbf7d0" text-anchor="middle" font-size="13">32.03%</text>
    <text x="950" y="582" fill="#e2e8f0" text-anchor="middle" font-size="13">알파벳</text>
    <text x="950" y="600" fill="#94a3b8" text-anchor="middle" font-size="12">광고</text>

    <rect x="1030" y="195.5" width="60" height="364.5" fill="#6366f1"/>
    <text x="1060" y="186" fill="#c7d2fe" text-anchor="middle" font-size="13">약 41%</text>
    <text x="1060" y="582" fill="#e2e8f0" text-anchor="middle" font-size="13">메타</text>
    <text x="1060" y="600" fill="#94a3b8" text-anchor="middle" font-size="12">광고(전사)</text>
  </g>

  <text x="60" y="632" fill="#94a3b8" font-size="14" font-family="Arial, sans-serif">A는 대형 패널 사이클과 범용 LED 경쟁이 만든 부품 마진, B는 폰·유리·광고에서 나오는 전사 마진이다. 네 회사 모두 안경을 세그먼트로 떼지 않는다.</text>
</svg>

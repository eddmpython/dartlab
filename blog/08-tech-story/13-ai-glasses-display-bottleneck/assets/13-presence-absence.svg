<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
  <title id="title">한쪽은 라인이 없고 한쪽은 있다</title>
  <desc id="desc">같은 AR 야망인데 삼성 손익계산서엔 안경 매출 라인 자체가 없고, 메타는 Reality Labs를 세그먼트로 떼어 공시해 손실이 매출을 압도하는 크기로 드러난다는 유무 대비 도식</desc>
  <rect width="1200" height="660" fill="#0f172a"/>
  <text x="60" y="66" fill="#f8fafc" font-size="33" font-family="Arial, sans-serif" font-weight="700">한쪽은 라인이 없고, 한쪽은 있다</text>
  <text x="60" y="104" fill="#cbd5e1" font-size="18" font-family="Arial, sans-serif">대조의 축은 금액 크기가 아니라 라인의 유무다. 먼저 있고 없음을 보고, 그다음에 크기를 본다.</text>

  <!-- zero baseline -->
  <line x1="90" y1="235" x2="1110" y2="235" stroke="#64748b" stroke-width="1.5"/>
  <text x="1115" y="240" fill="#94a3b8" font-size="13" font-family="Arial, sans-serif">0</text>

  <!-- divider -->
  <line x1="470" y1="150" x2="470" y2="600" stroke="#334155" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- LEFT: Samsung empty line -->
  <text x="255" y="180" fill="#e2e8f0" font-size="18" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">삼성전자 · 삼성디스플레이</text>
  <rect x="150" y="212" width="210" height="46" rx="6" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="255" y="241" fill="#94a3b8" font-size="16" font-family="Arial, sans-serif" text-anchor="middle" font-style="italic">안경 매출 라인 = 없음</text>
  <text x="255" y="300" fill="#cbd5e1" font-size="14" font-family="Arial, sans-serif" text-anchor="middle">완제품(Jinju 2026, Haean 2027)</text>
  <text x="255" y="322" fill="#cbd5e1" font-size="14" font-family="Arial, sans-serif" text-anchor="middle">아직 한 대도 안 팔았다.</text>
  <text x="255" y="352" fill="#94a3b8" font-size="14" font-family="Arial, sans-serif" text-anchor="middle">배팅은 개발비·설비투자에 녹아</text>
  <text x="255" y="374" fill="#94a3b8" font-size="14" font-family="Arial, sans-serif" text-anchor="middle">전사 333.6조 안에서 공백이 된다.</text>
  <text x="255" y="404" fill="#5eead4" font-size="14" font-family="Arial, sans-serif" text-anchor="middle" font-weight="700">숨긴 게 아니라 미출하의 공백</text>

  <!-- RIGHT: Meta RL loss bars (down from zero). scale 4.625 px/B -->
  <text x="790" y="180" fill="#e2e8f0" font-size="18" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">메타 Reality Labs (USD)</text>
  <text x="790" y="202" fill="#94a3b8" font-size="13.5" font-family="Arial, sans-serif" text-anchor="middle">Quest까지 담은 AR/VR 사업부 전체</text>

  <g font-family="Arial, sans-serif">
    <!-- 3Q revenue sliver +0.47B (up) at x=560 -->
    <rect x="560" y="232.8" width="46" height="2.2" fill="#22c55e"/>
    <text x="583" y="224" fill="#86efac" font-size="12.5" text-anchor="middle">매출 470M</text>
    <!-- 3Q loss -4.4B -> 20.4px -->
    <rect x="612" y="235" width="46" height="20.4" fill="#f97316"/>
    <text x="635" y="278" fill="#fdba74" font-size="13.5" text-anchor="middle">3Q 손실</text>
    <text x="635" y="298" fill="#fdba74" font-size="13.5" text-anchor="middle">-4.4B</text>
    <text x="600" y="330" fill="#fbbf24" font-size="13" text-anchor="middle">손실이 매출의 9배 (3Q 한정)</text>

    <!-- annual -19.2B -> 88.8px -->
    <rect x="740" y="235" width="70" height="88.8" fill="#ef4444"/>
    <text x="775" y="345" fill="#fca5a5" font-size="14" text-anchor="middle">2025 연간</text>
    <text x="775" y="366" fill="#fca5a5" font-size="14" text-anchor="middle">-19.2B</text>

    <!-- cumulative ~-80B -> 370px -->
    <rect x="900" y="235" width="90" height="370" fill="#b91c1c"/>
    <text x="945" y="628" fill="#fecaca" font-size="14" text-anchor="middle">2020말 이후 누적</text>
    <text x="945" y="649" fill="#fecaca" font-size="14" text-anchor="middle">약 -80B</text>
  </g>

  <text x="60" y="636" fill="#94a3b8" font-size="14" font-family="Arial, sans-serif">물리도 승패도 아니다. 삼성은 팔 물건이 없어 전사 숫자에 녹고, 메타는 그 야망을 별도 세그먼트로 떼어 공시하기로 택한 구조 차이다.</text>
</svg>

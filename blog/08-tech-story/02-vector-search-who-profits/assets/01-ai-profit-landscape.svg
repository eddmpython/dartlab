<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="880" height="460" fill="#0a0e1a"/>
  <text x="40" y="46" fill="#f1f5f9" font-size="26" font-weight="700">AI 상장사, 두 무리로 갈린다</text>
  <text x="40" y="74" fill="#64748b" font-size="15">2025년 영업이익률(%). 우리 데이터 실측. 순수 AI는 적자, AI를 얹은 강자는 흑자</text>

  <!-- zero line -->
  <line x1="470" y1="110" x2="470" y2="410" stroke="#475569" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="470" y="428" fill="#64748b" font-size="12" text-anchor="middle">0%</text>

  <!-- rows -->
  <g font-size="14">
    <!-- 마음AI -65.1 -->
    <text x="40" y="146" fill="#cbd5e1">마음AI</text>
    <text x="200" y="146" fill="#64748b" font-size="11">순수 AI 플랫폼</text>
    <rect x="275" y="132" width="195" height="24" fill="#ef4444"/>
    <text x="268" y="149" fill="#ef4444" font-weight="700" text-anchor="end">-65.1%</text>

    <!-- 솔트룩스 -19.3 -->
    <text x="40" y="201" fill="#cbd5e1">솔트룩스</text>
    <text x="200" y="201" fill="#64748b" font-size="11">순수 LLM(루시아)</text>
    <rect x="412" y="187" width="58" height="24" fill="#ef4444"/>
    <text x="405" y="204" fill="#ef4444" font-weight="700" text-anchor="end">-19.3%</text>

    <!-- 네이버 +18.3 -->
    <text x="40" y="256" fill="#e2e8f0">네이버</text>
    <text x="200" y="256" fill="#64748b" font-size="11">AI + 검색·커머스</text>
    <rect x="470" y="242" width="55" height="24" fill="#22c55e"/>
    <text x="533" y="259" fill="#22c55e" font-weight="700">18.3%</text>

    <!-- 더존비즈온 +28.6 -->
    <text x="40" y="311" fill="#e2e8f0">더존비즈온</text>
    <text x="200" y="311" fill="#64748b" font-size="11">AI + 기업 SW</text>
    <rect x="470" y="297" width="86" height="24" fill="#22c55e"/>
    <text x="564" y="314" fill="#22c55e" font-weight="700">28.6%</text>

    <!-- SK하이닉스 +48.6 -->
    <text x="40" y="366" fill="#e2e8f0">SK하이닉스</text>
    <text x="200" y="366" fill="#fbbf24" font-size="11">그 AI를 돌리는 반도체</text>
    <rect x="470" y="352" width="146" height="24" fill="#fbbf24"/>
    <text x="624" y="369" fill="#fbbf24" font-weight="700">48.6%</text>
  </g>

  <text x="290" y="100" fill="#ef4444" font-size="13" text-anchor="middle" font-weight="600">기술을 만드는 자</text>
  <text x="640" y="100" fill="#22c55e" font-size="13" text-anchor="middle" font-weight="600">기술을 얹은 자 · 떠받치는 자</text>
</svg>

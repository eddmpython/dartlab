<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 450" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="880" height="450" fill="#0a0e1a"/>
  <text x="40" y="46" fill="#f1f5f9" font-size="26" font-weight="700">기술은 상품, 이익은 세 자리에 앉는다</text>
  <text x="40" y="74" fill="#64748b" font-size="15">벡터 기술 자체는 오픈소스라 해자가 아니다. 이익은 대체 불가능한 자산에 간다</text>

  <!-- commoditized base layer -->
  <rect x="40" y="360" width="800" height="52" rx="8" fill="#1a1f2e" stroke="#334155" stroke-width="1.2"/>
  <text x="440" y="392" fill="#94a3b8" font-size="15" text-anchor="middle" font-weight="600">벡터·임베딩·RAG 기술 (오픈소스, 누구나 며칠이면 붙인다 = 해자 아님)</text>

  <!-- three pillars -->
  <g>
    <rect x="80" y="180" width="200" height="160" rx="10" fill="#0d1f16" stroke="#22c55e" stroke-width="1.6"/>
    <text x="180" y="220" fill="#22c55e" font-size="17" font-weight="700" text-anchor="middle">독점 데이터</text>
    <text x="180" y="252" fill="#94a3b8" font-size="12" text-anchor="middle">임베딩할 원재료.</text>
    <text x="180" y="272" fill="#94a3b8" font-size="12" text-anchor="middle">네이버 검색·쇼핑,</text>
    <text x="180" y="292" fill="#94a3b8" font-size="12" text-anchor="middle">더존 기업 데이터.</text>
  </g>
  <g>
    <rect x="340" y="180" width="200" height="160" rx="10" fill="#0d1f16" stroke="#22c55e" stroke-width="1.6"/>
    <text x="440" y="220" fill="#22c55e" font-size="17" font-weight="700" text-anchor="middle">유통·사용자</text>
    <text x="440" y="252" fill="#94a3b8" font-size="12" text-anchor="middle">기술을 팔 창구.</text>
    <text x="440" y="272" fill="#94a3b8" font-size="12" text-anchor="middle">매일 쓰는 검색창,</text>
    <text x="440" y="292" fill="#94a3b8" font-size="12" text-anchor="middle">이미 깔린 고객사.</text>
  </g>
  <g>
    <rect x="600" y="180" width="200" height="160" rx="10" fill="#211a0d" stroke="#fbbf24" stroke-width="1.6"/>
    <text x="700" y="220" fill="#fbbf24" font-size="17" font-weight="700" text-anchor="middle">반도체·컴퓨트</text>
    <text x="700" y="252" fill="#94a3b8" font-size="12" text-anchor="middle">임베딩·추론을 돌림.</text>
    <text x="700" y="272" fill="#94a3b8" font-size="12" text-anchor="middle">그 수요가 GPU·HBM</text>
    <text x="700" y="292" fill="#94a3b8" font-size="12" text-anchor="middle">주문이 된다.</text>
  </g>

  <!-- top: profit -->
  <rect x="240" y="110" width="400" height="46" rx="8" fill="#14210f" stroke="#22c55e" stroke-width="1.8"/>
  <text x="440" y="140" fill="#e2e8f0" font-size="18" font-weight="700" text-anchor="middle">이익은 여기 위에 앉는다</text>

  <!-- connectors -->
  <g stroke="#334155" stroke-width="1.5">
    <line x1="180" y1="180" x2="340" y2="156"/>
    <line x1="440" y1="180" x2="440" y2="156"/>
    <line x1="700" y1="180" x2="540" y2="156"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="880" height="400" fill="#0a0e1a"/>
  <text x="40" y="46" fill="#f1f5f9" font-size="26" font-weight="700">RAG: 검색을 붙여 환각을 줄인다</text>
  <text x="40" y="74" fill="#64748b" font-size="15">부품이 대부분 오픈소스이거나 빌려 쓰는 API다. 조립은 쉽고, 독점할 조각이 적다</text>

  <!-- boxes -->
  <g>
    <rect x="30" y="150" width="120" height="80" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="90" y="196" fill="#e2e8f0" font-size="15" font-weight="700" text-anchor="middle">질문</text>
  </g>
  <g>
    <rect x="192" y="150" width="120" height="80" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="252" y="186" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">임베딩</text>
    <text x="252" y="208" fill="#64748b" font-size="11" text-anchor="middle">API로 빌림</text>
  </g>
  <g>
    <rect x="354" y="150" width="150" height="80" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="429" y="182" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">벡터 DB 검색</text>
    <text x="429" y="204" fill="#64748b" font-size="11" text-anchor="middle">오픈소스(FAISS 등)</text>
  </g>
  <g>
    <rect x="546" y="150" width="150" height="80" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
    <text x="621" y="182" fill="#e2e8f0" font-size="14" font-weight="700" text-anchor="middle">LLM 생성</text>
    <text x="621" y="204" fill="#64748b" font-size="11" text-anchor="middle">API로 빌림</text>
  </g>
  <g>
    <rect x="738" y="150" width="110" height="80" rx="10" fill="#14210f" stroke="#22c55e" stroke-width="1.8"/>
    <text x="793" y="196" fill="#e2e8f0" font-size="15" font-weight="700" text-anchor="middle">답변</text>
  </g>

  <!-- arrows -->
  <g stroke="#475569" stroke-width="2" fill="#475569">
    <line x1="150" y1="190" x2="186" y2="190"/><polygon points="186,185 196,190 186,195"/>
    <line x1="312" y1="190" x2="348" y2="190"/><polygon points="348,185 358,190 348,195"/>
    <line x1="504" y1="190" x2="540" y2="190"/><polygon points="540,185 550,190 540,195"/>
    <line x1="696" y1="190" x2="732" y2="190"/><polygon points="732,185 742,190 732,195"/>
  </g>

  <text x="429" y="290" fill="#94a3b8" font-size="13" text-anchor="middle">LLM이 기억이 아니라 '찾아온 근거'를 보고 답하니, 환각이 줄고 최신 정보가 반영된다.</text>
  <text x="429" y="330" fill="#fbbf24" font-size="14" text-anchor="middle" font-weight="600">기술은 대단한데, 남이 못 따라 할 부분이 적다. 그래서 이걸 만든다고 다 돈 버는 게 아니다.</text>
</svg>

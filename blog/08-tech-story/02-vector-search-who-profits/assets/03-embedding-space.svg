<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="880" height="460" fill="#0a0e1a"/>
  <text x="40" y="46" fill="#f1f5f9" font-size="26" font-weight="700">임베딩: 의미를 좌표로 바꾼다</text>
  <text x="40" y="74" fill="#64748b" font-size="15">비슷한 뜻은 가까이, 다른 뜻은 멀리. 의미가 공간의 거리와 방향이 된다</text>

  <!-- axes hint -->
  <line x1="60" y1="410" x2="60" y2="110" stroke="#1e293b" stroke-width="1"/>
  <line x1="60" y1="410" x2="440" y2="410" stroke="#1e293b" stroke-width="1"/>

  <!-- cluster: 동물 (가까이) -->
  <circle cx="150" cy="180" r="7" fill="#38bdf8"/><text x="162" y="184" fill="#e2e8f0" font-size="14">강아지</text>
  <circle cx="205" cy="215" r="7" fill="#38bdf8"/><text x="217" y="219" fill="#e2e8f0" font-size="14">고양이</text>
  <circle cx="150" cy="250" r="7" fill="#38bdf8"/><text x="162" y="254" fill="#e2e8f0" font-size="14">토끼</text>
  <text x="120" y="150" fill="#38bdf8" font-size="12" font-weight="600">동물끼리는 가깝다</text>

  <!-- 자동차 (멀리) -->
  <circle cx="390" cy="370" r="7" fill="#f59e0b"/><text x="330" y="374" fill="#e2e8f0" font-size="14" text-anchor="end">자동차</text>
  <text x="300" y="345" fill="#f59e0b" font-size="12">뜻이 다르면 멀다</text>

  <!-- vector arithmetic panel -->
  <rect x="500" y="120" width="340" height="290" rx="12" fill="#0d1424" stroke="#1e293b" stroke-width="1.5"/>
  <text x="520" y="156" fill="#cbd5e1" font-size="15" font-weight="700">좌표끼리 계산도 된다</text>

  <g font-size="16" font-weight="700">
    <text x="520" y="210" fill="#e2e8f0">왕</text>
    <text x="565" y="210" fill="#ef4444">-</text>
    <text x="590" y="210" fill="#94a3b8">남자</text>
    <text x="655" y="210" fill="#22c55e">+</text>
    <text x="680" y="210" fill="#94a3b8">여자</text>
  </g>
  <line x1="520" y1="235" x2="800" y2="235" stroke="#334155" stroke-width="1"/>
  <text x="520" y="275" fill="#fbbf24" font-size="20" font-weight="700">≈ 여왕</text>

  <text x="520" y="330" fill="#64748b" font-size="13">단어의 의미가 방향과 거리로</text>
  <text x="520" y="352" fill="#64748b" font-size="13">표현되기 때문에, 글자가 안 겹쳐도</text>
  <text x="520" y="374" fill="#64748b" font-size="13">'뜻이 비슷한 것'을 찾을 수 있다.</text>
  <text x="520" y="396" fill="#38bdf8" font-size="13" font-weight="600">이것이 시맨틱(의미) 검색이다.</text>
</svg>

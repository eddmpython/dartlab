<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">상용화 병목 스택</title>
  <desc id="desc">하이퍼튜브 상용화는 진공, 초전도, 전력 제어, 토목, 안전 인증이 모두 통과해야 하는 병목 스택이다.</desc>
  <rect width="1200" height="675" fill="#0a0e1a"/>
  <text x="70" y="70" fill="#f8fafc" font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="34" font-weight="800">왜 상용화가 느린가: 병목은 한 개가 아니다</text>
  <text x="70" y="108" fill="#94a3b8" font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="17">시속 1,200km 자체보다, 수십 km 노선에서 같은 조건을 유지하는 운영 시스템이 더 어렵다.</text>
  <g font-family="Malgun Gothic, Segoe UI, sans-serif">
    <rect x="105" y="170" width="990" height="70" rx="18" fill="#111827" stroke="#334155"/>
    <rect x="105" y="170" width="820" height="70" rx="18" fill="#1d2a44"/>
    <text x="135" y="214" fill="#f8fafc" font-size="22" font-weight="800">1. 아진공 유지</text>
    <text x="880" y="214" text-anchor="end" fill="#fbbf24" font-size="19">튜브 전체가 압력 설비</text>
    <rect x="105" y="260" width="990" height="70" rx="18" fill="#111827" stroke="#334155"/>
    <rect x="105" y="260" width="720" height="70" rx="18" fill="#1d2a44"/>
    <text x="135" y="304" fill="#f8fafc" font-size="22" font-weight="800">2. 초전도와 냉각</text>
    <text x="790" y="304" text-anchor="end" fill="#fbbf24" font-size="19">30K급 자장 안정성</text>
    <rect x="105" y="350" width="990" height="70" rx="18" fill="#111827" stroke="#334155"/>
    <rect x="105" y="350" width="760" height="70" rx="18" fill="#1d2a44"/>
    <text x="135" y="394" fill="#f8fafc" font-size="22" font-weight="800">3. 선형추진 전력 제어</text>
    <text x="830" y="394" text-anchor="end" fill="#fbbf24" font-size="19">위치 감지와 극성 전환</text>
    <rect x="105" y="440" width="990" height="70" rx="18" fill="#111827" stroke="#334155"/>
    <rect x="105" y="440" width="900" height="70" rx="18" fill="#1d2a44"/>
    <text x="135" y="484" fill="#f8fafc" font-size="22" font-weight="800">4. 튜브 토목과 유지보수</text>
    <text x="970" y="484" text-anchor="end" fill="#fbbf24" font-size="19">교각, 플랜지, 펌프, 대피</text>
    <rect x="105" y="530" width="990" height="70" rx="18" fill="#111827" stroke="#334155"/>
    <rect x="105" y="530" width="640" height="70" rx="18" fill="#1d2a44"/>
    <text x="135" y="574" fill="#f8fafc" font-size="22" font-weight="800">5. 안전 인증과 운영</text>
    <text x="710" y="574" text-anchor="end" fill="#fbbf24" font-size="19">대피, 구조, 고장 모드</text>
  </g>
  <text x="1000" y="164" fill="#94a3b8" font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="14">상대 난도 개념도</text>
  <text x="600" y="642" text-anchor="middle" fill="#fbbf24" font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" font-weight="800">가장 느린 병목 하나가 전체 노선 속도와 발주 가능성을 잠근다.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">DART와 EDGAR 재무 착지</title>
  <desc id="desc">하이퍼튜브 관련 기술 칸에 놓인 회사들의 2025 DART와 최신 EDGAR 영업이익률은 기존 사업 손익을 보여준다.</desc>
  <rect width="1200" height="675" fill="#0a0e1a"/>
  <text x="70" y="68" fill="#f8fafc" font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="34" font-weight="800">재무 착지: 기대보다 기존 사업이 훨씬 크다</text>
  <text x="70" y="105" fill="#94a3b8" font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="17">DART는 2025Q1~Q4 합산, EDGAR는 회사별 최신 4개 fiscal quarter. 하이퍼튜브 매출이 아니다.</text>
  <g font-family="Malgun Gothic, Segoe UI, sans-serif">
    <line x1="250" y1="555" x2="1110" y2="555" stroke="#334155"/>
    <line x1="250" y1="460" x2="1110" y2="460" stroke="#172033"/>
    <line x1="250" y1="365" x2="1110" y2="365" stroke="#172033"/>
    <line x1="250" y1="270" x2="1110" y2="270" stroke="#172033"/>
    <text x="210" y="560" fill="#94a3b8" font-size="14">0%</text>
    <text x="200" y="465" fill="#94a3b8" font-size="14">10%</text>
    <text x="200" y="370" fill="#94a3b8" font-size="14">20%</text>
    <text x="200" y="275" fill="#94a3b8" font-size="14">30%</text>
    <g fill="#38bdf8">
      <rect x="270" y="392" width="62" height="163" rx="8"/>
      <rect x="360" y="320" width="62" height="235" rx="8"/>
      <rect x="450" y="438" width="62" height="117" rx="8"/>
      <rect x="540" y="436" width="62" height="119" rx="8"/>
      <rect x="630" y="308" width="62" height="247" rx="8"/>
    </g>
    <g fill="#f59e0b">
      <rect x="760" y="519" width="62" height="36" rx="8"/>
      <rect x="850" y="403" width="62" height="152" rx="8"/>
      <rect x="940" y="495" width="62" height="60" rx="8"/>
      <rect x="1030" y="501" width="62" height="54" rx="8"/>
    </g>
    <rect x="675" y="555" width="62" height="108" rx="8" fill="#ef4444"/>
    <text x="301" y="378" text-anchor="middle" fill="#f8fafc" font-size="14">17.2</text>
    <text x="391" y="306" text-anchor="middle" fill="#f8fafc" font-size="14">24.4</text>
    <text x="481" y="424" text-anchor="middle" fill="#f8fafc" font-size="14">12.5</text>
    <text x="571" y="422" text-anchor="middle" fill="#f8fafc" font-size="14">12.5</text>
    <text x="661" y="294" text-anchor="middle" fill="#f8fafc" font-size="14">26.0</text>
    <text x="706" y="640" text-anchor="middle" fill="#fecaca" font-size="14">-113.9</text>
    <text x="791" y="505" text-anchor="middle" fill="#f8fafc" font-size="14">3.8</text>
    <text x="881" y="389" text-anchor="middle" fill="#f8fafc" font-size="14">16.0</text>
    <text x="971" y="481" text-anchor="middle" fill="#f8fafc" font-size="14">6.3</text>
    <text x="1061" y="487" text-anchor="middle" fill="#f8fafc" font-size="14">5.7</text>
    <text x="301" y="590" text-anchor="middle" fill="#cbd5e1" font-size="13">현대로템</text>
    <text x="391" y="590" text-anchor="middle" fill="#cbd5e1" font-size="13">HD현대</text>
    <text x="481" y="590" text-anchor="middle" fill="#cbd5e1" font-size="13">효성중공업</text>
    <text x="571" y="590" text-anchor="middle" fill="#cbd5e1" font-size="13">전력 3사</text>
    <text x="661" y="590" text-anchor="middle" fill="#cbd5e1" font-size="13">선별 고마진</text>
    <text x="706" y="610" text-anchor="middle" fill="#fecaca" font-size="13">서남</text>
    <text x="791" y="590" text-anchor="middle" fill="#cbd5e1" font-size="13">AMSC</text>
    <text x="881" y="590" text-anchor="middle" fill="#cbd5e1" font-size="13">Wabtec</text>
    <text x="971" y="590" text-anchor="middle" fill="#cbd5e1" font-size="13">AECOM</text>
    <text x="1061" y="590" text-anchor="middle" fill="#cbd5e1" font-size="13">PWR</text>
    <rect x="70" y="168" width="290" height="82" rx="14" fill="#111827" stroke="#334155"/>
    <text x="92" y="200" fill="#38bdf8" font-size="17" font-weight="800">DART</text>
    <text x="92" y="228" fill="#cbd5e1" font-size="14">한국사는 2025Q1~Q4 calendar 합산</text>
    <rect x="70" y="270" width="290" height="82" rx="14" fill="#111827" stroke="#334155"/>
    <text x="92" y="302" fill="#f59e0b" font-size="17" font-weight="800">EDGAR</text>
    <text x="92" y="330" fill="#cbd5e1" font-size="14">미국사는 issuer별 fiscal label 유지</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">기술 성숙도와 다음 지표</title>
  <desc id="desc">하이퍼튜브는 축소 실험, 핵심기술 연구, 테스트베드, 인증, 상용 노선 사이에 큰 간격이 있다.</desc>
  <rect width="1200" height="675" fill="#0a0e1a"/>
  <text x="70" y="70" fill="#f8fafc" font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="34" font-weight="800">기술 성숙도: 개발 착수와 상용화는 다르다</text>
  <text x="70" y="108" fill="#94a3b8" font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="17">다음 보도는 속도보다 어느 단계가 통과됐는지부터 읽어야 한다.</text>
  <g font-family="Malgun Gothic, Segoe UI, sans-serif">
    <line x1="150" y1="350" x2="1050" y2="350" stroke="#334155" stroke-width="6"/>
    <g>
      <circle cx="170" cy="350" r="28" fill="#1d2a44" stroke="#38bdf8" stroke-width="4"/>
      <text x="170" y="358" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="800">1</text>
      <text x="170" y="420" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="800">축소 실험</text>
      <text x="170" y="448" text-anchor="middle" fill="#94a3b8" font-size="14">KRRI 1,019km/h</text>
      <text x="170" y="472" text-anchor="middle" fill="#94a3b8" font-size="14">1/1000기압</text>
    </g>
    <g>
      <circle cx="390" cy="350" r="28" fill="#1d2a44" stroke="#38bdf8" stroke-width="4"/>
      <text x="390" y="358" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="800">2</text>
      <text x="390" y="420" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="800">핵심기술 연구</text>
      <text x="390" y="448" text-anchor="middle" fill="#94a3b8" font-size="14">2025~2027</text>
      <text x="390" y="472" text-anchor="middle" fill="#94a3b8" font-size="14">127억원</text>
    </g>
    <g>
      <circle cx="610" cy="350" r="28" fill="#172033" stroke="#fbbf24" stroke-width="4"/>
      <text x="610" y="358" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="800">3</text>
      <text x="610" y="420" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="800">통합 테스트베드</text>
      <text x="610" y="448" text-anchor="middle" fill="#94a3b8" font-size="14">튜브와 차량</text>
      <text x="610" y="472" text-anchor="middle" fill="#94a3b8" font-size="14">장시간 운전 검증</text>
    </g>
    <g>
      <circle cx="830" cy="350" r="28" fill="#111827" stroke="#64748b" stroke-width="4"/>
      <text x="830" y="358" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="800">4</text>
      <text x="830" y="420" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="800">안전 인증</text>
      <text x="830" y="448" text-anchor="middle" fill="#94a3b8" font-size="14">대피, 구조,</text>
      <text x="830" y="472" text-anchor="middle" fill="#94a3b8" font-size="14">고장 모드</text>
    </g>
    <g>
      <circle cx="1050" cy="350" r="28" fill="#111827" stroke="#64748b" stroke-width="4"/>
      <text x="1050" y="358" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="800">5</text>
      <text x="1050" y="420" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="800">상용 노선</text>
      <text x="1050" y="448" text-anchor="middle" fill="#94a3b8" font-size="14">발주, 운영,</text>
      <text x="1050" y="472" text-anchor="middle" fill="#94a3b8" font-size="14">유지보수</text>
    </g>
    <rect x="130" y="170" width="940" height="70" rx="16" fill="#111827" stroke="#334155"/>
    <text x="160" y="213" fill="#fbbf24" font-size="21" font-weight="800">현재 판단</text>
    <text x="280" y="213" fill="#cbd5e1" font-size="18">하이퍼튜브는 유망한 연구 주제지만, 상장사 매출로 확인되는 상용 시장은 아직 아니다.</text>
    <rect x="270" y="555" width="660" height="50" rx="25" fill="#172033"/>
    <text x="600" y="587" text-anchor="middle" fill="#f8fafc" font-size="18" font-weight="800">다음 지표: 전용 선로 실증, 초전도 냉각 시간, 전력 제어, 안전 인증, 실제 발주</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">아진공 튜브와 자기부상 원리</title>
  <desc id="desc">하이퍼튜브는 낮은 압력의 튜브, 부상 간격, 가이드웨이 코일, 선형추진 제어가 동시에 맞아야 한다.</desc>
  <rect width="1200" height="675" fill="#0a0e1a"/>
  <text x="72" y="74" fill="#f8fafc" font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="34" font-weight="800">하이퍼튜브 원리: 속도보다 먼저 맞춰야 하는 4가지</text>
  <text x="72" y="112" fill="#94a3b8" font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="17">0.001~0.01기압 튜브 안에서 공기저항을 줄이고, 바퀴 대신 전자기력으로 띄우고 민다.</text>
  <rect x="80" y="210" width="1040" height="250" rx="125" fill="#111827" stroke="#64748b" stroke-width="7"/>
  <rect x="110" y="240" width="980" height="190" rx="95" fill="#172033" stroke="#334155" stroke-width="2"/>
  <ellipse cx="600" cy="335" rx="210" ry="66" fill="#1f2937" stroke="#fbbf24" stroke-width="4"/>
  <path d="M430 335 C470 265 730 265 770 335 C735 393 465 393 430 335Z" fill="#dbeafe"/>
  <path d="M486 326 C530 302 670 302 714 326 C685 344 515 344 486 326Z" fill="#0f172a"/>
  <rect x="310" y="466" width="580" height="34" rx="17" fill="#334155"/>
  <g fill="#fbbf24">
    <rect x="330" y="473" width="42" height="20" rx="6"/>
    <rect x="410" y="473" width="42" height="20" rx="6"/>
    <rect x="490" y="473" width="42" height="20" rx="6"/>
    <rect x="570" y="473" width="42" height="20" rx="6"/>
    <rect x="650" y="473" width="42" height="20" rx="6"/>
    <rect x="730" y="473" width="42" height="20" rx="6"/>
    <rect x="810" y="473" width="42" height="20" rx="6"/>
  </g>
  <line x1="220" y1="215" x2="220" y2="155" stroke="#38bdf8" stroke-width="3"/>
  <line x1="600" y1="270" x2="600" y2="155" stroke="#38bdf8" stroke-width="3"/>
  <line x1="825" y1="335" x2="1010" y2="245" stroke="#38bdf8" stroke-width="3"/>
  <line x1="680" y1="485" x2="1010" y2="555" stroke="#38bdf8" stroke-width="3"/>
  <g font-family="Malgun Gothic, Segoe UI, sans-serif">
    <rect x="86" y="132" width="275" height="70" rx="12" fill="#111827" stroke="#38bdf8"/>
    <text x="104" y="160" fill="#f8fafc" font-size="19" font-weight="800">아진공 튜브</text>
    <text x="104" y="187" fill="#cbd5e1" font-size="15">공기저항을 줄이는 압력 인프라</text>
    <rect x="470" y="132" width="280" height="70" rx="12" fill="#111827" stroke="#38bdf8"/>
    <text x="488" y="160" fill="#f8fafc" font-size="19" font-weight="800">캡슐과 객실 기밀</text>
    <text x="488" y="187" fill="#cbd5e1" font-size="15">낮은 외부 압력과 승객 안전 분리</text>
    <rect x="892" y="210" width="240" height="72" rx="12" fill="#111827" stroke="#38bdf8"/>
    <text x="910" y="238" fill="#f8fafc" font-size="19" font-weight="800">초전도 부상</text>
    <text x="910" y="265" fill="#cbd5e1" font-size="15">냉각과 자장 안정성이 핵심</text>
    <rect x="890" y="530" width="245" height="72" rx="12" fill="#111827" stroke="#38bdf8"/>
    <text x="908" y="558" fill="#f8fafc" font-size="19" font-weight="800">선형추진 제어</text>
    <text x="908" y="585" fill="#cbd5e1" font-size="15">위치 감지와 극성 전환</text>
  </g>
  <text x="600" y="632" text-anchor="middle" fill="#fbbf24" font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="20" font-weight="800">캡슐만 빠르면 안 된다. 튜브, 부상, 추진, 제어가 한 몸이어야 한다.</text>
</svg>

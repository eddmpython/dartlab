<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="880" height="480" fill="#0a0e1a"/>
  <text x="40" y="46" fill="#f1f5f9" font-size="25" font-weight="700">비에이치아이: 적자에서 두 자릿수로</text>
  <text x="40" y="74" fill="#64748b" font-size="15">영업이익률(%) 추이. 같은 기간 매출은 2,349억에서 7,741억으로 3배. 2021~2025 연간 실측</text>

  <!-- zero line -->
  <line x1="70" y1="290" x2="820" y2="290" stroke="#475569" stroke-width="1.5"/>
  <text x="60" y="295" fill="#64748b" font-size="12" text-anchor="end">0%</text>

  <!-- bars: -13.0 2.5 4.1 5.4 9.8, 1%=12px from zero y=290 -->
  <rect x="110" y="290" width="80" height="156" fill="#ef4444"/>
  <rect x="260" y="260" width="80" height="30" fill="#38bdf8"/>
  <rect x="410" y="241" width="80" height="49" fill="#38bdf8"/>
  <rect x="560" y="225" width="80" height="65" fill="#38bdf8"/>
  <rect x="710" y="172" width="80" height="118" fill="#22c55e"/>

  <text x="150" y="464" fill="#ef4444" font-size="15" text-anchor="middle" font-weight="700">-13.0%</text>
  <text x="300" y="250" fill="#38bdf8" font-size="14" text-anchor="middle">2.5%</text>
  <text x="450" y="231" fill="#38bdf8" font-size="14" text-anchor="middle">4.1%</text>
  <text x="600" y="215" fill="#38bdf8" font-size="14" text-anchor="middle">5.4%</text>
  <text x="750" y="160" fill="#22c55e" font-size="16" text-anchor="middle" font-weight="700">9.8%</text>

  <text x="150" y="314" fill="#94a3b8" font-size="13" text-anchor="middle">2021</text>
  <text x="300" y="314" fill="#94a3b8" font-size="13" text-anchor="middle">2022</text>
  <text x="450" y="314" fill="#94a3b8" font-size="13" text-anchor="middle">2023</text>
  <text x="600" y="314" fill="#94a3b8" font-size="13" text-anchor="middle">2024</text>
  <text x="750" y="314" fill="#94a3b8" font-size="13" text-anchor="middle">2025</text>

  <text x="440" y="120" fill="#22c55e" font-size="14" text-anchor="middle" font-weight="600">매출 3배 + 적자 탈출</text>
  <text x="440" y="140" fill="#64748b" font-size="12" text-anchor="middle">AI 전력난과 발전 설비 교체 수요를 탄 반전</text>
</svg>

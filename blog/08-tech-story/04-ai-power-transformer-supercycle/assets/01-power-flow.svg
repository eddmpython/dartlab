<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="880" height="340" fill="#0a0e1a"/>
  <text x="40" y="46" fill="#f1f5f9" font-size="24" font-weight="700">전기가 발전소에서 데이터센터까지</text>
  <text x="40" y="74" fill="#64748b" font-size="15">변압기는 길목마다 전압을 올렸다 내린다. 초고압 변압기가 가장 큰 병목이다</text>

  <!-- nodes -->
  <g text-anchor="middle">
    <rect x="40" y="150" width="120" height="70" rx="10" fill="#111827" stroke="#334155"/>
    <text x="100" y="185" fill="#e2e8f0" font-size="14">발전소</text>
    <text x="100" y="205" fill="#94a3b8" font-size="12">2만 볼트</text>

    <rect x="230" y="150" width="130" height="70" rx="10" fill="#1e293b" stroke="#fbbf24" stroke-width="2"/>
    <text x="295" y="180" fill="#fbbf24" font-size="13" font-weight="700">승압 변압기</text>
    <text x="295" y="205" fill="#e2e8f0" font-size="12">76만 볼트로</text>

    <rect x="430" y="150" width="120" height="70" rx="10" fill="#111827" stroke="#334155"/>
    <text x="490" y="185" fill="#e2e8f0" font-size="14">송전</text>
    <text x="490" y="205" fill="#94a3b8" font-size="12">먼 거리</text>

    <rect x="620" y="150" width="130" height="70" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="685" y="180" fill="#38bdf8" font-size="13" font-weight="700">강압 변압기</text>
    <text x="685" y="205" fill="#e2e8f0" font-size="12">단계적으로</text>

    <rect x="770" y="150" width="90" height="70" rx="10" fill="#111827" stroke="#22c55e" stroke-width="2"/>
    <text x="815" y="180" fill="#22c55e" font-size="12" font-weight="700">데이터</text>
    <text x="815" y="200" fill="#22c55e" font-size="12" font-weight="700">센터</text>
  </g>

  <!-- arrows -->
  <g fill="#475569" font-size="22">
    <text x="195" y="192">→</text>
    <text x="395" y="192">→</text>
    <text x="585" y="192">→</text>
    <text x="757" y="192">→</text>
  </g>

  <text x="295" y="118" fill="#fbbf24" font-size="13" text-anchor="middle" font-weight="600">아무나 못 만드는 자리</text>
  <text x="440" y="290" fill="#64748b" font-size="13" text-anchor="middle">전기 한 줄기가 GPU에 닿기까지 변압기는 최소 서너 번 전압을 바꾼다</text>
</svg>

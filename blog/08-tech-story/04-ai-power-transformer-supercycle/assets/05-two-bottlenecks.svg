<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="-apple-system, 'Segoe UI', sans-serif">
  <rect width="880" height="340" fill="#0a0e1a"/>
  <text x="40" y="46" fill="#f1f5f9" font-size="25" font-weight="700">AI 전력의 두 병목: 만들기와 나르기</text>
  <text x="40" y="74" fill="#64748b" font-size="15">전기를 만드는 병목과 실어나르는 병목. 이익은 둘 다 남이 못 만드는 자리에 앉는다</text>

  <g text-anchor="middle">
    <!-- 만들기 -->
    <rect x="60" y="150" width="200" height="90" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
    <text x="160" y="185" fill="#38bdf8" font-size="15" font-weight="700">만들기</text>
    <text x="160" y="210" fill="#e2e8f0" font-size="13">원자로 · SMR (3편)</text>
    <text x="160" y="228" fill="#64748b" font-size="11">전기를 생산</text>

    <text x="300" y="200" fill="#fbbf24" font-size="26">→</text>

    <!-- 나르기 -->
    <rect x="340" y="150" width="200" height="90" rx="12" fill="#111827" stroke="#fbbf24" stroke-width="2"/>
    <text x="440" y="185" fill="#fbbf24" font-size="15" font-weight="700">나르기</text>
    <text x="440" y="210" fill="#e2e8f0" font-size="13">변압기 (4편)</text>
    <text x="440" y="228" fill="#64748b" font-size="11">전기를 실어나름</text>

    <text x="580" y="200" fill="#22c55e" font-size="26">→</text>

    <!-- 데이터센터 -->
    <rect x="620" y="150" width="200" height="90" rx="12" fill="#111827" stroke="#22c55e" stroke-width="2"/>
    <text x="720" y="185" fill="#22c55e" font-size="15" font-weight="700">AI 데이터센터</text>
    <text x="720" y="210" fill="#e2e8f0" font-size="13">전기를 삼킴</text>
    <text x="720" y="228" fill="#64748b" font-size="11">GPU가 소비</text>
  </g>

  <text x="440" y="298" fill="#fbbf24" font-size="14" text-anchor="middle" font-weight="600">두 병목 모두, 이익은 가장 큰 설비가 아니라 가장 바꾸기 어려운 자리에 앉았다</text>
</svg>

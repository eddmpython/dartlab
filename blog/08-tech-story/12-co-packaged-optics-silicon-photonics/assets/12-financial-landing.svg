<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">CPO 거래망의 재무 착지</title>
  <desc id="desc">ASIC, 시스템, 광부품, 조립, 한국 보조축의 전사 마진 차이를 보여주는 도식</desc>
  <rect width="1200" height="720" fill="#0f172a"/>
  <text x="60" y="70" fill="#f8fafc" font-size="34" font-family="Arial, sans-serif" font-weight="700">CPO가 좋아져도 손익은 같은 모양으로 남지 않는다</text>
  <text x="60" y="112" fill="#cbd5e1" font-size="18" font-family="Arial, sans-serif">아래 값은 CPO 전용이 아니라 DART와 EDGAR 전사 숫자를 공정 위치별로 읽은 참고값이다.</text>

  <line x1="120" y1="600" x2="1080" y2="600" stroke="#475569" stroke-width="2"/>
  <line x1="120" y1="170" x2="120" y2="600" stroke="#475569" stroke-width="2"/>
  <text x="80" y="175" fill="#94a3b8" font-size="14" font-family="Arial, sans-serif">영업이익률</text>
  <text x="82" y="315" fill="#94a3b8" font-size="14" font-family="Arial, sans-serif">20%</text>
  <text x="88" y="462" fill="#94a3b8" font-size="14" font-family="Arial, sans-serif">0%</text>
  <text x="72" y="590" fill="#94a3b8" font-size="14" font-family="Arial, sans-serif">손실</text>

  <g font-family="Arial, sans-serif" font-size="16">
    <rect x="165" y="170" width="75" height="430" rx="8" fill="#38bdf8"/>
    <text x="157" y="628" fill="#e0f2fe">AVGO</text>
    <text x="163" y="154" fill="#e0f2fe">39.9%</text>

    <rect x="270" y="135" width="75" height="465" rx="8" fill="#22c55e"/>
    <text x="263" y="628" fill="#dcfce7">ANET</text>
    <text x="268" y="119" fill="#dcfce7">42.8%</text>

    <rect x="375" y="330" width="75" height="270" rx="8" fill="#a78bfa"/>
    <text x="371" y="628" fill="#ede9fe">CSCO</text>
    <text x="374" y="314" fill="#ede9fe">20.8%</text>

    <rect x="480" y="380" width="75" height="220" rx="8" fill="#818cf8"/>
    <text x="478" y="628" fill="#e0e7ff">MRVL</text>
    <text x="482" y="364" fill="#e0e7ff">16.1%</text>

    <rect x="585" y="455" width="75" height="145" rx="8" fill="#fbbf24"/>
    <text x="594" y="628" fill="#fef3c7">GLW</text>
    <text x="591" y="439" fill="#fef3c7">14.6%</text>

    <rect x="690" y="508" width="75" height="92" rx="8" fill="#fb923c"/>
    <text x="705" y="628" fill="#ffedd5">FN</text>
    <text x="697" y="492" fill="#ffedd5">9.5%</text>

    <rect x="795" y="590" width="75" height="10" rx="5" fill="#f97316"/>
    <text x="795" y="628" fill="#fed7aa">COHR</text>
    <text x="799" y="574" fill="#fed7aa">순 0.8%</text>

    <rect x="900" y="600" width="75" height="85" rx="8" fill="#ef4444"/>
    <text x="905" y="628" fill="#fee2e2">LITE</text>
    <text x="904" y="700" fill="#fee2e2">-10.9%</text>

    <rect x="1005" y="600" width="75" height="155" rx="8" fill="#dc2626"/>
    <text x="1004" y="628" fill="#fee2e2">OE</text>
    <text x="1002" y="700" fill="#fee2e2">-27.9%</text>
  </g>

  <rect x="145" y="90" width="205" height="34" rx="17" fill="#075985"/>
  <text x="168" y="113" fill="#e0f2fe" font-size="15" font-family="Arial, sans-serif">ASIC과 시스템 고마진</text>
  <rect x="555" y="90" width="235" height="34" rx="17" fill="#78350f"/>
  <text x="581" y="113" fill="#fef3c7" font-size="15" font-family="Arial, sans-serif">광부품과 조립은 다른 구조</text>
  <rect x="880" y="90" width="240" height="34" rx="17" fill="#7f1d1d"/>
  <text x="908" y="113" fill="#fee2e2" font-size="15" font-family="Arial, sans-serif">전환 비용과 손실 가능성</text>
</svg>

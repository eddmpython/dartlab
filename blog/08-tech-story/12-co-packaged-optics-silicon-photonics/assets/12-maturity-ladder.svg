<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">광 I/O 기술 성숙도 사다리</title>
  <desc id="desc">pluggable optics부터 optical I/O까지 성숙도와 검증 난도가 다름을 보여주는 도식</desc>
  <rect width="1200" height="680" fill="#101820"/>
  <text x="60" y="70" fill="#f8fafc" font-size="34" font-family="Arial, sans-serif" font-weight="700">pluggable, LPO, NPO, CPO, optical I/O는 같은 단계가 아니다</text>
  <text x="60" y="112" fill="#cbd5e1" font-size="18" font-family="Arial, sans-serif">성숙도가 다르면 고객 검증, 교체성, 수율 부담, 손익 반영 시점도 달라진다.</text>

  <g font-family="Arial, sans-serif">
    <rect x="90" y="495" width="190" height="70" rx="14" fill="#1d4ed8"/>
    <text x="122" y="523" fill="#eff6ff" font-size="20" font-weight="700">Pluggable</text>
    <text x="118" y="550" fill="#bfdbfe" font-size="15">성숙, 교체 쉬움</text>

    <rect x="300" y="420" width="190" height="70" rx="14" fill="#0f766e"/>
    <text x="365" y="448" fill="#ecfeff" font-size="20" font-weight="700">LPO</text>
    <text x="333" y="475" fill="#99f6e4" font-size="15">전력 절감 시도</text>

    <rect x="510" y="345" width="190" height="70" rx="14" fill="#7c3aed"/>
    <text x="562" y="373" fill="#f5f3ff" font-size="20" font-weight="700">NPO</text>
    <text x="536" y="400" fill="#ddd6fe" font-size="15">패키지 근처 이동</text>

    <rect x="720" y="270" width="190" height="70" rx="14" fill="#c2410c"/>
    <text x="775" y="298" fill="#fff7ed" font-size="20" font-weight="700">CPO</text>
    <text x="745" y="325" fill="#fed7aa" font-size="15">ASIC 옆 광엔진</text>

    <rect x="930" y="195" width="190" height="70" rx="14" fill="#be123c"/>
    <text x="962" y="223" fill="#fff1f2" font-size="20" font-weight="700">Optical I/O</text>
    <text x="956" y="250" fill="#fecdd3" font-size="15">더 깊은 칩 통합</text>
  </g>

  <path d="M185 485 L395 410 L605 335 L815 260 L1025 185" stroke="#94a3b8" stroke-width="4" fill="none" stroke-dasharray="10 8"/>
  <text x="100" y="625" fill="#cbd5e1" font-size="18" font-family="Arial, sans-serif">왼쪽으로 갈수록 교체성과 표준화가 쉽고, 오른쪽으로 갈수록 전기 경로는 줄지만 검증 난도가 오른다.</text>
  <text x="850" y="145" fill="#fecdd3" font-size="17" font-family="Arial, sans-serif">미래형 통합</text>
  <text x="95" y="455" fill="#bfdbfe" font-size="17" font-family="Arial, sans-serif">상용 기반</text>
</svg>

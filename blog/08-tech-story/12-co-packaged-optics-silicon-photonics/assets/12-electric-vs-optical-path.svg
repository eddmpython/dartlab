<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">전기 경로와 광 경로 비교</title>
  <desc id="desc">플러그형 광모듈과 CPO의 전기 경로 길이 차이를 설명하는 도식</desc>
  <rect width="1200" height="680" fill="#0f172a"/>
  <text x="60" y="70" fill="#f8fafc" font-size="34" font-family="Arial, sans-serif" font-weight="700">전기 구간이 길수록 보정, 전력, 열이 늘어난다</text>
  <text x="60" y="112" fill="#cbd5e1" font-size="18" font-family="Arial, sans-serif">CPO는 광 변환 위치를 스위치 ASIC 옆으로 당겨 전기 신호가 지나가는 거리를 줄인다.</text>

  <rect x="70" y="175" width="1060" height="170" rx="20" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text x="100" y="215" fill="#f8fafc" font-size="24" font-family="Arial, sans-serif" font-weight="700">기존 pluggable optics</text>
  <rect x="110" y="250" width="180" height="62" rx="12" fill="#1d4ed8"/>
  <text x="143" y="289" fill="#ffffff" font-size="20" font-family="Arial, sans-serif" font-weight="700">Switch ASIC</text>
  <path d="M305 281 C445 281 540 281 680 281" stroke="#f59e0b" stroke-width="13" fill="none" stroke-linecap="round"/>
  <text x="420" y="260" fill="#fbbf24" font-size="18" font-family="Arial, sans-serif">긴 전기 경로</text>
  <rect x="700" y="248" width="180" height="66" rx="12" fill="#7c3aed"/>
  <text x="732" y="288" fill="#ffffff" font-size="20" font-family="Arial, sans-serif" font-weight="700">광모듈</text>
  <path d="M895 281 C960 265 1018 300 1090 278" stroke="#22d3ee" stroke-width="9" fill="none" stroke-linecap="round"/>
  <text x="910" y="242" fill="#67e8f9" font-size="18" font-family="Arial, sans-serif">광섬유</text>

  <rect x="70" y="390" width="1060" height="190" rx="20" fill="#101820" stroke="#0f766e" stroke-width="2"/>
  <text x="100" y="430" fill="#f8fafc" font-size="24" font-family="Arial, sans-serif" font-weight="700">CPO 구조</text>
  <rect x="110" y="468" width="190" height="68" rx="14" fill="#1d4ed8"/>
  <text x="143" y="509" fill="#ffffff" font-size="20" font-family="Arial, sans-serif" font-weight="700">Switch ASIC</text>
  <rect x="330" y="468" width="170" height="68" rx="14" fill="#7c3aed"/>
  <text x="365" y="508" fill="#ffffff" font-size="20" font-family="Arial, sans-serif" font-weight="700">광엔진</text>
  <path d="M305 502 C315 502 320 502 330 502" stroke="#f59e0b" stroke-width="13" fill="none" stroke-linecap="round"/>
  <text x="270" y="555" fill="#fbbf24" font-size="18" font-family="Arial, sans-serif">짧은 전기 경로</text>
  <path d="M520 502 C660 465 820 535 1080 492" stroke="#22d3ee" stroke-width="11" fill="none" stroke-linecap="round"/>
  <text x="650" y="555" fill="#67e8f9" font-size="18" font-family="Arial, sans-serif">더 이른 광 변환</text>

  <circle cx="1045" cy="96" r="38" fill="#164e63"/>
  <text x="1018" y="104" fill="#e0f2fe" font-size="22" font-family="Arial, sans-serif" font-weight="700">70%</text>
  <text x="970" y="145" fill="#bae6fd" font-size="15" font-family="Arial, sans-serif">Broadcom 발표 기준 전력 절감</text>
</svg>

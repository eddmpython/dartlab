<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">플러그형 광모듈과 CPO 비교</title>
  <desc id="desc">교체성, 전기 경로, 열과 수율 부담을 비교하는 도식</desc>
  <rect width="1200" height="680" fill="#0b1120"/>
  <text x="60" y="70" fill="#f8fafc" font-size="34" font-family="Arial, sans-serif" font-weight="700">CPO는 속도만의 업그레이드가 아니라 위치 변화다</text>
  <text x="60" y="112" fill="#cbd5e1" font-size="18" font-family="Arial, sans-serif">앞면에서 갈아 끼우는 모듈과 ASIC 옆으로 들어오는 광엔진은 장점과 부담이 다르다.</text>

  <rect x="70" y="165" width="500" height="420" rx="18" fill="#111827" stroke="#475569" stroke-width="2"/>
  <text x="105" y="215" fill="#f8fafc" font-size="28" font-family="Arial, sans-serif" font-weight="700">Pluggable optics</text>
  <rect x="115" y="270" width="135" height="72" rx="12" fill="#2563eb"/>
  <text x="143" y="313" fill="#fff" font-size="18" font-family="Arial, sans-serif" font-weight="700">ASIC</text>
  <path d="M260 306 H395" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
  <rect x="405" y="262" width="115" height="88" rx="10" fill="#9333ea"/>
  <text x="426" y="313" fill="#fff" font-size="18" font-family="Arial, sans-serif" font-weight="700">Module</text>
  <text x="120" y="410" fill="#e2e8f0" font-size="20" font-family="Arial, sans-serif">장점</text>
  <text x="120" y="445" fill="#94a3b8" font-size="17" font-family="Arial, sans-serif">교체 쉽고 벤더 선택 폭이 넓다</text>
  <text x="120" y="482" fill="#e2e8f0" font-size="20" font-family="Arial, sans-serif">부담</text>
  <text x="120" y="517" fill="#94a3b8" font-size="17" font-family="Arial, sans-serif">ASIC에서 앞면 모듈까지 전기 경로가 남는다</text>

  <rect x="630" y="165" width="500" height="420" rx="18" fill="#0f1f1f" stroke="#14b8a6" stroke-width="2"/>
  <text x="665" y="215" fill="#f8fafc" font-size="28" font-family="Arial, sans-serif" font-weight="700">Co-Packaged Optics</text>
  <rect x="675" y="270" width="145" height="72" rx="12" fill="#2563eb"/>
  <text x="710" y="313" fill="#fff" font-size="18" font-family="Arial, sans-serif" font-weight="700">ASIC</text>
  <rect x="842" y="270" width="130" height="72" rx="12" fill="#9333ea"/>
  <text x="874" y="313" fill="#fff" font-size="18" font-family="Arial, sans-serif" font-weight="700">Engine</text>
  <path d="M820 306 H842" stroke="#f59e0b" stroke-width="12" stroke-linecap="round"/>
  <path d="M985 306 C1035 275 1075 334 1105 300" stroke="#22d3ee" stroke-width="9" fill="none" stroke-linecap="round"/>
  <text x="680" y="410" fill="#e2e8f0" font-size="20" font-family="Arial, sans-serif">장점</text>
  <text x="680" y="445" fill="#99f6e4" font-size="17" font-family="Arial, sans-serif">전기 경로가 짧고 포트 밀도와 전력에 유리하다</text>
  <text x="680" y="482" fill="#e2e8f0" font-size="20" font-family="Arial, sans-serif">부담</text>
  <text x="680" y="517" fill="#99f6e4" font-size="17" font-family="Arial, sans-serif">패키지 수율, 열, 테스트, 교체성이 어려워진다</text>

  <path d="M575 374 H625" stroke="#64748b" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="520" y="640" fill="#cbd5e1" font-size="18" font-family="Arial, sans-serif">핵심 질문: 전기 손실을 줄인 값이 서비스성과 수율 부담을 넘어서는가</text>
</svg>

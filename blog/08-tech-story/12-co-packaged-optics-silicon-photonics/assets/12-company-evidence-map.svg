<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">CPO 공정과 대표 상장사 지도</title>
  <desc id="desc">스위치 ASIC부터 시스템 검증까지 공정 칸과 대표 상장사를 연결한 도식</desc>
  <rect width="1200" height="760" fill="#111827"/>
  <text x="60" y="70" fill="#f8fafc" font-size="34" font-family="Arial, sans-serif" font-weight="700">CPO는 한 회사가 아니라 여섯 칸의 공정 네트워크다</text>
  <text x="60" y="110" fill="#cbd5e1" font-size="18" font-family="Arial, sans-serif">DART와 EDGAR 숫자는 각 회사가 어느 칸에 있는지 붙여야 해석된다.</text>

  <g font-family="Arial, sans-serif">
    <rect x="70" y="170" width="310" height="180" rx="16" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <text x="100" y="215" fill="#eff6ff" font-size="24" font-weight="700">1. 스위치 ASIC</text>
    <text x="100" y="252" fill="#bfdbfe" font-size="17">Broadcom, Marvell</text>
    <text x="100" y="282" fill="#bfdbfe" font-size="17">Cisco, NVIDIA</text>
    <text x="100" y="318" fill="#dbeafe" font-size="15">권한: 설계와 플랫폼</text>

    <rect x="445" y="170" width="310" height="180" rx="16" fill="#312e81" stroke="#a78bfa" stroke-width="2"/>
    <text x="475" y="215" fill="#f5f3ff" font-size="24" font-weight="700">2. 패키지와 기판</text>
    <text x="475" y="252" fill="#ddd6fe" font-size="17">Broadcom, TSMC</text>
    <text x="475" y="282" fill="#ddd6fe" font-size="17">Intel, Corning</text>
    <text x="475" y="318" fill="#ede9fe" font-size="15">권한: 수율과 열 경로</text>

    <rect x="820" y="170" width="310" height="180" rx="16" fill="#134e4a" stroke="#2dd4bf" stroke-width="2"/>
    <text x="850" y="215" fill="#ecfeff" font-size="24" font-weight="700">3. 광엔진과 PIC</text>
    <text x="850" y="252" fill="#ccfbf1" font-size="17">Marvell, Broadcom</text>
    <text x="850" y="282" fill="#ccfbf1" font-size="17">Intel, Coherent</text>
    <text x="850" y="318" fill="#ccfbf1" font-size="15">권한: 전력과 밀도</text>

    <rect x="70" y="425" width="310" height="180" rx="16" fill="#7c2d12" stroke="#fb923c" stroke-width="2"/>
    <text x="100" y="470" fill="#fff7ed" font-size="24" font-weight="700">4. 레이저와 광원</text>
    <text x="100" y="507" fill="#fed7aa" font-size="17">Coherent, Lumentum</text>
    <text x="100" y="537" fill="#fed7aa" font-size="17">오이솔루션</text>
    <text x="100" y="573" fill="#ffedd5" font-size="15">권한: 수명과 서비스성</text>

    <rect x="445" y="425" width="310" height="180" rx="16" fill="#713f12" stroke="#facc15" stroke-width="2"/>
    <text x="475" y="470" fill="#fefce8" font-size="24" font-weight="700">5. 접속과 조립</text>
    <text x="475" y="507" fill="#fef08a" font-size="17">Fabrinet, Corning</text>
    <text x="475" y="537" fill="#fef08a" font-size="17">Amphenol, Coherent</text>
    <text x="475" y="573" fill="#fef9c3" font-size="15">권한: 공차와 검사</text>

    <rect x="820" y="425" width="310" height="180" rx="16" fill="#581c87" stroke="#d8b4fe" stroke-width="2"/>
    <text x="850" y="470" fill="#faf5ff" font-size="24" font-weight="700">6. 시스템 검증</text>
    <text x="850" y="507" fill="#e9d5ff" font-size="17">Cisco, Arista</text>
    <text x="850" y="537" fill="#e9d5ff" font-size="17">NVIDIA, Broadcom</text>
    <text x="850" y="573" fill="#f3e8ff" font-size="15">권한: 고객 인증과 운영</text>
  </g>

  <path d="M380 260 H445" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M755 260 H820" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M975 350 V425" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M820 515 H755" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrowLeft)"/>
  <path d="M445 515 H380" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrowLeft)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowLeft" markerWidth="10" markerHeight="10" refX="1" refY="3" orient="auto">
      <path d="M9,0 L9,6 L0,3 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <text x="60" y="705" fill="#cbd5e1" font-size="18" font-family="Arial, sans-serif">읽는 순서: 기술 발표는 공정 위치를 확인하고, 공시는 전사 손익과 제품 설명으로 다시 검산한다.</text>
</svg>

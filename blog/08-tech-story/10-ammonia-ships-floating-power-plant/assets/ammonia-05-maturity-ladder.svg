<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">암모니아 선박 기술 성숙도</title>
  <desc id="desc">암모니아 선박의 기술 성숙도는 화물 취급 경험, 엔진 승인, 첫 선박, 선대 발주, 항만 벙커링, 연료 스프레드로 나뉜다.</desc>
  <rect width="1200" height="675" fill="#0a0e1a"/>
  <text x="70" y="68" fill="#f8fafc" font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="34" font-weight="800">기술 성숙도: 첫 배와 대량 보급은 다르다</text>
  <text x="70" y="106" fill="#94a3b8" font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="17">암모니아 선박은 이미 앞으로 움직이고 있지만, 양산은 항만과 연료와 인증이 같이 열려야 한다.</text>
  <g font-family="Malgun Gothic, Segoe UI, sans-serif">
    <line x1="135" y1="435" x2="1065" y2="435" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
    <g transform="translate(95 255)">
      <circle cx="55" cy="180" r="46" fill="#111827" stroke="#38bdf8" stroke-width="3"/>
      <text x="55" y="187" text-anchor="middle" fill="#38bdf8" font-size="24" font-weight="800">1</text>
      <text x="55" y="80" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="800">화물 경험</text>
      <text x="55" y="112" text-anchor="middle" fill="#cbd5e1" font-size="14">암모니아 운송</text>
      <text x="55" y="136" text-anchor="middle" fill="#cbd5e1" font-size="14">기초 취급</text>
    </g>
    <g transform="translate(275 255)">
      <circle cx="55" cy="180" r="46" fill="#111827" stroke="#38bdf8" stroke-width="3"/>
      <text x="55" y="187" text-anchor="middle" fill="#38bdf8" font-size="24" font-weight="800">2</text>
      <text x="55" y="80" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="800">엔진 승인</text>
      <text x="55" y="112" text-anchor="middle" fill="#cbd5e1" font-size="14">분사, SCR</text>
      <text x="55" y="136" text-anchor="middle" fill="#cbd5e1" font-size="14">파일럿 오일</text>
    </g>
    <g transform="translate(455 255)">
      <circle cx="55" cy="180" r="46" fill="#172033" stroke="#fbbf24" stroke-width="3"/>
      <text x="55" y="187" text-anchor="middle" fill="#fbbf24" font-size="24" font-weight="800">3</text>
      <text x="55" y="80" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="800">첫 선박</text>
      <text x="55" y="112" text-anchor="middle" fill="#cbd5e1" font-size="14">EXMAR 사례</text>
      <text x="55" y="136" text-anchor="middle" fill="#cbd5e1" font-size="14">실선 검증</text>
    </g>
    <g transform="translate(635 255)">
      <circle cx="55" cy="180" r="46" fill="#111827" stroke="#64748b" stroke-width="3"/>
      <text x="55" y="187" text-anchor="middle" fill="#cbd5e1" font-size="24" font-weight="800">4</text>
      <text x="55" y="80" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="800">선대 발주</text>
      <text x="55" y="112" text-anchor="middle" fill="#cbd5e1" font-size="14">반복 수주</text>
      <text x="55" y="136" text-anchor="middle" fill="#cbd5e1" font-size="14">운항 데이터</text>
    </g>
    <g transform="translate(815 255)">
      <circle cx="55" cy="180" r="46" fill="#111827" stroke="#64748b" stroke-width="3"/>
      <text x="55" y="187" text-anchor="middle" fill="#cbd5e1" font-size="24" font-weight="800">5</text>
      <text x="55" y="80" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="800">벙커링</text>
      <text x="55" y="112" text-anchor="middle" fill="#cbd5e1" font-size="14">항만 저장</text>
      <text x="55" y="136" text-anchor="middle" fill="#cbd5e1" font-size="14">안전 거리</text>
    </g>
    <g transform="translate(995 255)">
      <circle cx="55" cy="180" r="46" fill="#111827" stroke="#64748b" stroke-width="3"/>
      <text x="55" y="187" text-anchor="middle" fill="#cbd5e1" font-size="24" font-weight="800">6</text>
      <text x="55" y="80" text-anchor="middle" fill="#f8fafc" font-size="19" font-weight="800">경제성</text>
      <text x="55" y="112" text-anchor="middle" fill="#cbd5e1" font-size="14">연료 가격</text>
      <text x="55" y="136" text-anchor="middle" fill="#cbd5e1" font-size="14">규제 비용</text>
    </g>
    <rect x="410" y="530" width="380" height="58" rx="16" fill="#172033" stroke="#fbbf24"/>
    <text x="600" y="565" text-anchor="middle" fill="#fbbf24" font-size="19" font-weight="800">현재 관찰 지점: 첫 선박과 선대 발주 사이</text>
    <text x="600" y="625" text-anchor="middle" fill="#f8fafc" font-size="21" font-weight="800">양산은 기술보다 항만, 안전, 연료 공급, 인증의 동시 통과 문제다.</text>
  </g>
</svg>

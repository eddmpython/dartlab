<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">암모니아 선박 안전 병목 스택</title>
  <desc id="desc">암모니아 선박의 안전 병목은 독성, 부식, 누출, NOx, 암모니아 슬립, 벙커링, 크루 훈련이 동시에 쌓인다.</desc>
  <rect width="1200" height="675" fill="#0a0e1a"/>
  <text x="70" y="68" fill="#f8fafc" font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="34" font-weight="800">안전 병목: 엔진이 돌아가도 사람이 탈 수 있어야 한다</text>
  <text x="70" y="106" fill="#94a3b8" font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="17">암모니아 선박의 양산 조건은 출력표가 아니라 독성 연료를 안전하게 운항하는 절차다.</text>
  <g font-family="Malgun Gothic, Segoe UI, sans-serif">
    <g transform="translate(85 165)">
      <rect width="1030" height="68" rx="16" fill="#111827" stroke="#334155"/>
      <text x="40" y="43" fill="#fbbf24" font-size="22" font-weight="800">1 독성</text>
      <text x="180" y="43" fill="#cbd5e1" font-size="17">가스 감지기, 작업자 노출 한계, 비상 대피 구역</text>
    </g>
    <g transform="translate(85 248)">
      <rect width="980" height="68" rx="16" fill="#111827" stroke="#334155"/>
      <text x="40" y="43" fill="#fbbf24" font-size="22" font-weight="800">2 부식</text>
      <text x="180" y="43" fill="#cbd5e1" font-size="17">탱크, 밸브, 실링, 배관 재료 선택</text>
    </g>
    <g transform="translate(85 331)">
      <rect width="930" height="68" rx="16" fill="#111827" stroke="#334155"/>
      <text x="40" y="43" fill="#fbbf24" font-size="22" font-weight="800">3 누출</text>
      <text x="180" y="43" fill="#cbd5e1" font-size="17">이중 배관, 환기, 차단 밸브, 독성 구역 CFD</text>
    </g>
    <g transform="translate(85 414)">
      <rect width="880" height="68" rx="16" fill="#111827" stroke="#334155"/>
      <text x="40" y="43" fill="#fbbf24" font-size="22" font-weight="800">4 배출</text>
      <text x="180" y="43" fill="#cbd5e1" font-size="17">NOx, N2O, 암모니아 슬립, SCR 후처리</text>
    </g>
    <g transform="translate(85 497)">
      <rect width="830" height="68" rx="16" fill="#111827" stroke="#334155"/>
      <text x="40" y="43" fill="#fbbf24" font-size="22" font-weight="800">5 항만</text>
      <text x="180" y="43" fill="#cbd5e1" font-size="17">벙커링, 안전 거리, 저장 탱크, 보험과 규칙</text>
    </g>
    <g transform="translate(760 172)">
      <circle cx="250" cy="250" r="86" fill="#3b1520" stroke="#ef4444" stroke-width="3"/>
      <text x="250" y="232" text-anchor="middle" fill="#fecaca" font-size="22" font-weight="800">선급 인증</text>
      <text x="250" y="265" text-anchor="middle" fill="#f8fafc" font-size="16">HAZID</text>
      <text x="250" y="290" text-anchor="middle" fill="#f8fafc" font-size="16">운항 절차</text>
    </g>
    <text x="600" y="620" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="800">안전 병목을 통과해야 암모니아는 연료가 아니라 상업 운항 기술이 된다.</text>
  </g>
</svg>

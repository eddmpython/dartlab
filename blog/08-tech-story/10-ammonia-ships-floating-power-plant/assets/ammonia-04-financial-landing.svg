    <text x="92" y="209" fill="#cbd5e1" font-size="14">한국 회사 2025 또는 local label</text>
    <rect x="70" y="240" width="260" height="76" rx="14" fill="#111827" stroke="#334155"/>
    <text x="92" y="272" fill="#f59e0b" font-size="18" font-weight="800">EDGAR</text>
    <text x="92" y="299" fill="#cbd5e1" font-size="14">미국 회사 2025 fiscal panel</text>
    <text x="600" y="632" text-anchor="middle" fill="#fbbf24" font-size="19" font-weight="800">높은 마진은 기술 직접 수혜가 아니라 회사 전체 사업의 현재 손익이다.</text>

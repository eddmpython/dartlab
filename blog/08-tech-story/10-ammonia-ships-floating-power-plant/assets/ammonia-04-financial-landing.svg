<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">DART와 EDGAR 재무 착지</title>
  <desc id="desc">암모니아 선박 관련 기술 칸에 놓인 회사들의 DART와 EDGAR 영업이익률은 순수 암모니아선 매출이 아니라 기존 사업 손익이다.</desc>
  <rect width="1200" height="675" fill="#0a0e1a"/>
  <text x="70" y="68" fill="#f8fafc" font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="34" font-weight="800">재무 착지: 기술 칸은 같아도 손익은 다르다</text>
  <text x="70" y="106" fill="#94a3b8" font-family="Malgun Gothic, Segoe UI, sans-serif" font-size="17">DART와 EDGAR는 회사 전체 손익을 보여준다. 순수 암모니아선 매출로 읽으면 안 된다.</text>
  <g font-family="Malgun Gothic, Segoe UI, sans-serif">
    <line x1="180" y1="540" x2="1120" y2="540" stroke="#334155"/>
    <line x1="180" y1="450" x2="1120" y2="450" stroke="#172033"/>
    <line x1="180" y1="360" x2="1120" y2="360" stroke="#172033"/>
    <line x1="180" y1="270" x2="1120" y2="270" stroke="#172033"/>
    <line x1="180" y1="180" x2="1120" y2="180" stroke="#172033"/>
    <text x="128" y="545" fill="#94a3b8" font-size="14">0%</text>
    <text x="118" y="455" fill="#94a3b8" font-size="14">10%</text>
    <text x="118" y="365" fill="#94a3b8" font-size="14">20%</text>
    <text x="118" y="275" fill="#94a3b8" font-size="14">30%</text>
    <g fill="#38bdf8">
      <rect x="215" y="458" width="55" height="82" rx="8"/>
      <rect x="300" y="436" width="55" height="104" rx="8"/>
      <rect x="385" y="455" width="55" height="85" rx="8"/>
      <rect x="470" y="419" width="55" height="121" rx="8"/>
      <rect x="555" y="502" width="55" height="38" rx="8"/>
    </g>
    <rect x="640" y="540" width="55" height="209" rx="8" fill="#ef4444"/>
    <g fill="#f59e0b">
      <rect x="725" y="248" width="55" height="292" rx="8"/>
      <rect x="810" y="508" width="55" height="32" rx="8"/>
      <rect x="895" y="464" width="55" height="76" rx="8"/>
      <rect x="980" y="432" width="55" height="108" rx="8"/>
      <rect x="1065" y="391" width="55" height="149" rx="8"/>
    </g>
    <text x="242" y="443" text-anchor="middle" fill="#f8fafc" font-size="13">9.13</text>
    <text x="327" y="421" text-anchor="middle" fill="#f8fafc" font-size="13">11.59</text>
    <text x="412" y="440" text-anchor="middle" fill="#f8fafc" font-size="13">9.49</text>

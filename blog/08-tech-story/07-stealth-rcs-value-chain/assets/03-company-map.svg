<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">스텔스 밸류체인 회사 배치</title>
  <desc id="desc">주계약사, 센서, 엔진, 전자전, 한국 KF-21 라인에 해당하는 대표 회사를 배치한다.</desc>
  <rect width="1200" height="700" fill="#0a0e1a"/>
  <text x="58" y="68" fill="#f8fafc" font-family="Malgun Gothic, Arial" font-size="34" font-weight="700">스텔스 밸류체인은 플랫폼 혼자 끝나지 않는다</text>
  <text x="58" y="108" fill="#94a3b8" font-family="Malgun Gothic, Arial" font-size="20">형상 설계는 주계약사가 쥐지만, 레이더와 전자전, 엔진, 정비가 전투력의 나머지를 만든다</text>
  <g font-family="Malgun Gothic, Arial" font-size="18">
    <rect x="68" y="165" width="230" height="90" rx="16" fill="#111827" stroke="#fbbf24"/>
    <text x="92" y="200" fill="#fbbf24" font-weight="700">플랫폼 형상</text>
    <text x="92" y="230" fill="#e2e8f0">LMT, NOC, KAI</text>
    <rect x="345" y="165" width="230" height="90" rx="16" fill="#111827" stroke="#334155"/>
    <text x="369" y="200" fill="#fbbf24" font-weight="700">AESA 레이더</text>
    <text x="369" y="230" fill="#e2e8f0">RTX, 한화시스템</text>
    <rect x="622" y="165" width="230" height="90" rx="16" fill="#111827" stroke="#334155"/>
    <text x="646" y="200" fill="#fbbf24" font-weight="700">엔진과 열 신호</text>
    <text x="646" y="230" fill="#e2e8f0">GE, 한화에어로</text>
    <rect x="899" y="165" width="230" height="90" rx="16" fill="#111827" stroke="#334155"/>
    <text x="923" y="200" fill="#fbbf24" font-weight="700">전자전과 무장</text>
    <text x="923" y="230" fill="#e2e8f0">LIG넥스원, RTX</text>
    <path d="M298 210 H345 M575 210 H622 M852 210 H899" stroke="#38bdf8" stroke-width="3" stroke-dasharray="10 8"/>
    <rect x="150" y="335" width="900" height="120" rx="18" fill="#111827" stroke="#334155"/>
    <text x="190" y="380" fill="#f8fafc" font-size="24" font-weight="700">미국 라인</text>
    <text x="190" y="418" fill="#cbd5e1">F-35는 록히드마틴이 주계약, 노스롭은 B-21, RTX는 센서와 미사일 방어 축으로 배치된다.</text>
    <rect x="150" y="485" width="900" height="120" rx="18" fill="#111827" stroke="#334155"/>
    <text x="190" y="530" fill="#f8fafc" font-size="24" font-weight="700">한국 라인</text>
    <text x="190" y="568" fill="#cbd5e1">KF-21은 KAI가 체계통합, 한화시스템이 AESA 레이더, 한화에어로와 LIG가 엔진·전자전·무장 축을 맡는다.</text>
  </g>
</svg>


<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">저피탐 스택은 형상, 소재, 센서, 운용이 겹친 시스템이다</title>
  <desc id="desc">스텔스 항공기를 만드는 기술 스택을 형상, 흡수재, 열 신호, 센서융합, 전자전, 정비 계층으로 나눈다.</desc>
  <rect width="1200" height="680" fill="#0a0e1a"/>
  <text x="58" y="70" fill="#f8fafc" font-family="Malgun Gothic, Arial" font-size="34" font-weight="700">저피탐 스택은 한 가지 기술이 아니다</text>
  <text x="58" y="112" fill="#94a3b8" font-family="Malgun Gothic, Arial" font-size="20">형상 하나가 아니라 코팅, 열, 센서, 전자전, 정비가 같은 표적 신호를 줄인다</text>
  <g transform="translate(80 155)" font-family="Malgun Gothic, Arial">
    <rect x="0" y="0" width="1040" height="82" rx="16" fill="#111827" stroke="#334155"/>
    <text x="28" y="34" fill="#fbbf24" font-size="22" font-weight="700">1. 형상 설계</text>
    <text x="28" y="62" fill="#cbd5e1" font-size="18">평면 정렬, 내부 무장창, 흡입구 가림. 전파가 되돌아오는 길을 먼저 바꾼다.</text>
    <rect x="0" y="96" width="1040" height="82" rx="16" fill="#111827" stroke="#334155"/>
    <text x="28" y="130" fill="#fbbf24" font-size="22" font-weight="700">2. 소재와 코팅</text>
    <text x="28" y="158" fill="#cbd5e1" font-size="18">레이더 흡수재, 도료, 패널 틈 관리. 조립 뒤에도 정비가 계속 성능을 좌우한다.</text>
    <rect x="0" y="192" width="1040" height="82" rx="16" fill="#111827" stroke="#334155"/>
    <text x="28" y="226" fill="#fbbf24" font-size="22" font-weight="700">3. 열 신호와 배기</text>
    <text x="28" y="254" fill="#cbd5e1" font-size="18">엔진 배기와 표면 온도를 낮춰 적외선 탐지 장비가 보는 그림을 흐린다.</text>
    <rect x="0" y="288" width="1040" height="82" rx="16" fill="#111827" stroke="#334155"/>
    <text x="28" y="322" fill="#fbbf24" font-size="22" font-weight="700">4. 센서융합</text>
    <text x="28" y="350" fill="#cbd5e1" font-size="18">AESA 레이더, 전자광학, 적외선, 데이터링크를 합쳐 먼저 보고 먼저 쏜다.</text>
    <rect x="0" y="384" width="1040" height="82" rx="16" fill="#111827" stroke="#334155"/>
    <text x="28" y="418" fill="#fbbf24" font-size="22" font-weight="700">5. 전자전</text>
    <text x="28" y="446" fill="#cbd5e1" font-size="18">상대 레이더를 교란하고, 내 위치가 드러나는 송신을 줄이고, 네트워크로 표적 정보를 나눈다.</text>
    <rect x="0" y="480" width="1040" height="82" rx="16" fill="#111827" stroke="#334155"/>
    <text x="28" y="514" fill="#fbbf24" font-size="22" font-weight="700">6. 정비와 품질</text>
    <text x="28" y="542" fill="#cbd5e1" font-size="18">스크래치, 틈, 오염, 재도장 품질이 작전 때 실제 저피탐 성능과 가동률을 결정한다.</text>
  </g>
</svg>


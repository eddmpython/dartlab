<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">RCS는 실제 크기가 아니라 되돌아오는 전파의 크기다</title>
  <desc id="desc">레이더 전파가 둥근 표면, 평면 각도, 흡수재를 만났을 때 되돌아오는 신호가 달라지는 원리를 비교한다.</desc>
  <rect width="1200" height="620" fill="#0a0e1a"/>
  <text x="58" y="70" fill="#f8fafc" font-family="Malgun Gothic, Arial" font-size="34" font-weight="700">RCS는 실제 크기가 아니라 되돌아오는 전파의 크기다</text>
  <text x="58" y="112" fill="#94a3b8" font-family="Malgun Gothic, Arial" font-size="20">스텔스는 투명화가 아니라 반사 방향, 흡수, 산란을 설계하는 저피탐 공학이다</text>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#38bdf8"/>
    </marker>
    <marker id="amberArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#fbbf24"/>
    </marker>
  </defs>
  <g transform="translate(60 160)">
    <rect x="0" y="0" width="320" height="360" rx="18" fill="#111827" stroke="#1f2937"/>
    <text x="26" y="42" fill="#f8fafc" font-family="Malgun Gothic, Arial" font-size="23" font-weight="700">둥근 금속 표면</text>
    <path d="M95 230 C95 120 225 120 225 230 Z" fill="#334155" stroke="#64748b" stroke-width="3"/>
    <line x1="40" y1="170" x2="120" y2="190" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="205" y1="190" x2="286" y2="166" stroke="#f87171" stroke-width="4" marker-end="url(#amberArrow)"/>
    <text x="28" y="286" fill="#cbd5e1" font-family="Malgun Gothic, Arial" font-size="18">들어온 방향 근처로</text>
    <text x="28" y="314" fill="#cbd5e1" font-family="Malgun Gothic, Arial" font-size="18">강한 반사가 돌아온다</text>
  </g>
  <g transform="translate(440 160)">
    <rect x="0" y="0" width="320" height="360" rx="18" fill="#111827" stroke="#1f2937"/>
    <text x="26" y="42" fill="#f8fafc" font-family="Malgun Gothic, Arial" font-size="23" font-weight="700">각도를 맞춘 형상</text>
    <path d="M55 230 L165 118 L275 230 Z" fill="#263241" stroke="#64748b" stroke-width="3"/>
    <line x1="38" y1="180" x2="118" y2="190" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="178" y1="160" x2="262" y2="92" stroke="#fbbf24" stroke-width="4" marker-end="url(#amberArrow)"/>
    <text x="28" y="286" fill="#cbd5e1" font-family="Malgun Gothic, Arial" font-size="18">레이더가 있는 곳이 아니라</text>
    <text x="28" y="314" fill="#cbd5e1" font-family="Malgun Gothic, Arial" font-size="18">다른 방향으로 튕겨낸다</text>
  </g>
  <g transform="translate(820 160)">
    <rect x="0" y="0" width="320" height="360" rx="18" fill="#111827" stroke="#1f2937"/>
    <text x="26" y="42" fill="#f8fafc" font-family="Malgun Gothic, Arial" font-size="23" font-weight="700">흡수재와 경계 관리</text>
    <path d="M52 230 L166 122 L278 230 Z" fill="#18212d" stroke="#475569" stroke-width="3"/>
    <path d="M88 222 L166 145 L244 222" fill="none" stroke="#fbbf24" stroke-width="5" stroke-dasharray="10 10"/>
    <line x1="40" y1="180" x2="118" y2="190" stroke="#38bdf8" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M190 171 C215 169 235 163 252 147" fill="none" stroke="#fbbf24" stroke-width="3" opacity="0.8"/>
    <text x="28" y="286" fill="#cbd5e1" font-family="Malgun Gothic, Arial" font-size="18">반사 에너지를 줄이고</text>
    <text x="28" y="314" fill="#cbd5e1" font-family="Malgun Gothic, Arial" font-size="18">패널 틈의 산란을 낮춘다</text>
  </g>
</svg>


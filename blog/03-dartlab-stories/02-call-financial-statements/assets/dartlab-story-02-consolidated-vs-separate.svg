<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" width="880" height="340" role="img" aria-label="연결과 별도의 차이">
  <rect width="880" height="340" fill="#0a0e1a"/>
  <text x="440" y="40" text-anchor="middle" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="19" font-weight="700">같은 회사, 같은 계정, 숫자는 둘</text>
  <text x="440" y="63" text-anchor="middle" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13">삼성전자 자본총계, 2026년 1분기</text>

  <g>
    <rect x="60" y="92" width="340" height="188" rx="10" fill="#0f1626" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="230" y="120" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="15" font-weight="700">연결 (기본값)</text>
    <text x="230" y="142" text-anchor="middle" fill="#6e7681" font-family="ui-monospace, monospace" font-size="11">c.panel("BS")</text>
    <rect x="96" y="158" width="268" height="72" rx="6" fill="none" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="110" y="172" width="70" height="44" rx="4" fill="#fbbf24" opacity="0.85"/>
    <text x="145" y="199" text-anchor="middle" fill="#0a0e1a" font-family="system-ui, sans-serif" font-size="11" font-weight="700">본사</text>
    <rect x="192" y="176" width="52" height="36" rx="4" fill="#fbbf24" opacity="0.4"/>
    <rect x="252" y="176" width="52" height="36" rx="4" fill="#fbbf24" opacity="0.4"/>
    <rect x="312" y="176" width="40" height="36" rx="4" fill="#fbbf24" opacity="0.4"/>
    <text x="272" y="199" text-anchor="middle" fill="#0a0e1a" font-family="system-ui, sans-serif" font-size="10" font-weight="700">자회사들</text>
    <text x="230" y="258" text-anchor="middle" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="20" font-weight="700">약 486조 원</text>
  </g>

  <g>
    <rect x="480" y="92" width="340" height="188" rx="10" fill="#0f1626" stroke="#1f6feb" stroke-width="1.5"/>
    <text x="650" y="120" text-anchor="middle" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">별도</text>
    <text x="650" y="142" text-anchor="middle" fill="#6e7681" font-family="ui-monospace, monospace" font-size="11">c.panel("BS", scope="separate")</text>
    <rect x="516" y="158" width="268" height="72" rx="6" fill="none" stroke="#1f6feb" stroke-width="1" stroke-dasharray="4 3"/>
    <rect x="530" y="172" width="70" height="44" rx="4" fill="#1f6feb" opacity="0.85"/>
    <text x="565" y="199" text-anchor="middle" fill="#0a0e1a" font-family="system-ui, sans-serif" font-size="11" font-weight="700">본사</text>
    <text x="692" y="199" text-anchor="middle" fill="#6e7681" font-family="system-ui, sans-serif" font-size="11">자회사는 빠진다</text>
    <text x="650" y="258" text-anchor="middle" fill="#e6edf3" font-family="system-ui, sans-serif" font-size="20" font-weight="700">약 284조 원</text>
  </g>

  <text x="440" y="312" text-anchor="middle" fill="#6e7681" font-family="system-ui, sans-serif" font-size="12">어느 쪽이 맞느냐가 아니라, 무엇을 묻고 있느냐가 답을 정한다. 200조 원이 넘는 차이가 자회사에서 온다.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 520" role="img" aria-labelledby="title desc">
  <title id="title">코드셀 실행 상태 흐름</title>
  <desc id="desc">Company를 만든 뒤 panel과 select가 같은 실행 상태를 이어 쓰는 순서도</desc>
  <rect width="1120" height="520" fill="#0f1720"/>
  <rect x="50" y="54" width="1020" height="412" rx="22" fill="#f8fafc"/>
  <text x="90" y="112" fill="#172033" font-family="Arial, sans-serif" font-size="34" font-weight="700">브라우저 노트북은 실행한 셀을 기억한다</text>
  <g font-family="Arial, sans-serif">
    <rect x="92" y="162" width="280" height="180" rx="18" fill="#e8f1ff" stroke="#5b8def" stroke-width="3"/>
    <text x="124" y="210" fill="#17324d" font-size="24" font-weight="700">1. 회사 만들기</text>
    <text x="124" y="252" fill="#17324d" font-size="20">c = Company("005930")</text>
    <text x="124" y="288" fill="#49627d" font-size="18">이름 c가 살아남는다</text>
    <rect x="420" y="162" width="280" height="180" rx="18" fill="#eaf8ee" stroke="#3bb273" stroke-width="3"/>
    <text x="452" y="210" fill="#173d2a" font-size="24" font-weight="700">2. 표 열기</text>
    <text x="452" y="252" fill="#173d2a" font-size="20">is_ = c.panel("IS")</text>
    <text x="452" y="288" fill="#426951" font-size="18">앞 셀의 c를 재사용</text>
    <rect x="748" y="162" width="280" height="180" rx="18" fill="#fff4df" stroke="#f0a63a" stroke-width="3"/>
    <text x="780" y="210" fill="#4d3211" font-size="24" font-weight="700">3. 다시 보기</text>
    <text x="780" y="252" fill="#4d3211" font-size="20">is_.shape</text>
    <text x="780" y="288" fill="#755727" font-size="18">앞 표를 다시 읽는다</text>
    <path d="M374 252H416" stroke="#24364b" stroke-width="5" stroke-linecap="round"/>
    <path d="M404 239l18 13-18 13" fill="none" stroke="#24364b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M702 252h42" stroke="#24364b" stroke-width="5" stroke-linecap="round"/>
    <path d="M732 239l18 13-18 13" fill="none" stroke="#24364b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="92" y="376" width="936" height="52" rx="12" fill="#172033"/>
    <text x="124" y="410" fill="#f8fafc" font-size="22">중간부터 누르면 이름을 모른다. 고친 셀부터 아래로 다시 실행한다.</text>
  </g>
</svg>

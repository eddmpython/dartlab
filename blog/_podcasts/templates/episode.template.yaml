# 에피소드 메타데이터 템플릿. plan_episode.py 가 이 형태로 생성하고, 사람이 이어서 손본다.
# 발행 시 guid/오디오크기/길이/발행일 같은 기계값은 여기 쓰지 않고 published.json 에 기록된다.
episode:
  version: 1
  episodeId: P0N-{lane}-{slug}           # 폴더명과 동일
  episodeNo: 0                           # 정수. RSS itunes:episode + 정렬
  slug: {slug}
  title: "{제목}"                        # podcast_plan_loop titlePlan 에서 채택한 RSS 제목. SEO+궁금증 규율, 짧은 훅, 낚시 금지
  lane: company                          # dartlab | company | economy | disclosure | quant
  language: ko
  status: draft                          # draft | ready | published (ready 이상만 발행)

  audio:
    generator: notebooklm
    sourceHint: ""                       # NotebookLM m4a 경로(발행 시 --audio 로 지정)
    sourceDoc: script.md

  image:
    source: ""                           # 에피소드 폴더 기준 커버 소스. 예: cover.png
    key: episodes/{slug}/cover-3000.jpg  # R2 업로드 키. 비우면 source 기준 기본값 사용
  staticImage:
    source: ""                           # 16:9 정적 영상 이미지 소스. 예: static-video.jpg
    key: episodes/{slug}/static-video.jpg
  thumbnail:
    source: ""                           # staticImage 와 같으면 같은 파일 지정
    key: episodes/{slug}/static-video.jpg
  sourceAssets: []                       # 재사용 원본 이미지(한 세트).
                                         #  회사: {name: source-gray, pool: companyAsset, role: reusable-original}
                                         #    -> 중앙 companies 컬렉션의 같은 객체를 참조하고 재업로드하지 않음
                                         #  meta/topic: {source: assets/x.webp, name: x} -> 중앙 podcasts 컬렉션 + 객체
  visual:
    source: ""                           # 예: assets/source-gray.webp
    kicker: "DartLab Podcast"           # 에피소드 번호(EP.NN)는 이미지에 넣지 않는다
    titleLines: []                       # 카드뉴스형 줄바꿈 제목
    subtitle: ""
    footer: ""
  caption:
    hook: ""
    body: ""
    cta: ""
    hashtags: []

  audienceQuestion: "{독자 질문}"
  oneLineMessage: "{한 줄 요지}"
  summary: "{RSS description 원본, 2~3문장}"
  whereToLook:
    - "{확인점 1}"
    - "{확인점 2}"
  forbiddenAngles: [매수, 매도, 목표가, 수익 보장, 확정 전망]

  # 교차 링크 조인 키 + 역링크 (회사 에피소드가 아니면 빈 값)
  stockCode: ""                          # company lane 이면 6자리
  corpName: ""
  topicSlug: "{slug}"                    # 항상 존재. dartlab lane 은 dartlab
  cardType: company                      # company | event | economy | meta
  youtubeId: ""                          # 유튜브 영상 ID(공개 업로드 후 채우면 블로그/카드가 유튜브로 재생)
  links:
    blogSlug: ""                         # {base}/blog/<slug>
    cardSlug: ""                         # {base}/cards?post=<slug>
    terminalCode: ""                     # {base}/terminal?sym=<code>

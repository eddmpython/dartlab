  visual:
    source: assets/source.webp
    kicker: DartLab Podcast
    titleLines:
      - 하이닉스에 추월당한
      - "[[삼성전자]]"
      - "33년의 [[왕좌]]"
    subtitle: 1969 TV 회사에서 33년 메모리 1위까지, 그리고 처음 당한 추월. 거인의 역설을 강세와 약세로
    footer: 재무제표 격자 · 근거 링크 · 투자권유 아님
  caption:
    hook: 33년간 메모리 세계 1위였던 회사가, AI 시대의 메모리에서 처음 추월당했습니다.
    body: >-
      1969년 TV 회사로 시작해 1983년 도쿄선언, 33년간 메모리 세계 1위였던 삼성전자가 AI 시대의
      메모리 HBM에서 만년 2위 SK하이닉스에 처음 추월당했습니다. 파운드리는 TSMC에 10배 밀립니다.
      그런데도 여전히 가장 큰 거인의 역설을 강세와 약세 양쪽으로 풉니다.
    cta: 전체 에피소드는 DartLab 팟캐스트와 블로그 글에서 들을 수 있습니다.
    hashtags: ["#삼성전자", "#반도체", "#HBM", "#파운드리", "#DartLab"]

  audienceQuestion: 33년 메모리 1위가 처음 추월당했는데, 그런데도 왜 여전히 가장 큰가?
  oneLineMessage: >-
    삼성전자는 33년 메모리 1위였지만 FY2025 영업이익에서 SK하이닉스(47.21조)에 처음 추월당했다(삼성 43.6조).
    매출 334조지만 반도체 빼면 영업이익률 7%, 파운드리 적자 7조. 거인의 다음 10년은 HBM 반격과 파운드리에 달렸다.
  summary: >-
    1969년 TV 회사로 시작해 1983년 도쿄선언, 33년간 메모리 세계 1위였던 삼성전자가 AI 시대의 메모리
    HBM에서 만년 2위 SK하이닉스에 처음 추월당했습니다(FY2025 하이닉스 47.21조 > 삼성 43.6조, dartlab
    실측). 매출 334조지만 반도체를 빼면 영업이익률 7%, 파운드리는 TSMC에 10배 밀립니다. 그런데도 여전히
    가장 큰 거인의 역설을, 강세와 약세 양쪽으로 풉니다. 투자 권유가 아닌 재무제표 교육용 서사입니다.
  whereToLook:
    - 반도체(DS) 영업이익률 27%가 더 오르는지 아니면 내려오기 시작하는지
    - 파운드리 적자가 줄며 흑자전환에 다가가는지
    - HBM4에서 엔비디아 내 삼성 점유율이 회복되는지
  forbiddenAngles: [매수, 매도, 목표가, 수익 보장, 확정 전망]


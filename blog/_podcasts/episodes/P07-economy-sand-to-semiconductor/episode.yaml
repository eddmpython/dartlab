# 에피소드 메타데이터 (사람이 작성하는 SSOT).
# 발행 시 guid/오디오크기/길이/발행일 같은 기계값은 published.json 에 기록된다.
# 소스 문서는 블로그 글 하나다 (tech-story: 모래가 반도체가 되기까지).
episode:
  version: 1
  episodeId: P07-economy-sand-to-semiconductor   # 폴더명과 동일. P0N-{lane}-{slug}
  episodeNo: 7                           # 정수. RSS <itunes:episode> + 정렬
  slug: sand-to-semiconductor            # 링크/파일 slug
  title: "반도체: 모래를 칩으로 바꾸는 가장 어려운 공정이 왜 이익률 0%인가"
  lane: economy                          # dartlab | company | economy | disclosure | quant
  language: ko
  status: ready                          # draft | ready | published (ready 이상만 발행)

  # 오디오 소스 (NotebookLM 산출물). 레포에 커밋하지 않는다. 발행 시 --audio 로 경로 전달.
  audio:
    generator: notebooklm
    sourceHint: "Downloads/반도체_기술_난이도와_이익률의_기막힌_역설.m4a"
    sourceDoc: https://eddmpython.github.io/dartlab/blog/sand-to-semiconductor

  image:
    source: cover.jpg                    # 3000x3000 정사각 RSS 커버 (렌더 산출)
    key: episodes/sand-to-semiconductor/cover-3000.jpg
  staticImage:
    source: static-video.jpg             # 1280x720 16:9 (팟빵·유튜브 썸네일 규격, 렌더 산출)
    key: episodes/sand-to-semiconductor/static-video.jpg
  thumbnail:
    source: static-video.jpg
    key: episodes/sand-to-semiconductor/static-video.jpg
  sourceAssets:
    - source: assets/source.webp
      name: source
      role: reusable-original
  visual:
    source: assets/source.webp
    kicker: DartLab Podcast
    titleLines:
      - 모래가 칩이 되기까지
      - 가장 어려운 공정이
      - "[[가장 못 버는 역설]]"
    subtitle: 8단계 사슬 실측 · 폴리실리콘 0% 대 칩 48.6%
    footer: 반도체 밸류체인 · 대체 불가능성 · 사이클

  caption:
    hook: 모래를 정제하는 가장 어려운 공정이 사슬에서 가장 못 법니다.
    body: >-
      규사 한 줌이 고순도 실리콘, 웨이퍼, 칩이 되며 값이 수십만 배로 뜁니다. dartlab이 이 8단계
      사슬의 상장사 이익률을 2025년 연간으로 실측하니, 모래를 순도 99.999999999%로 정제하는 맨 앞
      공정(폴리실리콘, OCI 영업이익률 0.0%)이 아니라 대체 불가능한 장비와 소재, 칩에서 이익이
      터졌습니다. 한미반도체 43.6%, SK하이닉스 48.6%. 부가가치는 공정 난도가 아니라 대체
      불가능성이 정합니다.
    cta: 전체 에피소드는 DartLab 팟캐스트에서 들을 수 있습니다.
    hashtags: ["#DartLab", "#반도체", "#실리콘웨이퍼", "#밸류체인"]

  # 기획 요지
  audienceQuestion: 모래가 칩이 되는 8단계 사슬에서, 가장 어려운 공정이 가장 많이 벌까?
  oneLineMessage: >-
    모래를 순도 11N 실리콘으로 바꾸는 가장 어려운 맨 앞 공정(폴리실리콘)의 영업이익률이 0.0%로
    사슬에서 가장 낮았고, 이익은 대체 불가능한 장비(한미반도체 43.6%)와 칩(SK하이닉스 48.6%)에서
    터졌다. 부가가치는 공정 난도가 아니라 대체 불가능성과 사이클 위치, 자본 회수력이 정한다.
  summary: >-
    dartlab이 모래에서 칩까지 반도체 8단계 밸류체인의 상장사 이익률을 2025년 연간으로 실측했습니다.
    규사를 순도 99.999999999% 폴리실리콘으로 정제하는 인류 최고 난도의 맨 앞 공정(OCI)이 영업이익률
    0.0%로 사슬에서 가장 못 벌었고, 포토레지스트(동진쎄미켐 14.3%)와 실리콘 부품(하나머티리얼즈
    18.3%), 장비(한미반도체 43.6%), 칩(SK하이닉스 48.6%)으로 갈수록 이익이 커졌습니다. 부가가치를
    정하는 힘은 공정 난도가 아니라 대체 불가능성과 사이클 위치, 자본 회수력이라는 것을 전수 데이터로 보입니다.
  whereToLook:
    - 공정 난도가 아니라 대체 불가능성·사이클 위치·자본 회수력으로 이익을 설명하는지
    - 이익률은 2025년 연간 손익계산서 합산 기준이고 사이클에 따라 달라진다는 점
  forbiddenAngles: [매수, 매도, 목표가, 수익 보장, 확정 전망]

  # 교차 링크 조인 키 + 역링크 (회사 에피소드가 아니면 빈 값)

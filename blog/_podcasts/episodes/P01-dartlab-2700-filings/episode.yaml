      - DartLab
    subtitle: 공시와 재무제표를 하나의 격자로 읽는 첫 이야기
    footer: 공시 원문 직독 · 재무제표 격자 · 근거 링크
  caption:
    hook: DartLab은 2700개 상장사 공시와 재무제표를 하나의 비교 격자로 묶는 분석 도구입니다.
    body: >-
      첫 에피소드에서는 회사마다 흩어진 공시 원문을 런타임에 직독하고,
      숫자와 근거 링크를 함께 남기는 방식이 왜 필요한지 짚습니다.
    cta: 전체 에피소드는 DartLab 팟캐스트에서 들을 수 있습니다.
    hashtags: ["#DartLab", "#공시읽기", "#재무제표"]

  # 기획 요지
  audienceQuestion: DartLab은 대체 무엇을 해주는 도구인가?
  oneLineMessage: >-
    DartLab은 2700개 상장사의 공시와 재무제표를 런타임에 직독해 하나의 격자로 통합하고,
    그 위에서 분석까지 잇는 오픈 파이프라인이다.
  summary: >-
    회사마다 제각각인 공시와 재무제표를, DartLab이 어떻게 하나의 표준 격자로 통합해
    2700개 기업을 같은 잣대로 비교하게 만드는지 풀어봅니다. 굽지 않고 런타임에 직독하는
    이유, 근거를 함께 내는 분석까지.
  whereToLook:
    - 어떤 회사든 공시 원본까지 직독하는지
    - 분석이 근거(ref)와 함께 나오는지
  forbiddenAngles: [매수, 매도, 목표가, 수익 보장, 확정 전망]


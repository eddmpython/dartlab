# 발행 시 guid/오디오크기/길이/발행일 같은 기계값은 여기 쓰지 않고 published.json 에 기록된다.
episode:
  version: 1
  episodeId: P01-dartlab-2700-filings   # 폴더명과 동일. P0N-{lane}-{slug}

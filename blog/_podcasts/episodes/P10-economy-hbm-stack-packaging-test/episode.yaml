  caption:
    hook: HBM은 비싼 메모리가 아니라 GPU 옆에서 데이터를 굶기지 않는 공정 네트워크입니다.
    body: >-
      SK하이닉스, 한미반도체, 리노공업의 높은 2025년 마진은 HBM이 단순 DRAM이 아니라 TSV,
      열압착 본딩, CoWoS 패키징, 테스트, 고객 인증이 묶인 병목 네트워크라는 사실을 보여줍니다.
      NVIDIA와 Micron의 EDGAR 숫자까지 함께 보면, HBM 뉴스는 "누가 메모리를 만들었나"가 아니라
      "어느 공정 칸이 막혔고 그 병목이 누구의 매출과 이익으로 남았나"로 읽어야 합니다.
    cta: 전체 에피소드는 DartLab 팟캐스트에서 들을 수 있습니다.
    hashtags: ["#DartLab", "#HBM", "#반도체패키징", "#CoWoS", "#테스트"]

  audienceQuestion: HBM은 왜 옆으로 넓히지 않고 위로 쌓으며, 그 병목은 어떤 회사의 마진으로 남을까?
  oneLineMessage: >-
    HBM은 비싼 DRAM 한 조각이 아니라 메모리 제조, TSV, 본딩, CoWoS 패키징, 테스트, 고객 인증이
    묶인 공정 네트워크다. 그래서 HBM 뉴스는 특정 회사 하나가 아니라 어느 병목이 막혔고 그 병목이
    누구의 매출과 이익으로 남는지를 DART와 EDGAR로 확인해야 한다.
  summary: >-
    HBM은 GPU 옆에서 데이터를 짧은 거리로 밀어 넣기 위해 DRAM 다이를 수직으로 쌓는 시스템 부품입니다.
    SK하이닉스의 2025년 영업이익률 48.6%, 한미반도체 43.6%, 리노공업 47.5%, NVIDIA 최신 4개 분기
    64.0%, Micron 48.3% 같은 숫자는 모두 회사 전체 기준이지만, HBM 공정 네트워크의 어느 칸에 가격력과
    병목이 남는지 보여줍니다. 이번 편은 TSV, 열압착 본딩, CoWoS, 테스트, 베이스 다이를 한 지도에 놓고,
    기술 발표와 실제 매출 인식 사이의 시간차까지 설명합니다.
  whereToLook:
    - HBM을 메모리 제조 하나가 아니라 GPU 수요, 본딩, 패키징, 테스트, 고객 인증의 네트워크로 보는지
    - 회사 전체 영업이익률을 HBM 단독 마진으로 과장하지 않고 기간과 회계 기준을 분리하는지
    - HBM4 뉴스에서 개발 완료, 샘플, 고객 검증, 양산 출하를 구분하는지

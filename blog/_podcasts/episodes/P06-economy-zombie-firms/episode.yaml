    hashtags: ["#DartLab", "#좀비기업", "#한계기업", "#이자보상배율"]

  # 기획 요지
  audienceQuestion: 3년 내리 영업이익으로 이자도 못 갚는 상장사는 얼마나 되고, 그들은 같은 방향으로 가고 있나?
  oneLineMessage: >-
    3년 연속 이자보상배율 1 미만인 좀비가 비금융 상장사의 37%(713곳)이고, 같은 낙인 아래
    롯데케미칼은 3년째 더 깊어지고 LG디스플레이는 바닥을 치고 오른다. 상태보다 방향을 봐야 한다.
  summary: >-
    dartlab이 전상장사 공시에서 영업이익과 현금 이자지급을 꺼내 전수 집계했습니다. 이자를 무는
    비금융 상장사 1,924곳 중 713곳(37%)이 3년 연속 영업이익으로 이자조차 못 갚았고, 그중 402곳은
    아예 3년 내리 영업적자였습니다. 한국은행이 상장사 한계기업 27.6%로 경고한 그림을 전수로
    재현하고, 같은 좀비 명단이 롯데케미칼(심화)과 LG디스플레이·이마트(회복)로 갈리는 두 갈래를 짚습니다.
  whereToLook:

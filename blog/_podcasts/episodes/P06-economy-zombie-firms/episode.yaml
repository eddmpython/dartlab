  caption:
    hook: 번 돈으로 이자도 못 갚는 회사가 상장사 3곳 중 1곳입니다.
    body: >-
      dartlab이 비금융 상장사 1,924곳을 전수 집계했더니, 713곳이 2023년부터 2025년까지 3년 내리
      영업이익으로 현금 이자조차 못 갚았습니다. 이들이 짊어진 총부채는 1,042조원. 같은 좀비라도
      롯데케미칼처럼 더 깊어지는 곳과 LG디스플레이처럼 바닥을 치고 오르는 곳으로 갈립니다.

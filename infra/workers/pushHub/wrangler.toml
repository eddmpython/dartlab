name = "dartlab-push-hub"
main = "worker.js"
compatibility_date = "2024-12-01"

# 배포 절차 (mainPlan/watcher-notify-platform/08-p1-publish-ops-test.md §3):
#   wrangler d1 create dartlab-push-hub          # → database_id 아래 기입
#   wrangler d1 execute dartlab-push-hub --remote --file schema.sql
#   wrangler secret put VAPID_PRIVATE_KEY        # pkcs8 base64url ([06] §4)
#   wrangler secret put PUSHHUB_SEND_TOKEN       # GitHub Actions secret 과 동일값 필수
#   # [vars] VAPID_PUBLIC_KEY·VAPID_SUBJECT 기입 후
#   wrangler deploy
[[d1_databases]]
binding = "PUSHHUB_DB"
database_name = "dartlab-push-hub"
database_id = "bae665a2-5f0d-4a92-97d2-7ea84c5e4a04"

[vars]
ALLOW_ORIGIN = "https://eddmpython.github.io"
VAPID_SUBJECT = "mailto:eddmpython@gmail.com"
VAPID_PUBLIC_KEY = "BBcV8hvKW6syE2MruCRU7g_poeHWTYYwmt6g4LFrdXaVCBVXqcHnWocjpgXO69ITOn7gn4h6Z-hQFOmjpq79OR4"
# secrets (wrangler secret put): VAPID_PRIVATE_KEY(pkcs8 base64url) · PUSHHUB_SEND_TOKEN
# rate limit = Cloudflare 대시보드 WAF Rule(/subscribe IP/분) — wrangler 코드 0.

runtimeId = "codex"
displayName = "Codex CLI"
driver = "codexAppServer"
protocol = "jsonrpc-ndjson"
executableCandidates = ["codex"]
versionArgs = ["--version"]
launchArgs = ["app-server"]
windowsLaunch = ["node", "{shimDir}/node_modules/@openai/codex/bin/codex.js"]
installArgs = ["npm", "install", "-g", "@openai/codex"]
officialUrl = "https://developers.openai.com/codex/cli/"
authProbeArgs = ["login", "status"]
authSuccessPattern = "(?i)logged in"
loginArgs = ["login"]
